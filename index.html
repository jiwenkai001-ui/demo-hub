<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Hub - 项目展示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0; min-height: 100vh;
    }
    .header { text-align: center; padding: 60px 20px 40px; }
    .header h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { color: #94a3b8; font-size: 1.1rem; }
    .grid { max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card {
      display: block; text-decoration: none; background: #1e293b; border: 1px solid #334155;
      border-radius: 12px; padding: 28px 24px; transition: all 0.3s;
    }
    .card:hover { transform: translateY(-4px); border-color: #818cf8; box-shadow: 0 12px 32px rgba(129, 140, 248, 0.15); }
    .card-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .card-name { font-size: 1.3rem; font-weight: 600; color: #f1f5f9; margin-bottom: 8px; }
    .card-link { font-size: 0.9rem; color: #818cf8; }
    .empty { text-align: center; padding: 80px 20px; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Demo Hub</h1>
    <p>所有项目 Demo 展示</p>
  </div>
  <div class="grid">
      <a href="demos/test-demo/" class="card">
        <div class="card-icon">📦</div>
        <div class="card-name">test-demo</div>
        <div class="card-link">点击访问 →</div>
      </a></div>
</body>
</html>
