<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鲜链云 SCM · 供应链管理系统</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --brand-900:#0A3D30; --brand-800:#0C4A3A; --brand-700:#0E5A47; --brand-600:#10714F;
  --brand-500:#12855F; --brand-100:#DCEFE7; --brand-50:#F0F7F4;
  --bg:#F4F6F5; --surface:#FFFFFF; --line:#E5EAE8; --line-strong:#D4DCD9;
  --ink-900:#1A2420; --ink-700:#3A4642; --ink-500:#68746F; --ink-400:#8C9793;
  --green:#12855F; --green-bg:#E5F5EE; --amber:#B26A00; --amber-bg:#FFF3E0;
  --red:#C6443C; --red-bg:#FBEAE9; --blue:#2262A6; --blue-bg:#E8F1FA;
  --violet:#6D4FA1; --violet-bg:#F0EAF9;
  --shadow-1:0 1px 2px rgba(16,40,32,.05),0 1px 3px rgba(16,40,32,.06);
  --shadow-2:0 4px 14px rgba(16,40,32,.09);
  --shadow-3:0 10px 34px rgba(16,40,32,.16);
  --radius:10px; --radius-sm:7px;
  --side-w:216px; --side-w-collapsed:60px;
  --font:"PingFang SC","Microsoft YaHei","HarmonyOS Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink-900);font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:var(--brand-100)}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink-900)}
a{color:var(--brand-600);text-decoration:none}

/* ============ 布局骨架 ============ */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--side-w);background:linear-gradient(180deg,#0B2E25 0%,#0E3A2E 100%);color:#B9CFC7;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:50;transition:width .22s cubic-bezier(.4,0,.2,1);overflow:hidden}
.sidebar.collapsed{width:var(--side-w-collapsed)}
.logo{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;flex-shrink:0}
.logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2AB98A,#12855F);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 10px rgba(18,133,95,.35)}
.logo-mark svg{width:19px;height:19px;stroke:#fff}
.logo-text{line-height:1.2;white-space:nowrap;opacity:1;transition:opacity .15s}
.sidebar.collapsed .logo-text{opacity:0}
.logo-text b{display:block;color:#fff;font-size:15px;letter-spacing:.5px;font-weight:600}
.logo-text span{font-size:10px;color:#7FA79A;letter-spacing:1px}
.nav{flex:1;overflow-y:auto;padding:6px 10px 16px;scrollbar-width:thin;scrollbar-color:#2A5A4B transparent}
.nav::-webkit-scrollbar{width:4px}
.nav::-webkit-scrollbar-thumb{background:#2A5A4B;border-radius:2px}
.nav-group-label{font-size:10.5px;color:#5F8A7C;letter-spacing:2px;padding:14px 10px 5px;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#B9CFC7;cursor:pointer;margin-bottom:2px;white-space:nowrap;transition:background .15s,color .15s;position:relative;font-size:13.5px}
.nav-item svg{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(42,185,138,.24),rgba(42,185,138,.10));color:#fff;font-weight:500}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#2AB98A}
.nav-badge{margin-left:auto;background:#E25C48;color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;min-width:18px;text-align:center;font-weight:600}
.nav-sub{padding-left:26px;margin:1px 0}
.nav-sub .nav-item{font-size:12.5px;padding:6.5px 10px}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}
.user-chip{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;cursor:pointer;transition:background .15s}
.user-chip:hover{background:rgba(255,255,255,.06)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2AB98A,#0E5A47);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.user-chip .meta{line-height:1.25;white-space:nowrap;overflow:hidden}
.sidebar.collapsed .user-chip .meta{display:none}
.user-chip .meta b{display:block;color:#fff;font-size:12.5px;font-weight:500}
.user-chip .meta span{font-size:10.5px;color:#7FA79A}

.main{flex:1;margin-left:var(--side-w);display:flex;flex-direction:column;min-width:0;transition:margin .22s cubic-bezier(.4,0,.2,1)}
.main.expanded{margin-left:var(--side-w-collapsed)}
.topbar{height:54px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:40}
.icon-btn{width:32px;height:32px;border-radius:8px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-500);transition:.15s}
.icon-btn:hover{background:var(--brand-50);color:var(--brand-600)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-500)}
.crumbs b{color:var(--ink-900);font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.today-chip{font-size:12px;color:var(--ink-500);background:var(--bg);padding:5px 12px;border-radius:20px;border:1px solid var(--line)}
.content{padding:20px 22px 40px;max-width:1560px;width:100%}

/* ============ 通用组件 ============ */
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:19px;font-weight:600;letter-spacing:.2px}
.page-head .sub{color:var(--ink-500);font-size:12.5px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7.5px 15px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:13px;color:var(--ink-700);transition:.15s;font-weight:500}
.btn:hover{border-color:var(--brand-500);color:var(--brand-600);background:var(--brand-50)}
.btn.primary{background:var(--brand-600);border-color:var(--brand-600);color:#fff;box-shadow:0 2px 6px rgba(18,133,95,.25)}
.btn.primary:hover{background:var(--brand-700)}
.btn.danger{color:var(--red);border-color:#EBC8C5}
.btn.danger:hover{background:var(--red-bg);border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--brand-50)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn.link{border:none;background:none;padding:4px 6px;color:var(--brand-600);font-weight:500}
.btn.link:hover{background:var(--brand-50);border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-1)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14.5px;font-weight:600}
.card-h .hint{font-size:12px;color:var(--ink-400)}
.card-h .more{margin-left:auto;font-size:12.5px;color:var(--ink-500);cursor:pointer}
.card-h .more:hover{color:var(--brand-600)}
.card-b{padding:16px 18px}

.tabs{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:9px;width:fit-content;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--ink-500);transition:.15s;white-space:nowrap}
.tab:hover{color:var(--ink-900)}
.tab.active{background:var(--surface);color:var(--brand-600);font-weight:600;box-shadow:var(--shadow-1)}
.tab .cnt{font-size:10.5px;background:var(--red-bg);color:var(--red);border-radius:8px;padding:0 5px;margin-left:4px}
.tab.active .cnt{background:var(--brand-100)}

.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:5px;font-size:11.5px;font-weight:500;white-space:nowrap}
.tag.g{background:var(--green-bg);color:var(--green)} .tag.o{background:var(--amber-bg);color:var(--amber)}
.tag.r{background:var(--red-bg);color:var(--red)} .tag.b{background:var(--blue-bg);color:var(--blue)}
.tag.v{background:var(--violet-bg);color:var(--violet)} .tag.gr{background:#EEF1F0;color:var(--ink-500)}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.filter-bar .fld{display:flex;align-items:center;gap:6px}
.filter-bar label{font-size:12.5px;color:var(--ink-500);white-space:nowrap}
.input,.select{height:32px;padding:0 10px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);outline:none;transition:.15s;min-width:130px}
.input:focus,.select:focus{border-color:var(--brand-500);box-shadow:0 0 0 3px rgba(18,133,95,.12)}
.input::placeholder{color:var(--ink-400)}
textarea.input{height:auto;padding:8px 10px;resize:vertical}

.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12.8px}
.tbl th{text-align:left;padding:10px 12px;background:#FAFBFA;color:var(--ink-500);font-weight:500;font-size:11.8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl tbody tr{transition:background .12s;cursor:default}
.tbl tbody tr:hover{background:#F7FAF9}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .ops{display:flex;gap:2px}
.tbl .strong{font-weight:600}
.tbl tfoot td{background:#FAFBFA;font-weight:600;border-top:2px solid var(--line-strong)}
.empty{padding:52px 20px;text-align:center;color:var(--ink-400)}
.empty svg{width:44px;height:44px;stroke:#C9D3CF;fill:none;stroke-width:1.4;margin-bottom:10px}
.empty p{font-size:13px}

.pager{display:flex;align-items:center;gap:6px;padding:12px 16px;font-size:12.5px;color:var(--ink-500)}
.pager .pg{min-width:26px;height:26px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:12px;transition:.15s}
.pager .pg:hover{border-color:var(--brand-500);color:var(--brand-600)}
.pager .pg.on{background:var(--brand-600);border-color:var(--brand-600);color:#fff}

/* KPI 卡 */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-1);position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.kpi .k-label{font-size:12.5px;color:var(--ink-500);display:flex;align-items:center;gap:6px}
.kpi .k-icon{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.kpi .k-icon svg{width:17px;height:17px;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.kpi .k-value{font-size:25px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi .k-value small{font-size:12px;font-weight:500;color:var(--ink-400);margin-left:2px}
.kpi .k-delta{font-size:11.5px;margin-top:4px;display:flex;align-items:center;gap:3px}
.kpi .up{color:var(--green)} .kpi .down{color:var(--red)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1100px){.grid-2,.grid-3-1,.grid-1-2{grid-template-columns:1fr}.grid-4{grid-template-columns:1fr 1fr}}
.rk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:#EEF1F0;color:var(--ink-500);font-size:11.5px;font-weight:700}
.rk.top{background:linear-gradient(135deg,#2AB98A,#0E5A47);color:#fff}

/* 图表 */
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-500)}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.line-chart{width:100%;height:auto;display:block}

/* 待办列表 */
.todo-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.todo-row:last-child{border-bottom:none}
.todo-row:hover{background:#F7FAF9}
.todo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.todo-row .t-name{font-size:13px}
.todo-row .t-num{margin-left:auto;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.todo-row .t-arrow{color:var(--ink-400)}

/* 模态框 & 抽屉 */
.modal-mask{position:fixed;inset:0;background:rgba(10,30,24,.45);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-mask.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:14px;width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--shadow-3);transform:translateY(14px) scale(.98);transition:transform .22s cubic-bezier(.34,1.3,.64,1)}
.modal-mask.show .modal{transform:none}
.modal-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:15.5px;font-weight:600}
.modal-x{margin-left:auto;width:28px;height:28px;border:none;background:transparent;border-radius:7px;cursor:pointer;color:var(--ink-500);font-size:16px;display:flex;align-items:center;justify-content:center}
.modal-x:hover{background:var(--bg);color:var(--ink-900)}
.modal-b{padding:18px 20px;overflow-y:auto;flex:1}
.modal-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px}
.form-grid .full{grid-column:1/-1}
.fitem label{display:block;font-size:12.3px;color:var(--ink-500);margin-bottom:5px}
.fitem label .req{color:var(--red)}
.fitem .input,.fitem .select{width:100%}

/* 步骤条 */
.steps{display:flex;align-items:center;gap:0;font-size:12px;color:var(--ink-400);flex-wrap:wrap}
.steps .st{display:flex;align-items:center;gap:6px}
.steps .st i{width:18px;height:18px;border-radius:50%;background:#E8EDEB;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-style:normal}
.steps .st.done i{background:var(--brand-600);color:#fff}
.steps .st.cur i{background:var(--amber-bg);color:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
.steps .st.cur{color:var(--amber);font-weight:600}
.steps .ln{width:34px;height:1px;background:var(--line-strong);margin:0 8px}

/* Toast */
#toasts{position:fixed;top:66px;right:20px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{background:#122A22;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-3);display:flex;align-items:center;gap:9px;animation:tin .25s cubic-bezier(.34,1.3,.64,1);max-width:340px}
.toast svg{width:16px;height:16px;flex-shrink:0;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.toast.ok svg{stroke:#5CE0A9}.toast.err svg{stroke:#FF9084}.toast.info svg{stroke:#7CC0FF}
@keyframes tin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.toast.out{animation:tout .25s forwards}
@keyframes tout{to{opacity:0;transform:translateX(24px)}}

/* 描述列表 */
.desc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 20px}
.desc .di label{display:block;font-size:11.5px;color:var(--ink-400)}
.desc .di div{font-size:13px;font-weight:500;margin-top:1px}

/* 凭证分录表 */
.voucher-lines .input,.voucher-lines .select{min-width:0;width:100%}
.balance{font-variant-numeric:tabular-nums}

/* 折叠明细行 */
.expandable{cursor:pointer}

/* 进度条 */
.pbar{height:6px;border-radius:4px;background:#EDF1EF;overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--brand-500),var(--brand-600))}

/* 打卡时钟 */
.clock-card{background:linear-gradient(135deg,#0E5A47,#12855F);border-radius:14px;color:#fff;padding:26px;text-align:center;position:relative;overflow:hidden}
.clock-card::before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06);top:-60px;right:-40px}
.clock-card .t{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.clock-card .d{font-size:13px;color:#A9D8C8;margin-top:2px}
.punch-btn{margin-top:16px;width:110px;height:110px;border-radius:50%;border:4px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:16.5px;font-weight:600;cursor:pointer;transition:.18s;backdrop-filter:blur(3px)}
.punch-btn:hover{background:rgba(255,255,255,.24);transform:scale(1.04)}
.punch-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.punch-state{margin-top:12px;font-size:12.5px;color:#CFEBE1;display:flex;justify-content:center;gap:18px}

/* 审批时间线 */
.tline{position:relative;padding-left:22px}
.tline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tline .tl{position:relative;padding:0 0 16px}
.tline .tl::before{content:"";position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--brand-500)}
.tline .tl.gray::before{border-color:var(--line-strong)}
.tline .tl .tt{font-size:12.8px;font-weight:500}
.tline .tl .td{font-size:11.8px;color:var(--ink-400);margin-top:1px}

/* 日历排班 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hd{text-align:center;font-size:11px;color:var(--ink-400);padding:4px 0}
.cal .cell{aspect-ratio:1.15;border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-size:11px;display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:.13s;background:var(--surface)}
.cal .cell:hover{border-color:var(--brand-500)}
.cal .cell.dim{opacity:.35;pointer-events:none}
.cal .cell.today{border-color:var(--brand-600);box-shadow:0 0 0 2px var(--brand-100)}
.cal .cell b{font-size:12px;font-variant-numeric:tabular-nums}
.cal .shift-tag{font-size:9.5px;padding:0 4px;border-radius:3px;text-align:center;font-weight:600}

/* 库存预警条 */
.alert-list .al{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:12.8px;align-items:flex-start}
.alert-list .al:last-child{border:none}
.alert-list .al svg{width:15px;height:15px;flex-shrink:0;margin-top:2px;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* 侧边滑入详情面板 */
.drawer-mask{position:fixed;inset:0;background:rgba(10,30,24,.35);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-560px;bottom:0;width:min(560px,94vw);background:var(--surface);z-index:95;box-shadow:var(--shadow-3);display:flex;flex-direction:column;transition:right .26s cubic-bezier(.4,0,.2,1)}
.drawer.show{right:0}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-h h3{font-size:15.5px;font-weight:600}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px}
.drawer-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}

/* 公告 */
.notice-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line)}
.notice-item:last-child{border:none}
.notice-item .n-tag{flex-shrink:0}
.notice-item h4{font-size:13.5px;font-weight:600;cursor:pointer}
.notice-item h4:hover{color:var(--brand-600)}
.notice-item p{font-size:12.3px;color:var(--ink-500);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notice-item .n-meta{font-size:11.3px;color:var(--ink-400);margin-top:4px}

.badge-status{display:inline-flex;align-items:center;gap:5px}
.badge-status i{width:6px;height:6px;border-radius:50%}

/* 快捷入口 */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.quick{display:flex;flex-direction:column;align-items:center;gap:8px;padding:15px 6px;border-radius:10px;cursor:pointer;transition:.15s;border:1px solid transparent}
.quick:hover{background:var(--brand-50);border-color:var(--brand-100)}
.quick .q-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.quick .q-ic svg{width:18px;height:18px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.quick span{font-size:12.3px;color:var(--ink-700)}

/* 金额显示 */
.money{font-variant-numeric:tabular-nums}
.money.pos{color:var(--green)} .money.neg{color:var(--red)}

/* 响应式 */
@media(max-width:820px){
  .sidebar{width:var(--side-w-collapsed)}
  .sidebar .logo-text,.sidebar .user-chip .meta{display:none}
  .main{margin-left:var(--side-w-collapsed)}
  .content{padding:14px}
  .form-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}

function nextNo(kind){
  const c=DB.counters;
  if(kind==='order')return 'DD'+today().replace(/-/g,'')+(c.order++);
  if(kind==='pur')return 'CG'+today().replace(/-/g,'')+(c.pur++);
  if(kind==='rc')return 'SK'+today().replace(/-/g,'')+(c.rc++);
  if(kind==='pay')return 'FK'+today().replace(/-/g,'')+(c.rc++);
  if(kind==='vch')return '记-'+String(++c.vch).padStart(4,'0');
  return uid('N');
}

/* ---------- 联动引擎 ---------- */
const Engine={
  goodsById:id=>DB.goods.find(g=>g.id===id),
  custById:id=>DB.customers.find(c=>c.id===id),
  supById:id=>DB.suppliers.find(s=>s.id===id),
  empById:id=>DB.employees.find(e=>e.id===id),
  // 订单发货：扣库存 + 生成应收 + 生成收入凭证
  fulfillOrder(o){
    if(o.status!=='待发货')return false;
    o.items.forEach(it=>{const g=Engine.goodsById(it.goodsId);if(g){g.stock=Math.max(0,+(g.stock-it.qty).toFixed(1));
      DB.stockFlows.push({id:uid('sf'),date:today(),goodsId:g.id,type:'销售出库',qty:-it.qty,refNo:o.no})}});
    o.status='已完成';
    const c=Engine.custById(o.customerId);
    if(c){c.receivable=+(c.receivable+o.total).toFixed(2)}
    o.payStatus='未收款';
    Engine.addVoucher('转',[{subj:'1122 应收账款',dir:'借',amount:o.total},{subj:'6001 主营业务收入',dir:'贷',amount:o.total}],'客户销售确认收入-'+(c?c.name:''),'订单自动生成');
    return true;
  },
  // 采购入库：加库存 + 应付 + 凭证
  stockIn(p){
    if(p.status!=='待入库')return false;
    p.items.forEach(it=>{const g=Engine.goodsById(it.goodsId);if(g){g.stock=+(g.stock+it.qty).toFixed(1);
      DB.stockFlows.push({id:uid('sf'),date:today(),goodsId:g.id,type:'采购入库',qty:it.qty,refNo:p.no})}});
    p.status='已入库';
    const s=Engine.supById(p.supplierId);
    if(s){s.payable=+(s.payable+p.total).toFixed(2)}
    Engine.addVoucher('转',[{subj:'1403 原材料',dir:'借',amount:p.total},{subj:'2202 应付账款',dir:'贷',amount:p.total}],'采购入库-'+(s?s.name:''),'采购自动生成');
    return true;
  },
  // 收款：应收减少 + 凭证（借 银行存款 贷 应收）
  receivePay(customerId,amount,method,remark){
    const c=Engine.custById(customerId);if(!c)return false;
    c.receivable=Math.max(0,+(c.receivable-amount).toFixed(2));
    DB.receipts.unshift({id:uid('rc'),no:nextNo('rc'),date:today(),customerId,amount,method,remark:remark||'客户收款'});
    Engine.addVoucher('收',[{subj:'1002 银行存款',dir:'借',amount},{subj:'1122 应收账款',dir:'贷',amount}],`收到${c.name}货款`,'收款单自动生成');
    // 核销最早未收款订单
    let rest=amount;
    DB.orders.filter(o=>o.customerId===customerId&&o.status==='已完成'&&o.payStatus!=='已收款').sort((a,b)=>a.date.localeCompare(b.date))
      .forEach(o=>{if(rest>=o.total-0.001){o.payStatus='已收款';rest=+(rest-o.total).toFixed(2)}});
    return true;
  },
  // 付款：应付减少 + 凭证
  makePay(supplierId,amount,method,remark){
    const s=Engine.supById(supplierId);if(!s)return false;
    s.payable=Math.max(0,+(s.payable-amount).toFixed(2));
    DB.payments=DB.payments||[];
    DB.payments.unshift({id:uid('py'),no:nextNo('pay'),date:today(),supplierId,amount,method,remark:remark||'供应商付款'});
    Engine.addVoucher('付',[{subj:'2202 应付账款',dir:'借',amount},{subj:'1002 银行存款',dir:'贷',amount}],`支付${s.name}货款`,'付款单自动生成');
    return true;
  },
  addVoucher(type,lines,summary,source){
    const v={id:uid('v'),no:nextNo('vch'),date:today(),type,summary,source:source||'手工录入',lines:lines.map(l=>({...l}))};
    DB.vouchers.unshift(v);return v;
  },
  // 科目发生额汇总
  subjectBalances(){
    const map={};DB.subjects.forEach(s=>{map[s.code]={...s,debit:0,credit:0}});
    DB.vouchers.forEach(v=>v.lines.forEach(l=>{
      const code=l.subj.split(' ')[0];if(map[code]){
        if(l.dir==='借')map[code].debit+=l.amount;else map[code].credit+=l.amount;
      }}));
    return Object.values(map).map(m=>({...m,debit:+m.debit.toFixed(2),credit:+m.credit.toFixed(2)}));
  },
  // 待办统计
  todo(){
    return {
      audit:DB.orders.filter(o=>o.status==='待审核').length,
      ship:DB.orders.filter(o=>o.status==='待发货').length,
      stockIn:DB.purchases.filter(p=>p.status==='待入库').length,
      collect:DB.customers.filter(c=>c.receivable>0.01).length,
      leave:DB.leaves.filter(l=>l.status==='待审批').length,
      lowStock:DB.goods.filter(g=>g.status==='已上架'&&g.stock<=g.safe).length
    };
  }
};

/* ================= 商品中心 ================= */
const GoodsState={kw:'',cat:'全部',status:'全部'};
function renderGoods(){
  const list=DB.goods.filter(g=>
    (GoodsState.cat==='全部'||g.cat===GoodsState.cat)&&
    (GoodsState.status==='全部'||g.status===GoodsState.status)&&
    (!GoodsState.kw||(g.name+g.code+g.alias).toLowerCase().includes(GoodsState.kw.toLowerCase())));
  const stockValue=+DB.goods.reduce((s,g)=>s+g.stock*g.cost,0).toFixed(2);
  $('#view').innerHTML=`
  <div class="page-head"><div><h1>商品档案</h1><span class="sub">共 ${DB.goods.length} 个商品 · 库存货值 ¥${fmt(stockValue)}</span></div>
    <div class="actions"><button class="btn primary" onclick="goodsForm()">+ 新增商品</button></div></div>
  <div class="card">
    <div class="filter-bar">
      <div class="fld"><label>分类</label><select class="select" onchange="GoodsState.cat=this.value;render()">
        ${['全部',...DB.cats].map(c=>`<option ${c===GoodsState.cat?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="fld"><label>状态</label><select class="select" style="min-width:96px" onchange="GoodsState.status=this.value;render()">
        ${['全部','已上架','已下架'].map(c=>`<option ${c===GoodsState.status?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="fld"><label>搜索</label><input class="input" placeholder="商品名/编码/助记码" value="${esc(GoodsState.kw)}"
        oninput="GoodsState.kw=this.value;renderGoodsList()"></div>
      <span style="margin-left:auto;font-size:12.5px;color:var(--ink-400)">筛选结果 ${list.length} 条</span>
    </div>
    <div class="table-wrap" id="goodsTbl">${goodsTable(list)}</div>
  </div>`;
}
function goodsTable(list){
  if(!list.length)return `<div class="empty"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><p>没有符合条件的商品</p></div>`;
  return `<table class="tbl"><thead><tr>
    <th>编码</th><th>商品名称</th><th>分类</th><th>单位</th><th class="num">售价</th><th class="num">成本价</th>
    <th class="num">库存</th><th>库存状态</th><th>状态</th><th>操作</th></tr></thead><tbody>
    ${list.map(g=>{const low=g.stock<=g.safe;
      return `<tr>
      <td>${esc(g.code)}</td>
      <td class="strong">${esc(g.name)}</td>
      <td>${esc(g.cat)}</td><td>${esc(g.unit)}</td>
      <td class="num money">¥${fmt(g.price)}</td><td class="num" style="color:var(--ink-500)">¥${fmt(g.cost)}</td>
      <td class="num strong">${fmtN(g.stock)}</td>
      <td>${low?'<span class="tag r">低于安全库存</span>':'<span class="tag gr">正常</span>'}</td>
      <td><span class="tag ${g.status==='已上架'?'g':'gr'}">${g.status}</span></td>
      <td><div class="ops">
        <button class="btn link" onclick="goodsForm('${g.id}')">编辑</button>
        <button class="btn link" onclick="toggleGoods('${g.id}')">${g.status==='已上架'?'下架':'上架'}</button>
        <button class="btn link" style="color:var(--red)" onclick="delGoods('${g.id}')">删除</button>
      </div></td></tr>`}).join('')}
  </tbody></table>`;
}
function renderGoodsList(){$('#goodsTbl').innerHTML=goodsTable(DB.goods.filter(g=>
  (GoodsState.cat==='全部'||g.cat===GoodsState.cat)&&(GoodsState.status==='全部'||g.status===GoodsState.status)&&
  (!GoodsState.kw||(g.name+g.code+g.alias).toLowerCase().includes(GoodsState.kw.toLowerCase()))))}
function toggleGoods(id){const g=Engine.goodsById(id);g.status=g.status==='已上架'?'已下架':'已上架';saveDB();render();toast(`${g.name} 已${g.status}`)}
function delGoods(id){const g=Engine.goodsById(id);
  confirmBox(`确定删除商品「${g.name}」？该操作不可恢复。`,()=>{DB.goods=DB.goods.filter(x=>x.id!==id);saveDB();renderNav();render();toast('商品已删除')})}
function goodsForm(id){
  const g=id?Engine.goodsById(id):null;
  openModal(g?'编辑商品':'新增商品',`<div class="form-grid">
    <div class="fitem"><label>商品名称 <span class="req">*</span></label><input class="input" id="f_name" value="${esc(g?.name||'')}" placeholder="如：嫩豆腐"></div>
    <div class="fitem"><label>商品编码</label><input class="input" id="f_code" value="${esc(g?.code||'DJ'+String(DB.goods.length+1).padStart(3,'0'))}"></div>
    <div class="fitem"><label>商品分类 <span class="req">*</span></label><select class="select" id="f_cat">${DB.cats.map(c=>`<option ${g?.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="fitem"><label>单位 <span class="req">*</span></label><select class="select" id="f_unit">${['斤','kg','盒','袋','桶','箱','包','份','个'].map(u=>`<option ${g?.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>
    <div class="fitem"><label>销售价(元) <span class="req">*</span></label><input class="input" type="number" step="0.01" id="f_price" value="${g?.price??''}"></div>
    <div class="fitem"><label>成本价(元)</label><input class="input" type="number" step="0.01" id="f_cost" value="${g?.cost??''}"></div>
    <div class="fitem"><label>当前库存</label><input class="input" type="number" step="0.1" id="f_stock" value="${g?.stock??0}" ${g?'disabled style="background:var(--bg)"':''}></div>
    <div class="fitem"><label>安全库存</label><input class="input" type="number" id="f_safe" value="${g?.safe??50}"></div>
    <div class="fitem full"><label>助记码/别名</label><input class="input" id="f_alias" value="${esc(g?.alias||'')}"></div>
  </div>`,
  `<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveGoods('${id||''}')">保存</button>`);
}
function saveGoods(id){
  const name=$('#f_name').value.trim(),price=+$('#f_price').value;
  if(!name||!price){toast('请填写商品名称和销售价','err');return}
  if(id){const g=Engine.goodsById(id);Object.assign(g,{name,code:$('#f_code').value,cat:$('#f_cat').value,unit:$('#f_unit').value,price,cost:+$('#f_cost').value||0,safe:+$('#f_safe').value||0,alias:$('#f_alias').value||name});}
  else DB.goods.unshift({id:uid('g'),name,code:$('#f_code').value,cat:$('#f_cat').value,unit:$('#f_unit').value,price,cost:+$('#f_cost').value||0,stock:+$('#f_stock').value||0,safe:+$('#f_safe').value||0,alias:$('#f_alias').value||name,status:'已上架',created:today()});
  saveDB();closeModal();render();toast(id?'商品已更新':'商品已创建');
}

/* ================= 销售订单 ================= */
const OrderState={tab:'全部',kw:''};
function renderOrders(){
  const t=Engine.todo();
  const tabs=['全部','待审核','待发货','配送中','已完成','已关闭'];
  const cnt=s=>s==='全部'?DB.orders.length:DB.orders.filter(o=>o.status===s).length;
  $('#view').innerHTML=`
  <div class="page-head"><div><h1>销售订单</h1><span class="sub">订单流转：待审核 → 待发货 → 已完成，发货自动扣库存并生成应收</span></div>
    <div class="actions"><button class="btn primary" onclick="orderForm()">+ 新增订单</button></div></div>
  <div class="card">
    <div class="filter-bar" style="flex-direction:column;align-items:stretch;gap:12px">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <div class="tabs">${tabs.map(x=>`<div class="tab ${OrderState.tab===x?'active':''}" onclick="OrderState.tab='${x}';render()">${x}<span class="cnt">${fmtN(cnt(x))}</span></div>`).join('')}</div>
        <input class="input" style="margin-left:auto" placeholder="订单号 / 客户名称" value="${esc(OrderState.kw)}"
          oninput="OrderState.kw=this.value;renderOrderList()"></div>
    </div>
    <div class="table-wrap" id="orderTbl">${orderTable(DB.orders.filter(o=>orderFilter(o)))}</div>
  </div>`;
}
function orderFilter(o){
  const c=Engine.custById(o.customerId);
  return (OrderState.tab==='全部'||o.status===OrderState.tab)&&
    (!OrderState.kw||o.no.includes(OrderState.kw)||(c&&c.name.includes(OrderState.kw)));
}
function orderTable(list){
  if(!list.length)return `<div class="empty"><svg viewBox="0 0 24 24"><path d="M6 2h12l2 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6l2-4z"/></svg><p>暂无订单</p></div>`;
  return `<table class="tbl"><thead><tr>
    <th>订单号</th><th>客户</th><th class="num">下单金额</th><th>下单日期</th><th>发货日期</th><th>来源</th>
    <th>状态</th><th>收款</th><th>操作</th></tr></thead><tbody>
    ${list.map(o=>{const c=Engine.custById(o.customerId);
      return `<tr>
      <td class="strong" style="cursor:pointer;color:var(--brand-600)" onclick="orderDetail('${o.id}')">${esc(o.no)}</td>
      <td>${esc(c?c.name:'-')}<div style="font-size:11px;color:var(--ink-400)">${c?c.route||'':'-'}</div></td>
      <td class="num money strong">¥${fmt(o.total)}</td>
      <td>${o.date}</td><td>${o.deliveryDate||'-'}</td><td>${esc(o.source||'-')}</td>
      <td><span class="tag ${ORDER_ST[o.status]}">${o.status}</span></td>
      <td>${o.status==='已完成'?`<span class="tag ${o.payStatus==='已收款'?'g':'o'}">${o.payStatus||'未收款'}</span>`:'<span class="tag gr">-</span>'}</td>
      <td><div class="ops">
        ${o.status==='待审核'?`<button class="btn link" onclick="auditOrder('${o.id}')">审核</button>`:''}
        ${o.status==='待发货'?`<button class="btn link" onclick="shipOrder('${o.id}')">确认发货</button>`:''}
        ${o.status==='配送中'?`<button class="btn link" onclick="finishOrder('${o.id}')">完成配送</button>`:''}
        ${['待审核','待发货'].includes(o.status)?`<button class="btn link" onclick="orderForm('${o.id}')">编辑</button>
        <button class="btn link" style="color:var(--red)" onclick="closeOrder('${o.id}')">关闭</button>`:''}
        <button class="btn link" onclick="orderDetail('${o.id}')">详情</button>
      </div></td></tr>`}).join('')}
  </tbody><tfoot><tr><td colspan="2">合计</td><td class="num money">¥${fmt(list.reduce((s,o)=>s+o.total,0))}</td><td colspan="6"></td></tr></tfoot></table>`;
}
function renderOrderList(){$('#orderTbl').innerHTML=orderTable(DB.orders.filter(o=>orderFilter(o)))}
function auditOrder(id){const o=DB.orders.find(x=>x.id===id);
  confirmBox(`审核通过订单「${o.no}」？审核后进入待发货。`,()=>{o.status='待发货';saveDB();renderNav();render();toast('订单已审核，进入待发货')})}
function shipOrder(id){const o=DB.orders.find(x=>x.id===id);
  const stockWarn=o.items.map(it=>{const g=Engine.goodsById(it.goodsId);return g&&g.stock<it.qty?`${g.name}(库存${fmtN(g.stock)}/需${fmtN(it.qty)})`:null}).filter(Boolean);
  confirmBox(`确认订单「${o.no}」发货？${stockWarn.length?'<br><b style="color:var(--red)">库存不足：'+esc(stockWarn.join('、'))+'，发货后库存为0。</b>':''}<br>发货后将自动扣减库存、生成客户应收与收入凭证。`,
    ()=>{Engine.fulfillOrder(o);saveDB();renderNav();render();toast('订单已发货，库存/应收/凭证已联动更新')})}
function finishOrder(id){const o=DB.orders.find(x=>x.id===id);o.status='已完成';o.payStatus='未收款';
  const c=Engine.custById(o.customerId);if(c)c.receivable=+(c.receivable+o.total).toFixed(2);
  Engine.addVoucher('转',[{subj:'1122 应收账款',dir:'借',amount:o.total},{subj:'6001 主营业务收入',dir:'贷',amount:o.total}],'客户销售确认收入-'+(c?c.name:''),'订单自动生成');
  saveDB();renderNav();render();toast('配送完成，已生成应收')}
function closeOrder(id){const o=DB.orders.find(x=>x.id===id);
  confirmBox(`确定关闭订单「${o.no}」？`,()=>{o.status='已关闭';saveDB();renderNav();render();toast('订单已关闭')})}
let OI={cid:'',rows:[]};
function orderForm(id){
  const o=id?DB.orders.find(x=>x.id===id):null;
  OI={cid:o?o.customerId:(DB.customers[0]?DB.customers[0].id:''),rows:o?o.items.map(it=>({...it})):[{goodsId:DB.goods[0].id,qty:10,price:DB.goods[0].price}]};
  openModal(o?'编辑订单':'新增订单',`
    <div class="form-grid" style="margin-bottom:14px">
      <div class="fitem"><label>客户 <span class="req">*</span></label>
        <select class="select" id="o_cust" onchange="OI.cid=this.value">${DB.customers.map(c=>`<option value="${c.id}" ${OI.cid===c.id?'selected':''}>${esc(c.name)}（${c.type}）</option>`).join('')}</select></div>
      <div class="fitem"><label>发货日期</label><input class="input" type="date" id="o_date" value="${o?o.deliveryDate||dOff(1):dOff(1)}"></div>
      <div class="fitem"><label>订单来源</label><select class="select" id="o_src">${['后台','小程序','电话'].map(s=>`<option ${o&&o.source===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="fitem"><label>备注</label><input class="input" id="o_remark" value="${esc(o?.remark||'')}" placeholder="选填"></div>
    </div>
    <div style="display:flex;align-items:center;margin-bottom:8px"><b style="font-size:13px">商品明细</b>
      <button class="btn sm" style="margin-left:auto" onclick="addOrderRow()">+ 添加商品</button></div>
    <div class="table-wrap" style="border:1px solid var(--line);border-radius:8px" id="o_rows"></div>`,
  `<span style="margin-right:auto;font-size:13px">合计：<b class="money" id="o_total" style="font-size:16px;color:var(--brand-600)">¥0.00</b></span>
   <button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveOrder('${id||''}')">保存订单</button>`);
  renderOrderRows();
}
function renderOrderRows(){
  $('#o_rows').innerHTML=`<table class="tbl"><thead><tr><th style="min-width:180px">商品</th><th style="width:100px">数量</th><th style="width:110px">单价</th><th class="num" style="width:110px">小计</th><th style="width:50px"></th></tr></thead><tbody>
    ${OI.rows.map((r,i)=>{const g=Engine.goodsById(r.goodsId);
      return `<tr>
      <td><select class="select" style="width:100%" onchange="OI.rows[${i}].goodsId=this.value;OI.rows[${i}].price=Engine.goodsById(this.value).price;renderOrderRows()">
        ${DB.goods.filter(x=>x.status==='已上架').map(x=>`<option value="${x.id}" ${r.goodsId===x.id?'selected':''}>${esc(x.name)}(${esc(x.unit)})</option>`).join('')}</select></td>
      <td><input class="input" type="number" step="0.1" min="0" value="${r.qty}" oninput="OI.rows[${i}].qty=+this.value||0;upOrderTotal()"></td>
      <td><input class="input" type="number" step="0.01" min="0" value="${r.price}" oninput="OI.rows[${i}].price=+this.value||0;upOrderTotal()"></td>
      <td class="num money">¥${fmt(r.qty*r.price)}</td>
      <td><button class="btn link" style="color:var(--red);padding:2px 6px" onclick="OI.rows.splice(${i},1);renderOrderRows()">✕</button></td></tr>`}).join('')}
  </tbody></table>`;
  upOrderTotal();
}
function addOrderRow(){OI.rows.push({goodsId:DB.goods[0].id,qty:10,price:DB.goods[0].price});renderOrderRows()}
function upOrderTotal(){
  const total=OI.rows.reduce((s,r)=>s+r.qty*r.price,0);
  const el=$('#o_total');if(el)el.textContent='¥'+fmt(total);
}
function saveOrder(id){
  if(!OI.rows.length){toast('请至少添加一个商品','err');return}
  const items=OI.rows.map(r=>({goodsId:r.goodsId,qty:r.qty,price:r.price,amount:+(r.qty*r.price).toFixed(2)}));
  const total=+items.reduce((s,r)=>s+r.amount,0).toFixed(2);
  if(!isFinite(total)||items.some(r=>!isFinite(r.amount)||r.qty<=0)){toast('请填写有效的商品数量与单价','err');return}
  if(id){const o=DB.orders.find(x=>x.id===id);Object.assign(o,{customerId:OI.cid,items,total,deliveryDate:$('#o_date').value,source:$('#o_src').value,remark:$('#o_remark').value})}
  else{
    const dt=today();
    const no=nextNo('order');
    DB.orders.unshift({id:uid('o'),no,date:dt,deliveryDate:$('#o_date').value||dOff(1),customerId:OI.cid,items,total,status:'待审核',payStatus:'未收款',source:$('#o_src').value,remark:$('#o_remark').value});
  }
  saveDB();closeModal();renderNav();render();toast(id?'订单已更新':'订单已创建，待审核');
}
function orderDetail(id){
  const o=DB.orders.find(x=>x.id===id);const c=Engine.custById(o.customerId);
  const flowIdx=ORDER_FLOW.indexOf(o.status==='配送中'?'待发货':o.status);

  const flows=DB.stockFlows.filter(f=>!StockState.kw||(Engine.goodsById(f.goodsId)||{name:''}).name.includes(StockState.kw)||(f.refNo||'').includes(StockState.kw)).slice().reverse().slice(0,60);
  $('#view').innerHTML=`

    <div class="actions"><button class="btn" onclick="stockAdjustForm()">库存调整</button></div></div>
  <div class="card" style="margin-bottom:14px">

      <div class="tab ${StockState.tab==='inventory'?'active':''}" onclick="StockState.tab='inventory';render()">实时库存</div>
      <div class="tab ${StockState.tab==='flows'?'active':''}" onclick="StockState.tab='flows';render()">库存流水</div></div></div>
    ${StockState.tab==='inventory'
      ?`<div class="table-wrap"><table class="tbl"><thead><tr>
        <th>商品</th><th>分类</th><th class="num">当前库存</th><th>单位</th><th class="num">安全库存</th><th class="num">货值(成本)</th><th>库存状态</th></tr></thead><tbody>
        ${DB.goods.map(g=>{const low=g.stock<=g.safe;
          return `<tr><td class="strong">${esc(g.name)}</td><td>${esc(g.cat)}</td>
          <td class="num strong">${fmtN(g.stock)}</td><td>${esc(g.unit)}</td>
          <td class="num" style="color:var(--ink-500)">${fmtN(g.safe)}</td>
          <td class="num money">¥${fmt(g.stock*g.cost)}</td>
          <td>${low?'<span class="tag r">库存预警</span>':g.stock<=g.safe*1.5?'<span class="tag o">接近预警</span>':'<span class="tag g">正常</span>'}</td></tr>`}).join('')}
      </tbody></table></div>`
      :`<div class="filter-bar"><div class="fld"><label>搜索</label><input class="input" placeholder="商品名 / 单据号" value="${esc(StockState.kw)}" oninput="StockState.kw=this.value;render()"></div></div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>时间</th><th>商品</th><th>类型</th><th class="num">数量变化</th><th>关联单号</th></tr></thead><tbody>
        ${flows.map(f=>{const g=Engine.goodsById(f.goodsId);
          return `<tr><td>${f.date}</td><td class="strong">${esc(g?g.name:'-')}</td>
          <td><span class="tag ${f.qty>0?'g':'o'}">${f.type}</span></td>
          <td class="num money ${numCls(f.qty)}">${f.qty>0?'+':''}${fmtN(f.qty)}</td>
          <td>${esc(f.refNo||'-')}</td></tr>`}).join('')}
      </tbody></table></div>`}
  </div>`;
}
function stockAdjustForm(){
  openModal('库存调整',`<div class="form-grid">
    <div class="fitem full"><label>商品 <span class="req">*</span></label><select class="select" id="adj_goods">${DB.goods.map(g=>`<option value="${g.id}">${esc(g.name)}（当前 ${fmtN(g.stock)} ${esc(g.unit)}）</option>`).join('')}</select></div>
    <div class="fitem"><label>调整类型</label><select class="select" id="adj_type"><option>盘盈入库</option><option>盘亏出库</option><option>领用出库</option><option>报废出库</option></select></div>
    <div class="fitem"><label>数量 <span class="req">*</span></label><input class="input" type="number" id="adj_qty" min="0" placeholder="正整数"></div>
    <div class="fitem full"><label>调整原因</label><input class="input" id="adj_reason" placeholder="如：盘点差异"></div>
  </div>`,
  `<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="doStockAdjust()">确认调整</button>`);
}
function doStockAdjust(){
  const gid=$('#adj_goods').value,qty=+$('#adj_qty').value,type=$('#adj_type').value;
  if(!qty||qty<=0){toast('请输入有效数量','err');return}
  const g=Engine.goodsById(gid);
  const inbound=type.includes('盘盈');
  g.stock=+(g.stock+(inbound?qty:-qty)).toFixed(1);
  DB.stockFlows.push({id:uid('sf'),date:today(),goodsId:gid,type,qty:inbound?qty:-qty,refNo:'手动调整'});
  saveDB();closeModal();renderNav();render();
  toast(`已${inbound?'增加':'扣减'}「${g.name}」库存 ${fmtN(qty)} ${g.unit}`);
}

function saveCust(id){
  const name=$('#c_name').value.trim(),contact=$('#c_contact').value.trim();
  if(!name||!contact){toast('请填写客户名称和联系人','err');return}
  const data={name,code:$('#c_code').value,type:$('#c_type').value,contact,phone:$('#c_phone').value,route:$('#c_route').value,addr:$('#c_addr').value};
  if(id)Object.assign(Engine.custById(id),data);
  else DB.customers.push({id:uid('c'),...data,receivable:0,status:'合作中',created:today()});
  saveDB();closeModal();render();toast(id?'客户已更新':'客户已创建');
}
function delCust(id){const c=Engine.custById(id);
  confirmBox(`确定删除客户「${c.name}」？`,()=>{DB.customers=DB.customers.filter(x=>x.id!==id);saveDB();renderNav();render();toast('客户已删除')})}
function custReceive(id){
  const c=Engine.custById(id);
  if(c.receivable<=0.001){toast('该客户暂无应收账款','info');return}
  openModal('客户收款 - '+c.name,`<div class="form-grid">
    <div class="fitem full"><label>当前应收余额</label><div class="money" style="font-size:20px;font-weight:700;color:var(--red)">¥${fmt(c.receivable)}</div></div>
    <div class="fitem"><label>收款金额 <span class="req">*</span></label><input class="input" type="number" step="0.01" id="rc_amt" value="${c.receivable}"></div>

    <div class="fitem full"><label>备注</label><input class="input" id="rc_remark" placeholder="选填"></div>
  </div>`,
  `<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="doCustReceive('${c.id}')">确认收款</button>`);
}
function doCustReceive(id){
  const c=Engine.custById(id);const amt=+$('#rc_amt').value;
  if(!amt||amt<=0){toast('请输入有效金额','err');return}
  if(amt>c.receivable+0.001){toast('收款金额不能超过应收余额','err');return}
  Engine.receivePay(id,amt,$('#rc_method').value,$('#rc_remark').value);
  saveDB();closeModal();renderNav();render();toast('收款成功，应收减少并生成收款凭证');
}

  const overdue30=+(DB.orders.filter(o=>o.status==='已完成'&&o.payStatus!=='已收款'&&o.date<dOff(-15)).reduce((s,o)=>s+o.total,0)).toFixed(2);
  $('#view').innerHTML=`

function renderVLines(){
  const subjOpts=v=>DB.subjects.map(s=>`<option value="${s.code} ${s.name}" ${v.subj===s.code+' '+s.name?'selected':''}>${s.code} ${s.name}</option>`).join('');
  $('#v_lines').innerHTML=`<table class="tbl voucher-lines" style="border:1px solid var(--line);border-radius:8px;overflow:hidden"><thead><tr>

      <td><select class="select" onchange="VI.lines[${i}].dir=this.value;upVTotals()"><option ${l.dir==='借'?'selected':''}>借</option><option ${l.dir==='贷'?'selected':''}>贷</option></select></td>

function addVLine(){VI.lines.push({subj:DB.subjects[0].code+' '+DB.subjects[0].name,dir:'借',amount:''});renderVLines()}
function upVTotals(){
  const d=VI.lines.filter(l=>l.dir==='借').reduce((s,l)=>s+(+l.amount||0),0);
  const c=VI.lines.filter(l=>l.dir==='贷').reduce((s,l)=>s+(+l.amount||0),0);

  if(de){de.textContent='¥'+fmt(d);de.style.color=Math.abs(d-c)<0.005?'var(--green)':'var(--red)'}

function saveVoucher(){
  const summary=$('#v_summary').value.trim();
  if(!summary){toast('请填写摘要','err');return}
  const d=VI.lines.filter(l=>l.dir==='借').reduce((s,l)=>s+(+l.amount||0),0);
  const c=VI.lines.filter(l=>l.dir==='贷').reduce((s,l)=>s+(+l.amount||0),0);
  if(d<=0){toast('借方合计必须大于0','err');return}

/* ================= 运营管理：报表分析 ================= */
let ReportState={tab:'trend'};
function reportAgg(){
  const os=DB.orders.filter(o=>o.status==='已完成'||o.status==='配送中');
  const gMap={},cMap={},catMap={};
  os.forEach(o=>{
    const cv0=cMap[o.customerId]||(cMap[o.customerId]={sales:0,cnt:0});
    cv0.cnt++;cv0.sales=+(cv0.sales+o.total).toFixed(2);
    o.items.forEach(it=>{const g=Engine.goodsById(it.goodsId);if(!g)return;
      const gv=gMap[g.id]||(gMap[g.id]={qty:0,sales:0,profit:0});
      gv.qty+=it.qty;gv.sales=+(gv.sales+it.amount).toFixed(2);gv.profit=+(gv.profit+it.amount-it.qty*g.cost).toFixed(2);
      const cv=catMap[g.cat]||(catMap[g.cat]={sales:0,profit:0});
      cv.sales=+(cv.sales+it.amount).toFixed(2);cv.profit=+(cv.profit+it.amount-it.qty*g.cost).toFixed(2);});
  });
  return {os,gMap,cMap,catMap};
}
function renderReport(){
  const {os,gMap,cMap,catMap}=reportAgg();
  const mk=monthKey(today());
  const mos=os.filter(o=>monthKey(o.date)===mk);
  const mSales=+mos.reduce((s,o)=>s+o.total,0).toFixed(2);
  const mProfit=+mos.reduce((s,o)=>s+o.items.reduce((a,it)=>{const g=Engine.goodsById(it.goodsId);return a+it.amount-(g?it.qty*g.cost:0)},0),0).toFixed(2);
  const mRate=mSales?(mProfit/mSales*100).toFixed(1):'0.0';
  // 近14日趋势
  const days=[];for(let i=13;i>=0;i--){const d=dOff(-i);const dd=os.filter(o=>o.date===d);
    days.push({d,sales:+dd.reduce((s,o)=>s+o.total,0).toFixed(2),cnt:dd.length})}
  const max=Math.max(...days.map(x=>x.sales),1);
  const W=760,H=235,P={l:56,r:14,t:20,b:30},cw=(W-P.l-P.r)/14,bw=Math.min(32,cw*0.56);
  const gf=[0,.5,1];

  const grid=gy.map((y,i)=>`<line x1="${P.l}" y1="${y.toFixed(1)}" x2="${W-P.r}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <text x="${P.l-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--ink-400)">${fmtN(max*(1-gf[i]))}</text>`).join('');
  let bars='';days.forEach((x,i)=>{
    const h=Math.max((x.sales/max)*(H-P.t-P.b),2),bx=P.l+cw*i+(cw-bw)/2,by=H-P.b-h,cx=(P.l+cw*i+cw/2).toFixed(1);
    bars+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${i===13?'var(--brand-500)':'#BFE3D6'}"><title>${x.d}｜销售额 ¥${fmt(x.sales)}｜${x.cnt} 单</title></rect>
    <text x="${cx}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--ink-400)">${x.d.slice(5)}</text>
    ${x.sales>0?`<text x="${cx}" y="${(by-6).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink-500)">${fmtN(x.sales)}</text>`:''}`;});
  const tabs=REPORT_TABS.map(([k,t])=>`<div class="tab ${ReportState.tab===k?'on':''}" onclick="ReportState.tab='${k}';render()">${t}</div>`).join('');

    <div class="table-wrap"><table class="tbl"><thead><tr><th style="width:44px">排名</th><th>商品</th><th>分类</th><th class="num">销量</th><th style="min-width:200px">销售额占比</th><th class="num">毛利</th><th class="num">毛利率</th></tr></thead><tbody>
      ${gr.map((x,i)=>{const rate=x.sales?(x.profit/x.sales*100).toFixed(1):'0.0';
        return `<tr><td><span class="rk ${i<3?'top':''}">${i+1}</span></td>

      ${cr.map((x,i)=>`<tr><td><span class="rk ${i<3?'top':''}">${i+1}</span></td>

let PunchState={empId:'e1'};
const WEEK_CN=['周日','周一','周二','周三','周四','周五','周六'];
function punchToday(){return DB.attendance.find(a=>a.date===today()&&a.empId===PunchState.empId)}
function doPunch(kind){
  const t=nowHM();let rec=punchToday();
  if(!rec){rec={date:today(),empId:PunchState.empId,checkin:'',checkout:'',status:'正常'};DB.attendance.push(rec)}
  if(kind==='in'){
    if(rec.checkin){toast('今日已打过上班卡','info');return}
    rec.checkin=t;rec.status=t>'08:30'?'迟到':'正常';
    toast(rec.status==='迟到'?'已打卡，但已迟到':'上班打卡成功');
  }else{
    if(!rec.checkin){toast('请先打上班卡','err');return}
    if(rec.checkout){toast('今日已打过下班卡','info');return}
    rec.checkout=t;if(rec.status==='正常'&&t<'17:30')rec.status='早退';
    toast('下班打卡成功');
  }
  saveDB();render();
}
function punchCalendar(){
  const t=today();const Y=+t.slice(0,4),M=+t.slice(5,7);
  const days=new Date(Y,M,0).getDate(),wd=(new Date(Y,M-1,1).getDay()+6)%7;
  const amap={};DB.attendance.filter(a=>a.empId===PunchState.empId).forEach(a=>amap[a.date]=a);
  let cells='';for(let i=0;i<wd;i++)cells+='<div></div>';
  for(let d=1;d<=days;d++){
    const ds=Y+'-'+String(M).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const a=amap[ds],future=ds>t;
    let tag='<span style="color:var(--ink-400)">·</span>',tbg='';
    if(a){if(a.status==='正常'){tag='班';tbg='background:var(--green-bg);color:var(--green)'}
      else if(a.status==='迟到'){tag='迟';tbg='background:var(--amber-bg);color:var(--amber)'}
      else{tag='缺';tbg='background:var(--red-bg);color:var(--red)'}}
    cells+=`<div class="cal cell${ds===t?' today':''}${future?' dim':''}"><b>${d}</b><span class="shift-tag" style="${tbg}">${tag}</span></div>`;
  }
  return `<div class="cal">${['一','二','三','四','五','六','日'].map(x=>`<div class="hd">${x}</div>`).join('')}${cells}</div>`;
}

          <button class="punch-btn" onclick="doPunch('in')">上班<br>打卡</button>
          <button class="punch-btn" onclick="doPunch('out')">下班<br>打卡</button>
        </div>
        <div class="punch-state">
          <span>上班 ${rec&&rec.checkin?rec.checkin:'--:--'}</span>
          <span>下班 ${rec&&rec.checkout?rec.checkout:'--:--'}</span>

        <div class="table-wrap"><table class="tbl"><thead><tr><th>员工</th><th>部门</th><th>上班</th><th>下班</th><th>状态</th><th>本月出勤率</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
    </div>
    <div>
      <div class="card"><div class="card-h"><h3>考勤对象</h3></div><div class="card-b">
        <select class="select" style="width:100%" onchange="PunchState.empId=this.value;render()">
          ${DB.employees.filter(e=>e.status==='在职').map(e=>`<option value="${e.id}" ${e.id===emp.id?'selected':''}>${esc(e.name)} · ${esc(e.dept)}</option>`).join('')}
        </select>
        <div class="grid-2" style="margin-top:14px;gap:10px">
          <div style="background:var(--brand-50);border-radius:9px;padding:10px 12px"><div style="font-size:11.3px;color:var(--ink-500)">本月出勤</div><div style="font-size:20px;font-weight:700;color:var(--brand-700)">${worked}<small style="font-size:11px;color:var(--ink-400)"> 天</small></div></div>

          <div style="background:var(--red-bg);border-radius:9px;padding:10px 12px"><div style="font-size:11.3px;color:var(--ink-500)">缺卡/早退</div><div style="font-size:20px;font-weight:700;color:var(--red)">${miss}<small style="font-size:11px"> 次</small></div></div>
          <div style="background:var(--green-bg);border-radius:9px;padding:10px 12px"><div style="font-size:11.3px;color:var(--ink-500)">出勤率</div><div style="font-size:20px;font-weight:700;color:var(--green)">${rate}<small style="font-size:11px">%</small></div></div>
        </div>
      </div></div>
      <div class="card" style="margin-top:14px"><div class="card-h"><h3>${ym.slice(0,4)}年${+ym.slice(5,7)}月考勤日历</h3><span class="hint">${esc(emp.name)}</span></div><div class="card-b">${punchCalendar()}
        <div style="display:flex;gap:12px;margin-top:10px;font-size:11.3px;color:var(--ink-500)">

function saveLeave(){
  const empId=$('#lv_emp').value,type=$('#lv_type').value,start=$('#lv_start').value,end=$('#lv_end').value,reason=$('#lv_reason').value.trim();
  if(!start||!end){toast('请选择起止日期','err');return}
  const days=Math.round((new Date(end)-new Date(start))/86400000)+1;
  if(days<=0){toast('结束日期不能早于开始日期','err');return}
  if(!reason){toast('请填写请假事由','err');return}
  DB.leaves.unshift({id:uid('lv'),empId,type,start,end,days,reason,status:'待审批',appliedAt:today()+' '+nowHM()});

}

    <div class="kpi"><div class="k-label">质检合格率</div><div class="k-value" style="color:var(--green)">${passRate}%</div><div class="k-delta">QC 一次性合格</div></div>

    ${batches.map(b=>{

      <td style="font-size:12px">${esc(b.customerName)}</td>
      <td><span class="tag ${stTag}">${b.status}</span></td>
      <td><span class="tag ${b.qcResult==='合格'?'g':'r'}">${b.qcResult}</span></td>
      <td><button class="btn link" onclick="traceDetail('${b.id}')">查看链路</button></td></tr>`}).join('')}
    </tbody></table></div></div>`;

function traceDetail(id){
  const b=(DB.traceBatches||[]).find(x=>x.id===id);if(!b)return;
  const steps=[
    {icon:'🌾',title:'原料产地',name:b.origin,date:b.produceDate,desc:'原料采购源头',done:true},
    {icon:'🏭',title:'生产加工',name:b.supplierName,date:b.produceDate,desc:'供应商生产加工',done:true},
    {icon:'📦',title:'入库验收',name:`${b.inboundQty}${b.unit}`,date:b.inboundDate,desc:'质检'+b.qcResult+'·入库',done:true},
    {icon:'🔍',title:'分拣打包',name:b.pickDate?'已分拣':'待分拣',date:b.pickDate||'—',desc:'按订单分拣',done:!!b.pickDate},
    {icon:'🚚',title:'冷链配送',name:b.vehicle+'·'+b.route,date:b.deliverDate||'—',desc:'车辆配送',done:!!b.deliverDate},
    {icon:'✅',title:'客户签收',name:b.customerName,date:b.deliverDate||'—',desc:'送达签收',done:b.status==='已送达'}
  ];
  // 温控折线图
  let tempSvg='';
  if(b.tempLog&&b.tempLog.length){
    const ts=b.tempLog;const W=460,H=140,pl=40,pr=12,pt=15,pb=35;
    const temps=ts.map(t=>t.temp);const minT=Math.min(...temps)-1,maxT=Math.max(...temps)+1;
    const range=maxT-minT||1;
    const cw=(W-pl-pr)/Math.max(ts.length-1,1);
    const pts=ts.map((t,i)=>[pl+cw*i,pt+(1-(t.temp-minT)/range)*(H-pt-pb)]);
    const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    tempSvg=`<div style="margin-top:14px"><h4 style="font-size:12.5px;font-weight:600;color:var(--ink-700);margin-bottom:8px">冷链温控记录</h4>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;background:var(--bg);border-radius:8px">
      <line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="var(--line)"/>
      <line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" stroke="var(--line)"/>
      ${[0,.5,1].map(f=>{const y=pt+f*(H-pt-pb);return`<line x1="${pl}" y1="${y.toFixed(1)}" x2="${W-pr}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${pl-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--ink-400)">${(maxT-f*range).toFixed(1)}°C</text>`}).join('')}
      <path d="${path}" fill="none" stroke="var(--brand-500)" stroke-width="2.2"/>
      ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--brand-500)"/><text x="${p[0].toFixed(1)}" y="${(H-18).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="var(--ink-400)">${ts[i].time.slice(5)}</text>`).join('')}
      </svg></div>`;
  }
  // 溯源二维码（SVG模拟）
  const qrCells=[];for(let i=0;i<49;i++){if(Math.random()>.4)qrCells.push(i)}
  openDrawer('溯源详情 · '+b.batchNo,`
    <div style="text-align:center;margin-bottom:16px;padding:14px;background:var(--brand-50);border-radius:10px">
      <div style="font-size:13px;color:var(--ink-500)">溯源批次号</div>
      <div style="font-size:20px;font-weight:700;color:var(--brand-700);font-family:monospace;letter-spacing:1px;margin:4px 0">${esc(b.batchNo)}</div>
      <div style="font-size:12px;color:var(--ink-400)">${esc(b.goodsName)} · ${esc(b.origin)}</div>
    </div>
    <div class="desc" style="margin-bottom:14px">
      <div class="di"><label>商品</label><div>${esc(b.goodsName)}</div></div>
      <div class="di"><label>产地</label><div>${esc(b.origin)}</div></div>
      <div class="di"><label>供应商</label><div>${esc(b.supplierName)}</div></div>
      <div class="di"><label>入库数量</label><div>${b.inboundQty} ${esc(b.unit)}</div></div>

      <div class="di"><label>配送客户</label><div>${esc(b.customerName)}</div></div>
      <div class="di"><label>配送车辆</label><div>${esc(b.vehicle)} · ${esc(b.route)}</div></div>
      <div class="di"><label>当前状态</label><div><span class="tag ${b.status==='已送达'?'g':'o'}">${b.status}</span></div></div>
    </div>
    <h4 style="font-size:12.5px;font-weight:600;color:var(--ink-700);margin-bottom:10px">全链路追溯</h4>
    <div style="position:relative;padding-left:6px">
      ${steps.map((s,i)=>{const isLast=i===steps.length-1;
        return `<div style="display:flex;gap:12px;padding-bottom:${isLast?'0':'16px'};position:relative">
          ${!isLast?`<div style="position:absolute;left:15px;top:30px;bottom:0;width:2px;background:${s.done?'var(--brand-500)':'var(--line)'}"></div>`:''}
          <div style="width:30px;height:30px;border-radius:50%;background:${s.done?'var(--brand-500)':'var(--line-strong)'};color:${s.done?'#fff':'var(--ink-400)'};display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;z-index:1">${s.icon}</div>
          <div style="flex:1;padding-top:4px">
            <div style="font-size:13px;font-weight:600;color:${s.done?'var(--ink-900)':'var(--ink-400)'}">${s.title}</div>

          </div></div>`}).join('')}

      <svg width="105" height="105" viewBox="0 0 70 70" style="image-rendering:pixelated">

        <rect x="50" y="0" width="20" height="20" fill="none" stroke="var(--ink-900)" stroke-width="3"/><rect x="55" y="5" width="10" height="10" fill="var(--ink-900)"/>

/* ================= 团餐管理 ================= */
let GmState={tab:'sites',siteId:''};
function renderGroupMeal(){
  const sites=DB.groupSites||[];
  const totalPersons=sites.reduce((s,x)=>s+x.persons,0);
  const activeSites=sites.filter(s=>s.status==='运营中').length;
  const trans=DB.groupTransfers||[];
  const inTransit=trans.filter(t=>t.status==='配送中'||t.status==='待调拨').length;
  // 从订单关联项目点销售数据
  const siteSales={};
  (DB.orders||[]).filter(o=>o.status==='已完成'||o.status==='配送中').forEach(o=>{
    const c=Engine.custById(o.customerId);
    if(!c)return;
    const site=sites.find(s=>s.name===c.name);
    if(site){siteSales[site.id]=(siteSales[site.id]||0)+o.total}
  });
  const totalSales=Object.values(siteSales).reduce((s,v)=>s+v,0);
  const tabs=[['sites','项目点管理'],['stock','项目点库存'],['transfer','总仓调拨'],['sales','进销存分析']];
  const tabsHtml=tabs.map(([k,t])=>`<div class="tab ${GmState.tab===k?'on':''}" onclick="GmState.tab='${k}';render()">${t}</div>`).join('');
  let panel='';
  if(GmState.tab==='sites'){
    panel=`<div class="card"><div class="card-h"><h3>项目点列表</h3><span class="hint">共 ${sites.length} 个项目点 · ${activeSites} 个运营中</span></div>
    <div class="table-wrap"><table class="tbl"><thead><tr><th>项目点</th><th>编号</th><th>类型</th><th>负责人</th><th>就餐人数</th><th>配送线路</th><th>本月销售</th><th>状态</th><th>操作</th></tr></thead><tbody>
    ${sites.map(s=>`<tr><td class="strong">${esc(s.name)}</td><td style="font-family:monospace">${esc(s.code)}</td>
      <td><span class="tag gr">${esc(s.type)}</span></td><td>${esc(s.manager)}</td>
      <td class="num">${s.persons} 人</td><td><span class="tag b">${esc(s.route)}</span></td>
      <td class="num money">${siteSales[s.id]?fmt(siteSales[s.id]):'—'}</td>
      <td><span class="tag ${s.status==='运营中'?'g':'o'}">${s.status}</span></td>
      <td><button class="btn link" onclick="GmState.siteId='${s.id}';GmState.tab='stock';render()">查看库存</button></td></tr>`).join('')}
    </tbody></table></div></div>`;
  }else if(GmState.tab==='stock'){
    const gs=DB.groupStock||[];
    const siteFilter=GmState.siteId;
    const siteStock=siteFilter?gs.filter(x=>x.siteId===siteFilter):gs;
    const siteName=id=>{const s=sites.find(x=>x.id===id);return s?s.name:'-'};
    panel=`<div class="filter-bar"><div class="tabs" style="flex-wrap:wrap">
      <div class="tab ${!siteFilter?'on':''}" onclick="GmState.siteId='';render()">全部项目点</div>
      ${sites.map(s=>`<div class="tab ${siteFilter===s.id?'on':''}" onclick="GmState.siteId='${s.id}';render()">${esc(s.name)}</div>`).join('')}
    </div></div>
    <div class="card" style="margin-top:12px"><div class="card-h"><h3>项目点库存</h3><span class="hint">${siteFilter?'当前：'+esc(siteName(siteFilter)):'全部项目点'} · 与总仓联动</span></div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>项目点</th><th>商品</th><th>分类</th><th class="num">库存数量</th><th>总仓库存</th><th>状态</th><th>操作</th></tr></thead><tbody>
      ${siteStock.map(x=>{const g=Engine.goodsById(x.goodsId);if(!g)return'';
        const low=g.stock<x.safe;const totalWarehouse=g.stock;
        return `<tr><td style="font-size:12px">${esc(siteName(x.siteId))}</td><td>${esc(g.name)}</td><td><span class="tag gr">${esc(g.cat)}</span></td>
        <td class="num strong">${fmtN(x.qty)} ${esc(g.unit)}</td>
        <td class="num" style="color:var(--ink-500)">${fmtN(totalWarehouse)} ${esc(g.unit)}</td>
        <td><span class="tag ${x.qty<10?'r':'g'}">${x.qty<10?'低库存':'充足'}</span></td>
        <td>${x.qty<10?`<button class="btn sm primary" onclick="requestGmTransfer('${x.siteId}','${x.goodsId}',${Math.ceil(20-x.qty)})">申请补货</button>`:'—'}</td></tr>`}).join('')}
      </tbody></table></div></div>`;
  }else if(GmState.tab==='transfer'){
    panel=`<div class="card"><div class="card-h"><h3>总仓→项目点调拨单</h3><span class="hint">总仓发货自动扣减库存 · 项目点签收后增加项目点库存</span></div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>调拨单号</th><th>日期</th><th>调入项目点</th><th>品项数</th><th class="num">总数量</th><th>操作人</th><th>状态</th><th>操作</th></tr></thead><tbody>
      ${trans.map(t=>{const s=sites.find(x=>x.id===t.siteId);const totalQty=t.items.reduce((a,b)=>a+b.qty,0);
        const stTag=t.status==='已签收'?'g':t.status==='配送中'?'b':'o';
        return `<tr><td class="strong" style="font-family:monospace">${esc(t.id.toUpperCase())}</td><td>${t.date}</td>
        <td>${esc(s?s.name:'-')}</td><td class="num">${t.items.length}</td><td class="num">${fmtN(totalQty)}</td>
        <td>${esc(t.operator)}</td><td><span class="tag ${stTag}">${t.status}</span></td>
        <td>${t.status==='待调拨'?`<button class="btn sm primary" onclick="execGmTransfer('${t.id}')">执行调拨</button>`:'—'}</td></tr>`}).join('')}
      </tbody></table></div></div>`;
  }else if(GmState.tab==='sales'){
    // 进销存分析
    const siteData=sites.map(s=>{
      const stock=DB.groupStock.filter(x=>x.siteId===s.id);
      const stockVal=stock.reduce((v,x)=>{const g=Engine.goodsById(x.goodsId);return v+(g?x.qty*g.cost:0)},0);
      const sales=siteSales[s.id]||0;
      const transCount=(DB.groupTransfers||[]).filter(t=>t.siteId===s.id).length;
      return{s,stockVal,sales,transCount,stockCnt:stock.length};
    }).sort((a,b)=>b.sales-a.sales);
    const maxSales=Math.max(...siteData.map(x=>x.sales),1);
    panel=`<div class="card"><div class="card-h"><h3>各项目点进销存汇总</h3><span class="hint">销售额·库存金额·调拨次数</span></div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>项目点</th><th>类型</th><th>就餐人数</th><th class="num">本月销售</th><th>销售占比</th><th class="num">库存金额</th><th class="num">SKU数</th><th class="num">调拨次数</th></tr></thead><tbody>
      ${siteData.map(x=>`<tr><td class="strong">${esc(x.s.name)}</td><td><span class="tag gr">${esc(x.s.type)}</span></td>
        <td class="num">${x.s.persons}</td><td class="num money strong">¥${fmt(x.sales)}</td>
        <td><div class="pbar"><i style="width:${Math.round(x.sales/maxSales*100)}%"></i></div></td>
        <td class="num money">¥${fmt(x.stockVal)}</td><td class="num">${x.stockCnt}</td><td class="num">${x.transCount}</td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="3">合计</td><td class="num money">¥${fmt(totalSales)}</td><td></td>
      <td class="num money">¥${fmt(siteData.reduce((s,x)=>s+x.stockVal,0))}</td><td class="num">${siteData.reduce((s,x)=>s+x.stockCnt,0)}</td><td class="num">${siteData.reduce((s,x)=>s+x.transCount,0)}</td></tr></tfoot></table></div></div>
      <div class="card" style="margin-top:14px"><div class="card-h"><h3>项目点销售对比</h3><span class="hint">按销售额降序</span></div>
        <div class="card-b">${siteData.map(x=>`<div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px"><b>${esc(x.s.name)}</b>
          <span class="money strong">¥${fmt(x.sales)}</span></div>
          <div class="pbar"><i style="width:${Math.round(x.sales/maxSales*100)}%"></i></div></div>`).join('')}</div></div>`;
  }
  $('#view').innerHTML=`
  <div class="page-head"><div><h1>团餐管理</h1><span class="sub">项目点进销存 · 总仓联动调拨 · 各点经营分析</span></div></div>
  <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    <div class="kpi"><div class="k-label">项目点总数</div><div class="k-value">${sites.length}</div><div class="k-delta">${activeSites} 个运营中</div></div>
    <div class="kpi"><div class="k-label">覆盖就餐人数</div><div class="k-value">${fmtN(totalPersons)}</div><div class="k-delta">人/日</div></div>
    <div class="kpi"><div class="k-label">项目点本月销售</div><div class="k-value money">¥${fmtN(totalSales)}</div><div class="k-delta">已完成+配送中</div></div>
    <div class="kpi"><div class="k-label">在途调拨</div><div class="k-value" style="color:var(--amber)">${inTransit}</div><div class="k-delta">待执行/配送中</div></div>
  </div>
  <div class="tabs" style="margin:16px 0 14px">${tabsHtml}</div>
  ${panel}`;
}
function requestGmTransfer(siteId,goodsId,qty){
  const g=Engine.goodsById(goodsId);if(!g)return;
  if(g.stock<qty){toast('总仓库存不足，当前仅 '+g.stock+' '+g.unit,'err');return}
  DB.groupTransfers=DB.groupTransfers||[];
  DB.groupTransfers.unshift({id:'gt'+Date.now().toString(36),date:today(),siteId,items:[{goodsId,qty}],status:'待调拨',operator:'管理员'});
  saveDB();render();toast('调拨申请已创建，待执行');
}
function execGmTransfer(id){
  const t=(DB.groupTransfers||[]).find(x=>x.id===id);if(!t||t.status!=='待调拨')return;
  t.status='配送中';
  t.items.forEach(it=>{const g=Engine.goodsById(it.goodsId);if(g){g.stock=Math.max(0,+(g.stock-it.qty).toFixed(1));
    DB.stockFlows.push({id:uid('sf'),date:today(),goodsId:g.id,type:'团餐调拨',qty:-it.qty,refNo:t.id.toUpperCase()})}});
  saveDB();render();toast('已执行调拨，总仓库存已扣减');
}

/* ================= 启动 ================= */
function tickClock(){
  const el=document.getElementById('punchClock');
  if(el){const n=new Date();el.textContent=[n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':')}
}
setInterval(tickClock,1000);
const ROUTES={
  'dashboard':renderDashboard,
  'orders':renderOrders,'customers':renderCustomers,'goods':renderGoods,
  'purchase':renderPurchase,'suppliers':renderSuppliers,'stock':renderStock,'deliver':renderDeliver,
  'finance/settle':renderSettle,'finance/funds':renderFunds,'finance/voucher':renderVoucher,
  'finance/ledger':renderLedger,'finance/invoice':renderInvoice,
  'trace':renderTrace,'groupmeal':renderGroupMeal,
  'report':renderReport,
  'oa/punch':renderPunch,'oa/leave':renderLeave,'oa/emp':renderEmp,'oa/notice':renderNotice
};
function render(){
  const fn=ROUTES[route().k]||renderDashboard;
  try{fn()}catch(err){$('#view').innerHTML=`<div class="card"><div class="card-b"><div class="empty"><p>页面加载出错：${esc(err.message)}</p><button class="btn primary" style="margin-top:10px" onclick="render()">重试</button></div></div></div>`;console.error(err)}
}
/* 启动应用 */
loadDB();
(function(){
  const el=document.getElementById('todayChip');
  if(el)el.textContent=today()+' '+WEEK_CN[new Date().getDay()];
})();
renderNav();renderCrumbs();render();
</script>
