<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>暖通业务协同演示 Demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      window.__DEMO_ANALYTICS__ = {
        umamiScriptUrl: "",
        websiteId: "",
        productionDomain: ""
      };

      (function () {
        var cfg = window.__DEMO_ANALYTICS__;
        var host = window.location.hostname;
        var blocked = !cfg.websiteId || !cfg.umamiScriptUrl || !cfg.productionDomain;
        var local = host === "localhost" || host === "127.0.0.1" || host === "";
        if (blocked || local || host !== cfg.productionDomain) return;
        var script = document.createElement("script");
        script.defer = true;
        script.src = cfg.umamiScriptUrl;
        script.setAttribute("data-website-id", cfg.websiteId);
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <main class="stage-shell">
      <section class="brief-panel" aria-label="演示说明">
        <div class="brief-kicker">HVAC Mini Program Demo</div>
        <h1>暖通零售 + 渠道业务协同</h1>
        <p>
          用一条订单主线演示客户跟进、合同收款、库存送货、安装留痕、双确认结算和渠道分销统计。
        </p>
        <div class="brief-points">
          <span>未全款禁止安装</span>
          <span>安装照片留痕</span>
          <span>销售财务双确认</span>
          <span>渠道订单归集</span>
        </div>
      </section>

      <section class="phone-frame" aria-label="手机小程序演示">
        <div class="phone-speaker"></div>
        <div class="phone-screen">
          <header class="app-header">
            <div>
              <div class="mini-label">段总公司业务驾驶舱</div>
              <h2 id="screen-title">今日工作台</h2>
            </div>
            <button class="role-pill" id="role-switch" type="button" aria-label="切换演示角色">
              <span id="role-name">总经理</span>
            </button>
          </header>

          <section id="app" class="app-content" aria-live="polite"></section>

          <nav class="tabbar" aria-label="底部导航">
            <button class="tab active" type="button" data-page="dashboard">
              <span class="tab-icon">⌂</span>
              <span>工作台</span>
            </button>
            <button class="tab" type="button" data-page="crm">
              <span class="tab-icon">◇</span>
              <span>客户</span>
            </button>
            <button class="tab" type="button" data-page="orders">
              <span class="tab-icon">≡</span>
              <span>订单</span>
            </button>
            <button class="tab" type="button" data-page="channel">
              <span class="tab-icon">↗</span>
              <span>渠道</span>
            </button>
            <button class="tab" type="button" data-page="trace">
              <span class="tab-icon">◎</span>
              <span>追溯</span>
            </button>
          </nav>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
