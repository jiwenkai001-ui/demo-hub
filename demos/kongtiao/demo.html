<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正兴实业 · 中央空调智能管理系统</title>
<style>
:root {
  --teal-900:#134E4A;--teal-800:#115E59;--teal-700:#0F766E;--teal-600:#0D9488;
  --teal-500:#14B8A6;--teal-400:#2DD4BF;--teal-100:#CCFBF1;--teal-50:#F0FDFA;
  --amber-500:#F59E0B;--amber-400:#FBBF24;--amber-100:#FEF3C7;
  --slate-900:#0F172A;--slate-800:#1E293B;--slate-700:#334155;--slate-600:#475569;
  --slate-500:#64748B;--slate-400:#94A3B8;--slate-300:#CBD5E1;--slate-200:#E2E8F0;
  --slate-100:#F1F5F9;--slate-50:#F8FAFC;
  --red-500:#EF4444;--red-100:#FEE2E2;--green-500:#22C55E;--green-100:#DCFCE7;
  --blue-500:#3B82F6;--blue-100:#DBEAFE;--purple-500:#8B5CF6;--purple-100:#EDE9FE;
  --sidebar-w:220px;--radius:14px;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --shadow-md:0 4px 6px -1px rgba(15,23,42,.08),0 2px 4px -2px rgba(15,23,42,.04);
  --shadow-lg:0 10px 15px -3px rgba(15,23,42,.08),0 4px 6px -4px rgba(15,23,42,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--slate-100);color:var(--slate-800);line-height:1.6;-webkit-font-smoothing:antialiased}

/* ====== TOPBAR ====== */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:linear-gradient(135deg,var(--teal-800),var(--teal-700));box-shadow:0 2px 12px rgba(15,118,110,.3);height:56px;display:flex;align-items:center;padding:0 20px;gap:16px}
.brand{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:15px;white-space:nowrap}
.brand-icon{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px}
.brand-sub{font-size:10px;font-weight:400;opacity:.8}

.role-tabs{display:flex;gap:2px;margin-left:auto;margin-right:12px;background:rgba(255,255,255,.1);border-radius:10px;padding:3px}
.role-tab{padding:6px 14px;border-radius:7px;border:none;background:transparent;color:rgba(255,255,255,.7);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.role-tab:hover{color:#fff;background:rgba(255,255,255,.1)}
.role-tab.active{background:#fff;color:var(--teal-700)}

.device-toggle{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:10px;padding:3px 6px 3px 8px}
.device-toggle>span{color:rgba(255,255,255,.8);font-size:11px;font-weight:500}
.device-btn{width:28px;height:28px;border-radius:6px;border:none;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.device-btn.active{background:#fff;color:var(--teal-700)}
.device-btn svg{width:15px;height:15px}

/* ====== SIDEBAR ====== */
.sidebar{position:fixed;top:56px;left:0;bottom:0;width:var(--sidebar-w);background:#fff;box-shadow:2px 0 8px rgba(15,23,42,.06);z-index:50;overflow-y:auto;padding:12px 0}
.sidebar::-webkit-scrollbar{width:0}
.sidebar-group-label{font-size:10px;color:var(--slate-400);font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:16px 20px 6px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;color:var(--slate-600);cursor:pointer;transition:all .15s;border-left:3px solid transparent;font-weight:500}
.sidebar-item:hover{background:var(--slate-50);color:var(--teal-700)}
.sidebar-item.active{background:var(--teal-50);color:var(--teal-700);border-left-color:var(--teal-500);font-weight:700}
.sidebar-item .icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-item .icon svg{width:18px;height:18px}
.sidebar-item .badge{margin-left:auto;font-size:10px;background:var(--amber-500);color:#fff;padding:1px 7px;border-radius:10px;font-weight:700}

/* ====== MAIN ====== */
.main-wrap{margin-left:var(--sidebar-w);padding-top:56px;min-height:100vh}
.content-area{padding:24px;max-width:1300px;margin:0 auto;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Mobile frame */
.mobile-viewport{display:none;justify-content:center;padding:30px 0}
.mobile-frame{width:390px;height:780px;border-radius:44px;background:#1a1a2e;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.15);position:relative}
.mobile-frame::before{content:'';position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#1a1a2e;border-radius:0 0 18px 18px;z-index:10}
.mobile-screen{width:100%;height:100%;border-radius:32px;overflow-y:auto;overflow-x:hidden;background:var(--slate-100)}
.mobile-screen::-webkit-scrollbar{width:0}
.mobile-content{padding:44px 0 20px}
.mobile-content .content-area{padding:0 16px}

/* ====== SHARED ====== */
.page-title{font-size:20px;font-weight:700;color:var(--slate-900);margin-bottom:2px}
.page-sub{font-size:12px;color:var(--slate-500);margin-bottom:20px}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi-card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpi-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi-card.accent-teal::before{background:var(--teal-500)}
.kpi-card.accent-amber::before{background:var(--amber-500)}
.kpi-card.accent-blue::before{background:var(--blue-500)}
.kpi-card.accent-purple::before{background:var(--purple-500)}
.kpi-card.accent-green::before{background:var(--green-500)}
.kpi-card.accent-red::before{background:var(--red-500)}
.kpi-label{font-size:11px;color:var(--slate-500);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.kpi-label svg{width:13px;height:13px;opacity:.6}
.kpi-value{font-size:26px;font-weight:700;color:var(--slate-900);line-height:1.2}
.kpi-value .unit{font-size:13px;color:var(--slate-400)}
.kpi-trend{font-size:11px;margin-top:4px;display:flex;align-items:center;gap:3px}
.kpi-trend.up{color:var(--green-500)}
.kpi-trend.down{color:var(--red-500)}
.kpi-trend.neutral{color:var(--slate-400)}

.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--slate-200);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:700;color:var(--slate-800);display:flex;align-items:center;gap:7px}
.card-title svg{width:17px;height:17px;color:var(--teal-600)}
.card-action{font-size:12px;color:var(--teal-600);cursor:pointer;font-weight:600}
.card-body{padding:18px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}

.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;font-size:11px;color:var(--slate-500);font-weight:600;padding:9px 14px;border-bottom:2px solid var(--slate-200);white-space:nowrap}
.data-table td{padding:11px 14px;font-size:12px;border-bottom:1px solid var(--slate-100);color:var(--slate-700)}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover{background:var(--slate-50)}

.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;gap:3px}
.tag-teal{background:var(--teal-100);color:var(--teal-700)}
.tag-amber{background:var(--amber-100);color:#92400E}
.tag-blue{background:var(--blue-100);color:#1E40AF}
.tag-purple{background:var(--purple-100);color:#5B21B6}
.tag-green{background:var(--green-100);color:#166534}
.tag-red{background:var(--red-100);color:#991B1B}
.tag-slate{background:var(--slate-200);color:var(--slate-600)}

/* Steps */
.steps-row{display:flex;align-items:center;gap:0;margin:8px 0;flex-wrap:wrap}
.step-item{display:flex;align-items:center;gap:3px}
.step-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--slate-300);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--slate-400)}
.step-dot.done{background:var(--teal-500);border-color:var(--teal-500);color:#fff}
.step-dot.current{background:var(--amber-500);border-color:var(--amber-500);color:#fff}
.step-line{width:20px;height:2px;background:var(--slate-200)}
.step-line.done{background:var(--teal-500)}

/* Bar chart */
.bar-chart{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-label{width:70px;font-size:11px;color:var(--slate-600);text-align:right;flex-shrink:0}
.bar-track{flex:1;height:22px;background:var(--slate-100);border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:10px;font-weight:600;color:#fff;transition:width .8s ease}
.bar-fill.teal{background:linear-gradient(90deg,var(--teal-600),var(--teal-500))}
.bar-fill.amber{background:linear-gradient(90deg,var(--amber-500),var(--amber-400))}
.bar-fill.blue{background:linear-gradient(90deg,#2563EB,#3B82F6)}
.bar-fill.purple{background:linear-gradient(90deg,#7C3AED,#8B5CF6)}
.bar-fill.green{background:linear-gradient(90deg,#16A34A,#22C55E)}
.bar-fill.red{background:linear-gradient(90deg,#DC2626,#EF4444)}
.bar-fill.slate{background:linear-gradient(90deg,#64748B,#94A3B8)}

/* Funnel */
.funnel{display:flex;flex-direction:column;align-items:center;gap:0}
.funnel-step{height:40px;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:600;font-size:12px}
.funnel-step:nth-child(1){width:100%;background:var(--teal-700);border-radius:8px 8px 0 0}
.funnel-step:nth-child(3){width:78%;background:var(--teal-600)}
.funnel-step:nth-child(5){width:56%;background:var(--teal-500)}
.funnel-step:nth-child(7){width:34%;background:var(--amber-500);border-radius:0 0 8px 8px}
.funnel-arrow{color:var(--slate-400);font-size:12px;padding:1px 0}
.funnel-count{font-size:10px;opacity:.8}

/* Photo grid */
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photo-item{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;cursor:pointer;background:linear-gradient(135deg,var(--teal-50),var(--slate-100));display:flex;align-items:center;justify-content:center;transition:transform .2s}
.photo-item:hover{transform:scale(1.03)}
.photo-item::after{content:attr(data-label);position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:9px;padding:12px 6px 5px;text-align:center}
.photo-icon{font-size:24px;opacity:.4}

/* Timeline */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--slate-200)}
.timeline-item{position:relative;margin-bottom:14px}
.timeline-item:last-child{margin-bottom:0}
.timeline-item::before{content:'';position:absolute;left:-19px;top:5px;width:12px;height:12px;border-radius:50%;border:2px solid var(--teal-500);background:#fff}
.timeline-item.done::before{background:var(--teal-500)}
.timeline-time{font-size:10px;color:var(--slate-400)}
.timeline-title{font-size:12px;font-weight:600;color:var(--slate-800);margin:1px 0}
.timeline-desc{font-size:11px;color:var(--slate-500)}

.section-h{font-size:13px;font-weight:700;color:var(--slate-800);margin:16px 0 10px;display:flex;align-items:center;gap:7px}
.section-h .bar{width:3px;height:14px;background:var(--teal-500);border-radius:2px}

/* Mini stats */
.mini-stat{background:var(--slate-50);border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:10px}
.mini-stat-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.mini-stat-label{font-size:10px;color:var(--slate-500)}
.mini-stat-value{font-size:15px;font-weight:700;color:var(--slate-900)}

/* SOP */
.sop-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--slate-100)}
.sop-item:last-child{border-bottom:none}
.sop-num{width:22px;height:22px;border-radius:6px;background:var(--teal-100);color:var(--teal-700);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sop-text{font-size:12px;color:var(--slate-700);line-height:1.5}

/* Warranty */
.warranty-card{border:1px solid var(--slate-200);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.warranty-card.active{border-color:var(--green-500);background:var(--green-100)}
.warranty-card.expiring{border-color:var(--amber-500);background:var(--amber-100)}
.warranty-card.expired{border-color:var(--red-500);background:var(--red-100)}
.warranty-info{display:flex;flex-direction:column;gap:1px}
.warranty-name{font-size:12px;font-weight:600;color:var(--slate-800)}
.warranty-date{font-size:10px;color:var(--slate-500)}

/* Table scroll */
.table-wrap{overflow-x:auto}
.table-wrap::-webkit-scrollbar{height:5px}
.table-wrap::-webkit-scrollbar-thumb{background:var(--slate-300);border-radius:3px}

/* Role indicator */
.role-indicator{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:var(--teal-50);color:var(--teal-700);margin-bottom:16px;border:1px solid var(--teal-100)}

/* Progress bar */
.progress-bar{background:var(--slate-100);border-radius:6px;height:8px;width:100%;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:6px}

/* Payment type indicator */
.pay-type{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.pay-type.deposit{background:var(--amber-100);color:#92400E}
.pay-type.full{background:var(--green-100);color:#166534}
.pay-type.warranty{background:var(--purple-100);color:#5B21B6}
.pay-type.balance{background:var(--blue-100);color:#1E40AF}

/* Boss hero */
.boss-hero{background:linear-gradient(135deg,var(--teal-800),var(--teal-600));border-radius:var(--radius);padding:24px;color:#fff;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.boss-hero h2{font-size:18px;font-weight:700;margin-bottom:3px}
.boss-hero p{font-size:12px;opacity:.8}
.boss-hero-stat{text-align:right}
.boss-hero-stat .num{font-size:28px;font-weight:800}
.boss-hero-stat .lbl{font-size:11px;opacity:.8}

/* Role-aware notice */
.role-notice{padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* Mobile sidebar */
.mobile-nav{display:none}
.mobile-bottom-nav{display:none}

/* Responsive */
@media(max-width:768px){
  :root{--sidebar-w:0px}
  .sidebar{display:none}
  .main-wrap{margin-left:0}
  .role-tabs{display:none}
  .mobile-bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--slate-200);padding:6px 0;z-index:100;justify-content:space-around;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
  .mobile-bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;font-size:9px;color:var(--slate-400);cursor:pointer;border:none;background:none}
  .mobile-bottom-nav-item.active{color:var(--teal-600)}
  .mobile-bottom-nav-item svg{width:20px;height:20px}
  .mobile-role-bar{display:flex;padding:6px 12px;gap:5px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--slate-200);position:sticky;top:0;z-index:5}
  .mobile-role-bar::-webkit-scrollbar{display:none}
  .mobile-role-chip{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;background:var(--slate-100);color:var(--slate-600);border:none;cursor:pointer;white-space:nowrap}
  .mobile-role-chip.active{background:var(--teal-600);color:#fff}
}
</style>
</head>
<body>

<!-- ====== TOPBAR ====== -->
<nav class="topbar">
  <div class="brand">
    <div class="brand-icon">❄</div>
    <div>
      <div>正兴实业</div>
      <div class="brand-sub">中央空调智能管理系统</div>
    </div>
  </div>

  <div class="role-tabs" id="roleTabs">
    <button class="role-tab active" data-role="sales">销售总</button>
    <button class="role-tab" data-role="install">安装总</button>
    <button class="role-tab" data-role="service">售后总</button>
    <button class="role-tab" data-role="boss">老板</button>
  </div>

  <div class="device-toggle">
    <span>视图</span>
    <button class="device-btn active" id="desktopBtn" title="电脑端">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </button>
    <button class="device-btn" id="mobileBtn" title="手机端">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
    </button>
  </div>
</nav>

<!-- ====== SIDEBAR ====== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-group-label">业务管理</div>
  <div class="sidebar-item active" data-module="customer">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
    <span>客户管理</span>
    <span class="badge">56</span>
  </div>
  <div class="sidebar-item" data-module="contract">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13h6M9 17h4"/></svg></span>
    <span>合同管理</span>
  </div>
  <div class="sidebar-item" data-module="payment">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg></span>
    <span>收款管理</span>
    <span class="badge">8</span>
  </div>
  <div class="sidebar-item" data-module="install">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
    <span>现场安装管理</span>
    <span class="badge">14</span>
  </div>
  <div class="sidebar-item" data-module="service">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"/></svg></span>
    <span>售后维保派单</span>
    <span class="badge">12</span>
  </div>
  <div class="sidebar-group-label">数据分析</div>
  <div class="sidebar-item" data-module="report">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg></span>
    <span>报表管理</span>
  </div>
</aside>

<!-- ====== MAIN ====== -->
<div class="main-wrap">
  <div id="desktopView">
    <div class="content-area" id="mainContent"></div>
  </div>

                <tr><td>刘建国</td><td>三菱重工KXZ</td><td>排水试验(7/10)</td><td><div class="progress-bar"><div class="progress-bar-fill" style="background:var(--amber-500);width:70%"></div></div></td><td><span class="tag tag-amber">施工中</span></td><td>9/17</td></tr>
                <tr><td>吴小莉</td><td>格力雅居</td><td>抽真空检漏(9/10)</td><td><div class="progress-bar"><div class="progress-bar-fill" style="background:var(--green-500);width:85%"></div></div></td><td><span class="tag tag-green">即将完工</span></td><td>9/16</td></tr>

      <div class="card">
        <div class="card-header"><div class="card-title">${svg('shield')}售后维保概况</div></div>
        <div class="card-body">
          <div class="three-col" style="margin-bottom:0">
            <div class="mini-stat"><div class="mini-stat-icon" style="background:var(--green-100)">✅</div><div><div class="mini-stat-label">质保内客户</div><div class="mini-stat-value">186户 (84.5%)</div></div></div>
            <div class="mini-stat"><div class="mini-stat-icon" style="background:var(--red-100)">⚠️</div><div><div class="mini-stat-label">质保外客户</div><div class="mini-stat-value">34户 (15.5%)</div></div></div>
            <div class="mini-stat"><div class="mini-stat-icon" style="background:var(--purple-100)">💰</div><div><div class="mini-stat-label">维修收入</div><div class="mini-stat-value">¥26,400</div></div></div>

    return html;
  }

  const RENDERERS = {
    customer: renderCustomer,
    contract: renderContract,
    payment: renderPayment,
    install: renderInstall,
    service: renderService,
    report: renderReport,
  };

  // ====== STATE & RENDER ======
  function render(){
    const html = RENDERERS[currentModule] ? RENDERERS[currentModule]() : '<div class="page-title">模块开发中</div>';
    document.getElementById('mainContent').innerHTML = html;
    renderMobileContent();
  }

  function renderMobileContent(){
    // Build mobile role bar
    const bar = document.getElementById('mobileRoleBar');
    bar.innerHTML = Object.entries(ROLE_NAMES).map(([k,v])=>
      `<button class="mobile-role-chip ${k===currentRole?'active':''}" data-role="${k}">${v}</button>`
    ).join('');
    bar.querySelectorAll('.mobile-role-chip').forEach(c=>{
      c.onclick = ()=>{ switchRole(c.dataset.role); };
    });

    // Render module content (re-use desktop renderer, CSS adapts)
    const mc = document.getElementById('mobileContent');
    mc.innerHTML = RENDERERS[currentModule] ? RENDERERS[currentModule]() : '<div class="page-title">模块开发中</div>';
  }

  function switchRole(role){
    currentRole = role;
    document.querySelectorAll('.role-tab').forEach(t=>t.classList.toggle('active',t.dataset.role===role));
    render();
  }

  function switchModule(mod){
    currentModule = mod;
    document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.toggle('active',i.dataset.module===mod));
    document.querySelectorAll('.mobile-bottom-nav-item').forEach(i=>i.classList.toggle('active',i.dataset.module===mod));
    render();
  }

  function switchDevice(device){
    currentDevice = device;
    document.getElementById('desktopBtn').classList.toggle('active',device==='desktop');
    document.getElementById('mobileBtn').classList.toggle('active',device==='mobile');
    document.getElementById('desktopView').style.display = device==='desktop'?'block':'none';
    document.getElementById('mobileView').style.display = device==='mobile'?'flex':'none';
    if(device==='mobile'){ renderMobileContent(); }
  }

  // ====== EVENT BINDING ======
  document.querySelectorAll('.role-tab').forEach(t=>{
    t.onclick = ()=>switchRole(t.dataset.role);
  });
  document.querySelectorAll('.sidebar-item').forEach(i=>{
    i.onclick = ()=>switchModule(i.dataset.module);
  });
  document.getElementById('desktopBtn').onclick = ()=>switchDevice('desktop');
  document.getElementById('mobileBtn').onclick = ()=>switchDevice('mobile');

  // Build mobile bottom nav (show first 4 modules + report)
  const navItems = MODULES.slice(0,5).concat(MODULES.slice(5));
  const navIcons = {
    customer:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>',
    contract:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
    payment:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
    install:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
    service:'<path d="M9 12l2 2 4-4"/><path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"/>',
    report:'<path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/>',
  };
  const mobileNav = document.getElementById('mobileBottomNav');
  // Show 5 items: customer, contract, install, service, report
  const mobileNavList = ['customer','contract','install','service','report'];
  mobileNav.innerHTML = mobileNavList.map(m=>{
    const label = MODULES.find(x=>x.id===m).label;
    return `<button class="mobile-bottom-nav-item ${m===currentModule?'active':''}" data-module="${m}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${navIcons[m]}</svg><span>${label.length>4?label.slice(0,4):label}</span></button>`;
  }).join('');
  mobileNav.querySelectorAll('.mobile-bottom-nav-item').forEach(i=>{
    i.onclick = ()=>switchModule(i.dataset.module);
  });

  // Initial render
  render();
})();
</script>
