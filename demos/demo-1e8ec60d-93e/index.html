<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预包装食品批发管理系统 DEMO</title>
<style>
/* ================= 变量与重置 ================= */
:root{
  --primary:#409eff; --success:#67c23a; --warning:#e6a23c; --danger:#f56c6c; --info:#909399;
  --text-1:#303133; --text-2:#606266; --text-3:#909399;
  --border:#dcdfe6; --border-light:#ebeef5; --bg-page:#f5f7fa; --bg-card:#fff;
  --shadow:0 2px 12px 0 rgba(0,0,0,.1); --shadow-light:0 2px 4px 0 rgba(0,0,0,.05);
  --radius:6px; --sidebar-w:220px; --header-h:60px; --tabbar-h:56px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;color:var(--text-1);background:var(--bg-page);-webkit-font-smoothing:antialiased;
}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px;outline:none;color:var(--text-1)}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}

/* ================= 按钮 ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:36px;padding:0 16px;border-radius:var(--radius);font-size:14px;color:#fff;background:var(--primary);border:1px solid var(--primary);transition:opacity .2s,transform .1s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn:active{transform:translateY(1px)}
.btn-block{display:flex;width:100%}
.btn-sm{height:30px;padding:0 12px;font-size:13px}
.btn-xs{height:26px;padding:0 10px;font-size:12px}
.btn-lg{height:44px;padding:0 22px;font-size:16px}
.btn-default{color:var(--text-1);background:#fff;border-color:var(--border)}
.btn-default:hover{color:var(--primary);border-color:var(--primary);background:#ecf5ff}
.btn-success{background:var(--success);border-color:var(--success)}
.btn-warning{background:var(--warning);border-color:var(--warning)}
.btn-danger{background:var(--danger);border-color:var(--danger)}
.btn-text{background:transparent;color:var(--primary);border:none;padding:0 4px;height:auto;font-size:13px}
.btn-text:hover{opacity:.7}
.btn-text.danger{color:var(--danger)}
.btn-text.success{color:var(--success)}
.btn-text.warning{color:var(--warning)}
.btn[disabled],.btn.disabled{opacity:.45;cursor:not-allowed;pointer-events:none}

/* ================= 表单 ================= */
.input,.select,.textarea{height:36px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--text-1);transition:border-color .2s;width:100%}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary)}
.input[readonly]{background:#f5f7fa;color:var(--text-2);cursor:default}
.textarea{height:auto;padding:8px 11px;line-height:1.6;resize:vertical}
.form-item{margin-bottom:18px}
.form-item>label{display:block;margin-bottom:6px;color:var(--text-2);font-size:13px}
.form-row{display:flex;gap:12px}
.form-row>*{flex:1}
.form-tip{font-size:12px;color:var(--text-3);margin-top:4px}
.checkbox{width:15px;height:15px;vertical-align:-2px;accent-color:var(--primary);cursor:pointer}

/* ================= 卡片 / 表格 / 标签 ================= */
.card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow-light);padding:16px;margin-bottom:16px}
.card-title{font-size:16px;font-weight:600;color:var(--text-1)}
.card-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.table-wrap{width:100%;overflow-x:auto}
.table{width:100%;background:#fff;border-radius:var(--radius);overflow:hidden}
.table th,.table td{padding:10px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--border-light);vertical-align:middle}
.table th{background:#fafafa;color:var(--text-2);font-weight:600;white-space:nowrap}
.table tbody tr:hover{background:#f5f7fa}
.table tbody tr:last-child td{border-bottom:none}
.table tfoot td{background:#fafafa;font-weight:600;border-top:1px solid var(--border)}
.table-compact th,.table-compact td{padding:7px 10px}
.tag{display:inline-flex;align-items:center;justify-content:center;padding:0 7px;height:22px;line-height:20px;border-radius:4px;font-size:12px;background:#ecf5ff;color:var(--primary);border:1px solid #d9ecff;white-space:nowrap}
.tag.success{background:#f0f9eb;color:var(--success);border-color:#e1f3d8}
.tag.warning{background:#fdf6ec;color:var(--warning);border-color:#faecd8}
.tag.danger{background:#fef0f0;color:var(--danger);border-color:#fde2e2}
.tag.info{background:#f4f4f5;color:var(--info);border-color:#e9e9eb}

/* ================= 弹窗 / Toast ================= */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:2000;padding:24px}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:8px;width:100%;max-width:720px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 4px 24px rgba(0,0,0,.18);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.modal-header{padding:15px 20px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-title{font-size:16px;font-weight:600}
.modal-close{font-size:22px;color:var(--text-3);line-height:1;padding:0 2px}
.modal-close:hover{color:var(--text-1)}
.modal-body{padding:20px;overflow:auto;flex:1}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 18px;border-radius:4px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:14px;min-width:200px;max-width:80vw;border-left:4px solid var(--primary);animation:toastIn .2s ease-out}
.toast.success{border-left-color:var(--success);color:var(--success)}
.toast.warning{border-left-color:var(--warning);color:var(--warning)}
.toast.danger{border-left-color:var(--danger);color:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ================= 主布局 ================= */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:#2c3e50;color:#bfcbd9;display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:100}
.sidebar-brand{height:var(--header-h);display:flex;align-items:center;justify-content:center;gap:8px;background:#1f2d3d;color:#fff;padding:0 10px;text-align:center;flex-shrink:0}
.sidebar-brand .logo{font-size:20px}
.sidebar-brand .brand-text{font-size:15px;font-weight:600;line-height:1.25}
.sidebar-brand .brand-text small{display:block;font-size:10px;font-weight:400;color:#8fa4b8;letter-spacing:1px}
.sidebar-menu{flex:1;padding:8px 0;overflow-y:auto}
.sidebar-menu li{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;font-size:14px;transition:background .2s}
.sidebar-menu li:hover{background:#3a4a5c}
.sidebar-menu li.active{background:var(--primary);color:#fff}
.sidebar-menu li .icon{width:18px;text-align:center}
.sidebar-foot{padding:12px 14px;border-top:1px solid #3a4a5c;font-size:11px;color:#8497a9;line-height:1.7}
.sidebar-foot button{width:100%;height:30px;border:1px solid #4a5b6d;border-radius:4px;color:#bfcbd9;background:transparent;font-size:12px;margin-bottom:8px}
.sidebar-foot button:hover{color:#fff;border-color:#7d8fa1;background:#3a4a5c}
.main-area{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0}
.header-bar{height:var(--header-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50;gap:16px}
.crumb{font-size:13px;color:var(--text-3);display:flex;align-items:center;gap:6px;min-width:0}
.crumb b{font-size:16px;color:var(--text-1);font-weight:600;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:18px}
.bell{position:relative;font-size:19px;cursor:pointer;line-height:1;padding:4px}
.bell .dot{position:absolute;top:-3px;right:-6px;background:var(--danger);color:#fff;font-size:10px;border-radius:8px;padding:0 4px;line-height:14px;min-width:14px;text-align:center}
.msg-panel{position:absolute;top:34px;right:0;width:330px;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:200;display:none;overflow:hidden}
.msg-panel.show{display:block}
.msg-panel-head{padding:10px 12px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;font-size:13px}
.msg-panel ul{max-height:300px;overflow:auto}
.msg-panel li{padding:9px 12px;border-bottom:1px solid var(--border-light);font-size:13px;line-height:1.5;color:var(--text-2);cursor:default}
.msg-panel li:last-child{border-bottom:none}
.msg-panel li.unread{font-weight:600;color:var(--text-1);background:#fafcff}
.msg-panel li .msg-time{display:block;font-size:11px;color:var(--text-3);font-weight:400;margin-top:2px}
.user-chip{display:flex;align-items:center;gap:7px;color:var(--text-2);font-size:13px}
.avatar{width:28px;height:28px;border-radius:50%;background:#ecf5ff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:14px}
.logout-link{font-size:12px;color:var(--text-3);margin-left:2px}
.logout-link:hover{color:var(--danger)}
.page-content{padding:16px;flex:1}
.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--tabbar-h);background:#fff;border-top:1px solid var(--border);z-index:100}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--text-3);gap:2px}
.tabbar a .icon{font-size:18px}
.tabbar a.active{color:var(--primary)}

/* ================= KPI / 图表 ================= */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi-grid.kpi-3{grid-template-columns:repeat(3,1fr)}
.kpi-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-light);border-left:4px solid var(--primary)}
.kpi-card.success{border-left-color:var(--success)}
.kpi-card.warning{border-left-color:var(--warning)}
.kpi-card.danger{border-left-color:var(--danger)}
.kpi-card .label{color:var(--text-3);font-size:13px;margin-bottom:8px}
.kpi-card .value{font-size:24px;font-weight:600;color:var(--text-1);line-height:1.2;white-space:nowrap}
.kpi-card .value small{font-size:14px;color:var(--text-3);font-weight:400}
.kpi-card .delta{font-size:12px;color:var(--text-3);margin-top:6px;line-height:1.5}
.kpi-card .delta.up{color:var(--success)}
.kpi-card .delta.down{color:var(--danger)}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chart-box{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-light)}
.chart-box .title{font-size:15px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chart-box .title .sub{font-size:12px;font-weight:400;color:var(--text-3)}
.chart{position:relative;width:100%;height:300px}
.chart svg{display:block;overflow:visible}
.chart .axis-text{font-size:11px;fill:#909399}
.chart .grid-line{stroke:#f0f0f0;stroke-width:1}
.chart .axis-line{stroke:#dcdfe6;stroke-width:1}
.chart .dot{fill:#fff;stroke:#409eff;stroke-width:2;cursor:pointer;transition:r .15s}
.chart .dot:hover{r:6}
.bar-list{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.bar-row{display:grid;grid-template-columns:150px 1fr 56px;align-items:center;gap:10px;font-size:12px}
.bar-row .bar-name{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.bar-row .bar-track{display:block;height:14px;background:#f5f7fa;border-radius:0 4px 4px 0;overflow:hidden}
.bar-row .bar-fill{display:block;height:100%;background:linear-gradient(90deg,#95d475,#67c23a);border-radius:0 4px 4px 0;min-width:2px}
.bar-row .bar-name:hover{color:var(--primary)}
.bar-row .bar-val{color:var(--text-2);font-variant-numeric:tabular-nums}

/* ================= 工具栏 / 分页 / 切换组 ================= */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar .left{display:flex;gap:10px;align-items:center;flex:1;flex-wrap:wrap}
.toolbar .right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stock-toolbar .right{flex-wrap:nowrap;flex-shrink:0}
.stock-toolbar .right .input{flex:0 0 260px;width:260px;max-width:260px}
.stock-toolbar .right .select{flex:0 0 160px;width:160px}
.pagination{display:flex;gap:4px;justify-content:flex-end;align-items:center;margin-top:12px;font-size:13px;flex-wrap:wrap}
.pagination .page-btn{min-width:30px;height:30px;padding:0 10px;border:1px solid var(--border);background:#fff;color:var(--text-2);border-radius:4px}
.pagination .page-btn:hover:not([disabled]):not(.active){color:var(--primary);border-color:var(--primary)}
.pagination .page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination .page-btn[disabled]{color:var(--text-3);cursor:not-allowed;background:#fafafa}
.pagination .total{margin-right:12px;color:var(--text-3)}
.radio-group{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.radio-group button{padding:0 16px;height:34px;background:#fff;color:var(--text-2);border-right:1px solid var(--border);font-size:13px}
.radio-group button:last-child{border-right:none}
.radio-group button.active{background:var(--primary);color:#fff}
.notice{padding:9px 12px;border-radius:4px;font-size:12px;line-height:1.7;margin-bottom:12px}
.notice.info{background:#ecf5ff;color:#409eff}
.notice.warning{background:#fdf6ec;color:#b88230}
.notice.danger{background:#fef0f0;color:#f56c6c}

/* ================= 信用条 / 账龄 ================= */
.credit-bar{width:100%;height:6px;background:#ebeef5;border-radius:3px;margin-top:5px;overflow:hidden}
.credit-bar .fill{height:100%;background:var(--success);border-radius:3px;transition:width .3s}
.credit-bar .fill.warning{background:var(--warning)}
.credit-bar .fill.danger{background:var(--danger)}
.credit-info{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:#f5f7fa;border-radius:4px;margin-bottom:12px;font-size:13px;color:var(--text-2)}
.credit-info .strong{color:var(--text-1);font-weight:600}
.credit-info .warn{color:var(--warning);font-weight:600}
.credit-info .bad{color:var(--danger);font-weight:600}
.aging-bar{display:inline-flex;align-items:center;height:16px;border-radius:3px;overflow:hidden;min-width:110px;width:100%;max-width:260px;background:#ebeef5}
.aging-bar span{display:inline-block;height:100%}
.aging-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.aging-legend .item{display:inline-flex;align-items:center;gap:5px}
.aging-legend .dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.aging-chart{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.aging-row{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:12px;font-size:12px}
.aging-row .name{color:var(--text-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aging-row .stack{display:flex;height:20px;background:#f5f7fa;border-radius:0 4px 4px 0;overflow:hidden;position:relative}
.aging-row .stack span{height:100%;transition:width .3s}
.aging-axis{display:grid;grid-template-columns:110px 1fr;gap:12px;margin-top:8px}
.aging-axis .ticks{position:relative;height:16px;border-top:1px solid var(--border-light);font-size:11px;color:var(--text-3)}
.aging-axis .ticks span{position:absolute;top:2px;transform:translateX(-50%)}
.aging-axis .ticks span:first-child{transform:none}

/* ================= 登录 ================= */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#2c3e50 0%,#2f5876 45%,#409eff 100%)}
.login-shell{width:880px;max-width:100%;display:flex;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.login-form{width:440px;flex-shrink:0;padding:40px 38px 32px}
.login-form h1{font-size:19px;margin-bottom:6px}
.login-form .subtitle{font-size:13px;color:var(--text-3);margin-bottom:26px}
.login-btn{height:44px;font-size:16px;margin-top:4px}
.demo-tip{margin-top:14px;padding:9px 12px;background:#ecf5ff;border-radius:4px;font-size:12px;color:var(--primary);text-align:center;line-height:1.6}
.login-side{flex:1;background:linear-gradient(160deg,#1f2d3d 0%,#2c3e50 55%,#27567e 100%);color:#fff;padding:44px 34px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.login-side .side-title{font-size:20px;font-weight:600;line-height:1.4}
.login-side .side-title small{display:block;font-size:12px;font-weight:400;color:#9fb3c8;margin-top:6px;letter-spacing:1px}
.login-side .feat{display:flex;gap:12px;align-items:flex-start}
.login-side .feat .fi{width:32px;height:32px;border-radius:8px;background:rgba(64,158,255,.18);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.login-side .feat .ft{font-size:13px;font-weight:600;margin-bottom:2px}
.login-side .feat .fd{font-size:12px;color:#9fb3c8;line-height:1.6}
.login-side .side-foot{font-size:11px;color:#7d93a8;border-top:1px solid rgba(255,255,255,.12);padding-top:12px;line-height:1.7}

/* ================= 销售开单 ================= */
.sales-header{display:grid;grid-template-columns:1fr 1.35fr 1fr .9fr;gap:12px;background:#fff;padding:16px;border-radius:var(--radius);box-shadow:var(--shadow-light);margin-bottom:16px}
.sales-header .form-item{margin-bottom:0}
.sales-footer{background:#fff;padding:16px;border-radius:var(--radius);box-shadow:var(--shadow-light);margin-bottom:16px}
.sales-footer .summary{display:flex;justify-content:flex-end;gap:36px;flex-wrap:wrap}
.sales-footer .summary .item .label{color:var(--text-3);font-size:12px;margin-bottom:4px}
.sales-footer .summary .item .value{font-size:19px;font-weight:600}
.sales-footer .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-light);flex-wrap:wrap}
.qty-input{width:78px}
.price-input{width:92px}
.batch-tag{margin-top:4px;max-width:150px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
.sign-row{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.sign-row span{flex:1;min-width:110px;border-top:1px dashed #c0c4cc;padding-top:4px;text-align:center;color:var(--text-3)}

/* ================= 响应式 ================= */
@media (min-width:1024px){ .app{min-width:1180px} }
@media (max-width:1023px){
  .sidebar{display:none}
  .main-area{margin-left:0}
  .tabbar{display:flex}
  .page-content{padding-bottom:calc(16px + var(--tabbar-h))}
  .kpi-grid,.kpi-grid.kpi-3{grid-template-columns:repeat(2,1fr)}
  .sales-header{grid-template-columns:1fr 1fr}
  .chart-grid{grid-template-columns:1fr}
  .login-shell{flex-direction:column;width:460px}
  .login-form{width:100%}
  .login-side{display:none}
}
@media (max-width:768px){
  .sales-header{grid-template-columns:1fr 1fr}
  .sales-header .form-item:nth-child(3){grid-column:1/3}
  .bar-row{grid-template-columns:110px 1fr 48px}
}
@media (max-width:600px){
  .stock-toolbar .right{flex-wrap:wrap}
  .stock-toolbar .right .input,.stock-toolbar .right .select{flex:1 1 100%;width:100%;max-width:none}
  .toolbar .left,.toolbar .right{width:100%}
  .toolbar .input,.toolbar .select{width:100%!important;max-width:none!important}
  .table th,.table td{padding:7px 8px}
  .header-bar .page-title{font-size:14px}
  .crumb span.crumb-home{display:none}
  .msg-panel{position:fixed;top:64px;left:12px;right:12px;width:auto}
  .kpi-card .value{font-size:20px}
  .sales-footer .summary{gap:18px;justify-content:space-between}
}

/* ================= 工具类 ================= */
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}

/* ==================================================================

let DB = null;
let memSession = null;

function loadDB() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.products) && Array.isArray(d.batches) && Array.isArray(d.flows)) {
        DB = d;
        if (!DB.draft) DB.draft = null;
        if (!DB.seq) DB.seq = { sales: 6, receipt: 5, product: 11 };
        return;
      }
    }
  } catch (e) { /* 损坏则重建 */ }
  DB = seedData();
  saveDB();
}

function saveDB() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { /* 隐私模式降级为内存 */ }
}

function resetDemo() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  DB = seedData();
  saveDB();
  salesState = null;
  toast('演示数据已重置为初始状态', 'success');
  render();
}

function getSession() {
  const now = Date.now();
  try {
    const raw = localStorage.getItem(AUTH_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.expire && now <= s.expire) return s;
      localStorage.removeItem(AUTH_KEY);
    }
  } catch (e) { /* file:// 下可能禁用 localStorage */ }
  if (memSession && memSession.expire > now) return memSession;
  return null;
}

function doLogin(username, password) {
  if (!username) throw new Error('请输入账号');
  if (!password) throw new Error('请输入密码');
  if (password.length < 6) throw new Error('密码至少 6 位');
  const user = { username: username, name: username === 'admin' ? '王老板' : username, role: '老板' };
  const session = { user: user, expire: Date.now() + AUTH_DAYS };
  memSession = session;
  try { localStorage.setItem(AUTH_KEY, JSON.stringify(session)); } catch (e) {}
  return session;
}

function doLogout() {
  memSession = null;
  try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
  salesState = null;
  location.hash = '#/login';
  closeAllModals();
  render();
}

/* ==================================================================
   3. 工具函数

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function money(n, symbol) {
  const v = Number(n || 0).toFixed(2);
  return symbol === false ? v : '¥' + v;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function fmtDate(d) {
  const dt = d instanceof Date ? d : new Date(d);
  return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate());
}
function todayStr() { return fmtDate(new Date()); }
function ymdCompact(d) { return String(d.getFullYear()) + pad2(d.getMonth() + 1) + pad2(d.getDate()); }
function dayDiff(a, b) {
  const da = new Date(a + 'T00:00:00'), db = new Date(b + 'T00:00:00');
  return Math.round((da - db) / 86400000);
}
function expiryInfo(dateStr) {
  const days = dayDiff(dateStr, BIZ_TODAY);
  if (days < 0) return { type: 'expired', label: '已过期', days: days };
  if (days <= 7) return { type: 'danger', label: '剩' + days + '天', days: days };
  if (days <= 30) return { type: 'warning', label: '剩' + days + '天', days: days };
  return { type: 'success', label: '剩' + days + '天', days: days };
}
function expiryTag(info, useNormal) {
  let cls = 'success';
  if (info.type === 'expired' || info.type === 'danger') cls = 'danger';
  else if (info.type === 'warning') cls = 'warning';
  const label = useNormal && info.days > 30 ? '正常' : info.label;
  return '<span class="tag ' + cls + '">' + label + '</span>';
}
function productById(id) { return DB.products.find(p => p.id === Number(id)); }
function customerById(id) { return DB.customers.find(c => c.id === Number(id)); }
function warehouseName(id) { const w = DB.warehouses.find(x => x.id === Number(id)); return w ? w.name : '-'; }
function productStock(productId) {
  return DB.batches.filter(b => b.productId === productId && b.status === 1)
    .reduce((s, b) => s + b.remainingQty, 0);
}
function stockAmount() {
  return DB.batches.filter(b => b.status === 1).reduce((s, b) => {
    const p = productById(b.productId);
    return s + (p ? p.costPrice * b.remainingQty : 0);
  }, 0);
}
function stockAmountForKpi() {
  return Number((stockAmount() + (DB.kpi.stockOffset || 0)).toFixed(2));
}
function receivableByCustomer(id) { return DB.receivables.find(r => r.customerId === Number(id)); }
function gradePrice(retailPrice, grade) {
  const ratio = grade === 1 ? 0.85 : grade === 2 ? 0.92 : 1.0;
  return Number((retailPrice * ratio).toFixed(2));
}
function pickBatchByFIFO(productId, qty) {
  const list = DB.batches
    .filter(b => b.productId === productId && b.status === 1 && b.remainingQty > 0)
    .sort((a, b) => new Date(a.productionDate) - new Date(b.productionDate));
  const result = [];
  let remain = qty;
  for (const b of list) {
    if (remain <= 0) break;
    const take = Math.min(remain, b.remainingQty);
    result.push({ batchId: b.id, batchNo: b.batchNo, qty: take, productionDate: b.productionDate, expiryDate: b.expiryDate });
    remain -= take;
  }
  return result;
}
function genSalesNo() {
  const d = new Date();
  const seq = String(Math.floor(Math.random() * 900) + 100);
  return 'XS' + ymdCompact(d) + '-' + seq;
}
function genReceiptNo() {
  return 'SK' + ymdCompact(new Date()) + '-' + String(++DB.seq.receipt).padStart(3, '0');
}
function pageNumbers(current, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  if (current <= 4) return [1, 2, 3, 4, 5, '...', total];
  if (current >= total - 3) return [1, '...', total - 4, total - 3, total - 2, total - 1, total];
  return [1, '...', current - 1, current, current + 1, '...', total];
}
function unreadCount() { return DB.messages.filter(m => !m.read).length; }
function applyPayment(aging, amount) {
  let remain = amount;
  for (let i = aging.length - 1; i >= 0 && remain > 0; i--) {
    const take = Math.min(aging[i], remain);
    aging[i] = Number((aging[i] - take).toFixed(2));
    remain = Number((remain - take).toFixed(2));
  }
}

/* ==================================================================
   4. UI 组件：Toast / 弹窗 / 确认框
   ================================================================== */
function toast(message, type, duration) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  el.textContent = message;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(-6px)';
    setTimeout(() => el.remove(), 320);
  }, duration || 2200);
}

function openModal(title, bodyHTML, footerHTML, opts) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask show';
  const width = opts && opts.width ? 'max-width:' + opts.width + ';' : '';
  mask.innerHTML =
    '<div class="modal" style="' + width + '">' +
      '<div class="modal-header"><span class="modal-title">' + title + '</span>' +
        '<button class="modal-close" data-act="modal-close" aria-label="关闭">×</button></div>' +
      '<div class="modal-body">' + bodyHTML + '</div>' +
      (footerHTML ? '<div class="modal-footer">' + footerHTML + '</div>' : '') +
    '</div>';
  document.body.appendChild(mask);
  mask.addEventListener('click', e => {
    if (e.target === mask) mask.remove();
  });
  return mask;
}

function closeTopModal() {
  const all = document.querySelectorAll('.modal-mask.show');
  if (all.length) all[all.length - 1].remove();
}
function closeAllModals() {
  document.querySelectorAll('.modal-mask').forEach(m => m.remove());
}

function confirmDialog(message, title) {
  return new Promise(resolve => {
    const mask = openModal(
      title || '提示',
      '<div style="font-size:14px;line-height:1.8;color:var(--text-2)">' + message + '</div>',
      '<button class="btn btn-default btn-sm" data-act="confirm-no">取消</button>' +
      '<button class="btn btn-sm" data-act="confirm-yes">确定</button>',
      { width: '440px' }
    );
    let done = false;
    function finish(val) {
      if (done) return;
      done = true;
      mask.remove();
      resolve(val);
    }
    mask.addEventListener('click', e => {
      const act = e.target.dataset ? e.target.dataset.act : '';
      if (act === 'confirm-yes') finish(true);
      else if (act === 'confirm-no' || act === 'modal-close' || e.target === mask) finish(false);
    });
  });
}

function scanBarcode(onResult, tipText) {

function drawTrendChart(el, data) {
  const w = Math.max(300, el.clientWidth || 560);
  const h = Math.max(220, el.clientHeight || 300);
  const pad = { l: 48, r: 18, t: 18, b: 30 };
  const yMin = 700, yMax = 1400;
  const ticks = [800, 1000, 1200, 1400];
  const innerW = w - pad.l - pad.r;
  const innerH = h - pad.t - pad.b;
  const stepX = data.length > 1 ? innerW / (data.length - 1) : innerW;
  const pts = data.map((d, i) => ({
    x: pad.l + stepX * i,
    y: pad.t + (yMax - d.amount) / (yMax - yMin) * innerH,
    date: d.date,
    amount: d.amount
  }));

  let line = 'M' + pts[0].x.toFixed(1) + ' ' + pts[0].y.toFixed(1);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || pts[i + 1];
    const t = 0.2;
    const c1x = p1.x + (p2.x - p0.x) * t;
    const c1y = p1.y + (p2.y - p0.y) * t;
    const c2x = p2.x - (p3.x - p1.x) * t;
    const c2y = p2.y - (p3.y - p1.y) * t;
    line += ' C' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ',' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ',' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1);
  }
  const baseY = h - pad.b;
  const area = line + ' L' + pts[pts.length - 1].x.toFixed(1) + ' ' + baseY + ' L' + pts[0].x.toFixed(1) + ' ' + baseY + ' Z';

  let svg = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="近7日销售额趋势">';
  svg += '<defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="#409eff" stop-opacity="0.28"/>' +
    '<stop offset="100%" stop-color="#409eff" stop-opacity="0.02"/></linearGradient></defs>';
  ticks.forEach(v => {
    const y = pad.t + (yMax - v) / (yMax - yMin) * innerH;
    svg += '<line class="grid-line" x1="' + pad.l + '" y1="' + y.toFixed(1) + '" x2="' + (w - pad.r) + '" y2="' + y.toFixed(1) + '"/>';
    svg += '<text class="axis-text" x="' + (pad.l - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + v + '</text>';
  });
  svg += '<line class="axis-line" x1="' + pad.l + '" y1="' + baseY + '" x2="' + (w - pad.r) + '" y2="' + baseY + '"/>';
  pts.forEach(p => {
    svg += '<text class="axis-text" x="' + p.x.toFixed(1) + '" y="' + (h - 10) + '" text-anchor="middle">' + p.date + '</text>';
  });
  svg += '<path d="' + area + '" fill="url(#trendGrad)"/>';
  svg += '<path d="' + line + '" fill="none" stroke="#409eff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach(p => {
    svg += '<circle class="dot" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4">' +
      '<title>' + p.date + ' 销售额 ' + money(p.amount) + '</title></circle>';
  });
  svg += '</svg>';
  el.innerHTML = svg;
}

function getSalesState() {
  if (!salesState) {
    if (DB.draft && Array.isArray(DB.draft.items)) {
      salesState = DB.draft;
    } else {
      salesState = newSalesState();
    }
  }
  return salesState;
}
function salesTotal() {
  const s = getSalesState();
  const total = s.items.reduce((sum, i) => sum + i.amount, 0);
  const gift = s.items.filter(i => i.isGift).reduce((sum, i) => sum + i.qty * i.price, 0);
  const finalAmount = Math.floor(total);
  return { total: total, gift: gift, erase: Number((total - finalAmount).toFixed(2)), final: finalAmount };
}

function creditHTML() {
  const s = getSalesState();
  if (!s.customerId) return '<div class="credit-info"><span>请先选择客户，系统将自动校验信用额度</span></div>';
  const c = customerById(s.customerId);
  if (!c) return '';
  const orderAmount = s.items.filter(i => !i.isGift).reduce((sum, i) => sum + i.amount, 0);
  const used = c.balance + orderAmount;
  const ratio = c.creditLimit > 0 ? used / c.creditLimit : 0;
  const cls = ratio >= 1 ? 'danger' : ratio >= 0.8 ? 'warning' : '';
  const remain = Math.max(0, c.creditLimit - used);
  return '<div class="credit-info">' +
    '<span>客户：<b class="strong">' + esc(c.name) + '</b>（' + c.gradeLabel + '）· 信用额度 ' + money(c.creditLimit) + '</span>' +

    '<span style="min-width:150px;flex:1;max-width:240px">' +
      '<div class="credit-bar"><div class="fill ' + cls + '" style="width:' + Math.min(100, ratio * 100).toFixed(1) + '%"></div></div>' +
      '<div class="text-sm ' + (ratio >= 1 ? 'text-danger' : 'text-gray') + '" style="margin-top:3px">' +
        (ratio * 100).toFixed(0) + '% 已用' + (ratio >= 0.8 && ratio < 1 ? ' · 接近额度' : '') + '</div>' +
    '</span>' +
    '<span class="' + (ratio >= 1 ? 'bad' : ratio >= 0.8 ? 'warn' : '') + '">' +
      (ratio >= 1 ? '⛔ 无法继续赊销' : '剩余可用 ' + money(remain)) + '</span>' +

  if (!p) { toast('未找到商品', 'danger'); return; }
  if (p.status !== 1) { toast(p.name + ' 已停售，不可销售', 'danger'); return; }
  const c = customerById(s.customerId);
  const price = gradePrice(p.retailPrice, c.grade);
  const stock = productStock(p.id);
  if (stock <= 0) { toast(p.name + ' 库存不足，无法开单', 'danger'); return; }
  const exist = s.items.findIndex(i => i.productId === p.id && !i.isGift);
  if (exist >= 0) {
    const item = s.items[exist];
    if (item.qty + 1 > stock) { toast('库存不足，当前可售 ' + stock + ' ' + p.mainUnit, 'warning'); return; }
    item.qty += 1;
    item.amount = Number((item.qty * item.price).toFixed(2));
    item.batchNo = fifoLabel(p.id, item.qty);
    toast('已添加：' + p.name + '（数量 +1）', 'success');
  } else {
    const item = {
      uid: Date.now() + Math.random(),
      productId: p.id, name: p.name, spec: p.spec, unit: p.mainUnit,
      qty: 1, price: price, amount: price, isGift: false,
      batchNo: fifoLabel(p.id, 1)
    };
    s.items.push(item);
    toast('已添加：' + p.name + (fromScan ? '（扫码）' : ''), 'success');
  }
  renderSalesTable();
}

function confirmSalesSave() {
  const s = getSalesState();
  const c = customerById(s.customerId);
  const t = salesTotal();

  // 1) 按 FIFO 扣减批次库存，记录扣减明细
  const deductions = [];
  s.items.forEach(it => {
    let left = it.qty;
    const list = DB.batches
      .filter(b => b.productId === it.productId && b.status === 1 && b.remainingQty > 0)
      .sort((a, b) => new Date(a.productionDate) - new Date(b.productionDate));
    for (const b of list) {
      if (left <= 0) break;
      const take = Math.min(left, b.remainingQty);
      b.remainingQty -= take;
      left -= take;
      deductions.push({ productId: it.productId, batchNo: b.batchNo, qty: take });
    }
  });

  // 2) 生成销售流水
  DB.flows.push({ no: s.orderNo, date: s.date, customerId: c.id, type: '销售', amount: t.final, deductions: deductions, items: s.items.map(i => ({ name: i.name, qty: i.qty, price: i.price, amount: i.amount, gift: i.isGift })) });

  // 3) 客户欠款 + 应收台账账龄（计入 0-30 天）
  c.balance = Number((c.balance + t.final).toFixed(2));
  const r = receivableByCustomer(c.id);
  if (r) {
    r.balance = Number((r.balance + t.final).toFixed(2));
    r.aging[0] = Number((r.aging[0] + t.final).toFixed(2));
  }

  // 4) 看板今日销售额与 7 日趋势同步
  DB.kpi.todaySales = Number((DB.kpi.todaySales + t.final).toFixed(2));
  DB.salesTrend7d[DB.salesTrend7d.length - 1].amount = DB.kpi.todaySales;

  // 5) 草稿清空
  DB.draft = null;
  saveDB();
  closeAllModals();
  toast('销货单 ' + s.orderNo + ' 已保存，库存已按 FIFO 扣减', 'success');
  salesState = newSalesState();
  render();
  /* 无人为延迟 */
}

  return DB.products.map(p => {
    const alive = DB.batches.filter(b => b.productId === p.id && b.status === 1);
    const stock1 = alive.filter(b => b.warehouseId === 1).reduce((s, b) => s + b.remainingQty, 0);
    const stock2 = alive.filter(b => b.warehouseId === 2).reduce((s, b) => s + b.remainingQty, 0);
    const total = stock1 + stock2;
    const batches = DB.batches.filter(b => b.productId === p.id);
    const minExpiry = batches.length
      ? batches.reduce((min, b) => new Date(b.expiryDate) < new Date(min) ? b.expiryDate : min, batches[0].expiryDate)
      : null;
    return { p: p, stock1: stock1, stock2: stock2, total: total, amount: total * p.costPrice, minExpiry: minExpiry };
  })
  .filter(x => !k || x.p.name.toLowerCase().includes(k) || x.p.code.toLowerCase().includes(k))
  .filter(x => !wId || (wId === 1 ? x.stock1 > 0 : x.stock2 > 0));
}

function renderStockBatch(wrap) {
  const k = stockState.kw.trim().toLowerCase();
  const wId = stockState.warehouseId ? Number(stockState.warehouseId) : null;
  const list = DB.batches
    .filter(b => !wId || b.warehouseId === wId)
    .map(b => ({ b: b, p: productById(b.productId), info: expiryInfo(b.expiryDate) }))
    .filter(x => x.p)
    .filter(x => !k || x.p.name.toLowerCase().includes(k) || x.p.code.toLowerCase().includes(k) || x.b.batchNo.toLowerCase().includes(k))
    .sort((a, b) => new Date(a.b.productionDate) - new Date(b.b.productionDate));

  const groups = {};
  list.forEach(x => {
    if (!groups[x.b.productId]) groups[x.b.productId] = [];
    groups[x.b.productId].push(x);
  });
  Object.keys(groups).forEach(key => {
    groups[key].sort((a, b) => new Date(a.b.productionDate) - new Date(b.b.productionDate))
      .forEach((x, i) => { x.fifo = i + 1; });
  });

  const rows = list.map(x => {
    const statusTag = x.b.status === 3 ? '<span class="tag danger">已过期</span>' : expiryTag(x.info);
    const fifo = x.fifo === 1
      ? '<span class="tag success">⭐ 优先出库（最早批次）</span>'
      : '<span class="tag info">第 ' + x.fifo + ' 顺位</span>';
    return '<tr>' +
      '<td class="mono">' + x.p.code + '</td>' +
      '<td>' + esc(x.p.name) + '</td>' +
      '<td class="mono">' + x.b.batchNo + '</td>' +
      '<td>' + x.b.productionDate + '</td>' +
      '<td>' + x.b.expiryDate + '</td>' +
      '<td class="text-right">' + x.b.remainingQty + ' ' + x.p.mainUnit + '</td>' +
      '<td>' + warehouseName(x.b.warehouseId) + '</td>' +
      '<td>' + statusTag + '</td>' +
      '<td>' + fifo + '</td>' +
    '</tr>';
  }).join('');

  wrap.innerHTML =
    '<div class="notice warning">📌 先进先出（FIFO）建议：同商品按生产日期升序，标“⭐ 优先出库”的批次应优先发出；已过期批次自动冻结销售。</div>' +
    '<div class="table-wrap"><table class="table">' +
      '<thead><tr><th>编码</th><th>商品名称</th><th>批次号</th><th>生产日期</th><th>到期日期</th>' +
      '<th class="text-right">剩余库存</th><th>所在仓库</th><th>临期状态</th><th>FIFO 建议</th></tr></thead>' +
      '<tbody>' + (rows || '<tr><td colspan="9" class="text-center text-gray" style="padding:30px">无匹配批次</td></tr>') + '</tbody>' +
    '</table></div>';
}

const AGING_COLORS = ['#67c23a', '#409eff', '#e6a23c', '#f56c6c', '#909399'];
const AGING_BUCKETS = ['0-30天', '31-60天', '61-90天', '91-180天', '180天以上'];

function receivablePage() {
  const list = DB.receivables;
  const totalBalance = list.reduce((s, r) => s + r.balance, 0);
  const totalAging = AGING_BUCKETS.map((_, i) => list.reduce((s, r) => s + r.aging[i], 0));
  const overdueCount = list.filter(r => r.accountPeriod > 0 && r.creditLimit > 0 && r.balance / r.creditLimit >= 0.8).length;

  const rows = list.map(r => {
    const ratio = r.creditLimit > 0 ? r.balance / r.creditLimit : 0;
    const cls = ratio >= 1 ? 'danger' : ratio >= 0.8 ? 'warning' : '';
    const maxAging = Math.max.apply(null, r.aging.concat([1]));
    const bar = r.aging.map((v, i) => v > 0
      ? '<span style="width:' + (v / maxAging * 100).toFixed(2) + '%;background:' + AGING_COLORS[i] + '" title="' + AGING_BUCKETS[i] + '：' + money(v) + '"></span>'
      : '').join('');
    const agingText = r.aging.map((v, i) => v > 0 ? AGING_BUCKETS[i] + '：' + money(v) : '').filter(Boolean).join(' · ') || '无欠款';
    return '<tr>' +
      '<td><b>' + esc(r.customerName) + '</b><br><span class="text-sm text-gray">' +
        (r.accountPeriod === 0 ? '现结' : '账期 ' + r.accountPeriod + ' 天') + '</span></td>' +
      '<td class="text-right mono">' + money(r.creditLimit) + '</td>' +
      '<td style="min-width:160px">' +
        '<div class="text-right text-bold mono">' + money(r.balance) + '</div>' +
        '<div class="credit-bar"><div class="fill ' + cls + '" style="width:' + Math.min(100, ratio * 100).toFixed(1) + '%"></div></div>' +
        '<div class="text-sm text-gray">' + (ratio * 100).toFixed(0) + '% 已用</div>' +
      '</td>' +
      '<td style="min-width:240px">' +
        '<div class="aging-bar">' + (bar || '<span style="width:100%;background:#ebeef5"></span>') + '</div>' +
        '<div class="text-sm text-gray" style="margin-top:4px">' + agingText + '</div>' +
      '</td>' +
      '<td class="text-center nowrap">' +
        '<button class="btn-text" data-act="rc-reconcile" data-id="' + r.customerId + '">📄 对账</button>' +
        '<button class="btn-text success" data-act="rc-receipt" data-id="' + r.customerId + '">💵 收款</button>' +
      '</td>' +
    '</tr>';
  }).join('');

  // 账龄堆叠图
  const maxTotal = Math.max.apply(null, list.map(r => r.aging.reduce((s, v) => s + v, 0)).concat([1]));
  const axisMax = Math.max(10000, Math.ceil(maxTotal / 10000) * 10000);
  const chartRows = list.map(r => {
    const segs = r.aging.map((v, i) => v > 0
      ? '<span style="width:' + (v / axisMax * 100).toFixed(2) + '%;background:' + AGING_COLORS[i] + '" title="' + r.customerName + ' · ' + AGING_BUCKETS[i] + '：' + money(v) + '"></span>'
      : '').join('');
    return '<div class="aging-row"><span class="name">' + esc(r.customerName) + '</span>' +
      '<span class="stack">' + segs + '</span></div>';
  }).join('');
  const legend = AGING_BUCKETS.map((b, i) =>
    '<span class="item"><span class="dot" style="background:' + AGING_COLORS[i] + '"></span>' + b + '</span>'
  ).join('');
  const ticks = [0, 1, 2, 3, 4].map(i =>
    '<span style="left:' + (i * 25) + '%">' + Math.round(axisMax * i / 4 / 1000) + 'k</span>'
  ).join('');

  document.getElementById('pageContent').innerHTML =
    '<div class="kpi-grid kpi-3">' +
      '<div class="kpi-card warning"><div class="label">应收总额</div>' +
        '<div class="value">' + money(totalBalance) + '</div>' +
        '<div class="delta">' + list.length + ' 家客户</div></div>' +
      '<div class="kpi-card danger"><div class="label">逾期（账期外）客户</div>' +
        '<div class="value">' + overdueCount + '</div>' +
        '<div class="delta">超 80% 信用额度</div></div>' +
      '<div class="kpi-card"><div class="label">180 天以上账龄</div>' +
        '<div class="value">' + money(totalAging[4]) + '</div>' +
        '<div class="delta">需计提坏账准备</div></div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-header"><span class="card-title">📊 账龄分布</span>' +
        '<div class="aging-legend">' + legend + '</div></div>' +
      '<div class="aging-chart">' + chartRows + '</div>' +
      '<div class="aging-axis"><span></span><div class="ticks">' + ticks + '</div></div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-header"><span class="card-title">📋 应收账款台账</span>' +
        '<span class="text-sm text-gray">合计 ' + money(totalBalance) + '</span></div>' +
      '<div class="table-wrap"><table class="table">' +
        '<thead><tr><th>客户</th><th class="text-right">信用额度</th><th class="text-right">应收余额</th>' +
        '<th>账龄分桶</th><th class="text-center">操作</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div>' +
    '</div>';
}

function showReceipt(customerId) {
  const r = receivableByCustomer(customerId);
  if (!r) return;
  const mask = openModal(
    '💵 收款单 - ' + esc(r.customerName),
    '<div class="notice info" style="margin-bottom:14px">' +
      '<div><b>客户：</b>' + esc(r.customerName) + '　<b>账期：</b>' + (r.accountPeriod === 0 ? '现结' : r.accountPeriod + ' 天') + '</div>' +
      '<div><b>当前应收余额：</b><span class="text-danger text-bold">' + money(r.balance) + '</span></div>' +
    '</div>' +
    '<div class="form-item"><label>本次收款金额（元）</label>' +
      '<input id="receiptAmount" class="input" type="number" min="0.01" step="0.01" value="' + r.balance.toFixed(2) + '" data-role="rc-amount">' +
      '<div class="form-tip" id="receiptTip">收款后剩余应收：¥0.00</div></div>' +
    '<div class="form-item"><label>收款方式</label>' +
      '<select id="receiptMethod" class="select"><option>现金</option><option>银行转账</option><option>微信</option><option>支付宝</option></select></div>' +
    '<div class="form-item" style="margin-bottom:0"><label>备注</label>' +
      '<textarea id="receiptRemark" class="textarea" rows="2" placeholder="可填写付款流水号或备注"></textarea></div>',
    '<button class="btn btn-default btn-sm" data-act="modal-close">取消</button>' +
    '<button class="btn btn-success btn-sm" data-act="rc-receipt-submit" data-id="' + customerId + '">✓ 确认收款</button>',
    { width: '520px' }
  );
  mask.dataset.customerId = customerId;
  setTimeout(function () {
    const amount = document.getElementById('receiptAmount');
    const tip = document.getElementById('receiptTip');
    if (!amount || !tip) return;
    function updateTip() {
      const v = Number(amount.value) || 0;
      const remain = Math.max(0, r.balance - v);
      tip.textContent = '收款后剩余应收：' + money(remain);
      if (v > r.balance) { tip.textContent = '收款金额不能大于当前应收余额 ' + money(r.balance); tip.style.color = 'var(--danger)'; }
      else tip.style.color = '';
    }
    amount.addEventListener('input', updateTip);
    updateTip();
    amount.focus();
    amount.select();
  }, 30);
}

function submitReceipt(customerId) {
  const r = receivableByCustomer(customerId);
  const c = customerById(customerId);
  if (!r || !c) return;
  const amountEl = document.getElementById('receiptAmount');
  const methodEl = document.getElementById('receiptMethod');
  const remarkEl = document.getElementById('receiptRemark');
  const amount = Number(amountEl.value);
  if (!amount || amount <= 0) { toast('请输入有效的收款金额', 'warning'); return; }
  if (amount > r.balance + 0.001) { toast('收款金额不能大于应收余额 ' + money(r.balance), 'warning'); return; }
  const method = methodEl.value;
  const remark = (remarkEl.value || '').trim();
  const no = genReceiptNo();

  r.balance = Number((r.balance - amount).toFixed(2));
  c.balance = Number((c.balance - amount).toFixed(2));
  applyPayment(r.aging, amount);
  DB.flows.push({ no: no, date: todayStr(), customerId: Number(customerId), type: '收款', amount: amount, method: method, remark: remark });
  DB.messages.unshift({
    id: Date.now(), title: '收款到账：' + c.name + ' 回款 ' + money(amount) + '（' + method + '）',
    read: false, time: todayStr().slice(5) + ' ' + new Date().toTimeString().slice(0, 5)
  });
  saveDB();
  closeAllModals();
  toast('已收款 ' + money(amount) + '（' + method + '），应收余额已更新', 'success');
  render();
}

};

function bindEvents() {
  document.addEventListener('click', function (e) {
    const bell = e.target.closest ? e.target.closest('.bell') : null;
    if (!bell) {
      const panel = document.getElementById('msgPanel');
      if (panel) panel.classList.remove('show');
    }
    const el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    const act = el.dataset.act;
    const fn = Actions[act];
    if (!fn) return;
    if (el.hasAttribute('disabled')) return;
    e.preventDefault();
    fn(el, e);
  });

  document.addEventListener('input', function (e) {
    const role = e.target.dataset ? e.target.dataset.role : '';
    if (role === 'prod-search') {
      prodState.kw = e.target.value;
      prodState.page = 1;
      renderProductTable();
      return;
    }
    if (role === 'stock-kw') {
      stockState.kw = e.target.value;
      renderStockBody();
      return;
    }
    if (role === 'sales-qty' || role === 'sales-price') {
      const idx = Number(e.target.dataset.idx);
      const s = getSalesState();
      const it = s.items[idx];
      if (!it) return;
      if (role === 'sales-qty') {
        const stock = productStock(it.productId);
        let q = Math.max(1, Math.floor(Number(e.target.value) || 1));
        if (q > stock) { q = Math.max(1, stock); e.target.value = q; toast('库存不足，数量已调整为 ' + q, 'warning'); }
        it.qty = q;
      } else {
        it.price = Math.max(0, Number(e.target.value) || 0);
      }
      it.amount = it.isGift ? 0 : Number((it.qty * it.price).toFixed(2));
      refreshSalesTotals();
    }
  });

  document.addEventListener('change', function (e) {
    const role = e.target.dataset ? e.target.dataset.role : '';
    if (role === 'sales-customer') {
      getSalesState().customerId = e.target.value;
      renderSalesTable();
      if (e.target.value) toast('已选择客户，信用额度已校验', 'success');
      return;
    }
    if (role === 'sales-product') {
      const v = e.target.value;
      e.target.value = '';
      if (v) salesAddProduct(Number(v), false);
      return;
    }
    if (role === 'sales-date') {
      getSalesState().date = e.target.value || todayStr();
      return;
    }
    if (role === 'sales-gift') {
      const idx = Number(e.target.dataset.idx);
      const s = getSalesState();
      const it = s.items[idx];
      if (!it) return;
      it.isGift = e.target.checked;
      it.amount = it.isGift ? 0 : Number((it.qty * it.price).toFixed(2));
      renderSalesTable();
      toast(it.isGift ? '已标记为赠品，不计金额但扣减库存' : '已取消赠品标记', 'info');
      return;
    }
    if (role === 'sales-qty' || role === 'sales-price') {
      renderSalesTable();
      return;
    }
    if (role === 'stock-warehouse') {
      stockState.warehouseId = e.target.value;
      renderStockBody();
      return;
    }
  });

  window.addEventListener('hashchange', render);

  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (currentRoute === 'dashboard') drawDashboardCharts();
    }, 160);
  });
}

/* ==================================================================
   12. 启动
   ================================================================== */
loadDB();
if (!location.hash) {
  location.hash = getSession() ? '#/dashboard' : '#/login';
}
bindEvents();
render();



})();
</script>
</body>
</html>
