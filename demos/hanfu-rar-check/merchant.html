<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商户叫号端 · 汉服排队叫号演示</title>
  <link rel="stylesheet" href="./assets/common.css">
  <script defer src="./assets/i18n.js"></script>
  <script defer src="./assets/shared.js"></script>
  <script defer src="./assets/merchant.js"></script>
</head>
<body class="page-body">
  <main class="page-shell wide">
    <header class="page-head">
      <div class="page-head-main">
        <h1 data-i18n="merchant.header">商户叫号端</h1>
        <p data-i18n="merchant.desc">支持一键叫号、过号、重呼、完成；适合店员现场操作。</p>
        <a class="text-link" href="./index.html" data-i18n="common.backHome">返回总入口</a>
      </div>
      <div class="lang-switcher" data-lang-switcher>
        <button class="lang-btn" type="button" data-lang-btn="zh">中</button>
        <button class="lang-btn" type="button" data-lang-btn="en">EN</button>
      </div>
    </header>

    <section class="grid-2">
      <article class="panel">
        <h2 data-i18n="merchant.quickCall">快速叫号</h2>
        <div class="action-row">
          <button class="btn btn-primary full" id="callNextBtn" data-i18n="merchant.callNext">叫下一位</button>
        </div>
        <div class="current-call" id="currentCall"></div>
      </article>

      <article class="panel">
        <h2 data-i18n="merchant.control">现场控制</h2>
        <div class="action-row">
          <button class="btn btn-accent" id="recallBtn" data-i18n="merchant.recallCurrent">重呼当前号</button>
          <button class="btn btn-warning" id="passBtn" data-i18n="merchant.passCurrent">过号（稍后）</button>
          <button class="btn btn-success" id="completeBtn" data-i18n="merchant.completeCurrent">完成办理</button>
          <button class="btn btn-ghost" id="resetBtn" data-i18n="merchant.resetDemo">重置演示数据</button>
        </div>
        <p class="hint" data-i18n="merchant.controlHint">建议开场前先点一次“重置演示数据”，保证队列干净。</p>
      </article>
    </section>

    <section class="grid-2">
      <article class="panel">
        <h2 data-i18n="merchant.waitingList">等待中队列</h2>
        <div id="waitingList" class="queue-list"></div>
      </article>
      <article class="panel">
        <h2 data-i18n="merchant.passedList">过号队列</h2>
        <div id="passedList" class="queue-list"></div>
      </article>
    </section>

    <section class="panel">
      <h2 data-i18n="merchant.completedList">已完成记录</h2>
      <div id="completedList" class="queue-list"></div>
    </section>
  </main>
</body>
</html>
