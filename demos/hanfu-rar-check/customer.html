<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顾客取号端 · 汉服排队叫号演示</title>
  <link rel="stylesheet" href="./assets/common.css">
  <script defer src="./assets/i18n.js"></script>
  <script defer src="./assets/shared.js"></script>
  <script defer src="./assets/customer.js"></script>
</head>
<body class="page-body">
  <main class="page-shell narrow">
    <header class="page-head">
      <div class="page-head-main">
        <h1 data-i18n="customer.header">顾客取号端</h1>
        <p data-i18n="customer.desc">扫码进入后点击下方按钮取号；同一手机当天只保留一个有效号单。</p>
        <a class="text-link" href="./index.html" data-i18n="common.backHome">返回总入口</a>
      </div>
      <div class="lang-switcher" data-lang-switcher>
        <button class="lang-btn" type="button" data-lang-btn="zh">中</button>
        <button class="lang-btn" type="button" data-lang-btn="en">EN</button>
      </div>
    </header>

    <section class="panel">
      <button class="btn btn-primary full" id="takeTicketBtn" data-i18n="customer.takeNow">立即取号</button>
      <p class="hint" data-i18n="customer.hint">提示：有效号单期间再次扫码会直接显示当前进度，不会重复取号。</p>
    </section>

    <section class="panel" id="ticketPanel">
      <h2 data-i18n="customer.myTicket">我的号单</h2>
      <div class="ticket-card" id="ticketCard">
        <p class="muted" data-i18n="customer.noTicketShort">尚未取号</p>
      </div>
    </section>

    <section class="panel">
      <h2 data-i18n="customer.overview">当前队列概况</h2>
      <div id="queueOverview" class="queue-list"></div>
    </section>
  </main>
</body>
</html>
