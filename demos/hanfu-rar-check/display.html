<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>门店大屏端 · 汉服排队叫号演示</title>
  <link rel="stylesheet" href="./assets/common.css">
  <script defer src="./assets/i18n.js"></script>
  <script defer src="./assets/shared.js"></script>
  <script defer src="./assets/display.js"></script>
</head>
<body class="display-body">
  <div class="lang-switcher fixed" data-lang-switcher>
    <button class="lang-btn" type="button" data-lang-btn="zh">中</button>
    <button class="lang-btn" type="button" data-lang-btn="en">EN</button>
  </div>
  <main class="display-shell">
    <header class="display-head">
      <h1 data-i18n="display.header">云裳序 · 当前叫号</h1>
      <div id="clock" class="clock"></div>
    </header>

    <section class="display-current" id="displayCurrent"></section>

    <section class="display-queues">
      <article class="display-panel">
        <h2 data-i18n="display.waitingList">等待队列</h2>
        <div id="displayWaiting" class="display-list"></div>
      </article>
    </section>
  </main>
</body>
</html>
