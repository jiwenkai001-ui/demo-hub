<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F3A8A">
<title>微醺小酒馆 · 扫码点餐</title>
<style>
:root{
  --red:#E8453C; --red-d:#C8322A; --red-l:#FFF0EE;
  --blue:#1F3A8A; --blue-2:#2E55C6; --blue-l:#EEF2FF;
  --gold:#F5B942;
  --bg:#F5F6FA; --card:#fff; --text:#1B2340; --sub:#6B748C; --mute:#9AA2B5;
  --line:#ECEEF4; --shadow:0 6px 22px rgba(31,58,138,.08);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#E9ECF3;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
body{overflow-x:hidden}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(20,30,60,.08);padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.content{min-height:60vh}
svg{display:block;flex:none}

/* 顶部 */
.top{background:linear-gradient(125deg,#1B3278 0%,#2C54C4 62%,#3A67D8 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 16px;position:relative;overflow:hidden}
.top:after{content:"";position:absolute;right:-46px;top:-58px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07)}
.top:before{content:"";position:absolute;right:36px;bottom:-70px;width:120px;height:120px;border-radius:50%;background:rgba(232,69,60,.16)}
.top-row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(140deg,#FF6B5E,var(--red));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 12px rgba(232,69,60,.35)}
.brand-txt strong{display:block;font-size:17px;letter-spacing:.5px;line-height:1.2}
.brand-txt small{display:block;font-size:9px;opacity:.72;letter-spacing:2.2px;text-transform:uppercase;margin-top:2px}
.icon-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;color:#fff}
.store-row{display:flex;align-items:center;gap:8px;margin-top:15px;position:relative;z-index:1;flex-wrap:wrap}
.table-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600}
.store-name{font-size:12px;opacity:.85}
.slogan{margin-top:12px;position:relative;z-index:1;font-size:11px;letter-spacing:1.5px;opacity:.75}

/* 搜索 */
.search-wrap{padding:12px 14px 4px;position:sticky;top:0;background:var(--bg);z-index:20}
.search-box{height:38px;border-radius:19px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--mute);box-shadow:var(--shadow)}
.search-box input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:13px;color:var(--text)}
.search-box input::placeholder{color:var(--mute)}

/* 横幅 */
.banner{margin:12px 14px 4px;border-radius:var(--r);background:linear-gradient(115deg,#E8453C 0%,#F0694B 55%,#F5A35C 100%);color:#fff;padding:15px 17px;position:relative;overflow:hidden;min-height:96px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.banner:after{content:"🍻";position:absolute;right:8px;bottom:-18px;font-size:86px;opacity:.22;transform:rotate(-14deg)}
.banner-tag{display:inline-block;background:rgba(255,255,255,.22);border-radius:5px;padding:2px 7px;font-size:10px;letter-spacing:1px;margin-bottom:6px}
.banner h3{margin:0;font-size:17px;letter-spacing:.3px;white-space:nowrap}
.banner p{margin:6px 0 0;font-size:10.5px;opacity:.9;max-width:220px;line-height:1.5}
.banner .go{position:absolute;right:13px;bottom:12px;background:#fff;color:var(--red);font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;z-index:1}

/* 分类吸顶 */
.cats{position:sticky;top:0;z-index:25;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:7px 13px;border-radius:18px;background:#fff;color:var(--sub);font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent;transition:.18s}
.cat.on{background:var(--blue);color:#fff;box-shadow:0 5px 14px rgba(31,58,138,.24)}

/* 商品列表 */
.section-title{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px;font-size:14px;font-weight:700}
.section-title span{font-size:11px;color:var(--mute);font-weight:400}
.list{padding:0 14px}
.item{background:#fff;border-radius:14px;padding:12px;display:flex;gap:12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(30,40,80,.035);align-items:center}
.pimg{width:82px;height:82px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:39px;position:relative;overflow:hidden}
.pimg:after{content:"BISTRO";position:absolute;bottom:3px;right:5px;font-size:7px;letter-spacing:.6px;color:rgba(255,255,255,.75);font-weight:700}
.gpink{background:linear-gradient(140deg,#FFD9E6,#FF8FAE)}.gpurple{background:linear-gradient(140deg,#E6D6FF,#A77BEF)}.gpeach{background:linear-gradient(140deg,#FFE6CF,#FFAF78)}
.ggold{background:linear-gradient(140deg,#FFEDBE,#F5C254)}.gcream{background:linear-gradient(140deg,#FFF6E0,#EBD9AC)}.gbeer{background:linear-gradient(140deg,#FFE7A8,#E9A93B)}
.gblue{background:linear-gradient(140deg,#D7EAFF,#7BAEF0)}.gred{background:linear-gradient(140deg,#FFD6D2,#EE7B70)}.ggreen{background:linear-gradient(140deg,#D6F3DC,#85CF9A)}
.gmint{background:linear-gradient(140deg,#D5F5EC,#6FCBB2)}.gamber{background:linear-gradient(140deg,#FFE0BC,#EE9A55)}.gorange{background:linear-gradient(140deg,#FFE0B8,#FF9E4B)}
.gdark{background:linear-gradient(140deg,#4B4E6B,#23263B)}.gdark:after{color:rgba(255,255,255,.5)}
.info{flex:1;min-width:0}
.info h4{margin:0;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .en{font-size:9.5px;color:var(--mute);letter-spacing:.4px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .desc{font-size:11px;color:var(--sub);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagline{display:inline-block;font-size:9.5px;color:var(--red);background:var(--red-l);padding:1px 6px;border-radius:4px;margin-top:5px;font-weight:600}
.price-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px}
.price{color:var(--red);font-weight:800;font-size:17px;line-height:1}
.price small{font-size:11px;margin-right:1px}
.old{color:var(--mute);font-size:10px;text-decoration:line-through;margin-left:5px}
.add{width:28px;height:28px;border-radius:50%;background:linear-gradient(140deg,#F0554B,var(--red));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(232,69,60,.3)}

/* 底部 */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;z-index:60;box-shadow:0 -4px 18px rgba(30,40,80,.05)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mute);font-size:10px;position:relative}
.tab.on{color:var(--blue);font-weight:700}
.tab.on svg{stroke-width:2.2}
.tab .dot{position:absolute;top:7px;right:calc(50% - 20px);min-width:15px;height:15px;border-radius:9px;background:var(--red);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid #fff}
.cartbar{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:402px;height:56px;background:#202644;border-radius:28px;display:flex;align-items:center;padding:0 7px 0 15px;z-index:55;box-shadow:0 10px 28px rgba(20,25,55,.3);color:#fff}
.cart-ico{position:relative;margin-right:12px;color:#fff}
.cart-ico .n{position:absolute;top:-7px;right:-8px;min-width:17px;height:17px;border-radius:9px;background:var(--red);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.cart-sum{flex:1;min-width:0}
.cart-sum b{font-size:19px;color:#fff}
.cart-sum small{display:block;font-size:9.5px;color:rgba(255,255,255,.5);margin-top:-2px}
.pay-btn{height:42px;padding:0 20px;border-radius:21px;background:linear-gradient(120deg,#F0554B,var(--red));font-weight:800;font-size:14px;color:#fff;white-space:nowrap}

/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(16,20,40,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet{width:100%;max-width:430px;max-height:82vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;animation:up .24s ease-out;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.sheet-h h3{margin:0;font-size:16px}
.sheet-h .sub{font-size:11px;color:var(--mute);font-weight:400;margin-left:6px}
.x{width:28px;height:28px;border-radius:50%;background:#F2F3F7;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.sheet-body{padding:14px 18px}
.sheet-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;position:sticky;bottom:0;background:#fff}

/* 购物车条目 */
.cart-line{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.cart-line:last-child{border-bottom:0}
.cart-line .thumb{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:25px;flex:none}
.cl-info{flex:1;min-width:0}
.cl-info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-info small{color:var(--mute);font-size:10.5px}
.cl-info .p{color:var(--red);font-weight:700;font-size:14px;margin-top:2px}
.stepper{display:flex;align-items:center;gap:10px;flex:none}
.stepper button{width:25px;height:25px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.stepper button.plus{background:var(--blue);color:#fff;border-color:var(--blue)}
.stepper span{min-width:14px;text-align:center;font-weight:700;font-size:13px}

/* 商品详情 */
.detail-img{height:184px;margin:-14px -18px 16px;display:flex;align-items:center;justify-content:center;font-size:88px;position:relative}
.detail-img:after{content:"BISTRO";position:absolute;bottom:10px;right:16px;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.8);font-weight:700}
.detail-title{display:flex;justify-content:space-between;align-items:flex-start}
.detail-title h3{margin:0;font-size:19px}
.detail-title .p{color:var(--red);font-size:21px;font-weight:800}
.detail-en{font-size:10px;color:var(--mute);letter-spacing:1px;margin-top:2px}
.detail-desc{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6}
.spec-t{font-size:12px;font-weight:700;margin:18px 0 8px}
.specs{display:flex;gap:8px;flex-wrap:wrap}
.spec{border:1.5px solid var(--line);border-radius:9px;padding:7px 13px;font-size:12px;color:var(--sub);background:#fff}
.spec.on{border-color:var(--blue);color:var(--blue);background:var(--blue-l);font-weight:700}

/* 通用页面 */
.page-head{background:linear-gradient(125deg,#1B3278,#2E55C6);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;display:flex;align-items:center;gap:12px;position:relative}
.page-head h2{margin:0;font-size:17px;flex:1;text-align:center;margin-right:30px}
.page-head .icon-btn{background:rgba(255,255,255,.14)}
.card{background:#fff;border-radius:var(--r);margin:12px 14px;padding:15px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row + .row{margin-top:14px}
.row .lbl{color:var(--sub);font-size:13px}
.row .val{font-size:13px;font-weight:600;text-align:right}
.chev{color:var(--mute)}
.primary{background:linear-gradient(120deg,#F0554B,var(--red));color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:700}
.blue-btn{background:var(--blue);color:#fff;border-radius:10px;padding:9px 15px;font-size:12px;font-weight:700}
.ghost{border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:9px 15px;font-size:12px;font-weight:600}

/* 会员 */
.mcard{margin:14px;border-radius:18px;background:linear-gradient(125deg,#1B2F72,#2D55C4 60%,#3E70DD);color:#fff;padding:19px;position:relative;overflow:hidden}
.mcard:after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.mcard .lv{display:inline-flex;align-items:center;gap:5px;background:rgba(245,185,66,.2);color:#FFD980;border:1px solid rgba(255,217,128,.4);border-radius:12px;padding:3px 10px;font-size:10.5px;font-weight:700}
.mcard h3{margin:12px 0 2px;font-size:20px}
.mcard p{margin:0;font-size:11px;opacity:.7}
.mnum{display:flex;gap:30px;margin-top:18px;position:relative;z-index:1}
.mnum div b{display:block;font-size:21px;line-height:1.2}
.mnum div small{font-size:10px;opacity:.7}
.prog{height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;width:64%;background:linear-gradient(90deg,#FFD980,#F5B942);border-radius:3px}
.coupon{background:#fff;border-radius:14px;margin:0 14px 10px;display:flex;overflow:hidden;box-shadow:var(--shadow)}
.coupon .amt{width:92px;flex:none;background:linear-gradient(150deg,#FFF0EE,#FFE1DD);color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1.5px dashed #FFC9C3}
.coupon .amt b{font-size:24px;line-height:1}
.coupon .amt b small{font-size:12px}
.coupon .amt span{font-size:9.5px;margin-top:3px;opacity:.8}
.coupon .cinfo{flex:1;padding:13px;min-width:0}
.coupon .cinfo b{font-size:13px}
.coupon .cinfo small{display:block;color:var(--mute);font-size:10.5px;margin-top:3px}
.coupon .cbtn{align-self:center;margin-right:12px;font-size:11px;font-weight:700;color:#fff;background:var(--red);border-radius:12px;padding:5px 11px;white-space:nowrap}
.coupon.used{opacity:.62}
.coupon.used .cbtn{background:#E3E6EE;color:var(--sub)}

/* 订单 */
.order-card{background:#fff;border-radius:var(--r);margin:12px 14px;padding:15px;box-shadow:var(--shadow)}
.oc-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:11px}
.oc-top b{font-size:13px}
.st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:11px}
.st0{background:var(--blue-l);color:var(--blue)}.st1{background:#FFF4DE;color:#B97B12}.st2{background:#E9F8EF;color:#188A4E}.st3{background:#F1F2F6;color:var(--mute)}
.oc-body{padding:11px 0;font-size:12px;color:var(--sub);line-height:1.7}
.oc-foot{display:flex;justify-content:space-between;align-items:center;padding-top:11px;border-top:1px solid var(--line)}
.oc-foot .tot{font-size:12px;color:var(--sub)}
.oc-foot .tot b{color:var(--red);font-size:17px}
.empty{text-align:center;padding:70px 20px;color:var(--mute)}
.empty .e{font-size:56px;display:block;margin-bottom:12px;filter:grayscale(.3)}
.empty b{display:block;color:var(--sub);font-size:14px;margin-bottom:6px}

/* 时间轴 */
.timeline{padding:4px 0 0}
.tl{display:flex;gap:12px;position:relative;padding-bottom:20px}
.tl:last-child{padding-bottom:0}
.tl:not(:last-child):before{content:"";position:absolute;left:9px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl.done:not(:last-child):before{background:var(--blue)}
.tl .dotc{width:20px;height:20px;border-radius:50%;background:#E8EAF1;color:#fff;display:flex;align-items:center;justify-content:center;z-index:1;flex:none}
.tl.done .dotc{background:var(--blue)}
.tl.now .dotc{background:var(--red);box-shadow:0 0 0 4px var(--red-l)}
.tl b{font-size:13px}
.tl small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.tl.done b,.tl.now b{color:var(--text)}

/* 结算 */
.pay-line{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.pay-line:last-child{border-bottom:0}
.pay-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.radio{width:19px;height:19px;border-radius:50%;border:1.5px solid #CFD4E0;display:flex;align-items:center;justify-content:center;flex:none}
.radio.on{border-color:var(--blue);background:var(--blue)}
.radio.on:after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.remark{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:none;outline:0;background:#FAFBFD;height:62px;font-size:12px}
.pay-footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;z-index:70}
.pay-footer .amt{flex:1}
.pay-footer .amt b{font-size:21px;color:var(--red)}
.pay-footer .amt small{display:block;color:var(--mute);font-size:10px}
.pay-footer .go{background:linear-gradient(120deg,#F0554B,var(--red));color:#fff;border-radius:24px;padding:13px 26px;font-weight:800}

/* 成功 */
.success{text-align:center;padding:48px 26px 20px}
.sicon{width:78px;height:78px;border-radius:50%;background:linear-gradient(140deg,#48C88A,#1DA96B);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 10px 24px rgba(29,169,107,.26);animation:pop .4s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.success h2{margin:0;font-size:21px}
.success p{color:var(--sub);font-size:12px;margin:9px 0 24px}
.sinfo{background:#fff;border-radius:var(--r);padding:16px;text-align:left;box-shadow:var(--shadow)}
.sinfo .row{padding:5px 0}
.sbtns{display:flex;gap:10px;margin-top:20px}
.sbtns button{flex:1;border-radius:12px;padding:12px;font-weight:700;font-size:13px}

/* 表格选择 */
.table-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.table-grid button{border:1.5px solid var(--line);border-radius:10px;padding:11px 0;font-size:12px;font-weight:600;color:var(--sub)}
.table-grid button.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}

/* 提示 */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(25,30,55,.9);color:#fff;padding:11px 20px;border-radius:22px;font-size:13px;z-index:200;animation:fade .18s;white-space:nowrap}

/* 年龄门 */
.gate{position:fixed;inset:0;background:linear-gradient(150deg,#162A68,#2E55C6 60%,#E8453C);z-index:300;display:flex;align-items:center;justify-content:center;padding:28px;color:#fff;text-align:center}
.gate-in{max-width:330px}
.gate .gm{font-size:62px;display:block;margin-bottom:14px}
.gate h1{font-size:27px;margin:0 0 8px;letter-spacing:2px}
.gate .gen{font-size:11px;letter-spacing:5px;opacity:.7;margin-bottom:22px}

var KEY='bistro_order_app_v1';
var S={tab:'order',cat:'hot',cart:{},orders:[],table:'A12',couponClaim:{c2:1,c3:1},selCoupon:'auto',point:1280,ageOk:false,view:'main',modal:null,cartOpen:false,tableOpen:false,pay:'wechat',remark:'',search:'',currentOrder:null};
try{var raw=localStorage.getItem(KEY);if(raw){var sv=JSON.parse(raw);for(var k in sv){if(S.hasOwnProperty(k))S[k]=sv[k]}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({cart:S.cart,orders:S.orders,table:S.table,couponClaim:S.couponClaim,point:S.point,ageOk:S.ageOk}))}catch(e){}}
function prod(id){for(var i=0;i<P.length;i++)if(P[i].id===id)return P[i];return null}
function cartList(){var a=[];for(var key in S.cart){var v=S.cart[key];if(v.q>0){var pr=prod(v.id);if(pr)a.push({key:key,id:v.id,spec:v.spec,q:v.q,unit:v.unit,p:pr})}}return a}
function cartCount(){var n=0;cartList().forEach(function(x){n+=x.q});return n}
function cartTotal(){var n=0;cartList().forEach(function(x){n+=x.unit*x.q});return n}
function bestCoupon(total){var best=null;COUPONS.forEach(function(c){if(S.couponClaim[c.id]&&total>=c.th&&(!best||c.a>best.a))best=c});return best}
function discount(total){var c=null;if(S.selCoupon==='auto')c=bestCoupon(total);else if(S.selCoupon!=='none')COUPONS.forEach(function(x){if(x.id===S.selCoupon&&S.couponClaim[x.id]&&total>=x.th)c=x});return c?Math.min(c.a,total):0}
function orderStatus(o){var s=(Date.now()-o.createdAt)/1000;if(s<12)return 0;if(s<30)return 1;if(s<60)return 2;return 3}
function toast(msg){var d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},1500)}

/* ========== 渲染 ========== */
var app=document.getElementById('app');
var lastRenderKey='';
function render(){

  var keepScroll=rk===lastRenderKey;
  var top=window.pageYOffset||document.documentElement.scrollTop||0;
  var h='';
  if(!S.ageOk){h=gateHtml()}
  else if(S.view==='checkout'){h=checkoutHtml()}
  else if(S.view==='success'){h=successHtml()}
  else if(S.view==='orderDetail'){h=orderDetailHtml()}
  else if(S.view==='search'){h=searchHtml()}
  else{
    h=mainHtml();
    if(S.orders.length||S.point)h+='';
  }
  app.innerHTML=h;
  lastRenderKey=rk;
  if(keepScroll)window.scrollTo(0,top);else window.scrollTo(0,0);
  if(S.view==='search'&&S.search){var si=document.getElementById('searchInput');if(si){si.focus();si.setSelectionRange(si.value.length,si.value.length)}}
}
function gateHtml(){return '<div class="gate"><div class="gate-in"><span class="gm">🍻</span><h1>微醺小酒馆</h1><div class="gen">BISTRO BAR</div><p>年轻人的线下社交平台<br>理性饮酒 · 适量饮酒<br>未满 18 周岁禁止饮酒</p><button data-act="age-ok">我已满 18 周岁，进入点餐</button><small>进入即表示您已阅读并同意饮酒须知</small></div></div>'}

function mainHtml(){
  var h='';
  if(S.tab==='order')h+=topHtml()+bannerHtml()+searchBarHtml()+catsHtml()+productsHtml()+cartBarHtml();
  else if(S.tab==='orders')h+=pageHeadHtml('我的订单')+ordersHtml();
  else if(S.tab==='member')h+=pageHeadHtml('会员中心')+memberHtml();
  else h+=pageHeadHtml('我的')+profileHtml();
  h+=tabbarHtml();
  return h;
}
function topHtml(){return '<div class="top"><div class="top-row"><div class="brand"><div class="brand-mark">🥂</div><div class="brand-txt"><strong>微醺小酒馆</strong><small>Bistro Bar</small></div></div><button class="icon-btn" data-act="table-open">'+ic(I.pin,18)+'</button></div><div class="store-row"><span class="table-pill">'+ic(I.pin,13)+' 桌号 '+esc(S.table)+'</span><span class="store-name">微醺小酒馆 · 欢迎光临</span></div><div class="slogan">年轻人的线下社交平台 · 无低消 自由微醺</div></div>'}
function bannerHtml(){return '<div class="banner"><span class="banner-tag">夏日限定 · HOT</span><h3>酒水第二份半价</h3><p>人气果啤 / 精酿 / 鸡尾酒 全线参与</p><span class="go">去点餐 ›</span></div>'}
function searchBarHtml(){return '<div class="search-wrap"><div class="search-box">'+ic(I.search,16)+'<input id="searchInput" type="text" placeholder="搜索酒水、小食，例如：草莓果啤" value="'+esc(S.search)+'" data-act="search-input"><span style="font-size:10px;color:var(--mute)">共 '+P.length+' 款</span></div></div>'}
function catsHtml(){var h='<div class="cats">';CATS.forEach(function(c){h+='<button class="cat '+(S.cat===c.id?'on':'')+'" data-act="cat" data-id="'+c.id+'">'+c.n+'</button>'});return h+'</div>'}
function productsHtml(){
  var list=S.cat==='hot'?P.filter(function(p){return p.hot}):P.filter(function(p){return p.c===S.cat});
  if(!list.length)list=P;
  var h='<div class="section-title">'+(S.cat==='hot'?'人气必点榜':(CATS.filter(function(c){return c.id===S.cat})[0]||{}).n)+'<span>已选 '+cartCount()+' 件</span></div><div class="list" id="productList">';
  list.forEach(function(p){
    h+='<div class="item" data-act="detail" data-id="'+p.id+'"><div class="pimg '+p.g+'">'+p.em+'</div><div class="info"><h4>'+p.n+'</h4><div class="en">'+p.e+'</div><div class="desc">'+p.d+'</div>'+(p.hot?'<span class="tagline">🔥 热卖 '+p.sales+'</span>':'')+'<div class="price-row"><div><span class="price"><small>¥</small>'+money(p.p)+'</span><span class="old">¥'+money(p.o)+'</span></div><button class="add" data-act="quick-add" data-id="'+p.id+'">'+ic(I.plus,16)+'</button></div></div></div>';
  });
  return h+'</div>';
}
function cartBarHtml(){
  if(!cartCount())return '';

}
function tabbarHtml(){

function pageHeadHtml(title){return '<div class="page-head"><button class="icon-btn" data-act="back">'+ic(I.back,19)+'</button><h2>'+title+'</h2><button class="icon-btn" data-act="table-open">'+ic(I.pin,17)+'</button></div>'}

  if(!S.orders.length)return '<div class="empty"><span class="e">🧾</span><b>还没有订单哦</b><span>选几杯喜欢的酒，开启今晚的微醺时光</span><div style="margin-top:22px"><button class="blue-btn" data-act="tab" data-id="order">去点餐</button></div></div>';

    var st=orderStatus(o);
    var names=o.items.map(function(x){return x.n+' ×'+x.q}).join('、');

  });
  return h;
}

    var has=S.couponClaim[c.id];

  return h;

/* ========== 交互 ========== */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act'),id=t.getAttribute('data-id');
  if(a==='close-mask'&&e.target!==t)return;
  switch(a){
    case 'age-ok':S.ageOk=true;save();render();break;
    case 'tab':S.tab=id;S.view='main';S.modal=null;S.cartOpen=false;S.tableOpen=false;render();break;
    case 'tab-orders':S.tab='orders';S.view='main';render();break;
    case 'tab-member':S.tab='member';S.view='main';render();break;
    case 'back':S.view='main';render();break;
    case 'cat':S.cat=id;render();break;
    case 'detail':S.modal={id:id,spec:0,q:1};render();break;
    case 'quick-add':{
      var p=prod(id);var key=p.id+'|标准';
      if(S.cart[key])S.cart[key].q++;else S.cart[key]={id:p.id,spec:'标准',unit:p.p,q:1};
      save();render();toast('已加入购物车');break;
    }
    case 'spec':S.modal.spec=parseInt(t.getAttribute('data-i'));render();break;
    case 'm-qty':S.modal.q=Math.max(1,S.modal.q+parseInt(t.getAttribute('data-d')));render();break;
    case 'm-add':{
      var p2=prod(S.modal.id),sp=p2.specs?p2.specs[S.modal.spec]:null;
      var key2=p2.id+'|'+(sp?sp.n:'标准');
      if(S.cart[key2])S.cart[key2].q+=S.modal.q;else S.cart[key2]={id:p2.id,spec:sp?sp.n:'标准',unit:p2.p+(sp?sp.d:0),q:S.modal.q};
      S.modal=null;save();render();toast('已加入购物车');break;
    }
    case 'close-mask':S.modal=null;S.cartOpen=false;S.tableOpen=false;S.couponToggle=false;render();break;
    case 'close-cart':S.cartOpen=false;render();break;
    case 'close-table':S.tableOpen=false;render();break;
    case 'cart-open':S.cartOpen=true;render();break;
    case 'c-qty':{
      var k=t.getAttribute('data-key'),d=parseInt(t.getAttribute('data-d'));
      if(S.cart[k]){S.cart[k].q+=d;if(S.cart[k].q<=0)delete S.cart[k]}
      save();render();break;
    }
    case 'table-open':S.tableOpen=true;render();break;
    case 'pick-table':S.table=t.getAttribute('data-t');S.tableOpen=false;save();render();toast('已切换至 '+S.table+' 桌');break;
    case 'checkout':S.cartOpen=false;S.modal=null;S.view='checkout';S.couponToggle=false;render();break;
    case 'checkout-back':S.view='main';S.tab='order';render();break;
    case 'pay':S.pay=t.getAttribute('data-p');render();break;
    case 'coupon-toggle':S.couponToggle=true;render();break;
    case 'close-coupon':S.couponToggle=false;render();break;
    case 'sel-coupon':S.selCoupon=t.getAttribute('data-c');S.couponToggle=false;render();break;
    case 'claim':S.couponClaim[id]=1;save();render();toast('领取成功，下单自动抵扣');break;
    case 'submit-order':{
      var items=cartList();if(!items.length){toast('购物车是空的');return}
      var total=cartTotal(),dis=discount(total),paid=Math.max(0,total-dis);
      var o={id:'BP'+Date.now().toString().slice(-9),items:items.map(function(x){return {n:x.p.n,spec:x.spec,q:x.q,unit:x.unit}}),total:total,dis:dis,paid:paid,table:S.table,pay:S.pay,remark:S.remark,createdAt:Date.now()};
      S.orders.push(o);S.point+=Math.floor(paid);S.cart={};S.remark='';S.currentOrder=o.id;S.view='success';save();render();break;
    }
    case 'go-order':S.view='main';S.tab='orders';render();break;
    case 'go-menu':S.view='main';S.tab='order';render();break;
    case 'order-detail':S.currentOrder=id;S.view='orderDetail';render();break;
    case 'reorder':{
      var ord=null;S.orders.forEach(function(x){if(x.id===id)ord=x});
      if(ord){S.cart={};ord.items.forEach(function(x){var p3=null;P.forEach(function(y){if(y.n===x.n)p3=y});if(p3){var k3=p3.id+'|'+x.spec;S.cart[k3]={id:p3.id,spec:x.spec,unit:x.unit,q:x.q}}});save();S.view='main';S.tab='order';render();toast('已将商品加入购物车')}
      break;
    }
    case 'clear-search':S.search='';S.view='main';render();break;
    case 'info':toast('理性饮酒 · 未满18周岁禁止饮酒');break;
  }
});

    if(S.view==='search'){
      var sr=document.getElementById('searchResults');if(sr)sr.innerHTML=searchResultsHtml(list,S.search.trim());
    }else if(box){
      box.innerHTML=list.map(function(p){return '<div class="item" data-act="detail" data-id="'+p.id+'"><div class="pimg '+p.g+'">'+p.em+'</div><div class="info"><h4>'+p.n+'</h4><div class="en">'+p.e+'</div><div class="desc">'+p.d+'</div>'+(p.hot?'<span class="tagline">🔥 热卖 '+p.sales+'</span>':'')+'<div class="price-row"><div><span class="price"><small>¥</small>'+money(p.p)+'</span><span class="old">¥'+money(p.o)+'</span></div><button class="add" data-act="quick-add" data-id="'+p.id+'">'+ic(I.plus,16)+'</button></div></div></div>'}).join('');
    }
  }
  if(e.target&&e.target.id==='remarkInput')S.remark=e.target.value;
});
/* 定时刷新订单状态 */
setInterval(function(){if(S.orders.length&&(S.tab==='orders'||S.view==='orderDetail'||S.view==='success'))render()},5000);
render();
</script>
</body>
</html>
