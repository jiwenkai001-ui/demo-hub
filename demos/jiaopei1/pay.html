<body>
  <!-- Header -->
  <div class="header">
    <span class="back" onclick="history.back()">‹</span>
    确认订单
  </div>

  <!-- Product -->
  <div class="product-card">
    <div class="product-img">📦</div>
    <div class="product-info">
      <div>
        <div class="product-name" id="productName">精选商品</div>
        <div class="product-desc" id="productDesc">优质商品，全国包邮</div>
      </div>
      <div class="product-price"><small>¥</small><span id="productPrice">99.00</span></div>
    </div>
  </div>

  <!-- Address Form -->
  <div class="section-card">
    <div class="section-title">
      <span class="icon">📍</span>
      收货地址
    </div>

    <div class="form-group" id="nameGroup">
      <div class="form-label"><span class="required">*</span>姓名</div>
      <input type="text" class="form-input" id="name" placeholder="请输入收货人姓名" maxlength="20">
    </div>

    <div class="form-group" id="phoneGroup">
      <div class="form-label"><span class="required">*</span>联系电话</div>
      <input type="tel" class="form-input" id="phone" placeholder="请输入手机号" maxlength="11">
    </div>

    <div class="form-group" id="regionGroup">
      <div class="form-label"><span class="required">*</span>所在地区</div>
      <div class="region-selector">
        <select id="province">
          <option value="">省份</option>
        </select>
        <select id="city">
          <option value="">城市</option>
        </select>
        <select id="district">
          <option value="">区县</option>
        </select>
      </div>
    </div>

    <div class="detail-address" id="detailGroup">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="form-label" style="width:auto;"><span class="required">*</span>详细地址</div>
      </div>
      <textarea id="detailAddress" placeholder="街道、楼牌号等" maxlength="100"></textarea>
      <div class="char-count"><span id="addrCount">0</span>/100</div>
      <div class="suggestion-list" id="addrSuggestions"></div>
    </div>

    <div class="shipping-info" id="shippingInfo" style="display:none;">
      <span class="label">运费</span>
      <span class="fee" id="shippingFee">¥10.00</span>
    </div>
    <div class="shipping-hint" id="shippingHint" style="display:none;"></div>
  </div>

  <!-- Payment Methods -->
  <div class="section-card">
    <div class="section-title">
      <span class="icon">💳</span>
      支付方式
    </div>
    <div class="payment-list" id="paymentList">
    </div>
  </div>

  <!-- Order Summary -->
  <div class="section-card">
    <div class="section-title">
      <span class="icon">📋</span>
      订单明细
    </div>
    <div class="order-summary">
      <div class="summary-row">
        <span class="label">商品金额</span>
        <span class="value" id="goodsAmount">¥99.00</span>
      </div>
      <div class="summary-row">
        <span class="label">运费</span>
        <span class="value" id="shipAmount">¥10.00</span>
      </div>
      <div class="summary-row total">
        <span class="label">实付款</span>
        <span class="value"><small>¥</small><span id="totalAmount">109.00</span></span>
      </div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="total-price">
      <div class="label">合计</div>
      <div class="amount"><small>¥</small><span id="bottomTotal">109.00</span></div>
    </div>
    <button class="pay-btn" id="payBtn" onclick="submitOrder()">提交订单</button>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Pay Modal -->
  <div class="modal-overlay" id="payModal">
    <div class="modal">
      <div class="modal-icon" id="payModalIcon">💬</div>
      <div class="modal-title" id="payModalTitle">正在跳转支付...</div>
      <div class="modal-desc" id="payModalDesc">请在新页面中完成支付</div>
      <button class="modal-btn" onclick="closePayModal()">我知道了</button>
    </div>
  </div>

  <script src="assets/store.js"></script>
  <script src="assets/region-data.js"></script>
  <script>
    var config = Store.getConfig();
    var selectedPayment = 'wechat';

    // Init
    function init() {
      // Product info
      document.getElementById('productName').textContent = config.product.name;
      document.getElementById('productDesc').textContent = config.product.desc;
      document.getElementById('productPrice').textContent = config.product.price.toFixed(2);
      document.getElementById('goodsAmount').textContent = '¥' + config.product.price.toFixed(2);

      // Province options
      var provinceSelect = document.getElementById('province');
      var provinces = RegionData.getProvinces();
      provinces.forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        provinceSelect.appendChild(opt);
      });

      // Payment methods
      var paymentList = document.getElementById('paymentList');
      Object.keys(config.payment).forEach(function(key) {
        var method = config.payment[key];
        var item = document.createElement('div');
        item.className = 'payment-item' + (key === selectedPayment ? ' selected' : '') + (!method.enabled ? ' disabled' : '');
        item.dataset.type = key;
        item.innerHTML = `
          <div class="payment-icon ${key}">${method.icon}</div>
          <div class="payment-name">${method.name}</div>
          <div class="payment-radio"></div>
        `;
        item.onclick = function() {
          if (!method.enabled) return;
          selectedPayment = key;
          document.querySelectorAll('.payment-item').forEach(function(el) {
            el.classList.remove('selected');
          });
          item.classList.add('selected');
        };
        paymentList.appendChild(item);
      });

      // Set default selected to first enabled
      var firstEnabled = Object.keys(config.payment).find(function(k) {
        return config.payment[k].enabled;
      });
      if (firstEnabled) {
        selectedPayment = firstEnabled;
        document.querySelectorAll('.payment-item').forEach(function(el) {
          el.classList.toggle('selected', el.dataset.type === firstEnabled);
        });
      }

      updateTotal();
    }

    // Province change
    document.getElementById('province').addEventListener('change', function() {
      var province = this.value;
      var citySelect = document.getElementById('city');
      var districtSelect = document.getElementById('district');
      citySelect.innerHTML = '<option value="">城市</option>';
      districtSelect.innerHTML = '<option value="">区县</option>';
      if (province) {
        var cities = RegionData.getCities(province);
        cities.forEach(function(c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          citySelect.appendChild(opt);
        });
      }
      validateRegion();
      updateShipping();
    });

    // City change
    document.getElementById('city').addEventListener('change', function() {
      var province = document.getElementById('province').value;
      var city = this.value;
      var districtSelect = document.getElementById('district');
      districtSelect.innerHTML = '<option value="">区县</option>';
      if (province && city) {
        var districts = RegionData.getDistricts(province, city);
        districts.forEach(function(d) {
          var opt = document.createElement('option');
          opt.value = d;
          opt.textContent = d;
          districtSelect.appendChild(opt);
        });
      }
      validateRegion();
      updateShipping();
    });

    // District change
    document.getElementById('district').addEventListener('change', function() {
      validateRegion();
      updateShipping();
    });

    // Detail address
    document.getElementById('detailAddress').addEventListener('input', function() {
      var len = this.value.length;
      document.getElementById('addrCount').textContent = len;
      validateDetail();
      showAddressSuggestions(this.value);
    });

    // Name input
    document.getElementById('name').addEventListener('input', function() {
      validateName();
    });

    // Phone input
    document.getElementById('phone').addEventListener('input', function() {
      this.value = this.value.replace(/\D/g, '');
      validatePhone();
    });

    function updateShipping() {
      var province = document.getElementById('province').value;
      var city = document.getElementById('city').value;
      var district = document.getElementById('district').value;

      var shippingInfo = document.getElementById('shippingInfo');
      var shippingHint = document.getElementById('shippingHint');

      if (province) {
        var result = Store.calculateShipping(province, city, district, config.product.price);
        var feeEl = document.getElementById('shippingFee');
        if (result.isFree) {
          feeEl.textContent = '包邮';
          feeEl.className = 'fee free';
        } else {
          feeEl.textContent = '¥' + result.fee.toFixed(2);
          feeEl.className = 'fee';
        }
        shippingInfo.style.display = 'flex';

        if (result.freeThreshold && !result.isFree) {
          var diff = result.freeThreshold - config.product.price;
          if (diff > 0) {
            shippingHint.textContent = '再购 ¥' + diff.toFixed(2) + ' 即可享包邮';
          } else {
            shippingHint.textContent = '';
          }
        } else if (result.isFree) {
          shippingHint.textContent = '🎉 已享包邮';
        }
        shippingHint.style.display = shippingHint.textContent ? 'block' : 'none';

        document.getElementById('shipAmount').textContent = result.isFree ? '包邮' : '¥' + result.fee.toFixed(2);
      } else {
        shippingInfo.style.display = 'none';
        shippingHint.style.display = 'none';
        document.getElementById('shipAmount').textContent = '待计算';
      }

      updateTotal();
    }

    function updateTotal() {
      var province = document.getElementById('province').value;
      var city = document.getElementById('city').value;
      var district = document.getElementById('district').value;
      var price = config.product.price;
      var shipping = 0;

      if (province) {
        var result = Store.calculateShipping(province, city, district, price);
        shipping = result.fee;
      } else {
        shipping = config.shipping.defaultFee;
      }

      var total = price + shipping;
      document.getElementById('totalAmount').textContent = total.toFixed(2);
      document.getElementById('bottomTotal').textContent = total.toFixed(2);
    }

    // Validation
    function validateName() {
      var name = document.getElementById('name').value.trim();
      var group = document.getElementById('nameGroup');
      if (!name) {
        group.classList.add('has-error');
        return false;
      }
      group.classList.remove('has-error');
      return true;
    }

    function validatePhone() {
      var phone = document.getElementById('phone').value.trim();
      var group = document.getElementById('phoneGroup');
      if (!phone) {
        group.classList.add('has-error');
        return false;
      }
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        group.classList.add('has-error');
        return false;
      }
      group.classList.remove('has-error');
      return true;
    }

    function validateRegion() {
      var province = document.getElementById('province').value;
      var city = document.getElementById('city').value;
      var district = document.getElementById('district').value;
      var group = document.getElementById('regionGroup');
      if (!province || !city || !district) {
        group.classList.add('has-error');
        return false;
      }
      group.classList.remove('has-error');
      return true;
    }

    function validateDetail() {
      var detail = document.getElementById('detailAddress').value.trim();
      var group = document.getElementById('detailGroup');
      if (!detail || detail.length < 5) {
        group.style.borderColor = '';
        return false;
      }
      return true;
    }

    function validateAll() {
      var valid = true;
      if (!validateName()) { showToast('请输入收货人姓名'); valid = false; }
      else if (!validatePhone()) { showToast('请输入正确的手机号'); valid = false; }
      else if (!validateRegion()) { showToast('请选择完整的省市区地址'); valid = false; }
      else if (!validateDetail()) { showToast('请填写详细地址（至少5个字）'); valid = false; }

      var hasEnabledPayment = Object.values(config.payment).some(function(p) { return p.enabled; });
      if (!hasEnabledPayment) {
        showToast('暂未开启支付方式');
        valid = false;
      }

      return valid;
    }

    // Address suggestions (simulated)
    var sampleAddresses = [
      { text: '中关村软件园2号楼', hint: '北京市海淀区' },
      { text: '望京SOHO T3', hint: '北京市朝阳区' },
      { text: '陆家嘴金融中心', hint: '上海市浦东新区' },
      { text: '科技园南区A栋', hint: '广东省深圳市南山区' },
      { text: '天河城购物中心', hint: '广东省广州市天河区' }
    ];

    function showAddressSuggestions(query) {
      var list = document.getElementById('addrSuggestions');
      if (!query || query.length < 2) {
        list.classList.remove('show');
        return;
      }
      var matches = sampleAddresses.filter(function(a) {
        return a.text.indexOf(query) > -1;
      });
      if (matches.length === 0) {
        list.classList.remove('show');
        return;
      }
      list.innerHTML = '';
      matches.forEach(function(a) {
        var item = document.createElement('div');
        item.className = 'suggestion-item';
        item.innerHTML = '<div class="addr-text">' + a.text + '</div><div class="addr-hint">' + a.hint + '</div>';
        item.onclick = function() {
          document.getElementById('detailAddress').value = a.text;
          document.getElementById('addrCount').textContent = a.text.length;
          list.classList.remove('show');
        };
        list.appendChild(item);
      });
      list.classList.add('show');
    }

    // Hide suggestions on click outside
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#detailGroup')) {
        document.getElementById('addrSuggestions').classList.remove('show');
      }
    });

    // Submit order
    function submitOrder() {
      if (!validateAll()) return;

      var method = config.payment[selectedPayment];
      var modal = document.getElementById('payModal');
      document.getElementById('payModalIcon').textContent = method.icon;
      document.getElementById('payModalTitle').textContent = '正在跳转' + method.name;
      document.getElementById('payModalDesc').textContent = '请在' + method.name + '中完成支付，支付成功后将自动返回';
      modal.classList.add('show');

      // Simulate jump
      setTimeout(function() {
        // In real app, would redirect to payment URL
        console.log('Jump to:', method.jumpUrl);
      }, 1000);
    }

    function closePayModal() {
      document.getElementById('payModal').classList.remove('show');
    }

    // Toast
    var toastTimer;
    function showToast(msg) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() {
        toast.classList.remove('show');
      }, 2000);
    }

    init();
  </script>
</body>
</html>
