<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>育苗苗生鲜 · 数字化经营管理系统（演示 Demo）</title>
<style>
:root{
  --pri:#2563eb;--pri-d:#1d4ed8;--ok:#16a34a;--warn:#e8890c;--danger:#e5484d;--purple:#7c3aed;
  --bg:#f4f6fa;--card:#ffffff;--line:#e6e9f0;--line2:#eef1f6;
  --t1:#1f2937;--t2:#4b5563;--t3:#8b95a6;
  --sh:0 1px 3px rgba(16,24,40,.05),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  font-size:13px;color:var(--t1);background:var(--bg);height:100dvh;overflow:hidden;
  -webkit-text-size-adjust:100%;
}
.phone-shell{display:contents}
.app{display:flex;width:100%;height:100dvh;overflow:hidden;background:var(--bg)}

/* ---------- Sidebar ---------- */
.sidebar{width:228px;flex:0 0 228px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line2);flex:0 0 auto}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#16a34a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto}
.brand b{font-size:14px;letter-spacing:.2px;display:block;line-height:1.2}
.brand small{color:var(--t3);font-size:10px}
.nav{flex:1;overflow-y:auto;padding:10px 8px 20px}
.nav-g{margin:10px 8px 6px;color:var(--t3);font-size:10.5px;font-weight:700;letter-spacing:.6px}
.nav-i{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;color:var(--t2);cursor:pointer;margin-bottom:2px;user-select:none;font-size:12.5px;line-height:1.3}
.nav-i:hover{background:#f5f7fb;color:var(--t1)}
.nav-i.on{background:#eaf1ff;color:var(--pri-d);font-weight:700}
.nav-i .ic{width:17px;text-align:center;color:var(--pri);font-size:13px;flex:0 0 auto}
.nav-i.on .ic{color:var(--pri-d)}
.side-foot{padding:10px 16px;border-top:1px solid var(--line2);color:var(--t3);font-size:10.5px;flex:0 0 auto}

/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:58px;flex:0 0 58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px}
.crumb{color:var(--t3);font-size:12px}
.crumb b{color:var(--t1);font-weight:600}
.crumb .sep{margin:0 7px;color:#cbd5e1}
.spacer{flex:1}
.demo-badge{background:#fff7ed;color:#b45309;border:1px solid #fed7aa;padding:5px 9px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap}
.tb-btn{border:1px solid var(--line);background:#fff;color:var(--t2);border-radius:8px;padding:6px 10px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.tb-btn:hover{border-color:#bfdbfe;color:var(--pri)}
.hamb{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:15px;cursor:pointer}
#view{flex:1;overflow:auto;padding:18px 20px 34px}

/* ---------- Page header ---------- */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin:0 0 16px}
.ph h1{font-size:18px;margin:0 0 4px;font-weight:750;letter-spacing:.2px}
.ph p{margin:0;color:var(--t3);font-size:11.5px;line-height:1.5}
.pain{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:999px;padding:5px 10px;font-size:10.5px;font-weight:700;white-space:nowrap}
.pain::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--danger)}
.pain.none{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
.pain.none::before{background:#94a3b8}

/* ---------- Grid & Card ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.sp-a{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.sp-b{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh);padding:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;min-width:0}
.card-h h3{margin:0;font-size:13px;font-weight:700}
.card-h .sub{color:var(--t3);font-size:10.5px;font-weight:400}
.tag{font-size:10px;padding:3px 7px;border-radius:6px;background:#eff6ff;color:var(--pri-d);font-weight:700;white-space:nowrap}
.tag.g{background:#f0fdf4;color:#15803d}.tag.o{background:#fffbeb;color:#b45309}.tag.r{background:#fef2f2;color:#b91c1c}.tag.p{background:#f5f3ff;color:#6d28d9}

/* ---------- KPI ---------- */
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh);padding:15px 16px;min-width:0}
.kpi .lb{color:var(--t3);font-size:11px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.kpi .lb i{width:6px;height:6px;border-radius:2px;display:inline-block}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.kpi .v.sm{font-size:19px}
.kpi .ft{margin-top:7px;font-size:10.5px;color:var(--t3)}
.kpi .ft b{color:var(--ok)}
.kpi .ft b.down{color:var(--danger)}

/* ---------- Table ---------- */
.tb-wrap{overflow-x:auto;width:100%}
.tb-wrap.nowrap table{white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
th{color:var(--t3);font-weight:600;font-size:11px;background:#fafbfd;position:sticky;top:0}
tbody tr:hover{background:#fafcff}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:800;background:#f8fafc;border-top:2px solid var(--line);border-bottom:none}
.pill{font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700}
.pill.g{background:#dcfce7;color:#15803d}.pill.o{background:#fef3c7;color:#b45309}.pill.r{background:#fee2e2;color:#b91c1c}.pill.b{background:#dbeafe;color:#1d4ed8}.pill.gray{background:#f1f5f9;color:#64748b}
.muted{color:var(--t3)}.strong{font-weight:700}
.pos{color:var(--danger);font-weight:700}.neg{color:var(--ok);font-weight:700}

/* ---------- Buttons / forms ---------- */
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--pri-d)}
.btn.ghost{background:#fff;color:var(--pri);border-color:#bfdbfe}
.btn.ghost:hover{background:#f5f9ff}
.btn.warn{background:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{color:var(--t2);font-size:11px;font-weight:600}
.field select,.field input{border:1px solid #d9dee8;border-radius:8px;padding:8px 9px;font-size:12px;color:var(--t1);background:#fff;width:100%;min-width:0;outline:none}
.field select:focus,.field input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.form-row{display:grid;gap:12px;align-items:end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:none;background:#fff;color:var(--t2);padding:7px 13px;font-size:11.5px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--pri);color:#fff}

.alert{border-radius:8px;padding:10px 12px;font-size:11.5px;line-height:1.5;margin-top:10px}
.alert-danger{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-weight:600}
.alert-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;font-weight:600}
.alert-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8}

.callout{background:linear-gradient(135deg,#f0f6ff,#f7fbff);border:1px solid #dbeafe;border-radius:10px;padding:13px 15px;font-size:11.5px;color:#1e40af;line-height:1.6}
.callout b{color:#1d4ed8}
.steps{display:flex;flex-direction:column;gap:9px}
.step{display:flex;gap:10px;align-items:center;border:1px solid var(--line2);border-radius:9px;padding:9px 10px;cursor:pointer;background:#fff}
.step:hover{border-color:#bfdbfe;background:#f9fbff}
.step .n{width:22px;height:22px;flex:0 0 22px;border-radius:7px;background:#eaf1ff;color:var(--pri-d);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
.step .tx{flex:1;min-width:0}
.step .tx b{display:block;font-size:11.5px}
.step .tx span{color:var(--t3);font-size:10.5px}
.step .ar{color:var(--pri);font-size:14px}

.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:8px;font-size:10.5px;color:var(--t2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.prog{height:6px;background:#eef1f6;border-radius:99px;overflow:hidden;min-width:80px}
.prog>i{display:block;height:100%;background:var(--pri);border-radius:99px}

/* ---------- Paper / chat ---------- */
.paper{background:#fffdf7;border:1px solid #e8e2cf;border-radius:8px;padding:14px;font-family:"Microsoft YaHei",sans-serif;box-shadow:inset 0 0 0 4px #fffdf7,0 1px 2px rgba(0,0,0,.04)}
.paper h4{margin:0 0 4px;text-align:center;font-size:13px;letter-spacing:2px}
.paper .meta{text-align:center;color:#8b8371;font-size:10px;margin-bottom:10px}
.paper .pl{border-top:1px dashed #d8d0b8;padding:6px 0;display:flex;justify-content:space-between;font-size:11.5px}
.paper .pl b{font-weight:700}
.chat{display:flex;flex-direction:column;gap:9px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg .av{width:26px;height:26px;border-radius:7px;background:#e2e8f0;color:#475569;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:0 0 auto}
.msg .bd{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11.5px;line-height:1.5;max-width:100%}
.msg .tm{color:var(--t3);font-size:10px;margin-top:2px}
.file{display:inline-flex;align-items:center;gap:6px;border:1px solid #dbeafe;background:#f5f9ff;color:#1d4ed8;border-radius:6px;padding:4px 8px;font-size:10.5px;margin:3px 5px 0 0}

/* ---------- Drawer (order detail) ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:540px;max-width:100%;background:#fff;box-shadow:-10px 0 40px rgba(15,23,42,.18);z-index:45;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column}
body.drawer-open .drawer{transform:translateX(0)}
body.drawer-open .mask{display:block}
.drawer-h{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.drawer-h .x{margin-left:auto;border:none;background:#f1f5f9;color:var(--t2);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12px}
.drawer-b{flex:1;overflow:auto;padding:16px 18px 28px}
.d-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-bottom:8px;font-size:11.5px}
.d-meta div{display:flex;gap:8px;min-width:0}
.d-meta span{color:var(--t3);flex:0 0 auto}
.d-meta b{font-weight:700}
.drawer-b h4{font-size:12px;margin:16px 0 8px}
body.compact .drawer{width:100%}

/* ---------- Toast / mask / phone ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:#111827;color:#fff;padding:10px 16px;border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transition:.22s;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:30}
.phone-top{display:none;position:absolute;top:0;left:0;right:0;height:46px;background:#fff;border-bottom:1px solid var(--line);align-items:center;padding:0 12px;gap:8px;z-index:35;font-size:12px;font-weight:700}
.phone-top .btn{margin-left:auto;padding:5px 10px;font-size:11px}

/* ---------- Compact (phones & preview box) ---------- */
body.compact .hamb{display:block}
body.compact .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;width:264px;transform:translateX(-102%);transition:transform .24s ease;box-shadow:8px 0 30px rgba(15,23,42,.12)}
body.compact.nav-open .sidebar{transform:translateX(0)}
body.compact.nav-open .mask{display:block}
body.compact .demo-badge{font-size:9.5px;padding:4px 7px}
body.compact .tb-btn.hide-c{display:none}
body.compact #view{padding:14px 12px 30px}
body.compact .ph{flex-direction:column;gap:8px}
body.compact .pain{align-self:flex-start}
body.compact .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
body.compact .g3,body.compact .g2{grid-template-columns:minmax(0,1fr)}
body.compact .sp-a,body.compact .sp-b{grid-template-columns:minmax(0,1fr)}
body.compact .grid>*,body.compact .g2>*,body.compact .g3>*,body.compact .g4>*{min-width:0}
body.compact .card,body.compact .kpi{min-width:0;max-width:100%}
body.compact .card-h>*{min-width:0}
body.compact .bar-track{min-width:0}
body.compact .field input,body.compact .field select{min-width:0;max-width:100%}
body.compact .kpi .v{font-size:20px}
body.compact .kpi .v.sm{font-size:18px}
body.compact .tb-wrap{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
body.compact .tb-wrap table{white-space:nowrap;min-width:max-content}
body.compact .tb-wrap th,body.compact .tb-wrap td{white-space:nowrap}
body.compact .form-row{grid-template-columns:repeat(2,minmax(0,1fr))!important}
body.compact .form-row .span-all{grid-column:1/-1}
body.compact .lb-m{display:inline}
.lb-m{display:none;color:var(--t3);font-size:10px;margin-right:4px}
body.compact .seg{width:100%}
body.compact .seg button{flex:1}
body.compact .chart{min-width:0}

/* Phone preview frame on desktop */
body.phone-mode .phone-shell{display:block;position:relative;margin:0 auto;width:412px;height:840px;max-height:100dvh;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 20px 60px rgba(15,23,42,.28);transform:translateZ(0)}
body.phone-mode{background:#e2e8f0}
body.phone-mode .app{width:412px;height:840px;max-height:100dvh;border-radius:26px}
body.phone-mode .phone-top{display:flex}
body.phone-mode #view{padding-top:60px}
body.phone-mode .brand,body.phone-mode .topbar{display:none}
body.phone-mode .main{padding-top:0}
body.phone-mode .mask,body.phone-mode .sidebar,body.phone-mode #toast,body.phone-mode .drawer{position:absolute}
body.phone-mode .sidebar{top:0}
body.phone-mode .phone-top~.main .demo-badge{display:none}
body:not(.phone-mode) .phone-top{display:none}
@media (max-width:820px){body:not(.phone-mode) .phone-shell{display:contents}}
</style>
</head>
<body>
<div class="phone-shell">
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">苗</div>
      <div><b>育苗苗生鲜</b><small>数字化经营管理系统</small></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="side-foot">演示系统 · 数据均为仿真构造</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="hamb" data-act="toggleNav">☰</button>

  <div class="phone-top"><span>育苗苗生鲜 · 手机版演示</span><button class="btn ghost" data-act="togglePhone">退出预览</button></div>
  <div id="toast"></div>
</div>
</div>

const PRICE_VOL={'蔬菜':0.085,'水果':0.075,'肉类':0.11,'海鲜':0.10,'冻品':0.015,'调料':0.008};
const WEEK_LABELS=['09/15','09/22','09/29','10/06','10/13','10/20','10/27','11/03'];
function priceSeries(p,grain){
  const day=grain==='day',n=day?14:8;
  const amp=PRICE_VOL[p.cat]||0.03;
  const seed=p.name.length*0.73+(p.cat==='蔬菜'?1.2:0.5);
  const raw=[];
  for(let i=0;i<n;i++){
    raw.push(p.cost*(1+amp*Math.sin(i*0.9+seed)+amp*0.45*Math.cos(i*1.7+seed)));
  }
  const k=p.cost/raw[n-1];
  const values=raw.map((v,i)=>+(v*k).toFixed(2));
  const labels=day?DB.trendLabels.slice(-n):WEEK_LABELS.slice(-n);
  return {labels,values};
}

const SPEC_KG={'1kg/份':1,'500g/份':0.5,'5kg/箱':5,'2kg/袋':2,'20袋/箱':1,'1条/份':1};
function orderLines(o){
  const lines=[];let used=0;
  const kind=o.s.indexOf('幼儿园')>=0?'K':'P';
  for(let i=0;i<DB.products.length&&i<6;i++){
    const p=DB.products[i];
    const per=SPEC_KG[p.spec]||1;
    const qty=6+((i*5+o.items)%13);
    const kg=Math.round(qty*per*10)/10;
    const up=kind==='K'?p.priceK:p.priceP;
    const amt=Math.round(kg*up*100)/100;
    if(used+amt>o.amt*0.82)continue;
    const wt=(p.unit==='袋'?qty*20:kg)+' '+p.unit;
    lines.push({name:p.name,spec:p.spec,qty:qty,weight:wt,price:price2(up),amt:price2(amt)});
    used+=amt;
  }
  const rest=Math.round((o.amt-used)*100)/100;
  lines.push({name:'其他品类（合并）',spec:'—',qty:'—',weight:'—',price:'—',amt:price2(rest)});
  return lines;
}
function orderPay(o){
  const rate={'已完成':1,'配送中':0.6,'已分拣':0.3,'待分拣':0}[o.st]||0;

  return {payable:o.amt,paid,unpaid:o.amt-paid};
}

/* ---------- charts (hand-written SVG, no external libs) ---------- */
function lineChart(data,labels,opt){
  opt=opt||{};
  const w=640,h=210,pl=46,pr=14,pt=14,pb=30;
  const yfmt=opt.yfmt||(v=>(v/10).toFixed(0)+'k');
  const lastText=opt.lastText||('¥'+(data[data.length-1]/10).toFixed(1)+'万');
  const color=opt.color||'#2563eb';
  const max=Math.max(...data)*1.12,min=Math.min(...data)*0.86;
  const X=i=>pl+i*(w-pl-pr)/(data.length-1);
  const Y=v=>pt+(h-pt-pb)*(1-(v-min)/(max-min));
  const pts=data.map((v,i)=>[X(i),Y(v)]);
  const poly=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1));
  const areaStr=X(0).toFixed(1)+','+(h-pb)+' '+area.join(' ')+' '+X(data.length-1).toFixed(1)+','+(h-pb);
  let grid='';
  for(let k=0;k<4;k++){
    const v=min+(max-min)*k/3,y=Y(v);
    grid+=`<line x1="${pl}" y1="${y.toFixed(1)}" x2="${w-pr}" y2="${y.toFixed(1)}" stroke="#eef1f6"/>`;
    grid+=`<text x="${pl-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#8b95a6">${yfmt(v)}</text>`;
  }
  let xlab='';
  data.forEach((_,i)=>{if(i%2===0||i===data.length-1)xlab+=`<text x="${X(i).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="9.5" fill="#8b95a6">${labels[i]}</text>`;});
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===data.length-1?4:2.4}" fill="${color}" stroke="#fff" stroke-width="${i===data.length-1?2:1}"/>`).join('');
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<polygon points="${areaStr}" fill="url(#lg)"/>
    <polyline points="${poly}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xlab}
    <text x="${last[0].toFixed(1)-6}" y="${(last[1]-10).toFixed(1)}" text-anchor="end" font-size="10.5" font-weight="700" fill="${color}">${lastText}</text>
  </svg>`;
}
function donutChart(items){
  const cx=104,cy=100,r=66,sw=22,c=2*Math.PI*r,total=items.reduce((s,i)=>s+i.value,0);
  let off=0,segs='';
  items.forEach(it=>{
    const frac=it.value/total,d=c*frac;
    segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${sw}" stroke-dasharray="${d.toFixed(2)} ${(c-d).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=d;
  });
  let leg='';
  items.forEach((it,i)=>{
    const y=52+i*30;
    leg+=`<rect x="208" y="${y-9}" width="10" height="10" rx="2" fill="${it.color}"/>`;
    leg+=`<text x="225" y="${y}" font-size="11" fill="#4b5563">${it.label}</text>`;
    leg+=`<text x="378" y="${y}" font-size="11" font-weight="700" text-anchor="end" fill="#1f2937">${(it.value/total*100).toFixed(1)}%</text>`;
  });
  return `<svg class="chart" viewBox="0 0 388 200" xmlns="http://www.w3.org/2000/svg">
    ${segs}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="17" font-weight="800" fill="#1f2937">${items.length} 类</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="10" fill="#8b95a6">客户结构</text>
    ${leg}
  </svg>`;
}
function barChart(items){
  const w=620,rowH=36,h=items.length*rowH+12,labelW=54;
  const max=Math.max(...items.map(i=>i.value));
  let out='';
  items.forEach((it,i)=>{
    const y=i*rowH+8,bw=(w-labelW-70)*(it.value/max);
    out+=`<text x="0" y="${y+14}" font-size="11" fill="#4b5563">${it.label}</text>`;
    out+=`<rect x="${labelW}" y="${y+3}" width="${w-labelW-70}" height="15" rx="4" fill="#f1f4f9"/>`;
    out+=`<rect x="${labelW}" y="${y+3}" width="${bw.toFixed(1)}" height="15" rx="4" fill="${it.color}"/>`;
    out+=`<text x="${w}" y="${y+15}" text-anchor="end" font-size="11" font-weight="700" fill="#1f2937">${it.value}%</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
}

/* ---------- helpers ---------- */
function head(title,desc,pain){return `<div class="ph"><div><h1>${title}</h1><p>${desc}</p></div>${pain?`<span class="pain">解决痛点：${pain}</span>`:'<span class="pain none">基础业务模块</span>'}</div>`;}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400);}
function tbl(headers,rows,tfoot){return `<div class="tb-wrap nowrap"><table><thead><tr>${headers.map((x,i)=>`<th class="${typeof x==='object'&&x.num?'num':''}">${typeof x==='object'?x.t:x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody>${tfoot?`<tfoot><tr>${tfoot.map((x,i)=>`<td class="${typeof x==='object'&&x.num?'num':''}">${typeof x==='object'?x.t:x}</td>`).join('')}</tr></tfoot>`:''}</table></div>`;}

let priceType='中小学';
function recalcPrice(){
  const p=DB.products.find(x=>x.name===$('#fProduct').value);
  if(!p)return;
  const qty=Math.max(0,+$('#fQty').value||0);
  const base=priceType==='中小学'?p.priceP:p.priceK;
  const disc=priceType==='中小学'?DISCOUNT.primary:DISCOUNT.kindergarten;
  const auto=+(base*disc).toFixed(2);
  let pv=$('#fPrice').value;
  if(pv===''||+$('#fPrice').dataset.auto==='1'){pv=auto;$('#fPrice').value=auto;}
  const unit=+pv||0;
  const sales=unit*qty,cost=p.cost*qty,gross=sales-cost,rate=sales?gross/sales*100:0;
  const bad=unit<p.cost;
  $('#priceResult').innerHTML=`
    <div class="grid g4" style="margin-top:14px">
      <div class="kpi"><div class="lb">协议价 / 折扣</div><div class="v sm">¥${base.toFixed(2)} <span style="font-size:12px;color:var(--t3)">×${disc}</span></div><div class="ft">${priceType}价</div></div>
      <div class="kpi"><div class="lb">实际单价</div><div class="v sm">¥${unit.toFixed(2)}</div><div class="ft">采购成本 ¥${p.cost.toFixed(2)}</div></div>
      <div class="kpi"><div class="lb">销售额</div><div class="v sm">${money(sales)}</div><div class="ft">数量 ${qty} ${p.unit}</div></div>
      <div class="kpi"><div class="lb">毛利 / 毛利率</div><div class="v sm ${bad?'pos':'neg'}">${money(gross)} / ${rate.toFixed(1)}%</div><div class="ft">${bad?'已触发亏损':'正常'}</div></div>
    </div>
    ${bad?`<div class="alert alert-danger">价格异常预警：售价 ¥${unit.toFixed(2)} 低于采购成本 ¥${p.cost.toFixed(2)}，本单预计亏损 <b>${money(-gross)}</b>，禁止保存发货。</div>`:'<div class="alert alert-ok">价格校验通过，毛利率正常，可保存。</div>'}`;
  const sb=$('#savePrice');if(sb)sb.disabled=bad;
}

R.reports=()=>{

  const list=repDim==='school'
    ? DB.schools.filter(s=>repSchool==='all'||s.n===repSchool).map(s=>({label:s.n,sales:s.m,cr:0.70}))
    : DB.products.map(p=>({label:p.name,sales:D.monthSales/DB.products.length,cr:p.cost/p.priceP}));

    rows.push(`<tr><td class="strong">${it.label}</td><td class="num">${money(sales)}</td><td class="num">${money(cost)}</td><td class="num neg">${money(gross)}</td><td class="num">${(gross/sales*100).toFixed(1)}%</td><td class="num">${money(net)}</td></tr>`);
  });
  return head('经营分析报表','按学校 / 商品多维度统计采购价、销售价、单品毛利与净利润；支持每日 / 2-3 天 / 周颗粒度','#4 经营数据无法及时获取')
  +`<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>筛选条件</h3><button class="btn" data-act="genReport">生成报表</button></div>
     <div class="form-row" style="grid-template-columns:1fr 1fr 2fr">
       <div class="field"><label>统计维度</label><div class="seg"><button data-act="repDim" data-v="school" class="${repDim==='school'?'on':''}">按学校</button><button data-act="repDim" data-v="product" class="${repDim==='product'?'on':''}">按商品</button></div></div>
       <div class="field"><label>输出颗粒度</label><div class="seg">${grains.map(g=>`<button data-act="repGrain" data-v="${g[0]}" class="${repGrain===g[0]?'on':''}">${g[1]}</button>`).join('')}</div></div>
       <div class="field"><label>学校</label><select id="repSchool" data-act="repSchoolChange">${schoolOpts}</select></div>
     </div>
   </div>
   <div class="grid g4" style="margin-bottom:14px">
     <div class="kpi"><div class="lb">销售额</div><div class="v sm">${money(totalSales)}</div><div class="ft">统计维度：${repDim==='school'?'按学校':'按商品'}</div></div>
     <div class="kpi"><div class="lb">采购成本</div><div class="v sm">${money(totalCost)}</div><div class="ft">成本率 ${(totalCost/totalSales*100).toFixed(1)}%</div></div>
     <div class="kpi"><div class="lb">毛利</div><div class="v sm neg">${money(totalGross)}</div><div class="ft">毛利率 ${(totalGross/totalSales*100).toFixed(1)}%</div></div>
     <div class="kpi"><div class="lb">净利润（估）</div><div class="v sm">${money(totalNet)}</div><div class="ft">净利率 ${(totalNet/totalSales*100).toFixed(1)}%</div></div>
   </div>
   <div class="card"><div class="card-h"><h3>${repDim==='school'?'各学校':'各商品'}经营明细</h3><span class="tag p">颗粒度：${grains.find(g=>g[0]===repGrain)[1]}</span></div>
    ${tbl([repDim==='school'?'学校':'商品',{t:'销售额',num:true},{t:'采购成本',num:true},{t:'毛利',num:true},'毛利率',{t:'净利润',num:true}],rows,
      [{t:'合计'},{t:money(totalSales),num:true},{t:money(totalCost),num:true},{t:money(totalGross),num:true},{t:(totalGross/totalSales*100).toFixed(1)+'%'},{t:money(totalNet),num:true}])}
   </div>`;
};

  +`<div class="grid sp-a">
     <div class="card"><div class="card-h"><h3>品牌自定义（现场演示）</h3><span class="tag g">实时生效</span></div>

         <div style="display:flex;align-items:center;gap:10px"><div class="logo">苗</div><div><b id="brandPreview" style="font-size:14px">育苗苗生鲜管理系统</b><small style="display:block;color:var(--t3)">登录页 / 系统标题预览</small></div></div>
       </div>
       <div class="callout" style="margin-top:12px">输入任意名称即可预览<b>自定义软件名称</b>，私有化版本可同步替换 Logo 与登录页。</div>
     </div>
     <div class="card"><div class="card-h"><h3>替换旧系统 · 能力清单</h3><span class="tag b">对比蔬东坡</span></div>

         ['系统体验 / 培训服务','体验差、培训不到位','简洁易用 + 现场培训'],
         ['AI 单据 / 食安识别','无','拍照识别 + 群文件抓取'],
         ['价格异常预警','无','负毛利即时拦截'],
         ['经营毛利报表','取数慢','按学校/商品实时多维'],
         ['私有化 / 源码','不支持','私有部署 + 源码交付 + 二开'],
         ['现有系统对接','—','可对接蔬东坡 API 平滑过渡']
       ].map(r=>`<tr><td class="strong">${r[0]}</td><td><span class="pill r">${r[1]}</span></td><td><span class="pill g">${r[2]}</span></td></tr>`))}
       <div class="alert alert-ok">服务到期前可平滑替换：先对接现有 API 同步数据，再逐步切换至私有化系统。</div>

/* ======================= ROUTER ======================= */
function renderNav(){
  $('#nav').innerHTML=NAV.map(g=>`<div class="nav-g">${g.g}</div>`+g.items.map(([id,ic,name])=>`<div class="nav-i ${id===current?'on':''}" data-go="${id}"><span class="ic">${ic}</span><span>${name}</span></div>`).join('')).join('');
}
function go(id){
  if(!R[id])return;
  current=id;
  $('#crumbCur').textContent=PAGE_META[id]||id;
  $('#view').innerHTML=R[id]();
  renderNav();
  $('#view').scrollTop=0;
  toggleNav(false);
  closeDrawer();
  if(id==='agreement')recalcPrice();
}
function closeDrawer(){document.body.classList.remove('drawer-open');}
function toggleNav(on){document.body.classList.toggle('nav-open',!!on);}
function togglePhone(){document.body.classList.toggle('phone-mode');document.body.classList.add('compact');toast(document.body.classList.contains('phone-mode')?'已进入手机预览':'已退出手机预览');}

/* ======================= EVENTS ======================= */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){go(g.dataset.go);return;}
  const b=e.target.closest('[data-act]');
  if(!b)return;
  const a=b.dataset.act;
  switch(a){
    case 'toggleNav':toggleNav(!document.body.classList.contains('nav-open'));break;
    case 'closeNav':toggleNav(false);closeDrawer();break;
    case 'togglePhone':togglePhone();break;
    case 'viewOrder':openOrder(b.dataset.id);break;
    case 'closeDrawer':closeDrawer();break;
    case 'orderTab':orderTab=b.dataset.v;go('orders');break;
    case 'purTab':purchaseTab=b.dataset.v;go('purchase');break;
    case 'priceGrain':priceGrain=b.dataset.v;go('products');break;
    case 'priceProdChange':priceProd=$('#priceProd').value;go('products');break;
    case 'aiScan':aiDone=true;go('aiEntry');toast('AI 识别完成，已提取 4 行单据数据（含生产日期与保质期）');break;
    case 'aiConfirm':toast('已确认入库 4 行，单据同步完成');break;
    case 'foodGrab':foodDone=true;go('foodSafety');toast('已抓取 5 份食安资料并推送 IoT 打印机');break;
    case 'doTransfer':doTransfer();break;
    case 'tProdChange':{const p=DB.products.find(x=>x.name===$('#tProduct').value);$('#tAvail').value=p.stock+' '+p.unit;}
      break;
    case 'setType':priceType=b.dataset.v;$('#fPrice').dataset.auto='1';go('agreement');break;
    case 'priceChange':$('#fPrice').dataset.auto='1';recalcPrice();break;
    case 'priceInput':$('#fPrice').dataset.auto='0';recalcPrice();break;
    case 'savePrice':toast('价格已保存，协议价已更新');break;
    case 'recTab':recTab=b.dataset.v;go('reconcile');break;
    case 'repDim':repDim=b.dataset.v;go('reports');break;
    case 'repGrain':repGrain=b.dataset.v;go('reports');break;
    case 'repSchoolChange':repSchool=$('#repSchool').value;go('reports');break;
    case 'genReport':toast('报表已生成，可按日 / 2-3 天 / 周导出');break;
    case 'brandInput':$('#brandPreview').textContent=$('#brandName').value||'未命名系统';break;
  }
});
function doTransfer(){
  const p=DB.products.find(x=>x.name===$('#tProduct').value);
  const qty=+$('#tQty').value||0;
  const msg=$('#tMsg');
  if(qty>p.stock){
    msg.className='alert alert-danger';
    msg.innerHTML=`⛔ 超出可用库存，无法提交：${p.name} 当前可用 ${p.stock} ${p.unit}，本次调拨 ${qty} ${p.unit}。`;
    toast('调拨被拦截：超出可用库存');
  }else if(qty<=0){
    msg.className='alert alert-danger';msg.textContent='调拨数量必须大于 0。';
  }else{
    msg.className='alert alert-ok';
    msg.innerHTML=`✓ 校验通过：${p.name} 调拨 ${qty} ${p.unit}，提交成功（剩余 ${p.stock-qty} ${p.unit}）。`;
    toast('调拨单提交成功');
  }
}
/* responsive */
const NARROW=window.matchMedia('(max-width:820px)');
function syncCompact(){
  const phone=document.body.classList.contains('phone-mode');
  document.body.classList.toggle('compact',phone||NARROW.matches);
}
NARROW.addEventListener('change',syncCompact);
window.addEventListener('resize',syncCompact);
syncCompact();
go('dash');
</script>
