<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>宠安宠物医院 · 后台管理系统</title>
<style>
:root{
  --bg:#F2FAF5;
  --card:#FFFFFF;
  --border:#E4F1E8;
  --primary:#4FAF7A;
  --primary-dark:#3F9B6A;
  --deep:#1F6B4A;
  --tag:#E7F6EE;
  --text:#1F2D27;
  --muted:#7A8F84;
  --head:#F6FBF8;
  --green:#3E9C68;
  --orange:#D98A2B;
  --red:#D2554E;
  --gray:#8FA39A;
  --shadow:0 1px 2px rgba(31,107,74,.04),0 6px 18px rgba(31,107,74,.055);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  background:var(--bg);color:var(--text);font-size:13px;line-height:1.55;
  min-width:1180px;overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#CFE6D8;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶栏 ---------- */
.app{height:100vh;display:flex;flex-direction:column;min-width:1180px}
.topbar{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 0 rgba(31,107,74,.03);z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5FBB88,#2F8A5B);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 10px rgba(47,138,91,.25)}
.brand-text{display:flex;align-items:baseline;gap:8px}
.brand-text strong{font-size:16px;color:var(--deep);letter-spacing:.6px}
.brand-text span{font-size:12px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:14px}
.today{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.global-search{width:210px;height:34px;border:1px solid var(--border);background:var(--head);border-radius:9px;padding:0 12px;outline:none;transition:.15s}
.global-search:focus{border-color:#A9D8BC;background:#fff;box-shadow:0 0 0 3px rgba(79,175,122,.12)}
.mini-link{color:var(--deep);background:var(--tag);padding:7px 12px;border-radius:8px;font-size:12px;font-weight:500;white-space:nowrap}
.mini-link:hover{background:#D9F0E3}
.doctor{display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--tag);color:var(--deep);display:flex;align-items:center;justify-content:center;font-weight:700;border:1px solid #D5EEDF}
.doctor-meta{display:flex;flex-direction:column;line-height:1.25}
.doctor-meta strong{font-size:12.5px}
.doctor-meta span{font-size:11px;color:var(--muted)}
.logout{color:var(--muted);font-size:12px;padding:6px 8px;border-radius:6px}
.logout:hover{color:var(--red);background:#FDF1F0}

/* ---------- 主体 ---------- */
.workspace{flex:1;display:flex;min-height:0}
.sidebar{width:224px;flex:none;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px 12px}
.nav-title{font-size:11px;color:var(--muted);padding:0 10px 10px;letter-spacing:1.2px}
#nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#3D5248;text-align:left;font-size:13.5px;transition:.15s;position:relative}
.nav-item .ico{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:#6D8A7B;flex:none}
.nav-item:hover{background:#F4FBF7}
.nav-item.active{background:var(--tag);color:var(--deep);font-weight:600;box-shadow:inset 3px 0 0 var(--primary)}
.nav-item.active .ico{color:var(--deep)}
.nav-item .nm{flex:1;white-space:nowrap}
.nav-badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;font-weight:600}
.side-foot{border-top:1px solid var(--border);padding:12px 10px 2px;color:var(--muted);font-size:11px;line-height:1.8;flex:none}
.side-foot b{color:var(--deep);font-weight:600}
.side-reset{display:inline-block;margin-top:7px;font-size:11px;color:#B9403A;background:#FCEFEE;padding:4px 10px;border-radius:7px}
.side-reset:hover{background:#F9E1DE}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.page-head{padding:18px 24px 12px;flex:none}
.crumb{font-size:12px;color:var(--muted);margin-bottom:5px}
.crumb b{color:var(--deep);font-weight:600}
.head-row{display:flex;align-items:center;gap:14px}
.head-row h1{font-size:20px;color:var(--deep);letter-spacing:.6px;margin:0;font-weight:700}
.head-desc{font-size:12px;color:var(--muted)}
.head-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{flex:1;overflow:auto;padding:4px 24px 32px}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--border);background:#fff}
.card-head h3{font-size:14px;color:var(--deep);margin:0;font-weight:600;display:flex;align-items:center;gap:7px}
.card-head h3 em{font-style:normal;font-size:11px;color:var(--muted);font-weight:400}
.card-body{padding:14px 18px}
.card-body.tight{padding:6px 18px 10px}
.more-link{font-size:12px;color:var(--primary);cursor:pointer}
.more-link:hover{color:var(--deep);text-decoration:underline}

.btn{height:34px;padding:0 16px;border-radius:8px;border:1px solid var(--border);background:#fff;color:#42574C;font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{background:#F4FBF7;border-color:#CFE7D8}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(79,175,122,.22)}
.btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn.danger{color:#B9403A;border-color:#F3D9D7;background:#FDF5F4}
.btn.danger:hover{background:#FCE9E7}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.filterbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.fi{height:34px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:0 10px;outline:none;color:var(--text);transition:.15s}
.fi:focus{border-color:#9FD4B4;box-shadow:0 0 0 3px rgba(79,175,122,.12)}
select.fi{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7A8F84 50%),linear-gradient(135deg,#7A8F84 50%,transparent 50%);background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:26px}
.filter-spacer{margin-left:auto}
.filter-hint{font-size:12px;color:var(--muted)}

.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:var(--head);color:#42574C;font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12.5px}
.tbl td{padding:9px 12px;border-bottom:1px solid #F0F8F3;color:#334940;vertical-align:middle}
.tbl tbody tr:nth-child(even){background:#FCFEFD}
.tbl tbody tr:hover{background:#F4FBF7}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{font-variant-numeric:tabular-nums}
.tbl .id{font-family:"SFMono-Regular",Consolas,monospace;font-size:11.5px;color:#5E7A6C}
.tbl .empty{text-align:center;color:var(--muted);padding:36px 0}
.tbl .strong{font-weight:600;color:var(--deep)}
.tbl .muted{color:var(--muted)}
.op{color:var(--deep);font-size:12px;padding:3px 8px;border-radius:6px;background:#EFF9F3;margin-right:6px;white-space:nowrap;display:inline-block}
.op:hover{background:#DFF2E7}
.op.danger{color:#B9403A;background:#FCEFEE}
.op.danger:hover{background:#F9E1DE}
.op.ghost{background:#F3F7F5;color:#5E7A6C}
.op:last-child{margin-right:0}
.ops{white-space:nowrap}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;line-height:1.7;white-space:nowrap;font-weight:500}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.75}
.badge.green{background:#E7F6EE;color:#2F8A5B}
.badge.orange{background:#FDF2E3;color:#B4741B}
.badge.red{background:#FCE9E8;color:#B9403A}
.badge.gray{background:#EFF3F1;color:#6E8178}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--tag);color:var(--deep);font-size:11.5px}

.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--border);background:#fff}
.pg-total{font-size:12px;color:var(--muted)}
.pg-btns{display:flex;gap:6px;align-items:center}
.pg{min-width:28px;height:28px;padding:0 8px;border-radius:7px;border:1px solid var(--border);background:#fff;font-size:12px;color:#42574C}
.pg:hover{background:#F4FBF7}
.pg.on{background:var(--primary);border-color:var(--primary);color:#fff}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:14px}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .label{font-size:12px;color:var(--muted)}
.kpi .val{font-size:21px;font-weight:700;color:var(--deep);margin:5px 0 1px;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.kpi .val small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .sub{font-size:11px;color:var(--muted)}
.kpi .sub.warn{color:var(--orange)}
.kpi .sub.bad{color:var(--red)}
.kpi .kicon{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:9px;background:var(--tag);display:flex;align-items:center;justify-content:center;color:var(--primary)}

.chart{display:flex;align-items:flex-end;gap:8px;height:176px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.chart .bar{width:100%;max-width:26px;background:linear-gradient(180deg,#8ED1AC,#4FAF7A);border-radius:5px 5px 0 0;transition:.2s;cursor:default}
.chart .bar:hover{filter:brightness(1.06)}
.chart .bar.min{background:linear-gradient(180deg,#D8EEE1,#B9DFC9)}
.chart .x{font-size:10px;color:var(--muted);white-space:nowrap;transform:scale(.95)}

.prog{margin-bottom:13px}
.prog:last-child{margin-bottom:0}
.prog-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:#42574C}
.prog-top b{font-weight:600;color:var(--deep);font-variant-numeric:tabular-nums}
.prog-bar{height:8px;border-radius:5px;background:#EDF7F1;overflow:hidden}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,#4FAF7A,#83C9A2);border-radius:5px}

.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px}
.cols.even{grid-template-columns:1fr 1fr}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #EDF6F0;cursor:pointer}
.list-row:last-child{border-bottom:0}
.list-row:hover{background:#FAFEFC}
.list-row .time{font-variant-numeric:tabular-nums;color:var(--deep);font-weight:600;width:44px;font-size:12px;flex:none}
.lr-main{flex:1;min-width:0;overflow:hidden}
.lr-main strong{display:block;font-size:13px;color:#2C4338;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-main span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lr-doctor{font-size:11.5px;color:var(--muted);flex:none}
.lr-amount{font-weight:600;color:var(--deep);font-variant-numeric:tabular-nums;font-size:12.5px;flex:none}

.quickbar{display:flex;gap:10px;flex-wrap:wrap}
.quick{flex:1;min-width:120px;height:62px;border:1px dashed #CFE7D8;border-radius:12px;background:#FBFEFC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--deep);font-size:12.5px;transition:.15s}
.quick:hover{background:var(--tag);border-color:var(--primary);transform:translateY(-1px)}
.quick em{font-style:normal;font-size:18px;line-height:1}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;background:#fff;border-radius:12px 12px 0 0;padding:8px 8px 0}
.tab{padding:9px 18px;font-size:13px;color:#5E7A6C;border-radius:9px 9px 0 0;position:relative;top:1px;border-bottom:2px solid transparent}
.tab:hover{background:#F7FCF9;color:var(--deep)}
.tab.active{color:var(--deep);font-weight:600;border-bottom-color:var(--primary);background:#fff}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{height:34px;border:1px solid var(--border);border-radius:8px;padding:0 10px;outline:none;background:#fff;transition:.15s;width:100%}
.field textarea{height:auto;min-height:72px;padding:8px 10px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#9FD4B4;box-shadow:0 0 0 3px rgba(79,175,122,.12)}
.field.full{grid-column:1 / -1}
.hint{font-size:11.5px;color:var(--muted)}

/* ---------- 弹窗 / Toast ---------- */
.mask{position:fixed;inset:0;background:rgba(24,48,36,.34);backdrop-filter:blur(1.5px);display:none;align-items:center;justify-content:center;z-index:120}
.mask.show{display:flex}
.modal{background:#fff;border-radius:16px;width:560px;max-width:92vw;max-height:84vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(20,50,35,.22);animation:pop .16s ease-out}
.modal.wide{width:760px}
.modal.narrow{width:420px}
@keyframes pop{from{transform:translateY(8px) scale(.985);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:15.5px;margin:0;color:var(--deep)}
.modal-close{width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:16px;line-height:1}
.modal-close:hover{background:#F1F8F4;color:var(--deep)}
.modal-body{padding:18px 20px;overflow:auto;flex:1}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:#FBFEFC}

#toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#1F6B4A;color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;box-shadow:0 8px 20px rgba(20,60,40,.2);animation:tin .2s ease-out;max-width:320px}
.toast.warn{background:#B4741B}
.toast.info{background:#3E6E8E}
@keyframes tin{from{transform:translateX(12px);opacity:0}to{transform:none;opacity:1}}

/* ---------- 会员卡 ---------- */
.mcard{background:linear-gradient(135deg,#1F6B4A,#4FAF7A 60%,#7FCBA3);border-radius:14px;color:#fff;padding:16px 18px;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(31,107,74,.22)}
.mcard::after{content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.mcard .row{display:flex;justify-content:space-between;align-items:flex-start}
.mcard .lv{font-size:12px;background:rgba(255,255,255,.2);padding:2px 9px;border-radius:999px}
.mcard .no{font-family:Consolas,monospace;font-size:12px;opacity:.85;letter-spacing:1px;margin-top:2px}
.mcard .bal{font-size:24px;font-weight:700;margin:12px 0 2px;font-variant-numeric:tabular-nums}
.mcard .foot{display:flex;gap:18px;font-size:11.5px;opacity:.9;margin-top:8px}
.mini-title{font-size:12.5px;color:var(--deep);font-weight:600;margin:16px 0 8px;padding-left:8px;border-left:3px solid var(--primary)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kv .item{background:#F8FCFA;border:1px solid #EAF5EE;border-radius:9px;padding:8px 10px}
.kv .item span{display:block;font-size:11px;color:var(--muted)}
.kv .item strong{font-size:13px;color:var(--deep);font-weight:600}

/* ---------- 聊天 ---------- */
.chat-layout{display:grid;grid-template-columns:320px 1fr;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff;box-shadow:var(--shadow);height:calc(100vh - 210px);min-height:540px}
.chat-left{display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0}
.chat-left-head{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--deep);display:flex;justify-content:space-between;align-items:center}
.chat-list{overflow-y:auto;flex:1}
.chat-item{padding:12px 16px;border-bottom:1px solid #F2F8F4;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.chat-item:hover{background:#FAFEFC}
.chat-item.active{background:var(--tag)}
.chat-item .cav{width:34px;height:34px;border-radius:50%;background:#EAF6EF;color:var(--deep);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.chat-item .cmeta{flex:1;min-width:0}
.chat-item .cmeta strong{font-size:12.5px;display:block}
.chat-item .cmeta p{margin:2px 0 4px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .ctime{font-size:10.5px;color:var(--muted);text-align:right;flex:none;line-height:1.4}
.chat-item .unread{display:inline-flex;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;align-items:center;justify-content:center;margin-top:3px}
.chat-main{display:flex;flex-direction:column;min-width:0}
.chat-head{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.chat-head .doctor-line strong{font-size:13.5px;color:var(--deep)}
.chat-head .doctor-line span{font-size:11.5px;color:var(--muted);margin-left:6px}
.chat-head .no{font-family:Consolas,monospace;font-size:11.5px;color:var(--muted)}
.chat-body{flex:1;overflow-y:auto;padding:18px;background:linear-gradient(180deg,#FBFEFC,#F7FCF9);display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:8px;max-width:76%}
.msg .bubble{background:#fff;border:1px solid #E6F2EA;border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.65;color:#2C4338;box-shadow:0 1px 2px rgba(31,107,74,.04)}
.msg .t{font-size:10.5px;color:var(--muted);margin-top:4px}
.msg.left{align-self:flex-start}
.msg.right{align-self:flex-end;flex-direction:row-reverse}
.msg.right .bubble{background:var(--tag);border-color:#D6EEDF}
.msg.right .t{text-align:right}
.mavatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.mavatar.c{background:#FFF3E2;color:#B4741B}
.mavatar.d{background:#E7F6EE;color:var(--deep)}
.chat-input{border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;align-items:flex-end;background:#fff}
.chat-input textarea{flex:1;height:66px;border:1px solid var(--border);border-radius:10px;padding:8px 12px;outline:none;resize:none;line-height:1.6;font-size:12.5px}
.chat-input textarea:focus{border-color:#9FD4B4;box-shadow:0 0 0 3px rgba(79,175,122,.12)}
.chat-tip{font-size:11px;color:var(--muted);padding:0 16px 10px;background:#fff}

.row-note{font-size:12px;color:var(--muted);padding:10px 0 2px}
.checkbox{accent-color:var(--primary);width:15px;height:15px;vertical-align:-2px;cursor:pointer}
.hl{color:var(--deep);font-weight:600}
.stack{display:flex;flex-direction:column;gap:2px}
.stack small{color:var(--muted);font-size:11px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">

function toast(msg, type){
  const box = $('#toasts');

  el.textContent = msg;

    '<tbody>' + body + '</tbody></table></div>';
}

function pager(key, total, size){
  const sz = size || 10;
  const pages = Math.max(1, Math.ceil(total / sz));
  let page = S.page[key] || 1;
  page = Math.min(Math.max(1, page), pages);
  S.page[key] = page;
  let nums = '';
  for (let p = 1; p <= pages; p++) {
    nums += '<button class="pg' + (p === page ? ' on' : '') + '" data-act="page" data-key="' + key + '" data-p="' + p + '">' + p + '</button>';
  }
  return '<div class="pager"><span class="pg-total">共 ' + total + ' 条 · 第 ' + page + ' / ' + pages + ' 页</span>' +
    '<div class="pg-btns">' +
      '<button class="pg" data-act="page" data-key="' + key + '" data-p="' + (page - 1) + '">上一页</button>' +
      nums +
      '<button class="pg" data-act="page" data-key="' + key + '" data-p="' + (page + 1) + '">下一页</button>' +
    '</div></div>';
}

function paginate(key, arr, size){
  const sz = size || 10;
  const pages = Math.max(1, Math.ceil(arr.length / sz));
  let p = S.page[key] || 1;
  p = Math.min(Math.max(1, p), pages);
  S.page[key] = p;
  return { rows: arr.slice((p - 1) * sz, p * sz), pager: pager(key, arr.length, sz), page: p };
}

      let seq = D.appointments.filter(function(a){ return a.date === date; }).length + 1;
      let id = base + pad(seq, 3);
      while (D.appointments.some(function(a){ return a.id === id; })) { seq++; id = base + pad(seq, 3); }
      D.appointments.push({
        id:id, date:date, time:$('#modal [name="time"]').value,
        pet:pet.name, owner:owner.name, type:$('#modal [name="type"]').value,

      S.filters.appts.status = '全部';
      S.filters.appts.source = '全部';
      S.page.appts = 1;
      const timeText = $('#modal [name="time"]').value;
      renderRoute();
      toast('预约已创建：' + pet.name + ' · ' + date + ' ' + timeText);
    }
  });
  const ownerSel = $('#modal [name="owner"]');
  if (ownerSel) {
    ownerSel.onchange = function(){
      const id = this.value;
      $$('#modal [name="pet"] option').forEach(function(o){ o.hidden = o.dataset.owner !== id; });
      const visible = $('#modal [name="pet"] option:not([hidden])');
      if (visible) $('#modal [name="pet"]').value = visible.value;
    };
    ownerSel.onchange();
  }
}

  const revenue = todayBills.reduce(function(s, b){ return s + b.paid; }, 0);
  const todayAppts = D.appointments.filter(function(a){ return a.date === TODAY; });
  const waiting = todayAppts.filter(function(a){ return a.status === '待到店'; }).length;
  const arrived = todayAppts.filter(function(a){ return a.status === '已到店'; }).length;
  const treating = todayAppts.filter(function(a){ return a.status === '诊疗中'; }).length;
  const openBills = D.bills.filter(function(b){ return b.status === '待缴费' || b.status === '部分缴费'; });
  const due = openBills.reduce(function(s, b){ return s + (b.payable - b.paid); }, 0);
  const lowStock = D.inventory.filter(function(i){ return ['预警','缺货','近效期'].indexOf(i.status) > -1; });
  const pendingLabs = D.labs.filter(function(l){ return ['已开单','已采样','检测中'].indexOf(l.status) > -1; });

  const series = [];
  for (let off = -13; off <= 0; off++) {
    const d = dayStr(off);
    const sum = D.bills.filter(function(b){ return b.time.indexOf(d) === 0; })
      .reduce(function(s, b){ return s + b.paid; }, 0);
    series.push({ d:d.slice(5), sum:sum });
  }
  const max = Math.max.apply(null, series.map(function(s){ return s.sum; }).concat([1]));
  const bars = series.map(function(s){
    const h = 10 + Math.round(s.sum / max * 140);
    return '<div class="col"><div class="bar' + (s.sum < max * 0.45 ? ' min' : '') + '" style="height:' + h + 'px" title="' + s.d + ' 营收 ¥' + s.sum + '"></div><span class="x">' + s.d + '</span></div>';
  }).join('');

A.newCustomer = function(){
  openModal({
    title:'新建客户',
    body:'<div class="form-grid">' +
      '<div class="field"><label>客户姓名 *</label><input name="name" placeholder="如：林晓雯"></div>' +
      '<div class="field"><label>手机号 *</label><input name="phone" maxlength="11" placeholder="11 位手机号"></div>' +
      '<div class="field"><label>会员等级</label><select name="level">' + opts(['普通','银卡','金卡','黑金'], '普通') + '</select></div>' +
      '<div class="field"><label>客户来源</label><select name="source">' + opts(['门店','小程序','电话','美团','朋友推荐','公众号'], '门店') + '</select></div>' +
      '<div class="field"><label>生命周期</label><select name="lifecycle">' + opts(['潜客','新客','成长','成熟'], '潜客') + '</select></div>' +
      '<div class="field"><label>初始积分</label><input name="points" value="0"></div>' +
      '</div><div class="hint" style="margin-top:10px">新建客户将自动进入客户档案，可在详情中补充宠物资料。</div>',
    okText:'保存客户',
    onOk:function(){
      const name = $('#modal [name="name"]').value.trim();
      const phone = $('#modal [name="phone"]').value.trim();
      if (!name) { toast('请填写客户姓名', 'warn'); return false; }
      if (!/^1\d{10}$/.test(phone)) { toast('请填写正确的 11 位手机号', 'warn'); return false; }
      if (S.data.customers.some(function(c){ return c.phone === phone; })) {
        toast('该手机号已存在，请勿重复建档', 'warn');
        return false;
      }
      let maxId = 1000;
      S.data.customers.forEach(function(c){
        const n = parseInt(String(c.id).replace('C', ''), 10);
        if (n > maxId) maxId = n;
      });
      const level = $('#modal [name="level"]').value;
      const points = parseInt($('#modal [name="points"]').value, 10) || 0;
      S.data.customers.unshift({
        id:'C' + (maxId + 1), name:name, phone:phone, level:level,
        lifecycle:$('#modal [name="lifecycle"]').value, source:$('#modal [name="source"]').value,
        points:points, totalSpend:0, visits:0, lastVisit:'—',
        cardNo:'—', balance:0, discount: level === '普通' ? 1 : (level === '银卡' ? 0.95 : (level === '金卡' ? 0.9 : 0.8)),
        cardExp:'—', cardStatus:'未开卡'
      });
      persist();
      renderRoute();
      toast('客户「' + name + '」已创建');
    }
  });
};

function daysSince(ds){
  if (!ds || ds === '—') return 9999;
  const now = new Date(2026, 10, 8);
  const d = new Date(ds);
  return Math.round((now - d) / 86400000);
}
function crmAudience(criteria){
  return S.data.customers.filter(function(c){
    if (criteria.lifecycle !== '全部' && c.lifecycle !== criteria.lifecycle) return false;
    if (c.totalSpend < criteria.minSpend) return false;
    if (criteria.silentDays > 0 && daysSince(c.lastVisit) < criteria.silentDays) return false;
    return true;
  });
}

/* ---------------------------- 进销存管理 ---------------------------- */
function calcStockStatus(item){
  if (item.stock <= 0) return '缺货';
  if (item.stock < item.safety) return '预警';
  if (item.expiry && item.expiry !== '—') {
    const base = new Date(2026, 10, 8);
    const d = new Date(item.expiry);
    if ((d - base) / 86400000 <= 30) return '近效期';
  }
  return '正常';
}

A.consultSend = function(){
  const c = S.data.consults.find(function(x){ return x.id === S.consultId; });
  const input = $('#consultInput');
  if (!c || !input) return;
  if (c.status === '已关闭') { toast('会话已关闭，无法发送', 'warn'); return; }
  const text = input.value.trim();
  if (!text) { toast('请输入回复内容', 'warn'); return; }
  const t = nowTime();
  c.messages.push({ role:'d', text:text, time:t });
  c.status = '进行中';
  c.preview = text;
  c.time = t;
  c.unread = 0;
  persist();
  renderRoute();
  const body = $('#chatBody');
  if (body) body.scrollTop = body.scrollHeight;
  toast('消息已发送给 ' + c.pet + ' 的家长');
};

};


/* ---------------------------- 路由初始化 ---------------------------- */
function renderNav(){
  const nav = $('#nav');
  nav.innerHTML = NAV.map(function(n){
    return '<button class="nav-item" data-act="nav" data-to="' + n.key + '">' +
      '<span class="ico">' + n.icon + '</span>' +
      '<span class="nm">' + n.label + '</span>' +
      (n.key === 'consult' ? '<span class="nav-badge" id="consultBadge" style="display:none">0</span>' : '') +
      '</button>';
  }).join('');
  updateConsultBadge();
}

function updateConsultBadge(){
  const unread = S.data.consults.filter(function(c){ return c.unread > 0; }).length;
  const el = $('#consultBadge');
  if (el) {
    if (unread > 0) { el.style.display = 'flex'; el.textContent = unread; }
    else { el.style.display = 'none'; }
  }
}

function renderRoute(){
  const raw = (location.hash || '').replace(/^#\//, '') || 'dashboard';
  const key = NAV.some(function(n){ return n.key === raw; }) ? raw : 'dashboard';
  S.route = key;
  $$('#nav .nav-item').forEach(function(el){
    el.classList.toggle('active', el.dataset.to === key);
  });
  const meta = NAV.find(function(n){ return n.key === key; });
  $('#pageHead').innerHTML =
    '<div class="crumb">宠安宠物医院 · 后台管理 / <b>' + meta.label + '</b></div>' +
    '<div class="head-row"><h1>' + meta.label + '</h1><span class="head-desc">' + meta.desc + '</span>' +
    '<div class="head-right"><span class="tag">数据已保存至本机</span></div></div>';
  const content = $('#content');
  content.innerHTML = App.views[key] ? App.views[key]() : '<div class="card"><div class="card-body">页面加载失败</div></div>';
  content.scrollTop = 0;
  updateConsultBadge();
  const dbsize = $('#dbSize');
  if (dbsize) {
    let bytes = 0;
    try { bytes = localStorage.getItem(DB_KEY) ? localStorage.getItem(DB_KEY).length : 0; } catch (e) {}
    dbsize.textContent = (bytes / 1024).toFixed(1) + ' KB 本地数据';
  }
  if (key === 'consult') {
    const chat = $('#chatBody');
    if (chat) chat.scrollTop = chat.scrollHeight;
  }
}

function collectFilters(key){
  const f = S.filters[key] || (S.filters[key] = {});
  $$('[data-fkey="' + key + '"]').forEach(function(el){
    f[el.dataset.field] = el.value;
  });
  S.page[key] = 1;
}

/* ---------------------------- 全局事件 ---------------------------- */
function bindGlobal(){
  document.addEventListener('click', function(e){
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const fn = A[el.dataset.act];
    if (fn) {
      e.preventDefault();
      fn(el, e);
    }
  });

  $('#globalSearch').addEventListener('keydown', function(e){
    if (e.key === 'Enter') {
      const v = this.value.trim();
      if (!v) { toast('请输入客户姓名、手机号或单号', 'warn'); return; }
      S.tab.patients = 'customers';
      resetFilters('patientsC');
      S.filters.patientsC.q = v;
      S.filters.patientsP.q = v;
      App.go('patients');
      renderRoute();
      toast('已在客户与宠物档案中搜索：' + v);
    }
  });

  $('#mask').addEventListener('click', function(e){
    if (e.target === this) closeModal();
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && $('#mask').classList.contains('show')) closeModal();
  });

  window.addEventListener('hashchange', renderRoute);
}

function init(){
  loadData();
  renderNav();
  bindGlobal();
  if (!location.hash) location.hash = '#/dashboard';
  renderRoute();
}

init();
</script>
</body>
</html>
