<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ff6b35">
<title>鑫达食品批发商城</title>
<style>
:root{
  --primary:#ff6b35;
  --primary-dark:#e85a26;
  --primary-light:#fff3ee;
  --secondary:#1989fa;
  --secondary-dark:#0f6fd6;
  --bg:#f5f6f8;
  --card:#ffffff;
  --text:#1a1a1a;
  --text-sub:#8a8f99;
  --border:#ececec;
  --success:#07c160;
  --warning:#ff976a;
  --danger:#ee0a24;
  --tag-bg:#fff3ee;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --shadow-lg:0 4px 20px rgba(0,0,0,.1);
  --radius:10px;
  --radius-sm:6px;
  --max-w:600px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#e9ebef;
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:var(--max-w);margin:0 auto;background:var(--bg);min-height:100vh;position:relative;box-shadow:0 0 30px rgba(0,0,0,.08);overflow:hidden;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,textarea,select{font-family:inherit;font-size:14px;}
ul{list-style:none;}
img{max-width:100%;display:block;}

/* ===== Header ===== */
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
  padding:12px 14px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 8px rgba(255,107,53,.3);
}
.topbar .title{font-size:17px;font-weight:600;flex:1;text-align:center;}
.topbar .back-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.topbar .action-btn{padding:6px 10px;font-size:13px;background:rgba(255,255,255,.2);border-radius:6px;}

.search-bar{padding:10px 12px;background:#fff;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border);}
.rules-banner{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff8f0;border-bottom:1px solid #ffe0c0;font-size:12px;color:#e65100;line-height:1.5;}
.rules-banner .rules-icon{font-size:14px;flex-shrink:0;}
.search-bar input{flex:1;border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:13px;outline:none;}
.search-bar input:focus{border-color:var(--primary);}
.cart-icon{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.cart-badge{position:absolute;top:0;right:0;background:var(--danger);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.share-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;}
.share-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:999;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.share-modal .modal-card{background:#fff;border-radius:16px;padding:24px;width:80%;max-width:300px;text-align:center;position:relative;animation:slideUp .3s;}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.share-modal .close-x{position:absolute;top:10px;right:14px;font-size:22px;color:#999;cursor:pointer;line-height:1;}
.share-modal h3{font-size:16px;color:#333;margin-bottom:6px;}
.share-modal .shop-name{font-size:13px;color:#ff6b35;margin-bottom:16px;}
.share-modal .qr-canvas-wrap{display:flex;justify-content:center;margin-bottom:14px;}
.share-modal .qr-canvas-wrap canvas{border:6px solid #fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.1);}
.share-modal .tip{font-size:12px;color:#999;line-height:1.6;margin-bottom:16px;}
.share-modal .download-qr{display:inline-block;padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}

/* ===== Bottom Tab Bar ===== */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:var(--max-w);
  background:#fff;border-top:1px solid var(--border);
  display:flex;z-index:100;height:52px;
}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--text-sub);}
.tabbar .tab .icon{font-size:20px;line-height:1;}
.tabbar .tab.active{color:var(--primary);}

.page{padding-bottom:60px;min-height:100vh;}
.page.no-tab{padding-bottom:20px;}

/* ===== Shop Layout ===== */
.shop-wrap{display:flex;height:calc(100vh - 146px - 52px);}
.cat-sidebar{width:90px;background:#fafafa;border-right:1px solid var(--border);overflow-y:auto;}
.cat-item{padding:14px 6px;text-align:center;font-size:12px;color:var(--text-sub);border-left:3px solid transparent;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;}
.cat-item .emoji{font-size:22px;}
.cat-item.active{background:#fff;color:var(--primary);border-left-color:var(--primary);font-weight:600;}
.prod-grid{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.prod-card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
.prod-card .photo{height:100px;background:linear-gradient(135deg,#fef3e8,#ffe6d5);display:flex;align-items:center;justify-content:center;font-size:46px;position:relative;}
.prod-card .photo img{width:100%;height:100%;object-fit:cover;}
.prod-card .info{padding:8px;flex:1;display:flex;flex-direction:column;gap:3px;}
.prod-card .name{font-size:13px;font-weight:600;line-height:1.3;height:34px;overflow:hidden;}
.prod-card .spec{font-size:11px;color:var(--text-sub);}
.prod-card .min-unit{font-size:10px;color:var(--secondary);background:#eef5ff;padding:2px 5px;border-radius:4px;display:inline-block;align-self:flex-start;}
.prod-card .price{font-size:15px;color:var(--danger);font-weight:700;}
.prod-card .price small{font-size:11px;font-weight:400;}
.prod-card .stock{font-size:10px;color:var(--text-sub);}
.prod-card .add-btn{margin:6px 6px 6px;background:var(--primary);color:#fff;border:none;border-radius:6px;padding:6px 0;font-size:12px;font-weight:500;}
.prod-card .add-btn:active{background:var(--primary-dark);}
.prod-card.oos{opacity:.55;}
.prod-card.oos .add-btn{background:#ccc;}
.oos-tag{position:absolute;top:6px;right:6px;background:var(--danger);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;}

/* ===== Cart ===== */
.cart-list{padding:10px;}
.cart-item{background:#fff;border-radius:var(--radius);padding:12px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;}
.cart-item .ci-emoji{font-size:36px;width:50px;height:50px;display:flex;align-items:center;justify-content:center;background:#fef3e8;border-radius:8px;flex-shrink:0;}
.cart-item .ci-info{flex:1;min-width:0;}
.cart-item .ci-name{font-size:14px;font-weight:600;}
.cart-item .ci-spec{font-size:11px;color:var(--text-sub);margin-top:2px;}
.cart-item .ci-price{font-size:13px;color:var(--danger);margin-top:3px;}
.cart-item .ci-qty{display:flex;align-items:center;gap:6px;margin-top:6px;}
.qty-btn{width:26px;height:26px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text);}
.qty-btn:active{background:#e0e0e0;}
.qty-num{font-size:14px;font-weight:600;min-width:30px;text-align:center;}
.remove-btn{color:var(--text-sub);font-size:12px;padding:4px 6px;}
.cart-footer{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max-w);background:#fff;border-top:1px solid var(--border);padding:12px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 -2px 10px rgba(0,0,0,.05);z-index:99;}
.cart-total{font-size:15px;}
.cart-total .amount{color:var(--danger);font-size:20px;font-weight:700;}
.btn-checkout{background:var(--primary);color:#fff;border:none;border-radius:22px;padding:10px 24px;font-size:14px;font-weight:600;}
.btn-checkout:active{background:var(--primary-dark);}
.empty-state{padding:60px 20px;text-align:center;color:var(--text-sub);}
.empty-state .emoji{font-size:60px;margin-bottom:12px;}
.empty-state .text{font-size:14px;margin-bottom:20px;}

/* ===== Forms ===== */
.form-section{padding:14px;}
.form-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
.form-card h3{font-size:14px;color:var(--text-sub);margin-bottom:12px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:13px;color:var(--text-sub);margin-bottom:6px;}
.form-group label .req{color:var(--danger);}
.form-control{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;background:#fff;}
.form-control:focus{border-color:var(--primary);}
textarea.form-control{min-height:120px;resize:vertical;font-family:Consolas,monospace;}
.photo-upload{display:flex;align-items:center;gap:12px;}
.photo-upload .preview{width:80px;height:80px;border:1px dashed var(--border);border-radius:8px;background:#fafafa;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px;color:var(--text-sub);flex-shrink:0;position:relative;}
.photo-upload .preview img{width:100%;height:100%;object-fit:cover;}
.photo-upload .preview .empty{font-size:12px;color:var(--text-sub);text-align:center;line-height:1.3;padding:4px;}
.photo-upload .actions{display:flex;flex-direction:column;gap:6px;}
.photo-upload .upload-btn{padding:8px 12px;font-size:13px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer;text-align:center;}
.photo-upload .clear-btn{padding:6px 12px;font-size:12px;background:#fff;color:var(--text-sub);border:1px solid var(--border);border-radius:6px;cursor:pointer;}
.photo-upload input[type=file]{display:none;}
.form-row{display:flex;gap:10px;}
.form-row .form-group{flex:1;}
.toggle{display:flex;align-items:center;gap:10px;}
.toggle input{width:18px;height:18px;}
.btn-search{flex-shrink:0;background:var(--secondary);color:#fff;border:none;border-radius:8px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn-search:active{opacity:0.85;}
.pickup-radio{display:flex;gap:10px;}
.pickup-radio .pr-option{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;cursor:pointer;background:#fff;transition:all .15s;}
.pickup-radio .pr-option input{width:16px;height:16px;margin:0;}
.pickup-radio .pr-option:has(input:checked){border-color:var(--primary);background:#fff5f0;color:var(--primary);font-weight:600;}
.cust-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
.cust-card .cc-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px dashed #f0f0f0;}
.cust-card .cc-row:last-child{border-bottom:none;}
.cust-card .cc-row .cc-k{color:var(--text-sub);}
.cust-card .cc-actions{display:flex;gap:8px;margin-top:10px;}
.cust-card .cc-actions button{flex:1;padding:8px;border-radius:6px;font-size:13px;border:1px solid var(--border);background:#fff;cursor:pointer;}
.cust-card .cc-actions .edit{background:var(--primary);color:#fff;border-color:var(--primary);}
.profile-section{margin-bottom:18px;}
.profile-section h3{font-size:15px;margin:0 0 10px;color:var(--text);}
.empty-cust{padding:30px 0;text-align:center;color:var(--text-sub);font-size:13px;}
.empty-cust .emoji{font-size:42px;display:block;margin-bottom:8px;}
.btn-primary{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:600;width:100%;}
.btn-primary:active{background:var(--primary-dark);}
.btn-secondary{background:#fff;color:var(--primary);border:1px solid var(--primary);border-radius:8px;padding:12px;font-size:15px;font-weight:600;width:100%;}
.btn-block{width:100%;padding:12px;border-radius:8px;font-size:15px;font-weight:600;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn-block{flex:1;}

/* ===== Order Preview ===== */
.preview-card{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;}
.preview-card .ph{font-size:13px;color:var(--text-sub);margin-bottom:8px;font-weight:600;}
.preview-card .pr{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;}
.preview-card .pr.bold{font-weight:700;font-size:15px;color:var(--danger);border-top:1px solid var(--border);padding-top:10px;margin-top:5px;}
.preview-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);}
.preview-item:last-child{border-bottom:none;}
.preview-item .pi-emoji{font-size:24px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#fef3e8;border-radius:6px;}
.preview-item .pi-info{flex:1;}
.preview-item .pi-name{font-size:13px;font-weight:600;}
.preview-item .pi-spec{font-size:11px;color:var(--text-sub);}
.preview-item .pi-sub{font-size:13px;color:var(--danger);font-weight:600;text-align:right;}

/* ===== Payment ===== */
.pay-wrap{padding:30px 20px;}
.pay-card{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);text-align:center;margin-bottom:20px;}
.pay-card .pay-amt{font-size:32px;font-weight:700;color:var(--text);margin:10px 0;}
.pay-card .pay-amt small{font-size:16px;}
.pay-card .pay-ord{font-size:12px;color:var(--text-sub);}
.pay-method{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.pay-method .pm-item{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--border);}
.pay-method .pm-item:last-child{border-bottom:none;}
.pay-method .pm-icon{font-size:24px;}
.pay-method .pm-name{flex:1;font-size:14px;text-align:left;}
.pay-method .pm-check{color:var(--success);font-size:18px;}
.btn-wechat{background:var(--success);color:#fff;border:none;border-radius:8px;padding:13px;font-size:16px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-wechat:active{opacity:.9;}
.btn-wechat:disabled{opacity:.6;}

/* ===== Success ===== */
.success-wrap{padding:50px 20px;text-align:center;}
.success-icon{font-size:64px;margin-bottom:16px;}
.success-title{font-size:22px;font-weight:700;margin-bottom:8px;}
.success-sub{color:var(--text-sub);font-size:14px;margin-bottom:24px;}

/* ===== Orders List ===== */
.order-card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.order-card .oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--border);}
.order-card .oh .ord-no{font-size:12px;color:var(--text-sub);}
.order-card .oh .ord-status{font-size:12px;padding:2px 8px;border-radius:4px;}
.ord-status.paid{background:#e6f7ec;color:var(--success);}
.ord-status.pending{background:#fff3e6;color:var(--warning);}
.order-card .oi{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
.order-card .of{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);display:flex;justify-content:space-between;align-items:center;}
.order-card .of .total{color:var(--danger);font-weight:700;font-size:15px;}

/* ===== Admin ===== */
.admin-login{padding:40px 20px;}
.admin-login h2{text-align:center;color:var(--secondary);margin-bottom:24px;font-size:20px;}
.admin-login .login-card{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);}
.admin-login .btn-admin{background:var(--secondary);color:#fff;}
.admin-topbar{background:linear-gradient(135deg,var(--secondary),var(--secondary-dark));}
.admin-topbar .back-btn{font-size:22px;color:#fff;}
.admin-topbar .title{color:#fff;}
.admin-body{padding:14px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center;}
.stat-card .sv{font-size:22px;font-weight:700;color:var(--primary);}
.stat-card .sl{font-size:12px;color:var(--text-sub);margin-top:4px;}
.stat-card.blue .sv{color:var(--secondary);}
.stat-card.green .sv{color:var(--success);}
.stat-card.orange .sv{color:var(--primary);}
.quick-links{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:14px;}
.quick-links h3{font-size:14px;margin-bottom:12px;}
.quick-link{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.quick-link:last-child{border-bottom:none;}
.quick-link .ql-l{display:flex;align-items:center;gap:10px;}
.quick-link .ql-icon{font-size:22px;}
.quick-link .ql-name{font-size:14px;}
.quick-link .ql-arrow{color:var(--text-sub);}
.qr-section{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);text-align:center;margin-bottom:14px;}
.qr-section h3{font-size:14px;margin-bottom:12px;}
.qr-canvas-wrap{display:flex;justify-content:center;margin-bottom:10px;}
#qrCanvas{border:8px solid #fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);}
.qr-label{font-size:13px;color:var(--text-sub);margin-bottom:10px;}
.btn-download{background:#fff;color:var(--secondary);border:1px solid var(--secondary);border-radius:6px;padding:8px 16px;font-size:13px;}

/* Admin product list */
.admin-search{margin-bottom:12px;}
.admin-search input{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;}
.admin-list{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.admin-row{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--border);}
.admin-row:last-child{border-bottom:none;}
.admin-row .ar-info{flex:1;min-width:0;}
.admin-row .ar-name{font-size:14px;font-weight:600;}
.admin-row .ar-meta{font-size:11px;color:var(--text-sub);margin-top:3px;}
.admin-row .ar-actions{display:flex;gap:6px;}
.admin-row .ar-actions button{padding:5px 9px;font-size:12px;border-radius:5px;}
.btn-edit{background:#eef5ff;color:var(--secondary);}
.btn-del{background:#ffeef0;color:var(--danger);}
.admin-toolbar{display:flex;gap:8px;margin-bottom:12px;}
.admin-toolbar button{flex:1;background:var(--secondary);color:#fff;border-radius:8px;padding:9px;font-size:13px;font-weight:500;}
.admin-toolbar button.outline{background:#fff;color:var(--secondary);border:1px solid var(--secondary);}
.tag-pill{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;}
.tag-on{background:#e6f7ec;color:var(--success);}
.tag-off{background:#f0f0f0;color:var(--text-sub);}
.tag-oos{background:#ffeef0;color:var(--danger);}

/* Admin table-like for orders/payments */
.adm-table{width:100%;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px;}
.adm-table .th{display:flex;background:#fafafa;padding:10px 12px;font-size:11px;color:var(--text-sub);font-weight:600;}
.adm-table .tr{display:flex;padding:10px 12px;border-top:1px solid var(--border);font-size:12px;align-items:center;}
.adm-table .tc{flex:1;word-break:break-all;}
.adm-table .tc.small{flex:0 0 70px;}

.filter-bar{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;}
.filter-bar .fb-btn{white-space:nowrap;padding:6px 14px;border-radius:16px;background:#fff;border:1px solid var(--border);font-size:12px;color:var(--text-sub);}
.filter-bar .fb-btn.active{background:var(--secondary);color:#fff;border-color:var(--secondary);}

.import-result{background:#fff;border-radius:var(--radius);padding:14px;margin-top:14px;box-shadow:var(--shadow);}
.import-result .ir-ok{color:var(--success);font-weight:600;margin-bottom:8px;}
.import-result .ir-err{color:var(--danger);font-size:12px;}

/* ===== Toast ===== */
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80%;text-align:center;}
#toast.show{opacity:1;}

/* ===== Loading overlay ===== */

/* ===== Page transition ===== */

/* ---------- Storage Helpers ---------- */
const Store={
  get(key,def=null){
    try{const v=localStorage.getItem('fs_'+key);return v?JSON.parse(v):def;}catch(e){return def;}
  },
  set(key,val){localStorage.setItem('fs_'+key,JSON.stringify(val));},
  del(key){localStorage.removeItem('fs_'+key);},
  has(key){return localStorage.getItem('fs_'+key)!==null;},
};

/* ---------- Toast ---------- */
function toast(msg,ms=1800){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),ms);
}
function showLoading(){document.getElementById('loading').classList.add('show');}
function hideLoading(){document.getElementById('loading').classList.remove('show');}

/* ---------- Data Accessors ---------- */
function getProducts(){return Store.get('products',[]);}
function getProduct(id){return getProducts().find(p=>p.id===id);}
function saveProducts(arr){Store.set('products',arr);}
function getCategories(){return Store.get('categories',[]);}

function getCustomers(){return Store.get('customers',[]);}

function getOrders(){return Store.get('orders',[]);}

function getPayments(){return Store.get('payments',[]);}

function savePayments(arr){Store.set('payments',arr);}
function getCart(){return Store.get('cart',[]);}
function saveCart(arr){Store.set('cart',arr);}

/* ---------- Cart Operations ---------- */
function addToCart(productId){
  const p=getProduct(productId);
  if(!p||p.stock<=0){toast('商品缺货，无法加入');return;}
  const cart=getCart();
  const ex=cart.find(c=>c.productId===productId);
  if(ex){ex.qty+=p.minQty;}
  else{cart.push({productId:productId,name:p.name,spec:p.spec,minUnit:p.minUnit,minQty:p.minQty,unit:p.unit,price:p.price,emoji:prodEmoji(p),qty:p.minQty});}
  saveCart(cart);
  toast('已加入购物车');
  matchRoute();
}
function changeQty(productId,delta){
  const cart=getCart();
  const it=cart.find(c=>c.productId===productId);
  if(!it)return;
  it.qty+=delta;
  if(it.qty<it.minQty)it.qty=0;
  if(it.qty===0){cart.splice(cart.indexOf(it),1);}
  saveCart(cart);
  matchRoute();
}
function removeFromCart(productId){
  const cart=getCart().filter(c=>c.productId!==productId);
  saveCart(cart);
  toast('已移除');
  matchRoute();
}
function cartCount(){return getCart().reduce((s,c)=>s+c.qty,0);}
function cartTotal(){return getCart().reduce((s,c)=>s+c.qty*c.price,0);}

/* Default emoji for product by category */
function prodEmoji(p){
  if(p.photo)return null;
  const m={cat1:'🍜',cat2:'🥤',cat3:'🥛',cat4:'🍪',cat5:'🌾',cat6:'🍫'};
  return m[p.catId]||'📦';
}

/* ---------- Order Operations ---------- */
function genOrderId(){
  const d=new Date();
  const pad=(n,l=2)=>String(n).padStart(l,'0');
  return 'FS'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+pad(Math.floor(Math.random()*100),2);
}
function genPaymentId(){return 'PAY'+Date.now()+Math.floor(Math.random()*100);}

function matchRoute(){
  const path=getHash();
  const app=document.getElementById('app');
  app.innerHTML='';
  // Param routes
  if(path.indexOf('/admin/product/edit/')===0){
    const id=path.split('/').pop();
    return renderProductEdit(id);
  }
  if(routes[path])return routes[path]();

/* ---- Shop QR Code Modal ---- */
function showShopQR(){
  const modal=document.getElementById('shopQRModal');
  if(modal)modal.style.display='flex';
  setTimeout(drawShopQR,50);
}
function hideShopQR(){
  const modal=document.getElementById('shopQRModal');
  if(modal)modal.style.display='none';
}
function drawShopQR(){
  const canvas=document.getElementById('shopQRCanvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const url=shopUrl();
  try{
    const qr=QRCode.generate(url,1);
    const cells=qr.getModuleCount();
    const size=200;
    const cell=Math.floor(size/cells);
    const off=Math.floor((size-cell*cells)/2);
    ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#000';
    for(let r=0;r<cells;r++){
      for(let c=0;c<cells;c++){
        if(qr.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);
      }
    }
  }catch(e){console.error('QR gen error',e);}
}
function downloadShopQR(){
  const canvas=document.getElementById('shopQRCanvas');
  if(!canvas){toast('二维码未生成');return;}
  const link=document.createElement('a');
  link.download='shop-qrcode.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
}
window.showShopQR=showShopQR;
window.hideShopQR=hideShopQR;

function onPhoneInput(){
  const phone=document.getElementById('ck-phone').value.trim();
  if(phone.length>=4)lookupCustomer(phone);
}
function searchCustomerByPhone(){
  const phone=document.getElementById('ck-phone').value.trim();
  if(phone.length<4){toast('请至少输入4位号码');return;}
  lookupCustomer(phone);
  const tip=document.getElementById('cust-tip');
  if(tip && !tip.textContent)toast('未找到该手机号客户');
}
function lookupCustomer(phone){
  if(phone.length<4)return;
  const c=getCustomerByPhone(phone);
  const tip=document.getElementById('cust-tip');
  if(c){
    document.getElementById('ck-name').value=c.name;
    document.getElementById('ck-addr').value=c.address||'';
    document.getElementById('ck-first').checked=false;
    // Apply saved pickup preference if exists
    if(c.pickupType){
      const radio=document.querySelector(`input[name="pickupType"][value="${c.pickupType}"]`);
      if(radio){radio.checked=true;onPickupChange();}
    }
    tip.textContent='✅ 老客户：已自动填入信息';
    checkoutState.customerId=c.id;
  }else{
    tip.textContent='';
    checkoutState.customerId=null;
  }
}
function saveCheckoutCustomer(){
  const name=document.getElementById('ck-name').value.trim();
  const phone=document.getElementById('ck-phone').value.trim();
  const addr=document.getElementById('ck-addr').value.trim();
  const first=document.getElementById('ck-first').checked;
  const pickup=checkoutState.pickupType||'delivery';
  if(!name||!phone){toast('请填写姓名和电话');return;}
  if(!/^1\d{10}$/.test(phone)){toast('请输入正确的手机号');return;}
  if(pickup==='delivery'&&!addr){toast('送货上门必须填写地址');return;}
  let customers=getCustomers();
  let cust=customers.find(c=>c.phone===phone);
  if(cust){
    cust.name=name;
    cust.address=addr;
    cust.pickupType=pickup;
    cust.isFirst=false;
    checkoutState.customerId=cust.id;
  }else{
    cust={id:'c'+Date.now(),name,phone,address:addr,pickupType:pickup,isFirst:first,createdAt:Date.now()};
    customers.push(cust);
    checkoutState.customerId=cust.id;
  }
  saveCustomers(customers);
  navigate('/checkout/preview');
}
window.onPickupChange=onPickupChange;
window.onPhoneInput=onPhoneInput;
window.searchCustomerByPhone=searchCustomerByPhone;
window.lookupCustomer=lookupCustomer;
window.saveCheckoutCustomer=saveCheckoutCustomer;

function doWechatPay(){
  const btn=document.getElementById('pay-btn');
  btn.disabled=true;
  btn.innerHTML='支付中...';
  showLoading();
  setTimeout(()=>{
    hideLoading();
    const order=getOrder(checkoutState.orderId);
    if(!order){toast('订单不存在');navigate('/shop');return;}
    order.status='paid';
    order.paidAt=Date.now();
    const orders=getOrders();
    const idx=orders.findIndex(o=>o.id===order.id);
    if(idx>=0)orders[idx]=order;
    saveOrders(orders);
    // Reduce product stock
    const products=getProducts();
    order.items.forEach(it=>{
      const p=products.find(x=>x.id===it.productId);
      if(p)p.stock=Math.max(0,p.stock-it.qty);
    });
    saveProducts(products);
    // Record payment
    const payments=getPayments();
    payments.push({id:genPaymentId(),orderId:order.id,amount:order.total,method:'wechat',status:'paid',paidAt:Date.now()});
    savePayments(payments);
    navigate('/checkout/success');
  },2000);
}
window.doWechatPay=doWechatPay;

function saveProfileCustomer(id){
  const name=document.getElementById('p-name').value.trim();
  const phone=document.getElementById('p-phone').value.trim();
  const addr=document.getElementById('p-addr').value.trim();
  const first=document.getElementById('p-first').checked;
  const pickupSel=document.querySelector('input[name="p-pickup"]:checked');
  const pickup=pickupSel?pickupSel.value:'delivery';
  if(!name||!phone){toast('请填写姓名和电话');return;}
  if(!/^1\d{10}$/.test(phone)){toast('请输入正确的手机号');return;}
  if(pickup==='delivery'&&!addr){toast('送货偏好必须填写地址');return;}
  let customers=getCustomers();
  // Phone uniqueness check
  const dup=customers.find(c=>c.phone===phone&&c.id!==id);
  if(dup){toast('该手机号已存在客户档案');return;}
  if(id){
    const idx=customers.findIndex(c=>c.id===id);
    if(idx>=0){
      customers[idx]={...customers[idx],name,phone,address:addr,pickupType:pickup,isFirst:first};
    }
  }else{
    customers.push({id:'c'+Date.now(),name,phone,address:addr,pickupType:pickup,isFirst:first,createdAt:Date.now()});
  }
  saveCustomers(customers);
  toast('已保存客户档案');
  navigate('/profile');
}
function editCustomer(id){openCustomerEditor(id);}
function deleteCustomer(id){
  if(!confirm('确定删除此客户档案？'))return;
  let customers=getCustomers().filter(c=>c.id!==id);
  saveCustomers(customers);
  toast('已删除');
  navigate('/profile');
}
window.openCustomerEditor=openCustomerEditor;
window.saveProfileCustomer=saveProfileCustomer;
window.editCustomer=editCustomer;
window.deleteCustomer=deleteCustomer;

      </div>
      <div class="qr-section">
        <h3>扫码进入商城</h3>
        <div class="qr-canvas-wrap"><canvas id="qrCanvas" width="220" height="220"></canvas></div>
        <div class="qr-label">扫码访问：${shopUrl()}</div>
        <button class="btn-download" onclick="downloadQR()">⬇ 下载二维码</button>
      </div>
      <button class="btn-secondary" style="border-color:var(--danger);color:var(--danger);" onclick="adminLogout()">退出登录</button>

function paymentsRevenue(){return getPayments().filter(p=>p.status==='paid').reduce((s,p)=>s+p.amount,0);}
function shopUrl(){
  const base=location.href.split('#')[0];
  return base+'#/shop';
}
function drawQR(){
  const canvas=document.getElementById('qrCanvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const url=shopUrl();
  try{
    const qr=QRCode.generate(url,1); // 1 = M error correction level
    const cells=qr.getModuleCount();
    const size=220;
    const cell=Math.floor(size/cells);
    const off=Math.floor((size-cell*cells)/2);
    ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#000';
    for(let r=0;r<cells;r++){
      for(let c=0;c<cells;c++){
        if(qr.isDark(r,c)){
          ctx.fillRect(off+c*cell,off+r*cell,cell,cell);
        }
      }
    }
  }catch(e){
    // fallback: API image
    ctx.fillStyle='#fff';ctx.fillRect(0,0,220,220);
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{ctx.drawImage(img,0,0,220,220);};
    img.src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(url);
  }
}
function downloadQR(){
  const canvas=document.getElementById('qrCanvas');
  if(!canvas){toast('二维码未生成');return;}
  const link=document.createElement('a');
  link.download='shop-qrcode.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
  toast('已下载');
}

function handlePhotoUpload(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  if(file.size>2*1024*1024){toast('图片不能超过2MB');return;}
  const reader=new FileReader();
  reader.onload=function(e){
    const url=e.target.result;
    const preview=document.getElementById('p-photo-preview');
    preview.dataset.url=url;
    preview.innerHTML='<img src="'+url+'" alt="">';
    toast('图片已加载');
  };
  reader.onerror=function(){toast('读取失败，请重试');};
  reader.readAsDataURL(file);
}

  const preview=document.getElementById('p-photo-preview');
  if(!preview)return;
  preview.dataset.url='';
  preview.innerHTML='<div class="empty">暂无图片</div>';

}

function renderImport(){

      </div>
      <button class="btn-primary" style="background:var(--secondary);" onclick="doImport()">导入</button>
      <div id="import-result"></div>
    </div>
  `;

function doImport(){
  const txt=document.getElementById('import-json').value.trim();
  const result=document.getElementById('import-result');
  if(!txt){toast('请粘贴JSON');return;}
  let arr;
  try{arr=JSON.parse(txt);}catch(e){result.innerHTML=`<div class="import-result"><div class="ir-err">JSON解析失败：${e.message}</div></div>`;return;}
  if(!Array.isArray(arr)){result.innerHTML=`<div class="import-result"><div class="ir-err">数据必须是数组</div></div>`;return;}
  const products=getProducts();
  let ok=0;const errs=[];
  arr.forEach((it,i)=>{
    if(!it.name){errs.push(`第${i+1}项缺少name`);return;}
    if(typeof it.price!=='number'){errs.push(`第${i+1}项price无效`);return;}
    const np={
      id:it.id||('p'+Date.now()+i),
      name:it.name,
      catId:it.catId||'cat1',
      spec:it.spec||'',
      minUnit:it.minUnit||'1箱',
      minQty:it.minQty||1,
      unit:it.unit||'箱',
      price:it.price,
      stock:it.stock||0,
      photo:it.photo||'',
      description:it.description||'',
      status:it.status||'on'
    };
    products.push(np);ok++;
  });
  saveProducts(products);
  result.innerHTML=`<div class="import-result"><div class="ir-ok">✓ 成功导入 ${ok} 件商品</div>${errs.length?`<div class="ir-err">错误：${errs.join('；')}</div>`:''}</div>`;
  toast('导入完成');
}

  for(var r=0;r<moduleCount;r++){
    for(var c=0;c<moduleCount;c++){
      var sameCount=0;
      var dark=qrCode.isDark(r,c);
      for(var ii=-1;ii<=1;ii++){
        if(r+ii<0||moduleCount<=r+ii)continue;
        for(var jj=-1;jj<=1;jj++){
          if(c+jj<0||moduleCount<=c+jj)continue;
          if(ii==0&&jj==0)continue;
          if(dark==qrCode.isDark(r+ii,c+jj))sameCount++;
        }
      }
      if(sameCount>5)lostPoint+=3+sameCount-5;
    }
  }
  for(var r=0;r<moduleCount-1;r++){
    for(var c=0;c<moduleCount-1;c++){
      var count=0;
      if(qrCode.isDark(r,c))count++;
      if(qrCode.isDark(r+1,c))count++;
      if(qrCode.isDark(r,c+1))count++;
      if(qrCode.isDark(r+1,c+1))count++;
      if(count==0||count==4)lostPoint+=3;
    }
  }
  for(var r=0;r<moduleCount;r++){
    for(var c=0;c<moduleCount;c++){
      if(qrCode.isDark(r,c)&&qrCode.isDark(r+1,c)&&qrCode.isDark(r+2,c)&&qrCode.isDark(r+3,c)&&qrCode.isDark(r+4,c)){
        lostPoint+=40;
      }
    }
  }
  for(var c=0;c<moduleCount;c++){
    for(var r=0;r<moduleCount;r++){
      if(qrCode.isDark(r,c)&&qrCode.isDark(r,c+1)&&qrCode.isDark(r,c+2)&&qrCode.isDark(r,c+3)&&qrCode.isDark(r,c+4)){
        lostPoint+=40;
      }
    }
  }
  var darkCount=0;
  for(var c=0;c<moduleCount;c++){
    for(var r=0;r<moduleCount;r++){
      if(qrCode.isDark(r,c))darkCount++;
    }
  }
  var ratio=Math.abs(100*darkCount/moduleCount/moduleCount-50)/5;
  lostPoint+=ratio*10;
  return lostPoint;
};
QRCodeModel2.getBCHTypeInfo=function(data){
  var d=data<<10;
  while(QRCodeModel2.getBCHDigit(d)-QRCodeModel2.getBCHDigit(QRCodeModel2.G15)>=0){
    d^=(QRCodeModel2.G15<<(QRCodeModel2.getBCHDigit(d)-QRCodeModel2.getBCHDigit(QRCodeModel2.G15)));
  }
  return((data<<10)|d)^QRCodeModel2.G15_MSK;
};
QRCodeModel2.getBCHTypeNumber=function(data){
  var d=data<<12;
  while(QRCodeModel2.getBCHDigit(d)-QRCodeModel2.getBCHDigit(QRCodeModel2.G18)>=0){
    d^=(QRCodeModel2.G18<<(QRCodeModel2.getBCHDigit(d)-QRCodeModel2.getBCHDigit(QRCodeModel2.G18)));
  }
  return((data<<12)|d)^QRCodeModel2.G18_MSK;
};
QRCodeModel2.getBCHDigit=function(data){
  var digit=0;
  while(data!=0){digit++;data>>>=1;}
  return digit;
};
QRCodeModel2.G15=0x6679;
QRCodeModel2.G15_MSK=0x5412;
QRCodeModel2.G18=0x11B5;
QRCodeModel2.G18_MSK=0x6118;

QR8bit.prototype.mode=4;
QR8bit.prototype.getLengthInBits=QRCodeModel2.getLengthInBits;

// Public API
QRCode={
  generate:function(text,ecl){
    // Determine type number from data length for byte mode
    var byteLen=0;
    for(var i=0;i<text.length;i++){
      var c=text.charCodeAt(i);
      if(c<=0x7f)byteLen++;
      else if(c<=0x7ff)byteLen+=2;
      else byteLen+=3;
    }
    // Pick smallest type number that fits for byte mode at M level
    var caps=[14,26,42,62,84,106,122,152,180,213,250,287]; // M level capacities
    var type=1;
    for(;type<=caps.length;type++){if(byteLen<=caps[type-1])break;}
    if(byteLen>caps[caps.length-1])type=10; // fallback
    var qr=new QRCodeModel2(type,ecl==null?1:ecl);
    qr.addData(text);
    qr.make();
    return qr;
  }
};
