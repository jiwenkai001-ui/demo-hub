<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>京麦源 · AI定制软件演示系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --pri:#2563eb;--pri-l:#eff6ff;--ok:#16a34a;--ok-l:#f0fdf4;
  --warn:#e8890c;--warn-l:#fff7ed;--dan:#e5484d;--dan-l:#fef2f2;--pur:#7c3aed;--pur-l:#f5f3ff;
  --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;
}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-text-size-adjust:100%}
.app{height:100dvh;display:flex;background:var(--bg)}

/* ---------- sidebar ---------- */
.side{width:218px;flex:0 0 218px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.brand{height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex:0 0 32px}
.brand-t b{display:block;font-size:14px;letter-spacing:.2px}
.brand-t span{display:block;font-size:10.5px;color:var(--ink3);margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:12px 10px 26px}
.nav-g{font-size:10.5px;color:var(--ink3);padding:12px 8px 6px;letter-spacing:1px;font-weight:600}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink2);margin-bottom:2px;transition:.15s;white-space:nowrap}
.nav-i:hover{background:var(--bg)}
.nav-i.on{background:var(--pri-l);color:var(--pri);font-weight:600}
.nav-i .ic{width:20px;text-align:center;font-size:15px;flex:0 0 20px}
.nav-i .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav-i .pd{font-size:10px;color:var(--pur);background:var(--pur-l);padding:1px 5px;border-radius:5px;flex:0 0 auto}
.side-f{padding:10px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink3);line-height:1.6}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:58px;flex:0 0 58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px}
.burger{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;font-size:17px;cursor:pointer;color:var(--ink2)}
.crumb{font-size:12px;color:var(--ink3);min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.demo-flag{font-size:10.5px;color:var(--warn);background:var(--warn-l);border:1px solid #fed7aa;padding:4px 9px;border-radius:20px;white-space:nowrap}
.phone-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.phone-btn:hover{border-color:var(--pri);color:var(--pri)}
.view{flex:1;overflow:auto;padding:18px 20px 46px;min-width:0}

/* ---------- shared ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:19px;font-weight:700;letter-spacing:.2px}
.page-head p{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.6;max-width:760px}
.pain{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--pur);background:var(--pur-l);border:1px solid #e9e2ff;padding:5px 10px;border-radius:20px;max-width:430px;line-height:1.5}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 17px;box-shadow:0 1px 2px rgba(15,23,42,.03);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px;min-width:0}
.card-h h3{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;min-width:0}
.card-h h3 .dot{width:7px;height:7px;border-radius:2px;background:var(--pri);flex:0 0 7px}
.card-h .sub{font-size:11px;color:var(--ink3);white-space:nowrap}
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 16px;box-shadow:0 1px 2px rgba(15,23,42,.03);min-width:0}
.kpi .lb{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi .lb i{width:8px;height:8px;border-radius:3px;display:inline-block;flex:0 0 8px}
.kpi .vl{font-size:23px;font-weight:800;margin:9px 0 4px;letter-spacing:-.5px;white-space:nowrap}
.kpi .ex{font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--ok-l);color:var(--ok)}
.t-warn{background:var(--warn-l);color:var(--warn)}
.t-dan{background:var(--dan-l);color:var(--dan)}
.t-pri{background:var(--pri-l);color:var(--pri)}
.t-pur{background:var(--pur-l);color:var(--pur)}
.t-gray{background:#f1f5f9;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--ink2);background:#f8fafc;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfe}
.num{font-variant-numeric:tabular-nums}
.r{text-align:right}
.mono{font-family:ui-monospace,Consolas,monospace}
.tb-wrap{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11px;color:var(--ink2);font-weight:600}
.field select,.field input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;background:#fff;color:var(--ink);min-width:0;width:100%;height:34px}
.field select:focus,.field input:focus{outline:none;border-color:var(--pri)}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.controls .field{min-width:150px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:12px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn-pri{border-color:var(--pri);background:var(--pri);color:#fff;font-weight:600}
.btn-pri:hover{background:#1d4ed8;color:#fff}
.btn-dan{border-color:#fecaca;background:var(--dan-l);color:var(--dan)}
.hint{font-size:11px;color:var(--ink3);line-height:1.7}
.note{background:var(--pri-l);border:1px solid #dbeafe;border-radius:9px;padding:11px 13px;font-size:11.5px;color:#1e40af;line-height:1.7}
.note.warn{background:var(--warn-l);border-color:#fed7aa;color:#9a3412}
.bar-track{height:7px;background:#f1f5f9;border-radius:6px;overflow:hidden;min-width:60px}
.bar-fill{height:100%;border-radius:6px}
.lg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink2);margin-bottom:7px}
.lg i{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.lg b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.legends{flex:1;min-width:132px}
.flow-step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.flow-step:last-child{border-bottom:none}
.flow-step .no{width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:var(--pri-l);color:var(--pri);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.flow-step .tx{font-size:11.5px;line-height:1.6;color:var(--ink2)}
.flow-step .tx b{color:var(--ink)}
.flow-step .go{font-size:10.5px;color:var(--pri);cursor:pointer;margin-left:4px}
.alert{padding:11px 13px;border-radius:9px;font-size:12px;line-height:1.6;margin-top:12px;display:none}
.alert.show{display:block}
.alert.err{background:var(--dan-l);border:1px solid #fecaca;color:#b91c1c}
.alert.ok{background:var(--ok-l);border:1px solid #bbf7d0;color:#15803d}
.mini-badge{font-size:10px;color:var(--ink3);background:#f8fafc;border:1px solid var(--line);padding:2px 6px;border-radius:5px}
.line-item{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.line-item:last-child{border-bottom:none}
.line-item .p{flex:1;min-width:0}
.line-item .p b{display:block;font-size:12px}
.line-item .p span{font-size:10.5px;color:var(--ink3)}
.qty-in{width:74px;height:30px;border:1px solid var(--line);border-radius:7px;padding:0 7px;font-size:12.5px;text-align:right}
.qty-in.bad{border-color:var(--dan);background:var(--dan-l);color:var(--dan)}
.link{color:var(--pri);cursor:pointer}
.link:hover{text-decoration:underline}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;background:#f8fafc;border:1px solid var(--line);color:var(--ink2)}

/* ---------- overlay ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.42);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-16px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:12.5px;z-index:90;opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(15,23,42,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#b91c1c}
.toast.ok{background:#15803d}

/* ---------- phone shell ---------- */
.phone-shell{display:contents}
.phone-top{display:none}
body.phone-mode{background:#334155}
body.phone-mode .phone-shell{display:block;width:412px;margin:14px auto;position:relative}
body.phone-mode .phone-top{display:flex;align-items:center;justify-content:space-between;background:#0f172a;color:#fff;border-radius:22px 22px 0 0;padding:10px 16px;font-size:12px}
body.phone-mode .phone-top button{background:#334155;color:#fff;border:none;border-radius:7px;padding:5px 11px;font-size:11px;cursor:pointer}
body.phone-mode .app{width:412px;height:820px;border-radius:0 0 22px 22px;overflow:hidden;transform:translateZ(0);box-shadow:0 18px 50px rgba(0,0,0,.35)}

/* ================= COMPACT ================= */
body.compact .side{position:fixed;left:0;top:0;bottom:0;width:262px;transform:translateX(-102%);transition:transform .24s;box-shadow:8px 0 30px rgba(15,23,42,.14)}
body.compact.nav-open .side{transform:translateX(0)}
body.compact .burger{display:flex;align-items:center;justify-content:center}
body.compact .top{padding:0 12px;height:52px;flex:0 0 52px;gap:8px}
body.compact .demo-flag{display:none}
body.compact .phone-btn{padding:5px 7px;font-size:10.5px}
body.compact .view{padding:14px 12px 40px}
body.compact .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
body.compact .g3,body.compact .g2{grid-template-columns:minmax(0,1fr)}
body.compact .grid>*,body.compact .g2>*,body.compact .g3>*,body.compact .g4>*{min-width:0}
body.compact .card,body.compact .kpi{min-width:0;max-width:100%}
body.compact .card{padding:14px}
body.compact .card-h>*{min-width:0}
body.compact .kpi .vl{font-size:20px}
body.compact .page-head h2{font-size:17px}
body.compact .pain{max-width:100%}
body.compact .bar-track{min-width:0}
body.compact .field input,body.compact .field select{min-width:0;max-width:100%}
body.compact .controls .field{min-width:0;flex:1 1 44%}
body.compact .donut-wrap{gap:12px}
body.compact table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
body.compact th,body.compact td{white-space:nowrap}
body.compact .tb-wrap table{display:table;width:100%}
body.compact .tb-wrap.allow table{display:block}
body.phone-mode .app .side{width:230px;flex-basis:230px}
body.phone-mode .app{height:820px}
</style>
</head>

/* ---------- SVG charts ---------- */
function donut(items,totalText){
  const size=172,cx=86,cy=86,r=58,c=2*Math.PI*r;
  const total=items.reduce((s,i)=>s+i.v,0)||1;
  let off=0;
  const segs=items.map(it=>{
    const len=it.v/total*c;
    const s='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+it.c+'" stroke-width="22" stroke-dasharray="'+(len-2)+' '+(c-len+2)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    off+=len; return s;
  }).join('');
  const lg=items.map(it=>'<div class="lg"><i style="background:'+it.c+'"></i><span>'+it.k+'</span><b>'+(it.v/total*100).toFixed(1)+'%</b></div>').join('');
  return '<div class="donut-wrap"><svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" style="flex:0 0 '+size+'px">'+segs+
    '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="12" fill="#94a3b8">累计消费</text>'+
    '<text x="'+cx+'" y="'+(cy+17)+'" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">'+(totalText||wan(total))+'</text></svg>'+
    '<div class="legends">'+lg+'</div></div>';
}
function barChart(items,fmt){
  const w=480,h=176,padL=48,padB=26,padT=10;
  const max=Math.max.apply(null,items.map(i=>i.v))*1.12||1;
  const rowH=(h-padT-padB)/items.length;
  let out='';
  items.forEach((it,i)=>{
    const bw=(it.v/max)*(w-padL-16);
    const y=padT+i*rowH+rowH*0.18;
    const bh=rowH*0.6;
    out+='<text x="'+(padL-8)+'" y="'+(y+bh*0.72)+'" text-anchor="end" font-size="11" fill="#475569">'+it.k+'</text>';
    out+='<rect x="'+padL+'" y="'+y+'" width="'+(w-padL-16)+'" height="'+bh+'" rx="4" fill="#f1f5f9"/>';
    out+='<rect x="'+padL+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="4" fill="'+(it.c||'#2563eb')+'"/>';
    out+='<text x="'+(padL+bw+6)+'" y="'+(y+bh*0.74)+'" font-size="10.5" fill="#475569">'+(fmt?fmt(it.v):it.v)+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="display:block">'+out+'</svg>';
}
function lineChart(items){
  const w=480,h=176,padL=40,padB=24,padT=12;
  const max=Math.max.apply(null,items.map(i=>i.v))*1.15;
  const min=Math.min.apply(null,items.map(i=>i.v))*0.85;
  const pts=items.map((it,i)=>{
    const x=padL+i*(w-padL-14)/(items.length-1);
    const y=padT+(1-(it.v-min)/(max-min))*(h-padT-padB);
    return {x:x,y:y,it:it};
  });
  const poly=pts.map(p=>p.x+','+p.y).join(' ');
  const area='M'+pts[0].x+','+(h-padB)+' L'+pts.map(p=>p.x+','+p.y).join(' L')+' L'+pts[pts.length-1].x+','+(h-padB)+' Z';
  let out='<path d="'+area+'" fill="#eff6ff"/>';
  out+='<polyline points="'+poly+'" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(p=>{
    out+='<circle cx="'+p.x+'" cy="'+p.y+'" r="3.5" fill="#fff" stroke="#2563eb" stroke-width="2"/>';
    out+='<text x="'+p.x+'" y="'+(p.y-10)+'" text-anchor="middle" font-size="10" fill="#475569">'+wan(p.it.v)+'</text>';
    out+='<text x="'+p.x+'" y="'+(h-6)+'" text-anchor="middle" font-size="10.5" fill="#94a3b8">'+p.it.m+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="display:block">'+out+'</svg>';
}

function fillAI(n){
  const c=custById(ST.orderCust).name;
  const txts={
    1:''+c+'：要 60 袋龙须挂面、25 袋高筋小麦粉，损耗记 2 袋',
    2:''+c+'：龙须挂面 9999 袋，急单',
    3:''+c+'：手擀面 500g 30袋、宽面 500g 45袋、白面馒头 200 个'
  };
  document.getElementById('aiText').value=txts[n];
  toast('已填入示例'+(n===2?'（超库存单）':''));
}
function aiParse(){
  const t=document.getElementById('aiText').value;
  const found=[];
  DB.products.forEach(p=>{
    const idx=t.indexOf(p.name);
    if(idx<0) return;
    // 优先识别「数量在品名之前」：如 "60 袋龙须挂面"
    const before=t.slice(0,idx).match(/(\d+)\s*[袋个把箱斤kg]?\s*$/i);
    // 兼容「数量在品名之后」：先跳过规格 token（500g / 25kg 等），再取首个数量
    let tail=t.slice(idx+p.name.length).replace(/^\s*\d+(?:\.\d+)?\s*(?:g|kg|ml|l)\b/gi,'');
    const after=tail.match(/^[^\d]{0,12}(\d+)/);
    const qty=before?+before[1]:(after?+after[1]:10);
    found.push({pid:p.id,qty:qty,loss:0});
  });
  if(!found.length){ toast('未识别到产品，请试试示例按钮','err'); return; }
  const lm=t.match(/损耗[^\d]{0,6}(\d+)/); if(lm) found[0].loss=+lm[1];
  ST.lines=found; go('order'); toast('AI 已识别 '+found.length+' 个品项并自动录入','ok');
}

function submitOrder(){
  const c=custById(ST.orderCust);
  for(const ln of ST.lines){
    const p=prodById(ln.pid);
    if(ln.qty+ln.loss>p.stock){
      const e=document.getElementById('orderErr'),o=document.getElementById('orderOk');
      e.innerHTML='⛔ <b>提交失败：</b>「'+p.name+'」本次数量 '+(ln.qty+ln.loss)+' '+p.unit+' 超出可用库存（当前库存 '+p.stock+' '+p.unit+'），无法提交。请调整数量或走补货流程。';
      e.classList.add('show'); if(o)o.classList.remove('show');
      toast('超出可用库存，无法提交','err'); return;
    }

  o.innerHTML='✅ 订单提交成功！已按 '+c.name+' 的专属价结算，库存同步扣减，单据进入配送排班。';o.classList.add('show');
  toast('订单提交成功','ok');
}

  '<div class="card" style="margin-bottom:13px"><div class="card-h"><h3><span class="dot"></span>送货单预览（'+ST.filtRoute+' / '+ST.filtRegion+'）</h3><span class="sub">'+list.length+' 行 · '+(ST.hideNoStock?'已隐藏无货产品':'含无货产品')+'</span></div>'+

    '<div class="note warn" style="margin-top:12px">🖨 <b>打印模板可自定义：</b>可自由显示/隐藏单价、总价，适配客户对账与门店收货不同场景。勾选「仅打印有现货产品」后，无货产品（鲜切面）自动隐藏。</div>'+
  '</div>'+
  '<div class="card"><div class="card-h"><h3><span class="dot" style="background:#16a34a"></span>线路品项汇总（备货用）</h3><span class="sub">按配送线路自动汇总各产品订单总量</span></div>'+
    '<div class="tb-wrap"><table><thead><tr><th>产品</th><th>规格</th><th class="r">订单总量</th><th class="r">预估货值</th></tr></thead><tbody>'+sumRows+'</tbody></table></div></div>';
}

function renderInventory(){
  const inRows=DB.inbounds.map(b=>'<tr><td>'+b.no+'</td><td><b>'+b.mat+'</b></td><td>'+b.batch+'</td><td class="r num">'+b.qty+'</td><td>'+b.time+'</td><td><span class="tag t-pri">'+b.times+'</span></td><td>'+b.by+'</td></tr>').join('');
  const dRows=DB.stockDiff.map(d=>'<tr><td><b>'+d.mat+'</b></td><td class="r num">'+d.book+'</td><td class="r num">'+d.real+'</td><td class="r num" style="color:'+(d.diff<0?'var(--dan)':'var(--ok)')+'">'+(d.diff>0?'+':'')+d.diff+'</td><td><span class="tag '+(d.type==='溢余'?'t-ok':'t-warn')+'">'+d.type+'</span></td><td>'+d.reason+'</td></tr>').join('');
  const bRows=DB.batches.map(b=>{const used=(b.used/b.qty*100).toFixed(0);return '<tr><td>'+b.id+'</td><td><b>'+b.mat+'</b></td><td>'+b.supplier+'</td><td>'+b.in+'</td><td class="r num">'+b.qty+'</td><td class="r num">'+b.used+'</td><td>'+b.to+'</td><td style="min-width:100px"><div class="bar-track"><div class="bar-fill" style="width:'+used+'%;background:#7c3aed"></div></div><span class="hint">'+used+'% 已耗用</span></td></tr>';}).join('');
  return head('inventory')+
  '<div class="grid g4" style="margin-bottom:13px">'+
    kpi('原料批次','#7c3aed',DB.batches.length+' 批','全程可溯源')+
    kpi('分次入库单','#2563eb',DB.inbounds.length+' 单','同物料多批次')+
    kpi('本期报损折损','#e5484d','46 '+('单位'),'已登记可追溯')+
    kpi('账实差异项','#e8890c',DB.stockDiff.length+' 项','账面 vs 实际')+
  '</div>'+
  '<div class="card" style="margin-bottom:13px"><div class="card-h"><h3><span class="dot"></span>分次入库登记</h3><span class="sub">原料/成品可分批次、分多次录入，无需整单一次入库</span></div>'+
    '<div class="tb-wrap"><table><thead><tr><th>入库单号</th><th>物料</th><th>批次</th><th class="r">数量(kg)</th><th>入库时间</th><th>批次</th><th>登记人</th></tr></thead><tbody>'+inRows+'</tbody></table></div></div>'+
  '<div class="grid g2">'+
    '<div class="card"><div class="card-h"><h3><span class="dot" style="background:#e5484d"></span>库存损耗与账实差异</h3><span class="sub">盈亏全程可追溯</span></div>'+
      '<div class="tb-wrap"><table><thead><tr><th>物料</th><th class="r">账面</th><th class="r">实际</th><th class="r">差异</th><th>类型</th><th>原因</th></tr></thead><tbody>'+dRows+'</tbody></table></div></div>'+
    '<div class="card"><div class="card-h"><h3><span class="dot" style="background:#7c3aed"></span>原料溯源与用量绑定</h3><span class="sub">每批原料用量分摊至对应成品</span></div>'+
      '<div class="tb-wrap"><table><thead><tr><th>批次</th><th>原料</th><th>供应商</th><th>入库日</th><th class="r">入库量</th><th class="r">已用</th><th>用于成品</th><th>耗用</th></tr></thead><tbody>'+bRows+'</tbody></table></div></div>'+
  '</div>';
}

function renderCost(){
  const rows=DB.costRows.map(r=>{
    const p=prodById(r.pid);
    const total=+(r.costMat+r.aux+r.mfg).toFixed(2);
    const outRate=(r.out/r.matIn).toFixed(2);
    const lossRate=((1-r.matIn/r.out)*100).toFixed(1);
    const gp=p.base-total, gpr=(gp/p.base*100).toFixed(1);
    return '<tr><td><b>'+p.name+'</b></td><td class="r num">'+r.matIn+'</td><td class="r num">'+r.out+'</td><td class="r num" style="color:var(--pri)">'+outRate+'</td><td class="r num">'+lossRate+'%</td>'+
      '<td class="r num">'+p2(r.costMat)+'</td><td class="r num">'+p2(r.aux)+'</td><td class="r num">'+p2(r.mfg)+'</td><td class="r num" style="font-weight:700">'+p2(total)+'</td>'+
      '<td class="r num">'+p2(p.base)+'</td><td class="r"><span class="tag '+(gpr>=18?'t-ok':'t-warn')+'">'+gpr+'%</span></td></tr>';
  }).join('');
  const bars=DB.costRows.slice(0,5).map((r,i)=>({k:prodById(r.pid).name,v:+(r.costMat+r.aux+r.mfg).toFixed(2),c:['#2563eb','#7c3aed','#16a34a','#e8890c','#0891b2'][i]}));
  return head('cost')+
  '<div class="grid g4" style="margin-bottom:13px">'+
    kpi('核算成品','#2563eb',DB.costRows.length+' 款','基于原料实际用量')+
    kpi('平均产出倍率','#16a34a','1.14','产出 / 领用')+
    kpi('平均损耗倍率','#e8890c','12.6%','转化过程损耗')+
    kpi('成本口径','#7c3aed','原料+辅料+制造','精细化分摊')+
  '</div>'+
  '<div class="card" style="margin-bottom:13px"><div class="card-h"><h3><span class="dot"></span>生产倍率与成本分摊明细</h3><span class="sub">单位成本 = 原辅料成本 + 制造费用 · 自动核算</span></div>'+
    '<div class="tb-wrap"><table><thead><tr><th>成品</th><th class="r">原料领用</th><th class="r">成品产出</th><th class="r">产出倍率</th><th class="r">损耗倍率</th><th class="r">原料成本</th><th class="r">辅料</th><th class="r">制造费用</th><th class="r">单位成本</th><th class="r">售价</th><th class="r">毛利率</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="note" style="margin-top:12px">📐 <b>倍率说明：</b>产出倍率 = 成品产出 ÷ 原料领用；损耗倍率 = (1 − 原料领用 ÷ 成品产出)。系统依据原料实际领用与成品产出自动计算，无需人工统计。</div>'+
  '</div>'+
  '<div class="card"><div class="card-h"><h3><span class="dot" style="background:#7c3aed"></span>各成品单位成本对比</h3><span class="sub">为定价与利润核算提供精准数据</span></div>'+barChart(bars,v=>'¥'+p2(v))+'</div>';
}

function renderFinance(){
  const rRows=DB.regions.map(r=>{
    const list=DB.customers.filter(c=>c.region===r);
    const ytd=sum(list,c=>c.ytd), ar=sum(list,c=>c.ar);
    return '<tr><td><b>'+r+'</b></td><td>'+list.length+'</td><td class="r num">'+money(ytd)+'</td><td class="r num" style="color:var(--warn);font-weight:600">'+money(ar)+'</td><td class="r num">'+(ar/ytd*100).toFixed(1)+'%</td><td>'+(ar/ytd>0.25?'<span class="tag t-dan">关注坏账</span>':'<span class="tag t-ok">正常</span>')+'</td></tr>';
  }).join('');
  const recRows=DB.recon.map(r=>'<tr><td>'+r.no+'</td><td><b>'+r.cust+'</b></td><td>'+r.period+'</td><td class="r num">'+money(r.amt)+'</td><td><span class="tag '+(r.status==='已确认'?'t-ok':'t-warn')+'">'+r.status+'</span></td><td>'+r.way+'</td></tr>').join('');
  return head('finance')+
  '<div class="grid g3" style="margin-bottom:13px">'+
    kpi('今日账单小计','#2563eb',money(DB.timeCash),'每日账单日清')+
    kpi('当前账期累计欠款','#e8890c',money(DB.periodAr),'账期口径汇总')+
    kpi('月底账单汇总','#16a34a',money(DB.monthEnd),'月结统一出账')+
  '</div>'+
  '<div class="card" style="margin-bottom:13px"><div class="card-h"><h3><span class="dot" style="background:#e8890c"></span>区域欠款汇总统计</h3><span class="sub">按业务员负责区域自动归集 · 管控区域坏账</span></div>'+
    '<div class="tb-wrap"><table><thead><tr><th>区域</th><th>客户数</th><th class="r">累计消费</th><th class="r">欠款合计</th><th class="r">欠款率</th><th>风险</th></tr></thead><tbody>'+rRows+'</tbody></table></div></div>'+
  '<div class="card"><div class="card-h"><h3><span class="dot"></span>双向对账记录</h3>'+
    '<span class="btn" onclick="toast(\'已导出客户对账明细 + 区域对账数据\',\'ok\')">⬇ 一键导出对账明细</span></div>'+
    '<div class="tb-wrap"><table><thead><tr><th>对账单号</th><th>客户</th><th>账期</th><th class="r">金额</th><th>状态</th><th>对账方式</th></tr></thead><tbody>'+recRows+'</tbody></table></div>'+
    '<div class="note" style="margin-top:12px">🔄 <b>双向对账：</b>客户端可自助完成历史账单与欠款对账；企业后台一键导出客户对账明细与区域对账数据，供需双方账目统一，财务日清月结。</div>'+
  '</div>';
}

/* ---------- shell / routing ---------- */
function buildNav(){
  let html='',lastG='';
  PAGES.forEach(p=>{
    if(p.group!==lastG){html+='<div class="nav-g">'+p.group+'</div>';lastG=p.group;}
    html+='<div class="nav-i" id="nav-'+p.id+'" onclick="go(\''+p.id+'\')"><span class="ic">'+p.icon+'</span><span class="nm">'+p.name+'</span>'+(p.pain?'<span class="pd">'+p.pain.split(' ').length+'</span>':'')+'</div>';
  });
  document.getElementById('nav').innerHTML=html;
}
const RENDER={dash:renderDash,customer:renderCustomer,billing:renderBilling,credit:renderCredit,order:renderOrder,delivery:renderDelivery,inventory:renderInventory,cost:renderCost,finance:renderFinance};
function go(id){
  PAGES.forEach(p=>{const el=document.getElementById('nav-'+p.id);if(el)el.classList.toggle('on',p.id===id);});
  const p=PAGES.find(x=>x.id===id);
  document.getElementById('crumb').innerHTML='京麦源 · 数智中枢 / <b>'+p.group+' / '+p.name+'</b>';
  document.getElementById('view').innerHTML=RENDER[id]();
  document.getElementById('view').scrollTop=0;
  toggleNav(false);
}
let toastTimer;
function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast on'+(type?' '+type:'');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),2400);
}
function toggleNav(force){
  const on=typeof force==='boolean'?force:!document.body.classList.contains('nav-open');
  document.body.classList.toggle('nav-open',on);
  document.getElementById('mask').classList.toggle('on',on&&document.body.classList.contains('compact'));
}
function togglePhone(){
  document.body.classList.toggle('phone-mode');
  syncCompact();
}
const NARROW=window.matchMedia('(max-width: 820px)');
function syncCompact(){
  const phone=document.body.classList.contains('phone-mode');
  document.body.classList.toggle('compact',phone||NARROW.matches);
}
NARROW.addEventListener('change',syncCompact);
window.addEventListener('resize',syncCompact);

/* ---------- boot ---------- */
buildNav();syncCompact();go('dash');
</script>
</body>
