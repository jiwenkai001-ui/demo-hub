<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车鉴云 · 机动车鉴定评估管理系统</title>
<style>
:root{
  --bg:#f3f5f9; --panel:#ffffff; --line:#e6e9f0; --text:#1f2937; --muted:#7b8494;
  --primary:#2563eb; --primary-dark:#1d4ed8; --primary-soft:#eaf1ff;
  --green:#16a34a; --green-soft:#e8f7ee; --amber:#d97706; --amber-soft:#fff5e6;
  --red:#dc2626; --red-soft:#fdecec; --purple:#7c3aed; --purple-soft:#f2edff;
  --sidebar:#0f1729; --shadow:0 1px 3px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;outline:none}
button{cursor:pointer}
a{color:var(--primary);text-decoration:none}
.app{display:flex;min-height:100vh}

/* ---------- 侧边栏 ---------- */
.sidebar{width:238px;background:var(--sidebar);color:#c5cede;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:30}
.brand{height:70px;display:flex;align-items:center;gap:11px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand-mark svg{width:22px;height:22px}
.brand-name{font-size:17px;font-weight:700;color:#fff;letter-spacing:.5px;white-space:nowrap}
.brand-sub{font-size:10px;color:#7e8ca6;letter-spacing:1.4px;white-space:nowrap}
.nav{flex:1;overflow-y:auto;padding:14px 12px 24px}
.nav::-webkit-scrollbar{width:0}
.nav-group{font-size:11px;color:#63718b;letter-spacing:1.2px;padding:16px 10px 7px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;height:42px;padding:0 12px;border-radius:9px;color:#b7c2d6;cursor:pointer;margin-bottom:2px;transition:.15s;white-space:nowrap}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(90deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.35)}
.nav-item svg{width:18px;height:18px;flex:0 0 auto;opacity:.9}
.nav-item span{font-size:13.5px}
.side-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#6d7b93;line-height:1.7}

/* ---------- 主区域 ---------- */
.main{margin-left:238px;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}
.crumb{color:var(--muted);font-size:13px}
.crumb b{color:var(--text);font-weight:600}
.top-right{display:flex;align-items:center;gap:14px}
.top-search{display:flex;align-items:center;gap:8px;background:#f5f7fb;border:1px solid transparent;border-radius:9px;padding:0 12px;height:36px;width:230px;transition:.2s}
.top-search:focus-within{border-color:#bfd3ff;background:#fff}
.top-search svg{width:16px;height:16px;color:#9aa5b6;flex:0 0 auto}
.top-search input{border:0;background:transparent;width:100%;font-size:13px}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:#64748b;position:relative}
.icon-btn:hover{background:#f8fafc;color:var(--primary)}
.icon-btn svg{width:18px;height:18px}
.dot{position:absolute;top:7px;right:8px;width:7px;height:7px;background:var(--red);border-radius:50%;border:1.5px solid #fff}
.user-chip{display:flex;align-items:center;gap:9px;padding-left:6px;border-left:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 auto}
.user-name{font-size:13px;font-weight:600;line-height:1.2}
.user-role{font-size:11px;color:var(--muted)}
.content{padding:26px 28px 50px;max-width:1600px;width:100%;margin:0 auto}

/* ---------- 通用组件 ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-head h1{font-size:22px;margin:0 0 4px;font-weight:700;letter-spacing:.3px}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 15px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#374151;font-size:13px;font-weight:500;white-space:nowrap;transition:.15s}
.btn:hover{border-color:#c7d3e8;background:#f9fbff}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 3px 8px rgba(37,99,235,.2)}
.btn.primary:hover{background:var(--primary-dark)}
.btn.danger{color:var(--red);border-color:#f3c9c9}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:7px}
.btn svg{width:15px;height:15px}
.link{border:0;background:transparent;color:var(--primary);font-size:12.5px;padding:2px 5px}
.link:hover{text-decoration:underline}
.link.red{color:var(--red)}
.link.gray{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-head h3,.card h3{margin:0;font-size:15px;font-weight:650}
.card-body{padding:18px 20px}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
.nowrap{white-space:nowrap}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:18px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.b-blue{background:var(--primary-soft);color:var(--primary)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-purple{background:var(--purple-soft);color:var(--purple)}
.b-gray{background:#eef1f5;color:#64748b}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px 19px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:86px;height:86px;border-radius:50%;background:var(--kbg);opacity:.55}
.kpi-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.kpi-label{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--kc);background:var(--kbg)}
.kpi-icon svg{width:18px;height:18px}
.kpi-value{font-size:29px;font-weight:750;line-height:1.2;margin:10px 0 4px;position:relative;z-index:1;letter-spacing:-.5px}
.kpi-sub{font-size:11.5px;color:var(--muted);position:relative;z-index:1}
.kpi-sub em{font-style:normal;color:var(--green);font-weight:600}
.kpi-sub em.down{color:var(--red)}

/* 图表 */
.chart-wrap{display:flex;align-items:center;gap:22px;min-height:195px}
.chart-wrap svg{width:100%;height:auto;max-height:195px}
.donut{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative}
.donut::after{content:"";position:absolute;width:98px;height:98px;border-radius:50%;background:#fff}
.donut-inner{position:relative;z-index:1;text-align:center}
.donut-inner b{display:block;font-size:25px;line-height:1.1}
.donut-inner span{font-size:11px;color:var(--muted)}
.legend{flex:1;display:flex;flex-direction:column;gap:10px}
.legend-row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.legend-dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.legend-row .n{margin-left:auto;font-weight:650}

/* 表格 */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:12px 14px;background:#fafbfd;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid #f0f2f6;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbfcff}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.field{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 11px;background:#fff;font-size:13px;color:var(--text);min-width:0}
.field:focus{border-color:#9dbdff;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.search-field{position:relative}
.search-field input{padding-left:32px;width:220px}
.search-field svg{position:absolute;left:10px;top:10px;width:15px;height:15px;color:#9aa5b6}
select.field{cursor:pointer;padding-right:26px}
.toolbar .spacer{flex:1}
.pager{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.pager-btns{display:flex;gap:6px}
.pg{width:29px;height:29px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#475569;font-size:12px}
.pg.active{background:var(--primary);border-color:var(--primary);color:#fff}
.empty{padding:54px 20px;text-align:center;color:var(--muted)}
.empty svg{width:42px;height:42px;color:#cbd5e1;margin-bottom:10px}

/* 时间线 / 待办 */
.todo{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #f0f2f6}
.todo:last-child{border-bottom:0}
.todo-bar{width:3px;height:34px;border-radius:3px;background:var(--amber);flex:0 0 auto}
.todo-main{flex:1;min-width:0}
.todo-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.timeline{padding:8px 20px 14px}
.tl{display:flex;gap:12px;position:relative;padding:10px 0}
.tl:not(:last-child)::before{content:"";position:absolute;left:5px;top:24px;bottom:-6px;width:1px;background:#e6e9f0}
.tl-dot{width:11px;height:11px;border-radius:50%;background:var(--primary);border:2px solid #dbeafe;flex:0 0 auto;margin-top:5px;z-index:1}
.tl-dot.green{background:var(--green);border-color:#dcfce7}
.tl-dot.amber{background:var(--amber);border-color:#fef3c7}
.tl-text{font-size:12.5px;line-height:1.5}
.tl-text b{font-weight:600}
.tl-time{font-size:11px;color:var(--muted);margin-top:2px}

/* 车辆卡片 */
.vehicle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.vehicle-card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:18px;transition:.18s}
.vehicle-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(16,24,40,.09);border-color:#c9d8f5}
.veh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.veh-icon{width:44px;height:44px;border-radius:11px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center}
.veh-icon svg{width:25px;height:25px}
.veh-plate{font-size:15px;font-weight:700;letter-spacing:.5px}
.veh-model{font-size:12.5px;color:var(--muted);margin-top:2px}
.veh-info{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;padding:13px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.veh-info div span{display:block;font-size:11px;color:var(--muted)}
.veh-info div b{font-size:12.5px;font-weight:600;word-break:break-all}
.veh-foot{display:flex;align-items:center;justify-content:space-between;padding-top:13px}

/* 检测清单 */
.check-block{border:1px solid var(--line);border-radius:11px;margin-bottom:14px;overflow:hidden}
.check-title{background:#f8fafc;padding:11px 15px;font-size:13px;font-weight:650;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.check-title::before{content:"";width:3px;height:14px;background:var(--primary);border-radius:2px}
.check-grid{padding:6px 15px 12px}
.check-row{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #f4f6f9}
.check-row:last-child{border-bottom:0}
.check-label{font-size:12.5px;color:#475569}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12px;color:#64748b;transition:.15s}
.seg input:checked+span{background:var(--primary-soft);border-color:#93b8ff;color:var(--primary);font-weight:600}
.seg input:focus-visible+span{box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.level-box{border-radius:11px;padding:15px 18px;display:flex;align-items:center;gap:14px;margin-bottom:16px}
.level-box.info{background:var(--primary-soft);border:1px solid #cfe0ff}
.level-box.warn{background:var(--amber-soft);border:1px solid #f6ddb0}
.level-box b{font-size:17px}

/* 弹窗 */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:22px}
.modal{background:#fff;border-radius:14px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.24);animation:pop .18s ease-out}
.modal.wide{width:min(980px,100%)}
.modal.narrow{width:min(520px,100%)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 22px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:16px;margin:0;font-weight:650}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:#fbfcfe;border-radius:0 0 14px 14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.form-item{display:flex;flex-direction:column;gap:6px}
.form-item.full{grid-column:1/-1}
.form-item label{font-size:12.5px;color:#4b5563;font-weight:600}
.form-item .field,.form-item textarea{width:100%;height:38px}
.form-item textarea{height:88px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;resize:vertical;font-size:13px}
.form-item textarea:focus{border-color:#9dbdff}
.req::after{content:" *";color:var(--red)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:9px 15px;border:0;background:transparent;color:var(--muted);font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:650}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}
.info-grid div span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.info-grid div b{font-size:13px;font-weight:600;word-break:break-all}
.sec-title{font-size:13px;font-weight:650;margin:20px 0 10px;padding-left:9px;border-left:3px solid var(--primary)}

/* VIN 工具 */
.vin-result{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:18px;min-height:180px}
.vin-big{font-family:ui-monospace,Consolas,monospace;font-size:24px;letter-spacing:4px;font-weight:700;color:#1e293b;margin-bottom:6px;word-break:break-all}
.vin-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #e2e8f0;font-size:13px}
.vin-row:last-child{border-bottom:0}
.vin-row span{color:var(--muted)}
.vin-row b{font-weight:600}
.mock-row{padding:12px 0;border-bottom:1px solid #f0f2f6}
.mock-row:last-child{border-bottom:0}
.mock-row .t{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.mock-row .d{font-size:12px;color:var(--muted);margin-top:3px}
.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:9px;padding:10px 13px;font-size:12px;margin-top:14px}

/* 报告纸张 */
.paper{background:#fff;border:1px solid #dfe3ea;box-shadow:0 6px 26px rgba(16,24,40,.08);padding:42px 48px;color:#1f2937;font-size:13px;line-height:1.8}
.paper-head{display:flex;align-items:center;gap:16px;border-bottom:3px double #1e3a8a;padding-bottom:16px;margin-bottom:22px}
.paper-logo{width:56px;height:56px;border:2px solid #1e3a8a;border-radius:50%;color:#1e3a8a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;line-height:1.1;text-align:center;flex:0 0 auto}
.paper-head h2{font-size:22px;margin:0;letter-spacing:3px;color:#1e3a8a}
.paper-head p{margin:2px 0 0;font-size:12px;color:#64748b}
.paper h3{font-size:14px;margin:22px 0 8px;color:#1e3a8a}
.paper-table{width:100%;border-collapse:collapse;margin:10px 0}
.paper-table td{border:1px solid #d7dde6;padding:8px 11px;font-size:12.5px}
.paper-table td.lb{background:#f5f7fb;width:110px;color:#64748b;font-weight:600}
.paper p{margin:7px 0}
.conclusion{background:#f5f8ff;border-left:4px solid #2563eb;padding:14px 16px;font-size:14px;font-weight:600;margin:10px 0 18px}
.sign-row{display:flex;justify-content:space-between;margin-top:46px;gap:30px}
.sign-box{flex:1;font-size:12.5px;color:#475569}
.sign-box .line{border-top:1px solid #94a3b8;margin-top:38px;padding-top:6px;text-align:center}
.stamp{width:98px;height:98px;border:3px solid rgba(220,38,38,.55);border-radius:50%;color:rgba(220,38,38,.65);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;line-height:1.4;transform:rotate(-14deg);margin:16px 0 0 auto}
.paper-foot{border-top:1px solid #e2e8f0;margin-top:30px;padding-top:10px;font-size:11px;color:#94a3b8}

/* Toast */
#toastRoot{position:fixed;top:18px;right:20px;z-index:300;display:flex;flex-direction:column;gap:9px}
.toast{background:#111827;color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:slide .25s ease-out;max-width:340px}
.toast.ok{background:#15803d}
.toast.err{background:#b91c1c}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
#printArea{display:none}

/* ---------- 多级导航（一级分组 / 二级模块 / 三级页面） ---------- */
.nav-item.level1{font-weight:600;color:#dbe4f2}
.nav-item.level2{padding-left:24px;font-size:13px}
.nav-item.level3{padding-left:39px;font-size:12.5px;height:35px;color:#95a3b9}
.nav-item.level3 span{font-size:12.5px}
.nav-item.level3::before{content:"";position:absolute;left:27px;top:16px;width:5px;height:5px;border-radius:50%;background:#4d5d77}
.nav-item.level3.active::before{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.nav-caret{width:13px;height:13px;margin-left:auto;transition:transform .18s;opacity:.65;flex:0 0 auto}
.nav-item.open .nav-caret{transform:rotate(90deg)}
.nav-children{display:none}
.nav-children.show{display:block}
.nav-count{margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.1);padding:1px 6px;border-radius:9px}
.nav-item.active .nav-count{background:rgba(255,255,255,.22)}

const PAGE_NAME={},PAGE_PATH={},PAGE_ANCESTORS={};
(function walk(nodes,ids,names){
  nodes.forEach(n=>{
    const ni=ids.concat(n.id),nn=names.concat(n.name);
    PAGE_ANCESTORS[n.id]=ids;PAGE_PATH[n.id]=nn;
    if(n.children)walk(n.children,ni,nn);else PAGE_NAME[n.id]=n.name;
  });
})(NAV,[],[]);
function findNav(id){
  let found=null;
  (function walk(nodes){nodes.forEach(n=>{if(n.id===id)found=n;if(n.children)walk(n.children)})})(NAV);
  return found;
}
function firstLeaf(n){while(n&&n.children)n=n.children[0];return n?n.id:'dashboard'}
function navNode(n,level){
  const has=!!n.children,open=state.navOpen.includes(n.id),active=state.page===n.id;
  const cls='nav-item level'+level+(active?' active':'')+(open?' open':'');
  const caret=has?'<svg class="nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>':'';
  const icon=n.icon?svg(ico[n.icon]):'';
  const count=has?'<span class="nav-count">'+n.children.length+'</span>':'';
  let html='<div class="'+cls+'" data-nav="'+n.id+'" title="'+n.name+'">'+icon+'<span>'+n.name+'</span>'+count+caret+'</div>';
  if(has)html+='<div class="nav-children'+(open?' show':'')+'">'+n.children.map(c=>navNode(c,level+1)).join('')+'</div>';
  return html;
}

}

const FIELDS=[
  {title:'车身结构件（事故判定核心）',rows:[['frontRail','左/右前纵梁'],['rearRail','后纵梁'],['aPillar','A 柱'],['bPillar','B 柱'],['cPillar','C 柱'],['waterTank','水箱框架'],['firewall','防火墙'],['shockTower','前减震器座'],['trunkFloor','后备箱底板']]},
  {title:'动力与底盘系统',rows:[['engine','发动机'],['gearbox','变速箱'],['chassis','底盘大梁']]},
  {title:'特殊车况排查',rows:[['water','是否水泡'],['fire','是否火烧'],['odometer','里程表状态']]}
];
const FIELD_LABEL={};FIELDS.forEach(g=>g.rows.forEach(r=>FIELD_LABEL[r[0]]=r[1]));
function computeLevel(v){
  const key=['frontRail','rearRail','aPillar','bPillar','cPillar','firewall','shockTower','trunkFloor'];
  if(key.some(k=>v[k]==='切割更换'))return '重大事故车';
  if(v.fire==='是')return '火烧车';
  if(v.water==='是')return '水泡车';
  if(key.some(k=>v[k]==='钣金修复'))return '事故车（轻微）';
  if(v.odometer==='异常')return '里程异常';
  return '非事故车';
}

function toChineseNum(n){
  n=Math.floor(Number(n)||0);
  if(n===0)return '零';
  const d='零一二三四五六七八九',units=['','十','百','千'],big=['','万','亿','万亿'];
  const sections=[];let bi=0;
  while(n>0){
    const sec=n%10000;let str='',zero=false;
    for(let i=3;i>=0;i--){
      const g=Math.floor(sec/Math.pow(10,i))%10;
      if(g===0){if(str)zero=true}
      else{if(zero){str+='零';zero=false}str+=d[g]+units[i]}
    }
    if(str)sections.unshift(str+big[bi]);
    n=Math.floor(n/10000);bi++;
  }
  return sections.join('').replace(/零+/g,'零').replace(/零$/,'');
}

/* ==================== VIN 解析 ==================== */
const WMI={'LSV':'上汽大众','LFV':'一汽-大众','LHG':'广汽本田','LHGJ':'广汽本田','LGB':'上汽通用别克','LSG':'上汽通用雪佛兰','LFN':'一汽丰田','LFM':'一汽丰田','LTV':'广汽丰田','LVH':'东风本田','LZW':'上汽通用五菱','LS5':'重庆长安','LSJ':'上汽荣威','LGX':'广汽丰田','WBA':'宝马（德国）','WDC':'梅赛德斯-奔驰（德国）','WAU':'奥迪（德国）','1HG':'本田（美国）','5YJ':'特斯拉（美国）','JM1':'马自达（日本）','KNA':'起亚（韩国）'};
const YEAR={A:2010,B:2011,C:2012,D:2013,E:2014,F:2015,G:2016,H:2017,J:2018,K:2019,L:2020,M:2021,N:2022,P:2023,R:2024,S:2025,T:2026,V:2027,W:2028,X:2029,Y:2030};
const TRANS={A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9};
const WEIGHT=[8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];
function parseVin(vin){
  vin=String(vin||'').trim().toUpperCase();
  if(vin.length!==17)return {error:'VIN 必须为 17 位字符'};
  if(/[IOQ]/.test(vin))return {error:'VIN 中不能包含字母 I、O、Q'};
  let sum=0,ok=true;
  for(let i=0;i<17;i++){const ch=vin[i];const val=/[0-9]/.test(ch)?Number(ch):TRANS[ch];if(val===undefined){ok=false;break}sum+=val*WEIGHT[i]}
  if(!ok)return {error:'VIN 包含非法字符'};
  const mod=sum%11,expect=mod===10?'X':String(mod);
  const region={'L':'中国','W':'德国','1':'美国','5':'美国','J':'日本','K':'韩国','S':'英国','V':'法国','3':'墨西哥','2':'加拿大'}[vin[0]]||'其他地区';
  let maker='未收录制造商';Object.keys(WMI).sort((a,b)=>b.length-a.length).forEach(k=>{if(vin.startsWith(k))maker=WMI[k]});
  return {vin,check:expect===vin[8],expect,region,maker,year:YEAR[vin[9]]||'未知（'+vin[9]+'）',plant:vin.slice(10,12),serial:vin.slice(12),type:['1','2','3','4','5','6','7','8'].includes(vin[0])?'乘用车':'车辆'};
}
function vinResultHtml(res){

  return '<div class="vin-big">'+esc(res.vin)+'</div>'+
  '<div style="margin-bottom:12px"><span class="badge '+(res.check?'b-green':'b-red')+'">'+(res.check?'校验位通过 · VIN 格式有效':'校验位不符 · 请核对 VIN 准确性')+'</span></div>'+

  '<div class="vin-row"><span>车型年份（第10位）</span><b>'+esc(res.year)+'</b></div><div class="vin-row"><span>校验位（第9位）</span><b>'+esc(res.vin[8])+'（应为 '+esc(res.expect)+'）</b></div>'+

}
function mockRecords(vin){
  const seed=vin.charCodeAt(vin.length-1)%3;
  const b=['2024-03-18','2023-09-06','2022-11-22','2021-05-14'],a=['更换机油机滤 · 4S 店 regular','前刹车片更换 · 4S 店','空调滤芯更换 · 4S 店','首次保养 · 4S 店'];

  '<div class="page-head"><div><h1>关于系统</h1><p>车鉴云 · 机动车鉴定评估管理系统　v1.1</p></div></div>'+
  '<div class="grid-2"><div class="card pad"><h3 style="margin-bottom:12px">系统概述</h3><p>本系统面向机动车鉴定评估机构，覆盖案件受理、车辆查勘、结构检测、事故等级判定、报告出具与归档的全业务流程。采用三级导航结构，所有业务数据保存在本地浏览器中。</p>'+
  '<div class="sec-title">版本信息</div><div class="info-grid"><div><span>系统版本</span><b>v1.1.0</b></div><div><span>导航层级</span><b>三级（分类 / 模块 / 页面）</b></div><div><span>数据存储</span><b>localStorage</b></div><div><span>开发架构</span><b>原生 HTML + CSS + JavaScript</b></div><div><span>适用行业</span><b>机动车鉴定评估 / 二手车检测</b></div><div><span>报告规范</span><b>GB/T 30323 参考</b></div></div></div>'+
  '<div class="card pad"><h3 style="margin-bottom:12px">功能模块一览</h3>'+NAV.filter(n=>n.children).map(g=>'<div style="margin-bottom:12px"><b>'+g.name+'</b><div style="margin-top:5px">'+g.children.map(m=>'<span class="badge b-gray" style="margin:3px 5px 3px 0">'+m.name+'（'+m.children.length+' 页）</span>').join('')+'</div></div>').join('')+
  '<div class="sec-title">使用提示</div><p class="muted">点击左侧二级模块可展开三级页面；工作台待办与全局搜索可快速定位案件；检测结论保存后会自动判定事故等级并写入报告。</p></div></div>';
}

/* ==================== 渲染入口 ==================== */
const PAGES={
  dashboard:renderDashboard,
  'case-all':renderCases,'case-pending':renderCases,'case-doing':renderCases,'case-done':renderCases,
  'inspect-task':renderInspection,'inspect-standard':renderInspectStandard,
  'report-all':renderReports,'report-draft':renderReports,'report-signed':renderReports,
  'vehicle-all':renderVehicles,'vehicle-accident':renderVehicles,'vehicle-clean':renderVehicles,
  'vin-parse':()=>renderVin('parse'),'vin-history':()=>renderVin('history'),
  'catalog-brand':()=>renderCatalog('brand'),'catalog-series':()=>renderCatalog('series'),'catalog-model':()=>renderCatalog('model'),
  'staff-expert':renderExperts,'staff-auditor':renderAuditors,
  'client-company':renderClients,'client-person':renderClients,
  'config-structure':()=>renderConfig('structure'),'config-power':()=>renderConfig('power'),'config-special':()=>renderConfig('special'),
  'setting-company':renderSettings,'setting-role':renderRoles,'setting-about':renderAbout
};
function render(){
  document.getElementById('content').innerHTML=(PAGES[state.page]||renderDashboard)();
  const u=document.getElementById('userName');if(u)u.textContent=DB.settings.appraiser;
  const a=document.getElementById('avatar');if(a)a.textContent=(DB.settings.appraiser||'鉴')[0];
}

/* ==================== 交互事件 ==================== */
document.addEventListener('click',e=>{
  const navEl=e.target.closest('[data-nav]');
  if(navEl){
    const nid=navEl.dataset.nav,node=findNav(nid);
    if(node&&node.children){
      const i=state.navOpen.indexOf(nid);
      if(i>=0){state.navOpen.splice(i,1);renderNav();return}
      state.navOpen.push(nid);navigate(firstLeaf(node));
    }else navigate(nid);
    return;
  }
  const nav=e.target.closest('[data-page]');if(nav){navigate(nav.dataset.page);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  if(act==='overlay'){if(e.target===el)closeModal();return}
  if(act==='close-modal'){closeModal();return}
  if(act==='notify'){toast('您有 '+DB.cases.filter(c=>['待受理','检测中','报告编制'].includes(c.status)).length+' 项待处理案件');return}
  if(act==='new-case'){openCaseForm();return}
  if(act==='case-detail'){openCase(id);return}
  if(act==='case-edit'){openCaseForm(id);return}
  if(act==='save-case'){saveCase(id);return}
  if(act==='case-del'){
    if(confirm('确定删除案件 '+id+' 吗？此操作不可撤销。')){DB.cases=DB.cases.filter(c=>c.id!==id);delete DB.inspections[id];save();render();toast('案件已删除')}return;
  }
  if(act==='case-tab'){state.detailTab=el.dataset.tab;renderCaseModal();return}
  if(act==='open-inspect'){openInspection(id);return}
  if(act==='save-inspect'){saveInspection(id);return}
  if(act==='gen-report'){const r=ensureReport(id);closeModal();render();viewReport(r.id);return}
  if(act==='view-report'){viewReport(id);return}
  if(act==='print-report'){printReport(id);return}
  if(act==='export-report'){
    const r=DB.reports.find(x=>x.id===id);if(!r)return;
    const blob=new Blob([JSON.stringify(r,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=r.id+'.json';a.click();URL.revokeObjectURL(a.href);toast('报告数据已导出');return;
  }
  if(act==='parse-vin'){
    const v=document.getElementById('vinInput');state.vinText=v?v.value.trim().toUpperCase():'';render();return;
  }
  if(act==='query-history'){
    const v=document.getElementById('hisVin').value.trim().toUpperCase();
    if(v.length!==17){toast('请输入 17 位 VIN 码','err');return}
    document.getElementById('hisResult').innerHTML=mockRecords(v);toast('查询完成（演示数据）');return;
  }
  if(act==='new-expert'){openExpertForm();return}
  if(act==='save-expert'){
    const d={};new FormData(document.querySelector('.modal .form-grid')).forEach((v,k)=>d[k]=String(v).trim());
    if(!d.name){toast('请填写姓名','err');return}
    d.years=Number(d.years)||1;DB.experts.push({id:uid('E'),...d,status:d.status||'在岗'});save();closeModal();render();toast('鉴定师已添加');return;
  }
  if(act==='del-expert'){if(confirm('确定移除该鉴定师？')){DB.experts=DB.experts.filter(x=>x.id!==id);save();render();toast('已移除')}return}
  if(act==='new-client'){openClientForm();return}
  if(act==='save-client'){
    const d={};new FormData(document.querySelector('.modal .form-grid')).forEach((v,k)=>d[k]=String(v).trim());
    if(!d.name){toast('请填写客户名称','err');return}
    DB.clients.push({id:uid('K'),...d});save();closeModal();render();toast('客户已添加');return;
  }
  if(act==='del-client'){if(confirm('确定删除该客户？')){DB.clients=DB.clients.filter(x=>x.id!==id);save();render();toast('已删除')}return}
  if(act==='save-settings'){
    document.querySelectorAll('.card.pad input.field').forEach(i=>{if(i.name)DB.settings[i.name]=i.value.trim()});
    document.querySelectorAll('.card.pad input[type=checkbox]').forEach(i=>DB.settings[i.name]=i.checked);
    save();render();toast('系统设置已保存');return;
  }
  if(act==='new-catalog'){openCatalogForm();return}
  if(act==='save-catalog'){
    const d={};new FormData(document.querySelector('.modal .form-grid')).forEach((v,k)=>d[k]=String(v).trim());
    if(!d.brand||!d.series||!d.model){toast('品牌、车系、车型为必填项','err');return}
    let b=DB.catalog.find(x=>x.brand===d.brand);
    if(!b){b={brand:d.brand,series:[]};DB.catalog.push(b)}
    let s=b.series.find(x=>x.name===d.series);
    if(!s){s={name:d.series,models:[]};b.series.push(s)}
    let m=s.models.find(x=>x.name===d.model);
    if(!m){m={name:d.model,years:[]};s.models.push(m)}
    String(d.years||'').split(/[,，、\s]+/).filter(Boolean).forEach(y=>{if(!m.years.includes(y))m.years.push(y)});
    save();closeModal();render();toast('车型分类已保存');return;
  }
  if(act==='reset-data'){if(confirm('确定恢复演示数据？当前所有修改将被清除。')){DB=seedDB();save();navigate('dashboard');toast('已恢复演示数据')}return}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.filter){state[e.target.dataset.filter]=e.target.value;render()}
  if(e.target.dataset.config){
    const item=DB.checkItems.find(i=>i.key===e.target.dataset.config);
    if(item){item.enabled=e.target.checked;save();toast('检测项配置已更新');render()}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='caseQ'){state.q=e.target.value;render();const n=document.getElementById('caseQ');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&e.target.id==='vinInput'){e.preventDefault();state.vinText=e.target.value.trim().toUpperCase();render()}
  if(e.key==='Enter'&&e.target.id==='globalSearch'){
    const q=e.target.value.trim();if(!q)return;state.q=q;navigate('case-all');toast('已按「'+q+'」筛选案件');
  }
});

/* ==================== 启动 ==================== */
renderNav();navigate('dashboard');
</script>
</body>
</html>
