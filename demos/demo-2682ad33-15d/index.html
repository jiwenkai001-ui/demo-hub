<title>阳光采购平台 - 生鲜食材供应链</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --green-900:#14532d;--green-800:#166534;--green-700:#15803d;--green-600:#16a34a;
  --green-500:#22c55e;--green-400:#4ade80;--green-200:#bbf7d0;--green-100:#dcfce7;--green-50:#f0fdf4;
  --amber-600:#d97706;--amber-500:#f59e0b;--amber-400:#fbbf24;--amber-200:#fde68a;--amber-100:#fef3c7;
  --blue-600:#2563eb;--blue-500:#3b82f6;--blue-100:#dbeafe;
  --red-600:#dc2626;--red-500:#ef4444;--red-100:#fee2e2;
  --purple-600:#9333ea;--purple-100:#f3e8ff;
  --slate-800:#1e293b;--slate-700:#334155;--slate-600:#475569;--slate-500:#64748b;
  --slate-400:#94a3b8;--slate-300:#cbd5e1;--slate-200:#e2e8f0;--slate-100:#f1f5f9;--slate-50:#f8fafc;
  --radius:12px;--shadow:0 2px 8px rgba(0,0,0,.06);--shadow-lg:0 8px 24px rgba(0,0,0,.1);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--slate-100);color:var(--slate-800);font-size:14px;line-height:1.6}

/* ====== LAYOUT ====== */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--green-900);color:#fff;flex-shrink:0;display:flex;flex-direction:column}
.sidebar-logo{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.sidebar-logo-icon{width:36px;height:36px;background:var(--green-500);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.sidebar-logo h1{font-size:15px;font-weight:700;line-height:1.2}
.sidebar-logo span{font-size:10px;opacity:.7}
.sidebar-menu{flex:1;padding:12px 8px;overflow-y:auto}
.sidebar-group{margin-bottom:16px}
.sidebar-group-label{font-size:10px;color:rgba(255,255,255,.4);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:1px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.8);transition:all .15s;margin-bottom:2px}
.sidebar-item:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar-item.active{background:var(--green-600);color:#fff;font-weight:600}
.sidebar-item svg{width:16px;height:16px;flex-shrink:0}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{height:60px;background:#fff;border-bottom:1px solid var(--slate-200);display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:var(--shadow);flex-shrink:0}
.header-left{display:flex;align-items:center;gap:16px}
.page-title-lg{font-size:17px;font-weight:700;color:var(--slate-800)}
.header-right{display:flex;align-items:center;gap:14px}
.role-tabs{display:flex;background:var(--slate-100);border-radius:8px;padding:3px}
.role-tab{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;color:var(--slate-500);transition:all .15s;white-space:nowrap}
.role-tab:hover{color:var(--slate-700)}
.role-tab.active{background:#fff;color:var(--green-700);box-shadow:var(--shadow)}
.device-toggle{display:flex;background:var(--slate-100);border-radius:8px;padding:3px}
.device-btn{padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--slate-500);display:flex;align-items:center;justify-content:center}
.device-btn.active{background:#fff;color:var(--green-700);box-shadow:var(--shadow)}
.device-btn svg{width:16px;height:16px}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}

.content{flex:1;padding:20px 24px;overflow-y:auto}

/* ====== KPI CARDS ====== */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi-card{background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border-top:3px solid var(--green-600)}
.kpi-card.accent-amber{border-top-color:var(--amber-500)}
.kpi-card.accent-blue{border-top-color:var(--blue-500)}
.kpi-card.accent-red{border-top-color:var(--red-500)}
.kpi-card.accent-purple{border-top-color:var(--purple-600)}
.kpi-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--slate-500);margin-bottom:8px}
.kpi-label svg{width:14px;height:14px}
.kpi-value{font-size:24px;font-weight:800;color:var(--slate-800);line-height:1.2}
.kpi-value .unit{font-size:13px;font-weight:600;color:var(--slate-400);margin-left:2px}
.kpi-trend{font-size:11px;margin-top:6px;font-weight:600}
.kpi-trend.up{color:var(--green-600)}
.kpi-trend.down{color:var(--red-500)}
.kpi-trend.neutral{color:var(--slate-400)}

/* ====== CARDS ====== */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--slate-100)}
.card-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--slate-800)}
.card-title svg{width:16px;height:16px;color:var(--green-600)}
.card-action{font-size:12px;color:var(--green-600);cursor:pointer;font-weight:600}
.card-action:hover{color:var(--green-700)}
.card-body{padding:16px 18px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* ====== TABLE ====== */
.table-wrap{overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{text-align:left;padding:10px 14px;background:var(--slate-50);color:var(--slate-600);font-weight:600;border-bottom:1px solid var(--slate-200);white-space:nowrap}
.data-table td{padding:10px 14px;border-bottom:1px solid var(--slate-100);color:var(--slate-700)}
.data-table tr{cursor:pointer;transition:background .15s}
.data-table tr:hover{background:var(--green-50)}
.data-table b{color:var(--slate-800)}

/* ====== TAGS ====== */
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.tag-green{background:var(--green-100);color:var(--green-700)}
.tag-amber{background:var(--amber-100);color:#92400E}
.tag-red{background:var(--red-100);color:#991B1B}
.tag-blue{background:var(--blue-100);color:#1E40AF}
.tag-purple{background:var(--purple-100);color:#5B21B6}
.tag-slate{background:var(--slate-100);color:var(--slate-600)}
.tag-teal{background:#ccfbf1;color:#0f766e}

/* ====== PROGRESS ====== */
.progress-bar{height:8px;background:var(--slate-100);border-radius:4px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--green-500);border-radius:4px;transition:width .3s}

/* ====== TIMELINE ====== */
.timeline{border-left:2px solid var(--slate-200);padding-left:16px}
.timeline-item{position:relative;padding-bottom:14px}
.timeline-item::before{content:'';position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--slate-300);border:2px solid #fff}
.timeline-item.done::before{background:var(--green-500)}
.timeline-item.current::before{background:var(--amber-500)}
.timeline-time{font-size:10px;color:var(--slate-400);font-weight:600}
.timeline-title{font-size:13px;font-weight:700;color:var(--slate-800);margin:2px 0}
.timeline-desc{font-size:11px;color:var(--slate-500);line-height:1.6}

/* ====== PHOTO GRID ====== */
.photo-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.photo-item{aspect-ratio:1;background:var(--slate-100);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden}
.photo-item:hover{transform:scale(1.03)}
.photo-item::after{content:attr(data-label);position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);color:#fff;font-size:9px;padding:2px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-icon{font-size:24px}

/* ====== STEPS ====== */
.steps-row{display:flex;align-items:center;gap:4px}
.step-item{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.step-dot{width:32px;height:32px;border-radius:50%;background:var(--slate-200);color:var(--slate-400);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.step-dot.done{background:var(--green-500);color:#fff}
.step-dot.current{background:var(--amber-500);color:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.4)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}
.step-line{flex:1;height:2px;background:var(--slate-200);min-width:20px}
.step-line.done{background:var(--green-500)}

/* ====== FILTER TABS ====== */
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter-tab{padding:5px 12px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--slate-200);color:var(--slate-500);background:#fff;transition:all .15s}
.filter-tab:hover{border-color:var(--green-400)}
.filter-tab.active{background:var(--green-600);color:#fff;border-color:var(--green-600)}

/* ====== BAR CHART ====== */
.bar-chart{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-label{font-size:11px;color:var(--slate-600);width:80px;flex-shrink:0;font-weight:600}
.bar-track{flex:1;height:24px;background:var(--slate-100);border-radius:6px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:10px;color:#fff;font-weight:700}
.bar-fill.green{background:linear-gradient(90deg,var(--green-500),var(--green-400))}
.bar-fill.amber{background:linear-gradient(90deg,var(--amber-500),var(--amber-400))}
.bar-fill.red{background:linear-gradient(90deg,var(--red-500),var(--red-400))}
.bar-fill.blue{background:linear-gradient(90deg,var(--blue-500),var(--blue-400))}
.bar-fill.purple{background:linear-gradient(90deg,var(--purple-600),#a855f7)}

/* ====== DONUT ====== */
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{width:100px;height:100px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:'';position:absolute;top:15px;left:15px;right:15px;bottom:15px;background:#fff;border-radius:50%}
.donut-center{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1}
.donut-num{font-size:18px;font-weight:800;color:var(--slate-800)}
.donut-label{font-size:9px;color:var(--slate-400)}
.donut-legend{display:flex;flex-direction:column;gap:6px;flex:1}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--slate-600)}
.legend-dot{width:8px;height:8px;border-radius:50%}

/* ====== ROLE NOTICE ====== */
.role-notice{background:var(--green-50);color:var(--green-700);padding:10px 14px;border-radius:8px;font-size:12px;line-height:1.6;margin-bottom:14px}

/* ====== DETAIL VIEW ====== */
.back-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer;color:var(--green-600);font-size:13px;font-weight:600;padding:8px 0;transition:opacity .2s}
.back-bar:hover{opacity:.7}
.back-bar svg{width:18px;height:18px}
.detail-hero{background:linear-gradient(135deg,var(--green-800),var(--green-600));border-radius:var(--radius);padding:20px 24px;color:#fff;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.detail-hero-info h2{font-size:20px;font-weight:700;margin-bottom:4px}
.detail-hero-info p{font-size:12px;opacity:.9;line-height:1.8}
.detail-hero-tag{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.detail-hero-tag .tag{font-size:12px;padding:4px 14px}
.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.info-item{background:var(--slate-50);border-radius:10px;padding:10px 14px}
.info-label{font-size:10px;color:var(--slate-500);margin-bottom:2px}
.info-value{font-size:13px;font-weight:600;color:var(--slate-800)}
.click-hint{font-size:10px;color:var(--green-500);font-weight:400;margin-left:4px}

/* ====== EDIT SYSTEM ====== */
.edit-toggle{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--green-200);color:var(--green-600);background:var(--green-50);transition:all .15s}
.edit-toggle:hover{background:var(--green-100)}
.edit-toggle.active{background:var(--green-600);color:#fff}
.detail-view-banner{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--green-50);border-radius:8px;margin-bottom:14px;font-size:12px;color:var(--green-700)}
.btn{padding:7px 18px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--green-600);color:#fff}
.btn-primary:hover{background:var(--green-700)}
.btn-cancel{background:var(--slate-100);color:var(--slate-600)}
.btn-cancel:hover{background:var(--slate-200)}
.btn-save{background:var(--green-600);color:#fff}
.btn-save:hover{background:var(--green-700)}

.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:600;color:var(--slate-700);margin-bottom:5px;display:block}
.form-input,.form-textarea,.form-select{width:100%;padding:8px 12px;border:1px solid var(--slate-200);border-radius:8px;font-size:12px;color:var(--slate-800);font-family:inherit;transition:border .15s;box-sizing:border-box}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--green-500);outline:none;box-shadow:0 0 0 3px rgba(34,197,94,.1)}
.form-textarea{min-height:70px;resize:vertical;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ====== MODAL ====== */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:540px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--slate-100);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0;z-index:1}
.modal-title{font-size:14px;font-weight:700;color:var(--slate-800)}
.modal-close{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--slate-400);transition:all .15s}
.modal-close:hover{background:var(--slate-100);color:var(--slate-700)}
.modal-body{padding:18px 20px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--slate-100);position:sticky;bottom:0;background:#fff;border-radius:0 0 14px 14px}

/* ====== PUBLIC NOTICE ====== */
.notice-card{padding:12px 14px;border:1px solid var(--slate-200);border-radius:10px;margin-bottom:10px;transition:all .15s;cursor:pointer}
.notice-card:hover{border-color:var(--green-300);background:var(--green-50)}
.notice-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.notice-card-title{font-size:13px;font-weight:700;color:var(--slate-800)}
.notice-card-meta{font-size:10px;color:var(--slate-400)}
.notice-card-desc{font-size:11px;color:var(--slate-500);line-height:1.6}

/* ====== TRACE MAP ====== */
.trace-steps{display:flex;gap:0;margin:10px 0}
.trace-step{flex:1;text-align:center;position:relative;padding-top:30px}
.trace-step::before{content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--slate-200);border:3px solid #fff;z-index:1}
.trace-step.done::before{background:var(--green-500)}
.trace-step.current::before{background:var(--amber-500)}
.trace-step::after{content:'';position:absolute;top:19px;left:50%;right:-50%;height:2px;background:var(--slate-200)}
.trace-step:last-child::after{display:none}
.trace-step.done::after{background:var(--green-500)}
.trace-step-name{font-size:10px;color:var(--slate-500);font-weight:600}
.trace-step.done .trace-step-name{color:var(--green-600)}
.trace-step.current .trace-step-name{color:var(--amber-600)}
.trace-step-time{font-size:9px;color:var(--slate-400);margin-top:2px}

/* ====== MOBILE ====== */
.mobile-frame{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:375px;height:700px;background:#000;border-radius:40px;padding:12px;z-index:100;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mobile-frame.active{display:block}
.mobile-screen{width:100%;height:100%;background:var(--slate-100);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.mobile-header{background:#fff;padding:12px 14px;border-bottom:1px solid var(--slate-200);display:flex;align-items:center;justify-content:space-between}
.mobile-header-title{font-size:14px;font-weight:700;color:var(--slate-800)}
.mobile-role-bar{display:flex;gap:6px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--slate-100);overflow-x:auto;white-space:nowrap}
.mobile-role-chip{padding:4px 12px;border-radius:16px;font-size:11px;font-weight:600;background:var(--slate-100);color:var(--slate-500);border:none;cursor:pointer;flex-shrink:0}
.mobile-role-chip.active{background:var(--green-600);color:#fff}
.mobile-content{flex:1;overflow-y:auto;padding:12px}
.mobile-bottom-nav{display:flex;background:#fff;border-top:1px solid var(--slate-200);padding:4px 0}
.mobile-bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:9px;color:var(--slate-400);cursor:pointer;background:none;border:none}
.mobile-bottom-nav-item.active{color:var(--green-600)}
.mobile-bottom-nav-item svg{width:18px;height:18px}
.mobile-close{position:absolute;top:-30px;right:0;color:#fff;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:16px;font-size:12px;cursor:pointer}

/* Mobile responsive overrides */
.mobile-screen .kpi-grid{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.mobile-screen .kpi-card{padding:10px 12px}
.mobile-screen .kpi-value{font-size:18px}
.mobile-screen .two-col{grid-template-columns:1fr;gap:10px}
.mobile-screen .three-col{grid-template-columns:1fr;gap:8px}
.mobile-screen .card{margin-bottom:10px}
.mobile-screen .card-header{padding:10px 12px}
.mobile-screen .card-body{padding:12px}
.mobile-screen .card-title{font-size:12px}
.mobile-screen .data-table{font-size:10px}
.mobile-screen .data-table th,.mobile-screen .data-table td{padding:6px 8px}
.mobile-screen .photo-grid{grid-template-columns:repeat(3,1fr)}
.mobile-screen .info-grid{grid-template-columns:repeat(2,1fr)}
.mobile-screen .filter-tab{font-size:10px;padding:4px 10px}
.mobile-screen .detail-hero{padding:14px 16px}
.mobile-screen .detail-hero-info h2{font-size:16px}
.mobile-screen .detail-hero-info p{font-size:11px}
.mobile-screen .steps-row{flex-wrap:wrap;gap:2px}
.mobile-screen .step-dot{width:24px;height:24px;font-size:10px}
.mobile-screen .step-line{min-width:10px}
.mobile-screen .donut-wrap{flex-direction:column;gap:10px}
.mobile-screen .content{padding:10px 12px}

/* Page title */
.page-title-section{margin-bottom:16px}
.page-title{font-size:20px;font-weight:800;color:var(--slate-800);margin-bottom:4px}
.page-sub{font-size:12px;color:var(--slate-500)}
.role-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--green-700);background:var(--green-50);padding:6px 12px;border-radius:8px;margin-bottom:12px;font-weight:600;display:inline-flex}

/* Section header */
.section-h{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.section-h .bar{flex:1;height:1px;background:var(--slate-200)}
.section-h span{font-size:12px;font-weight:700;color:var(--slate-600);white-space:nowrap}

/* Mini stat */
.mini-stat{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--slate-50);border-radius:10px}
.mini-stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.mini-stat-label{font-size:10px;color:var(--slate-500)}
.mini-stat-value{font-size:15px;font-weight:800;color:var(--slate-800)}

/* Quality score */
.quality-score{text-align:center;padding:14px}
.quality-num{font-size:36px;font-weight:800;color:var(--green-600);line-height:1}
.quality-label{font-size:11px;color:var(--slate-400);margin-top:4px}
.quality-ring{width:100px;height:100px;margin:0 auto 8px;border-radius:50%;background:conic-gradient(var(--green-500) 0deg,var(--green-500) calc(var(--pct)*3.6deg),var(--slate-100) calc(var(--pct)*3.6deg));display:flex;align-items:center;justify-content:center}
.quality-ring::after{content:'';width:72px;height:72px;background:#fff;border-radius:50%}
.quality-ring-num{position:absolute;font-size:20px;font-weight:800;color:var(--green-600)}
</style>

  function render(){
    const html = RENDERERS[currentModule] ? RENDERERS[currentModule]() : '<div class="page-title">模块开发中</div>';
    document.getElementById('mainContent').innerHTML = html;
    updateSidebar();
    updatePageTitle();
    buildMobileNav();
    renderMobileContent();
    wireUpEvents();

  function updateSidebar(){
    const menu = document.getElementById('sidebarMenu');
    const allowed = ROLE_MODULES[currentRole] || [];
    let html = '';
    MENU.forEach(group => {
      const visibleItems = group.items.filter(i => allowed.includes(i.id));
      if(visibleItems.length === 0) return;
      html += `<div class="sidebar-group"><div class="sidebar-group-label">${group.group}</div>`;
      visibleItems.forEach(item => {
        html += `<div class="sidebar-item ${currentModule===item.id?'active':''}" data-module="${item.id}">${svg(item.icon)}${item.label}</div>`;
      });
      html += `</div>`;
    });
    menu.innerHTML = html;
    menu.querySelectorAll('.sidebar-item').forEach(i=>{
      i.onclick = ()=>switchModule(i.dataset.module);
    });
  }

  function updatePageTitle(){
    let title = '';
    MENU.forEach(g => g.items.forEach(i => { if(i.id===currentModule) title = i.label; }));
    document.getElementById('pageTitle').textContent = title || '工作台';
  }

  // ====== MODAL ======
  function showModal(title, bodyHtml){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modalOverlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <div class="modal-head">
          <div class="modal-title">${title}</div>
          <div class="modal-close" id="modalCloseBtn">✕</div>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-footer">
          <button class="btn btn-cancel" id="modalCancelBtn">取消</button>
          <button class="btn btn-primary" id="modalSaveBtn">💾 保存</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('modalCloseBtn').onclick = closeModal;
    document.getElementById('modalCancelBtn').onclick = closeModal;
    document.getElementById('modalSaveBtn').onclick = ()=>{ closeModal(); };
    overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  }
  function closeModal(){
    const m = document.getElementById('modalOverlay');
    if(m) m.remove();
  }

  // ====== NAVIGATION ======
  function switchRole(role){
    currentRole = role;
    renderRoleTabs();
    const allowed = ROLE_MODULES[role] || [];
    if(!allowed.includes(currentModule) && allowed.length > 0){
      currentModule = allowed[0];
    }
    render();
  }

  function switchModule(mod){
    const allowed = ROLE_MODULES[currentRole] || [];
    if(!allowed.includes(mod)) return;
    currentModule = mod;
    currentView = 'list';
    render();
  }

  function switchDevice(device){
    currentDevice = device;
    document.getElementById('desktopBtn').classList.toggle('active', device==='desktop');
    document.getElementById('mobileBtn').classList.toggle('active', device==='mobile');
    document.getElementById('mobileFrame').classList.toggle('active', device==='mobile');
  }

  // ====== INIT ======
  renderRoleTabs();
  render();

  document.getElementById('desktopBtn').onclick = ()=>switchDevice('desktop');
  document.getElementById('mobileBtn').onclick = ()=>switchDevice('mobile');
  document.getElementById('mobileClose').onclick = ()=>switchDevice('desktop');

  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });
})();
