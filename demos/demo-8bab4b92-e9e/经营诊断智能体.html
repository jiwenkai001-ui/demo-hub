<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>经营诊断智能体 · 租金6折优惠申请分析</title>
<style>
:root{
  --bg:#f4f6fb;--surface:#ffffff;--border:#e6eaf1;--text:#1e293b;--sub:#64748b;
  --mute:#94a3b8;--primary:#4f46e5;--primary-soft:#eef2ff;--indigo:#6366f1;
  --shadow:0 2px 12px rgba(16,24,40,.06);--radius:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
button{cursor:pointer}

.app{height:100vh;display:flex;flex-direction:column}
.topbar{height:66px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;font-size:19px;font-weight:700;box-shadow:0 4px 12px rgba(79,70,229,.3)}
.logo strong{display:block;font-size:16px}
.logo small{display:block;font-size:11px;color:var(--mute);letter-spacing:.3px}
.topbar-right{display:flex;align-items:center;gap:10px}
.engine-badge{font-size:12px;padding:7px 12px;border-radius:20px;background:#ecfdf5;color:#047857;font-weight:600}
.btn{border:1px solid transparent;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:600;transition:.15s}
.btn-ghost{background:var(--surface);color:var(--sub);border-color:var(--border)}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:#4338ca}
.btn:disabled{opacity:.5;cursor:not-allowed}

.workspace{flex:1;display:grid;grid-template-columns:minmax(380px,44%) 1fr;gap:0;min-height:0}
.left-panel{background:var(--bg);border-right:1px solid var(--border);overflow-y:auto;padding:20px 22px 40px}
.right-panel{background:var(--surface);min-width:0;display:flex}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.panel-head h2{font-size:17px;margin:0 0 4px}
.panel-head p{margin:0;font-size:12px;color:var(--sub)}
.update-time{font-size:11px;color:var(--mute);white-space:nowrap;margin-top:3px}

.diag-panel{display:flex;flex-direction:column;gap:18px}
.score-card{background:linear-gradient(135deg,#eef2ff,#faf5ff);border:1px solid #e0e7ff;border-radius:var(--radius);padding:20px;display:flex;align-items:center;gap:22px}
.score-ring{width:100px;height:100px;border-radius:50%;flex-shrink:0;position:relative;background:conic-gradient(var(--color) var(--score),#e2e8f0 0);display:grid;place-items:center}
.score-inner{width:80px;height:80px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-num{font-size:30px;font-weight:800;line-height:1;color:var(--color)}
.score-unit{font-size:11px;color:var(--mute);margin-top:3px}
.score-meta h3{margin:8px 0 6px;font-size:15px}
.score-meta p{margin:0;font-size:12.5px;line-height:1.6;color:#475569}
.severity-pill{font-size:11px;color:#fff;padding:3px 10px;border-radius:12px;font-weight:600}

.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px 14px;display:flex;flex-direction:column;gap:3px}
.metric-label{font-size:11.5px;color:var(--sub)}
.metric-value{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.metric-sub{font-size:10.5px;color:var(--mute)}
.metric-indigo .metric-value{color:#4f46e5}.metric-blue .metric-value{color:#0284c7}
.metric-green .metric-value{color:#16a34a}.metric-red .metric-value{color:#dc2626}
.metric-amber .metric-value{color:#d97706}.metric-orange .metric-value{color:#ea580c}

.panel-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.section-heading{font-size:14px;margin:0 0 16px}
.dimension-list{display:flex;flex-direction:column;gap:14px}
.dimension-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dimension-name{font-size:12.5px;font-weight:600}
.dimension-score{font-size:13px;font-weight:700}
.dimension-track{height:6px;background:#eef2f7;border-radius:4px;overflow:hidden}
.dimension-fill{height:100%;border-radius:4px;transition:width .5s}
.dimension-finding{margin:6px 0 0;font-size:11px;color:var(--sub);line-height:1.5}
.cause-list{display:flex;flex-direction:column;gap:10px}
.cause-item{display:flex;gap:10px;align-items:flex-start}
.cause-item>div{display:flex;flex-direction:column;gap:2px}
.cause-item strong{font-size:12.5px}
.cause-item span{font-size:11px;color:var(--sub);line-height:1.5}
.weight-tag{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:700;flex-shrink:0;margin-top:2px}
.w-高{background:#fee2e2;color:#b91c1c}.w-中{background:#fef3c7;color:#b45309}.w-低{background:#f1f5f9;color:#64748b}

.chat-view{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{height:62px;flex-shrink:0;border-bottom:1px solid var(--border);padding:0 22px;display:flex;align-items:center;justify-content:space-between}
.chat-title{display:flex;align-items:center;gap:10px}
.bot-avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.chat-title strong{display:block;font-size:14px}
.chat-title small{display:block;font-size:11px;color:var(--mute)}
.engine-chip{font-size:11px;color:var(--sub);background:var(--bg);border:1px solid var(--border);padding:5px 10px;border-radius:16px}
.chat-messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.chat-welcome{margin:auto;text-align:center;max-width:460px}
.welcome-icon{font-size:42px;margin-bottom:12px}
.chat-welcome h2{font-size:20px;margin:0 0 10px}
.chat-welcome p{color:var(--sub);line-height:1.7;font-size:13px}
.welcome-chips,.chat-suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.welcome-chips button,.chat-suggestions button{background:var(--surface);border:1px solid var(--primary);color:var(--primary);border-radius:18px;padding:8px 14px;font-size:12.5px;transition:.15s}
.welcome-chips button:hover,.chat-suggestions button:hover{background:var(--primary-soft)}
.chat-suggestions{padding:0 24px 8px;margin-top:0;justify-content:flex-start}
.chat-suggestions button:disabled{opacity:.5}
.msg{display:flex;gap:10px;max-width:92%}
.msg-user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{width:30px;height:30px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.msg-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.msg-tag{font-size:10.5px;color:var(--sub)}
.msg-user .msg-tag{text-align:right}
.msg-content{border-radius:12px;padding:14px 16px;line-height:1.7;font-size:13px;background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 3px rgba(16,24,40,.04)}
.msg-user .msg-content{background:var(--primary);color:#fff;border-color:transparent}
.markdown h3{font-size:15px;margin:4px 0 10px}
.markdown h4{font-size:13.5px;margin:12px 0 6px}
.markdown p{margin:6px 0}
.markdown ul{margin:8px 0;padding-left:20px}
.markdown li{margin:4px 0}
.markdown strong{font-weight:700}
.markdown blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--primary);background:var(--primary-soft);border-radius:0 8px 8px 0;color:#4338ca;font-size:12.5px}
.markdown code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}
.md-space{height:4px}
.msg-user .msg-content.markdown blockquote{background:rgba(255,255,255,.15);color:#fff;border-color:#fff}
.thinking{display:flex;gap:5px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;width:fit-content}
.thinking span{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:bounce 1.2s infinite}
.thinking span:nth-child(2){animation-delay:.2s}.thinking span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.chat-input{padding:14px 24px 20px;border-top:1px solid var(--border);display:flex;gap:10px}
.chat-input input{flex:1;border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:13.5px;outline:none;transition:.15s}
.chat-input input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.chat-input button{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:0 20px;font-size:13px;font-weight:600}
.chat-input button:disabled{opacity:.5;cursor:not-allowed}

.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border-radius:16px;width:min(820px,96vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 12px}
.modal-head h2{font-size:18px;margin:0}
.icon-btn{background:none;border:none;font-size:20px;color:var(--sub)}
.modal-hint{margin:0;padding:0 24px 12px;color:var(--sub);font-size:12.5px}
.modal-body{padding:0 24px;overflow-y:auto}
.edit-group{margin-bottom:20px}
.edit-group h4{font-size:13px;margin:0 0 10px;color:var(--primary);padding-bottom:6px;border-bottom:1px solid var(--border)}
.edit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
.edit-field{display:flex;flex-direction:column;gap:5px}
.edit-field span{font-size:11.5px;color:var(--sub)}
.edit-field input,.edit-field textarea{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;outline:none}
.edit-field input:focus,.edit-field textarea:focus{border-color:var(--primary)}
.f-full{grid-column:1/-1}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border)}
@media(max-width:980px){.workspace{grid-template-columns:1fr;grid-template-rows:45% 55%}.left-panel{border-right:none;border-bottom:1px solid var(--border)}.edit-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">
      <span class="logo-mark">诊</span>
      <div><strong>经营诊断智能体</strong><small>Business Diagnosis Agent · 离线单文件版</small></div>
    </div>
    <div class="topbar-right">
      <span class="engine-badge">⚙ 规则引擎（离线可用）</span>
      <button class="btn btn-ghost" id="btnReload">载入示例</button>
      <button class="btn btn-primary" id="btnEdit">编辑数据</button>
    </div>
  </header>
  <div class="workspace">
    <aside class="left-panel">
      <div class="panel-head">
        <div><h2 id="panelTitle">经营诊断</h2><p id="panelSub">分析面板</p></div>
        <span class="update-time" id="updateTime"></span>
      </div>
      <div id="diagArea"></div>
    </aside>
    <main class="right-panel">
      <div class="chat-view">
        <div class="chat-header">
          <div class="chat-title"><span class="bot-avatar">智</span><div><strong>经营诊断智能体</strong><small>基于申请数据 · 可解释分析</small></div></div>
          <span class="engine-chip">规则引擎</span>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-suggestions" id="chatSuggestions"></div>
        <form class="chat-input" id="chatForm">
          <input id="chatInput" placeholder="输入你的问题，例如：为什么会亏损？6折该不该批？" autocomplete="off" />
          <button type="submit" id="chatSend">发送 ➤</button>
        </form>
      </div>
    </main>
  </div>
</div>
<div id="modalRoot"></div>

<script>
/* ============================================================
   经营诊断智能体 · 纯前端单文件版
   全部逻辑内联，无后端、无外部依赖，双击即可离线运行
   ============================================================ */

/* ---------- 1. 工具函数 ---------- */
function r2(n){ return Number.isFinite(n) ? Math.round(n*100)/100 : 0; }
function div(a,b){ return b===0 ? 0 : a/b; }
function fmt(n){ return (Number(n)||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
var money = function(n){ return '¥'+fmt(n); };          // 带符号（引擎文本/聊天用）
var metricMoney = function(n){ return fmt(n); };        // 无符号（指标卡片用）
function pct(n,d){ if(d===undefined) d=1; return (((Number(n)||0))*100).toFixed(d)+'%'; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ---------- 2. 示例数据（来自《丈八北名创租管费优惠申请（租金6折）》） ---------- */
var SAMPLE = {
  cityCompany:'西安公司', projectName:'3号零星', merchantName:'名创优品', shopNo:'ZZBL001',
  businessType:'零售', categoryL1:'综合零售', categoryL2:'日用百货', supplierLevel:'二级', brandLevel:'A',
  area:389.94, avgSales3m:142948.77,
  costs:{ rent:46793, managementFee:12392.29, electricity:1800, water:0, posRent:0,
          warehouseRent:0, advertising:0, laborCost:18500, accommodationCost:1500, otherCost:0 },
  employeeCount:4, grossMargin:0.35, discountPeriod:'2026-10', discountRate:0.6,
  reason:'名创优品自2018.10.28开业，近期门前客流环比下降32.96%；销售较2025年同期下滑28.87%（142948.77/200990.88）；邻近500米大贸城存在同品牌竞争。2026年1-9月已给予每月18717元租金扶持，申请10月继续给予18717元租金扶持（租金6折），综合管理费不变。',
  contractStart:'2018.10.28', contractEnd:'2026.10.27', deposit:111132
};

/* ---------- 3. 指标重算 ---------- */
function parseDropPct(reason,keywords){
  for(var i=0;i<keywords.length;i++){
    var re=new RegExp(keywords[i]+'[^0-9]{0,6}([0-9]+(?:\\.[0-9]+)?)\\s*%');
    var m=reason.match(re);
    if(m) return r2(Number(m[1]));
  }
  return 0;
}
function computeMetrics(data){
  var c=data.costs;
  var totalCost=c.rent+c.managementFee+c.electricity+c.water+c.posRent+c.warehouseRent+c.advertising+c.laborCost+c.accommodationCost+c.otherCost;
  var avgSalesPsf=div(data.avgSales3m,data.area);
  var rentSalesRatio=div(c.rent+c.managementFee,data.avgSales3m);
  var avgSalary=div(c.laborCost,data.employeeCount);
  var monthlyProfit=data.avgSales3m*data.grossMargin-totalCost;
  var breakEvenSales=div(totalCost,data.grossMargin);
  var discountAmount=c.rent*(1-data.discountRate);
  var discountedRentMgmt=c.rent+c.managementFee-discountAmount;
  var discountedRatio=div(discountedRentMgmt,data.avgSales3m);
  var discountedProfit=monthlyProfit+discountAmount;
  return {
    totalCost:r2(totalCost), avgSalesPsf:r2(avgSalesPsf),
    rentSalesRatio:Math.round(rentSalesRatio*10000)/10000, avgSalary:r2(avgSalary),
    monthlyProfit:r2(monthlyProfit), breakEvenSales:r2(breakEvenSales),
    discountAmount:r2(discountAmount), discountedRentMgmt:r2(discountedRentMgmt),
    discountedRatio:Math.round(discountedRatio*10000)/10000, discountedProfit:r2(discountedProfit),
    salesDropPct:parseDropPct(data.reason,['下滑','下降','下跌','同比']),
    trafficDropPct:parseDropPct(data.reason,['客流','人流','到访'])
  };
}

/* ---------- 4. 诊断引擎 ---------- */
function severityFromScore(s){ if(s>=75)return'good'; if(s>=55)return'watch'; if(s>=35)return'warning'; return'critical'; }
var SEVERITY_LABEL={good:'良好',watch:'关注',warning:'预警',critical:'严重'};
var SEVERITY_COLOR={good:'#16a34a',watch:'#f59e0b',warning:'#f97316',critical:'#dc2626'};

function diagnose(data){
  var m=computeMetrics(data);
  var dimensions=[];

  // 1. 盈利能力
  var profitMargin=m.monthlyProfit/(data.avgSales3m||1);
  var profitScore=m.monthlyProfit>0?Math.min(100,60+profitMargin*200):Math.max(5,55+profitMargin*250);
  dimensions.push({
    key:'profitability',name:'盈利能力',severity:severityFromScore(profitScore),score:Math.round(profitScore),
    finding:m.monthlyProfit>=0?('月净利润为正（'+money(m.monthlyProfit)+'），毛利率 '+pct(data.grossMargin)+'，处于盈利状态。'):('月净利润为负（'+money(m.monthlyProfit)+'），净利率 '+pct(profitMargin)+'，处于亏损状态。'),
    detail:'在 '+pct(data.grossMargin)+' 毛利率下，月度毛利约 '+money(data.avgSales3m*data.grossMargin)+'，扣除总成本 '+money(m.totalCost)+' 后'+(m.monthlyProfit>=0?'仍有盈余':'不足以覆盖成本')+'。',
    advice:m.monthlyProfit>=0?'维持当前毛利与成本结构，关注成本上行风险。':'提升毛利或减少刚性成本，是扭亏的关键路径。'
  });

  // 2. 坪效
  var psfScore=Math.max(5,Math.min(100,m.avgSalesPsf/8));
  dimensions.push({
    key:'efficiency',name:'坪效水平',severity:severityFromScore(psfScore),score:Math.round(psfScore),
    finding:'坪效 '+money(m.avgSalesPsf)+'/㎡·月，'+(m.avgSalesPsf<300?'低于':m.avgSalesPsf<600?'接近':'高于')+'零售业态常见区间。',
    detail:'建筑面积 '+data.area+'㎡，月均销售 '+money(data.avgSales3m)+'。坪效反映单位面积的产出效率，是判断铺位价值的核心指标。',
    advice:m.avgSalesPsf<400?'通过提升陈列效率、调整品类结构或优化动线提高单位面积产出。':'坪效表现尚可，可继续保持。'
  });

  // 3. 租售比
  var ratioPct=m.rentSalesRatio;
  var ratioScore=ratioPct<=0.15?92:ratioPct<=0.2?80:ratioPct<=0.25?65:ratioPct<=0.3?50:ratioPct<=0.4?30:12;
  dimensions.push({
    key:'rentBurden',name:'租售比',severity:severityFromScore(ratioScore),score:ratioScore,
    finding:'原租售比 '+pct(ratioPct)+'，'+(ratioPct>0.3?'明显偏高（健康参考值约 15%~25%）':'处于合理区间')+'。',
    detail:'租金+综合管理费 '+money(data.costs.rent+data.costs.managementFee)+' 占月销售 '+money(data.avgSales3m)+' 的 '+pct(ratioPct)+'；折后租售比降至 '+pct(m.discountedRatio)+'。',
    advice:ratioPct>0.3?'租金刚性负担偏重，是亏损的重要结构性因素；需通过扶持或租金模式调整缓解。':'租售比健康，租金负担可控。'
  });

  // 4. 成本结构
  var rentShare=(data.costs.rent+data.costs.managementFee)/(m.totalCost||1);
  var laborShare=(data.costs.laborCost+data.costs.accommodationCost)/(m.totalCost||1);
  var costScore=rentShare>0.75?28:rentShare>0.6?48:72;
  dimensions.push({
    key:'costStructure',name:'成本结构',severity:severityFromScore(costScore),score:costScore,
    finding:'租管费占总成本 '+pct(rentShare)+'，人工占 '+pct(laborShare)+'，成本以刚性支出为主。',
    detail:'总成本 '+money(m.totalCost)+' 中，租金+管理费 '+money(data.costs.rent+data.costs.managementFee)+'、人工+住宿 '+money(data.costs.laborCost+data.costs.accommodationCost)+'。刚性成本占比高意味着销售下滑时利润弹性差。',
    advice:rentShare>0.7?'刚性成本占比过高，抗风险能力弱；建议探索浮动租金/联营抽成模式。':'成本结构相对均衡。'
  });

  // 5. 盈亏平衡
  var coverage=m.breakEvenSales>0?data.avgSales3m/m.breakEvenSales:1;
  var beScore=Math.max(5,Math.min(100,coverage*70));
  dimensions.push({
    key:'breakEven',name:'盈亏平衡',severity:severityFromScore(beScore),score:Math.round(beScore),
    finding:'盈亏平衡销售额 '+money(m.breakEvenSales)+'，当前销售达成 '+pct(Math.min(coverage,9.99),0)+'，'+(coverage<1?'尚未跨过盈亏平衡点':'已越过盈亏平衡点')+'。',
    detail:'按 '+pct(data.grossMargin)+' 毛利率，需月销 '+money(m.breakEvenSales)+' 才能覆盖 '+money(m.totalCost)+' 总成本；当前月销 '+money(data.avgSales3m)+'，缺口 '+money(Math.max(0,m.breakEvenSales-data.avgSales3m))+'。',
    advice:coverage<1?'需将月销提升至盈亏平衡线以上，或同步压降成本、提高毛利。':'已实现盈亏平衡，关注安全边际。'
  });

  // 6. 成长趋势
  var drop=Math.max(m.salesDropPct,m.trafficDropPct);
  var trendScore=drop>=30?15:drop>=20?30:drop>=10?50:75;
  if(drop>0){
    dimensions.push({
      key:'trend',name:'成长趋势',severity:severityFromScore(trendScore),score:trendScore,
      finding:'销售同比下滑 '+m.salesDropPct+'%，客流环比下降 '+m.trafficDropPct+'%，处于'+(drop>=25?'明显':'轻度')+'下行通道。',
      detail:'趋势指标来自申请备注中的披露，反映外部需求与客流的变化，是亏损的直接触发因素。',
      advice:'需判断下滑是商圈性、季节性还是竞争性，针对性制定引流与差异化策略。'
    });
  }

  // 7. 优惠效能
  var lossBefore=Math.max(0,-m.monthlyProfit);
  var offsetRate=lossBefore>0?m.discountAmount/lossBefore:1;
  var discountScore=m.discountedProfit>=0?90:offsetRate>=0.7?65:offsetRate>=0.4?45:25;
  dimensions.push({
    key:'discount',name:'优惠效能',severity:severityFromScore(discountScore),score:discountScore,
    finding:'月优惠 '+money(m.discountAmount)+'，可覆盖原亏损的 '+pct(Math.min(offsetRate,9.99),0)+'；折后盈亏 '+money(m.discountedProfit)+'。',
    detail:'折扣率 '+pct(data.discountRate,0)+'，折后月租管费 '+money(m.discountedRentMgmt)+'，折后租售比 '+pct(m.discountedRatio)+'。',
    advice:offsetRate<1?'单次优惠不足以完全扭亏，需配套经营改善措施，避免形成长期依赖。':'优惠后可实现盈亏平衡或盈利。'
  });

  // 综合健康分（加权）
  var weights={profitability:0.28,efficiency:0.12,rentBurden:0.2,costStructure:0.12,breakEven:0.16,trend:0.07,discount:0.05};
  var healthScore=0,weightSum=0;
  for(var i=0;i<dimensions.length;i++){
    var d=dimensions[i]; var w=weights[d.key]!==undefined?weights[d.key]:0.05;
    healthScore+=d.score*w; weightSum+=w;
  }
  healthScore=Math.round(healthScore/(weightSum||1));
  var overallSeverity=severityFromScore(healthScore);

  // 根因推断
  var rootCauses=[];
  if(m.rentSalesRatio>0.3) rootCauses.push({factor:'租金刚性偏高',evidence:'租售比 '+pct(m.rentSalesRatio)+'，租管费占总成本 '+pct(rentShare),weight:'高'});
  if(m.trafficDropPct>0) rootCauses.push({factor:'外部客流下滑',evidence:'备注披露客流环比下降 '+m.trafficDropPct+'%',weight:'高'});
  if(m.salesDropPct>0) rootCauses.push({factor:'销售趋势恶化',evidence:'销售同比下滑 '+m.salesDropPct+'%',weight:'高'});
  if(/竞争|竞品|同品牌|大贸城/.test(data.reason)) rootCauses.push({factor:'同业竞争分流',evidence:'备注提及邻近区域存在同品牌竞争',weight:'中'});
  if(m.avgSalesPsf<400) rootCauses.push({factor:'坪效偏低',evidence:'坪效仅 '+money(m.avgSalesPsf)+'/㎡·月，空间产出不足',weight:'中'});
  if(data.costs.laborCost>0&&laborShare<0.2) rootCauses.push({factor:'人力投入相对不足',evidence:'人工+住宿仅占总成本 '+pct(laborShare)+'，可能影响服务与销售转化',weight:'低'});
  if(!rootCauses.length) rootCauses.push({factor:'暂无显著异常',evidence:'各项指标处于合理区间',weight:'低'});

  // 风险
  var risks=[];
  if(m.monthlyProfit<0) risks.push('持续亏损：月度净亏损 '+money(Math.abs(m.monthlyProfit))+'，现金流承压。');
  if(coverage<1) risks.push('销售未达盈亏平衡线，缺口 '+money(m.breakEvenSales-data.avgSales3m)+'。');
  if(offsetRate<1) risks.push('优惠只能部分减亏，若外部客流持续下滑，扶持效果将被侵蚀。');
  if(/已给予|连续|每月.*扶持/.test(data.reason)) risks.push('存在连续多月扶持记录，需警惕政策依赖与公平性质疑。');
  if(m.rentSalesRatio>0.3) risks.push('租售比长期高于健康区间，商户可持续经营能力存疑。');

  // 机会
  var opportunities=[];
  if(m.discountAmount>0) opportunities.push('6折扶持每月释放 '+money(m.discountAmount)+' 现金流，可缓解短期压力。');
  if(m.discountedRatio<m.rentSalesRatio) opportunities.push('折后租售比由 '+pct(m.rentSalesRatio)+' 降至 '+pct(m.discountedRatio)+'，经营弹性改善。');
  if(m.avgSalesPsf<400) opportunities.push('坪效提升空间大，品类优化与陈列调整有望带来增量。');
  opportunities.push('可探索销售抽成/联营等浮动租金模式，实现商场与商户风险共担。');

  // 建议
  var recommendations=[];
  if(m.monthlyProfit<0&&offsetRate<1) recommendations.push({
    title:'短期：延续定向扶持并设置退出机制',
    detail:'建议批准本期 '+money(m.discountAmount)+' 租金扶持，但以"月度销售回升至 '+money(m.breakEvenSales*0.9)+' 以上"作为递减/退出条件，避免无限期依赖。',priority:'高'});
  if(/竞争|同品牌/.test(data.reason)) recommendations.push({
    title:'中期：差异化定位应对竞争',
    detail:'结合品牌等级与客群，调整品类结构、引入体验型/高毛利品类，降低与周边同品牌的价格竞争。',priority:'高'});
  recommendations.push({
    title:'中期：提升坪效与人效',
    detail:'当前坪效 '+money(m.avgSalesPsf)+'/㎡、人效 '+money(data.avgSales3m/(data.employeeCount||1))+'/人，建议优化陈列动线与排班，设定月度提升目标。',priority:'中'});
  recommendations.push({
    title:'长期：协商浮动租金方案',
    detail:'以"保底租金+销售抽成"替代固定租金，在销售下行期自动降低商户负担，实现风险共担。',priority:'中'});
  recommendations.push({
    title:'管理：建立经营数据跟踪台账',
    detail:'按月采集销售、客流、坪效数据，设置租售比与盈亏平衡预警线，实现从事后审批到事前预警的转变。',priority:'低'});

  var headline=m.monthlyProfit>=0
    ? (data.merchantName+' 整体经营'+(overallSeverity==='good'?'健康':'基本平稳')+'，健康分 '+healthScore+'，租售比 '+pct(m.rentSalesRatio)+' 需持续关注。')
    : (data.merchantName+' 处于亏损状态（月净亏 '+money(Math.abs(m.monthlyProfit))+'），核心矛盾是租售比 '+pct(m.rentSalesRatio)+' 偏高叠加销售下滑 '+(m.salesDropPct||0)+'%，健康分 '+healthScore+'。');

  return {
    generatedAt:new Date().toISOString(),data:data,metrics:m,healthScore:healthScore,
    overallSeverity:overallSeverity,headline:headline,dimensions:dimensions,rootCauses:rootCauses,
    risks:risks,opportunities:opportunities,recommendations:recommendations
  };
}

var PATTERNS=[
  {intent:'greeting',words:['你好','您好','hi','hello','在吗','嗨']},
  {intent:'rootcause',words:['根因','原因','为什么','为何','什么原因','归因','根源','导致']},
  {intent:'recommend',words:['建议','怎么办','如何改进','措施','对策','方案','优化','该不该','要不要批','审批']},
  {intent:'risk',words:['风险','隐患','危险','问题','注意']},
  {intent:'discount',words:['优惠','扶持','折扣','减免','6折','六折','月优惠','折后']},
  {intent:'rent',words:['租售比','租金','管理费','租管费','房租']},
  {intent:'efficiency',words:['坪效','面积','单位面积','㎡','产出效率']},
  {intent:'cost',words:['成本','人工','人工成本','费用结构','成本结构']},
  {intent:'breakeven',words:['盈亏平衡','平衡点','保本','达成','缺口']},
  {intent:'trend',words:['趋势','下滑','下降','客流','同比','环比','竞争','销售']},
  {intent:'profit',words:['盈利','亏损','利润','净利','毛利','赚钱','赔钱']},
  {intent:'data',words:['数据','公式','怎么算','怎么来的','来源','口径','依据']},
  {intent:'overview',words:['诊断','总结','整体','概况','分析','评估','健康','看一下','review']}
];
var INTENT_LABEL={overview:'整体诊断',profit:'盈利能力',rent:'租售比',efficiency:'坪效',cost:'成本结构',breakeven:'盈亏平衡',trend:'趋势',discount:'优惠效能',rootcause:'根因分析',risk:'风险提示',recommend:'改进建议',data:'数据口径',greeting:'问候',unknown:'自由提问'};
var INTENT_ICON={rootcause:'🔍',recommend:'✅',rent:'🏠',discount:'🎁',risk:'⚠️',profit:'💰',efficiency:'📐',cost:'🧾',breakeven:'⚖️',trend:'📉',overview:'📊',data:'📋',greeting:'👋'};
function recognizeIntent(question){
  var q=question.toLowerCase().trim();
  for(var i=0;i<PATTERNS.length;i++){
    var p=PATTERNS[i];
    for(var j=0;j<p.words.length;j++){ if(q.indexOf(p.words[j].toLowerCase())>=0) return p.intent; }
  }
  return'unknown';
}
function severityZh(s){return({good:'良好',watch:'关注',warning:'预警',critical:'严重'})[s]||s;}
var COST_LABEL={rent:'租金',managementFee:'综合管理费',electricity:'电费',water:'水费',posRent:'POS租金',warehouseRent:'仓库租金',advertising:'广告宣传',laborCost:'人工成本',accommodationCost:'员工住宿',otherCost:'其他成本'};

        '- 租售比 = (租金 + 管理费) ÷ 月均销售',
        '- 成本合计 = 各成本项求和（本引擎已修正原表漏计 POS/仓库/广告三项的问题）',
        '- 月净利润 = 销售 × 毛利率 − 成本合计',
        '- 盈亏平衡点 = 成本合计 ÷ 毛利率',
        '- 月优惠金额 = 租金 × (1 − 折扣率)',
        '- 折后各项 = 折后租管费基础上重算','',
        '销售下滑、客流下降等趋势信号从申请备注文本中解析得到。诊断结论由确定性规则推导，可解释、可复现。'
      ].join('\n');
    default:
      return [
        '我理解你想了解「'+INTENT_LABEL[intent]+'」相关内容。基于当前数据，我的核心判断是：','',
        d.headline,'',
        '我可以帮你深入分析以下方面，试试点选或换种问法：',
        '- 为什么亏损？（根因分析）',
        '- 租售比健康吗？（租金诊断）',
        '- 6折优惠该不该批？（审批建议）',
        '- 有哪些风险？（风险提示）',
        '- 给出经营改善建议'
      ].join('\n');
  }
}
var DEFAULT_SUGGESTIONS=['整体诊断怎么样？','为什么会亏损？','6折优惠合理吗？','租售比怎么改善？','给出审批建议','有哪些风险？'];

/* ---------- 7. Markdown 渲染（安全转义） ---------- */
function inlineMd(text){
  return String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/g).filter(Boolean).map(function(p){
    if(p.indexOf('**')===0&&p.lastIndexOf('**')===p.length-2) return '<strong>'+p.slice(2,-2)+'</strong>';
    if(p.indexOf('`')===0&&p.lastIndexOf('`')===p.length-2) return '<code>'+p.slice(1,-1)+'</code>';
    return p;
  }).join('');
}
function renderMarkdown(text){
  var lines=String(text).split('\n'),html='',list=[];
  function flush(){ if(list.length){html+='<ul>'+list.map(function(x){return '<li>'+inlineMd(esc(x))+'</li>';}).join('')+'</ul>'; list=[];} }
  for(var i=0;i<lines.length;i++){
    var t=lines[i].trim();
    if(t.indexOf('- ')===0){list.push(t.slice(2)); continue;}
    flush();
    if(t.indexOf('## ')===0) html+='<h3>'+inlineMd(esc(t.slice(3)))+'</h3>';
    else if(t.indexOf('### ')===0) html+='<h4>'+inlineMd(esc(t.slice(4)))+'</h4>';
    else if(t.indexOf('> ')===0) html+='<blockquote>'+inlineMd(esc(t.slice(2)))+'</blockquote>';
    else if(t==='') html+='<div class="md-space"></div>';
    else html+='<p>'+inlineMd(esc(t))+'</p>';
  }
  flush();
  return html;
}

/* ---------- 8. 状态与渲染 ---------- */
var state={data:clone(SAMPLE),diagnosis:null,messages:[],suggestions:DEFAULT_SUGGESTIONS.slice(),loading:false};

function renderDiagnosis(){
  var d=state.diagnosis,m=d.metrics;
  document.getElementById('panelTitle').textContent=d.data.merchantName+' · '+d.data.shopNo;
  document.getElementById('panelSub').textContent=d.data.cityCompany+' / '+d.data.projectName+' · '+d.data.discountPeriod;
  document.getElementById('updateTime').textContent='更新于 '+new Date(d.generatedAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  var color=SEVERITY_COLOR[d.overallSeverity],scoreDeg=d.healthScore*3.6;
  var html='<div class="diag-panel">';
  // 健康分
  html+='<section class="score-card"><div class="score-ring" style="--score:'+scoreDeg+'deg;--color:'+color+'"><div class="score-inner"><span class="score-num" style="color:'+color+'">'+d.healthScore+'</span><span class="score-unit">/100</span></div></div><div class="score-meta"><span class="severity-pill" style="background:'+color+'">'+SEVERITY_LABEL[d.overallSeverity]+'</span><h3>经营健康分</h3><p>'+esc(d.headline)+'</p></div></section>';
  // 指标
  var metrics=[
    ['月均销售',metricMoney(d.data.avgSales3m),'近3个月','indigo'],
    ['坪效',metricMoney(m.avgSalesPsf),'元/㎡·月','blue'],
    ['租售比',pct(m.rentSalesRatio),'折后 '+pct(m.discountedRatio),m.rentSalesRatio>0.3?'red':'green'],
    ['月净利润',metricMoney(m.monthlyProfit),'亏损',m.monthlyProfit<0?'red':'green'],
    ['盈亏平衡线',metricMoney(m.breakEvenSales),'达成 '+pct(Math.min(m.breakEvenSales?d.data.avgSales3m/m.breakEvenSales:0,9.99),0),'amber'],
    ['月优惠金额',metricMoney(m.discountAmount),pct(d.data.discountRate,0)+' 折扣','orange']
  ];
  html+='<section class="metric-grid">';
  metrics.forEach(function(x){html+='<div class="metric metric-'+x[3]+'"><span class="metric-label">'+x[0]+'</span><span class="metric-value">'+x[1]+'</span><span class="metric-sub">'+x[2]+'</span></div>';});
  html+='</section>';
  // 维度
  html+='<section class="panel-section"><h3 class="section-heading">📊 维度诊断</h3><div class="dimension-list">';
  d.dimensions.forEach(function(dim){
    var c=SEVERITY_COLOR[dim.severity];
    html+='<div class="dimension"><div class="dimension-head"><span class="dimension-name">'+dim.name+'</span><span class="dimension-score" style="color:'+c+'">'+dim.score+'</span></div><div class="dimension-track"><div class="dimension-fill" style="width:'+dim.score+'%;background:'+c+'"></div></div><p class="dimension-finding">'+esc(dim.finding)+'</p></div>';
  });
  html+='</div></section>';
  // 根因
  html+='<section class="panel-section"><h3 class="section-heading">🔍 根因推断</h3><div class="cause-list">';
  d.rootCauses.forEach(function(c){html+='<div class="cause-item"><span class="weight-tag w-'+c.weight+'">'+c.weight+'</span><div><strong>'+esc(c.factor)+'</strong><span>'+esc(c.evidence)+'</span></div></div>';});
  html+='</div></section>';
  html+='</div>';
  document.getElementById('diagArea').innerHTML=html;
}

function renderChat(){
  var box=document.getElementById('chatMessages'),html='';
  if(state.messages.length===0){
    html='<div class="chat-welcome"><div class="welcome-icon">🤖</div><h2>你好，我是经营诊断智能体</h2><p>我已读取这份《租金6折优惠申请》的数据并完成诊断。左侧是分析结果，你可以针对任意维度向我提问。</p><div class="welcome-chips">';
    DEFAULT_SUGGESTIONS.forEach(function(s){html+='<button data-q="'+esc(s)+'">'+esc(s)+'</button>';});
    html+='</div></div>';
  }else{
    state.messages.forEach(function(msg){
      html+='<div class="msg msg-'+msg.role+'">';
      if(msg.role==='assistant') html+='<div class="msg-avatar">智</div>';
      html+='<div class="msg-body">';
      if(msg.intent) html+='<div class="msg-tag">'+(INTENT_ICON[msg.intent]||'💬')+' 分析 · '+(msg.engine==='llm'?'AI增强':'规则')+'</div>';
      html+='<div class="msg-content markdown">'+renderMarkdown(msg.content)+'</div></div></div>';
    });
  }
  if(state.loading) html+='<div class="msg msg-assistant"><div class="msg-avatar">智</div><div class="msg-body"><div class="thinking"><span></span><span></span><span></span></div></div></div>';
  box.innerHTML=html;
  // 建议条
  var sug=document.getElementById('chatSuggestions');
  if(state.messages.length>0){
    var s='';
    state.suggestions.slice(0,4).forEach(function(x){s+='<button data-q="'+esc(x)+'"'+(state.loading?' disabled':'')+'>'+esc(x)+'</button>';});
    sug.innerHTML=s;
  }else sug.innerHTML='';
  requestAnimationFrame(function(){box.scrollTop=box.scrollHeight;});
  // 绑定询问按钮
  Array.prototype.forEach.call(document.querySelectorAll('[data-q]'),function(b){
    b.onclick=function(){ if(!state.loading) ask(b.getAttribute('data-q')); };
  });
}

function ask(q){
  var question=(q||'').trim();
  if(!question||state.loading) return;
  state.messages.push({role:'user',content:question});
  state.loading=true;
  renderChat();
  setTimeout(function(){
    var intent=recognizeIntent(question);
    state.messages.push({role:'assistant',content:generateRuleAnswer(intent,state.diagnosis),intent:intent,engine:'rule'});
    state.loading=false;
    state.suggestions=DEFAULT_SUGGESTIONS.slice(0,4);
    renderChat();
  },420);
}

function recompute(){
  state.diagnosis=diagnose(state.data);
  state.messages=[{role:'assistant',content:'🔄 数据已更新，诊断结果已重新计算。你可以继续提问，我会基于最新数据回答。'}];
  state.suggestions=DEFAULT_SUGGESTIONS.slice();
  renderDiagnosis(); renderChat();
}

/* ---------- 9. 编辑弹窗 ---------- */

    return '<label class="edit-field"><span>'+label+'</span><input data-cost="'+key+'" type="number" step="0.01" value="'+esc(d.costs[key])+'" /></label>';
  }
  var costItems=[['rent','租金'],['managementFee','综合管理费'],['electricity','电费'],['water','水费'],['posRent','POS租金'],['warehouseRent','仓库租金'],['advertising','广告宣传'],['laborCost','人工成本'],['accommodationCost','员工住宿'],['otherCost','其他成本']];

  html+='<div class="edit-group"><h4>基础信息</h4><div class="edit-grid">';
  html+=fieldTop('merchantName','商户名称')+fieldTop('shopNo','商铺号')+fieldTop('cityCompany','城市公司')+fieldTop('projectName','项目名称')+fieldTop('businessType','经营业态')+fieldTop('area','建筑面积 (㎡)','number');
  html+='</div></div>';
  html+='<div class="edit-group"><h4>经营指标</h4><div class="edit-grid">';
  html+=fieldTop('avgSales3m','月均销售','number')+fieldTop('grossMargin','毛利率 (0~1)','number')+fieldTop('employeeCount','员工数','number')+fieldTop('discountRate','折扣率 (0~1)','number');
  html+='</div></div>';
  html+='<div class="edit-group"><h4>成本项（月）</h4><div class="edit-grid">';
  costItems.forEach(function(x){html+=fieldCost(x[0],x[1]);});
  html+='</div></div>';
  html+='<div class="edit-group"><h4>申请说明</h4><div class="edit-grid">';
  html+=fieldTop('discountPeriod','折扣周期');
  html+='<label class="edit-field"><span>合同起止</span><input value="'+esc(d.contractStart+' ~ '+d.contractEnd)+'" readonly /></label>';
  html+='<div class="f-full"><label class="edit-field"><span>申请理由 / 经营描述</span><textarea rows="4" data-top="reason">'+esc(d.reason)+'</textarea></label></div>';
  html+='</div></div>';
  html+='</div><div class="modal-foot"><button class="btn btn-ghost" id="modalCancel">取消</button><button class="btn btn-primary" id="modalSave">保存并重新诊断</button></div></div></div>';
  root.innerHTML=html;
  function close(){root.innerHTML='';}
  document.getElementById('modalClose').onclick=close;
  document.getElementById('modalCancel').onclick=close;
  document.getElementById('backdrop').onclick=function(e){if(e.target.id==='backdrop')close();};
  document.getElementById('modalSave').onclick=function(){
    var nd=clone(state.data);
    Array.prototype.forEach.call(document.querySelectorAll('[data-top]'),function(inp){
      var k=inp.getAttribute('data-top');
      if(k==='reason'||k==='merchantName'||k==='shopNo'||k==='cityCompany'||k==='projectName'||k==='businessType'||k==='discountPeriod') nd[k]=inp.value;
      else nd[k]=Number(inp.value)||0;
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-cost]'),function(inp){
      nd.costs[inp.getAttribute('data-cost')]=Number(inp.value)||0;
    });
    state.data=nd; close(); recompute();
  };
}

state.diagnosis=diagnose(state.data);
renderDiagnosis();
renderChat();
