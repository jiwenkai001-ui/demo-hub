<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>预包装食品批发管理系统</title>
<style>
/* ===== 全局重置与变量 ===== */
:root{
  --blue:#1989fa;
  --blue-dark:#07c160;
  --green:#07c160;
  --orange:#ff976a;
  --orange-dark:#ee9c28;
  --red:#ee0a24;
  --gray-1:#f7f8fa;
  --gray-2:#f2f3f5;
  --gray-3:#ebedf0;
  --gray-4:#dcdee0;
  --gray-5:#969799;
  --gray-6:#646566;
  --gray-7:#323233;
  --gray-8:#1a1a1a;
  --text:#323233;
  --text-secondary:#646566;
  --text-light:#969799;
  --border:#ebedf0;
  --bg:#f7f8fa;
  --card-shadow:0 4px 12px rgba(100,100,100,.08);
  --radius:12px;
  --radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif;
  font-size:14px;color:var(--text);background:var(--bg);
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
a{text-decoration:none;color:inherit}
button{border:none;background:none;font-family:inherit;cursor:pointer;color:inherit}
input{border:none;outline:none;font-family:inherit;font-size:inherit;background:none}
ul,ol{list-style:none}
img{display:block;max-width:100%}

/* ===== App 容器 ===== */
#app{max-width:600px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(0,0,0,.05)}
.page{display:none;min-height:100vh;padding-bottom:60px;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 顶部导航栏 ===== */
.nav-bar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  height:46px;padding:0 16px;
  background:#fff;border-bottom:1px solid var(--border);
  font-size:17px;font-weight:600;
}
.nav-bar .nav-left{width:40px;display:flex;align-items:center}
.nav-bar .nav-title{flex:1;text-align:center}
.nav-bar .nav-right{width:40px;display:flex;align-items:center;justify-content:flex-end;position:relative}
.nav-bar .back-icon{font-size:22px;color:var(--gray-7)}
.nav-bar .bell{font-size:20px;color:var(--gray-7)}
.badge{
  position:absolute;top:-4px;right:-6px;
  min-width:16px;height:16px;padding:0 4px;
  background:var(--red);color:#fff;border-radius:8px;
  font-size:10px;line-height:16px;text-align:center;
  border:1.5px solid #fff;
}

/* ===== 底部 Tab 栏 ===== */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:600px;z-index:100;
  display:flex;background:#fff;
  border-top:1px solid var(--border);
  height:56px;align-items:center;
}
.tabbar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--gray-5);font-size:11px;cursor:pointer}
.tabbar-item .tab-icon{font-size:22px;line-height:1}
.tabbar-item.active{color:var(--blue)}

/* ===== 通用组件 ===== */
.card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--card-shadow);margin-bottom:12px}
.card-pad{padding:14px}
.section-title{font-size:15px;font-weight:600;padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.section-title .more{font-size:13px;color:var(--blue);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;transition:opacity .2s}
.btn:active{opacity:.7}
.btn-primary{background:var(--blue);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-warning{background:var(--orange);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-outline{border:1px solid var(--blue);color:var(--blue);background:#fff}
.btn-outline-gray{border:1px solid var(--gray-4);color:var(--gray-6);background:#fff}
.btn-block{display:flex;width:100%}
.btn-sm{padding:4px 10px;font-size:12px}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-blue{background:#e6f3ff;color:var(--blue)}
.tag-orange{background:#fff3e0;color:var(--orange-dark)}
.tag-red{background:#ffeaea;color:var(--red)}
.tag-green{background:#e8f8ee;color:var(--green)}
.tag-gray{background:var(--gray-2);color:var(--gray-6)}
.tag-outline-orange{border:1px solid var(--orange);color:var(--orange);background:transparent}
.divider{height:1px;background:var(--border);margin:8px 0}
.empty{text-align:center;padding:40px 0;color:var(--gray-5);font-size:13px}
.search-bar{display:flex;gap:8px;padding:10px 16px;background:#fff}
.search-bar input{flex:1;background:var(--gray-1);border-radius:20px;padding:8px 14px;font-size:13px}
.filter-bar{display:flex;gap:8px;padding:8px 16px;background:#fff;overflow-x:auto;white-space:nowrap}
.filter-btn{padding:6px 14px;border-radius:16px;font-size:13px;background:var(--gray-1);color:var(--gray-6);flex-shrink:0}
.filter-btn.active{background:var(--blue);color:#fff}
.list-item{padding:14px 16px;border-bottom:1px solid var(--border);background:#fff}
.list-item:last-child{border-bottom:none}

/* ===== 登录页 ===== */
.login-page{background:linear-gradient(180deg,#2196F3 0%,#43a047 100%);min-height:100vh;padding:0 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.login-logo{width:80px;height:80px;background:rgba(255,255,255,.2);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:16px}
.login-title{color:#fff;font-size:24px;font-weight:700;margin-bottom:4px}
.login-sub{color:rgba(255,255,255,.85);font-size:14px;margin-bottom:32px}
.login-card{background:#fff;border-radius:16px;padding:28px 24px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.login-field{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:8px}
.login-field .field-icon{font-size:20px;color:var(--gray-5);width:24px;text-align:center}
.login-field input{flex:1;font-size:15px;padding:4px 0}
.login-field input::placeholder{color:var(--gray-5)}
.login-btn{margin-top:20px;width:100%;padding:13px;background:var(--blue);color:#fff;border-radius:24px;font-size:16px;font-weight:600;letter-spacing:2px}
.login-btn:active{opacity:.85}
.login-features{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.feature-item{background:rgba(255,255,255,.18);border-radius:10px;padding:14px 10px;display:flex;align-items:center;gap:10px}
.feature-item .f-icon{font-size:24px}
.feature-item .f-text{text-align:left}
.feature-item .f-name{color:#fff;font-size:13px;font-weight:600}
.feature-item .f-desc{color:rgba(255,255,255,.7);font-size:11px}
.login-hint{margin-top:24px;color:rgba(255,255,255,.8);font-size:12px}

/* ===== Dashboard ===== */
.dash-header{background:linear-gradient(135deg,#1989fa 0%,#0a7de3 100%);padding:20px 16px 50px;position:relative}
.dash-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.dash-greeting{color:#fff}
.dash-greeting .hello{font-size:20px;font-weight:700}
.dash-greeting .role-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.dash-greeting .role{background:#fff;color:var(--blue);padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.dash-greeting .date{color:rgba(255,255,255,.85);font-size:12px;margin-left:4px}
.dash-avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:22px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px;margin-top:-36px;position:relative;z-index:2}
.stat-card{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--card-shadow);display:flex;align-items:center;gap:12px}
.stat-card .stat-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stat-icon.blue{background:#e6f3ff}
.stat-icon.orange{background:#fff3e0}
.stat-icon.red{background:#ffeaea}
.stat-icon.cyan{background:#e0f7fa}
.stat-info .stat-val{font-size:20px;font-weight:700;color:var(--gray-8)}
.stat-info .stat-label{font-size:12px;color:var(--gray-5)}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 0;padding:8px 0}
.quick-item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px;cursor:pointer}
.quick-item:active{opacity:.7}
.quick-item .q-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.quick-item .q-text{font-size:12px;color:var(--gray-7)}
.order-card{padding:14px;border-bottom:1px solid var(--border)}
.order-card:last-child{border-bottom:none}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.order-customer{font-size:15px;font-weight:600}
.order-amount{font-size:16px;font-weight:700;color:var(--gray-8)}
.order-meta{font-size:12px;color:var(--gray-5);display:flex;gap:10px;flex-wrap:wrap}
.notice-item{padding:12px 0;border-bottom:1px solid var(--border)}
.notice-item:last-child{border-bottom:none}
.notice-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.notice-type{font-size:12px;font-weight:600}
.notice-content{font-size:13px;color:var(--gray-7);line-height:1.5}
.notice-time{font-size:11px;color:var(--gray-5);margin-top:2px}

/* ===== 商品列表 ===== */
.product-card{padding:14px 16px;border-bottom:1px solid var(--border)}
.product-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.product-name{font-size:15px;font-weight:600}
.product-info{font-size:12px;color:var(--gray-5);line-height:1.7}
.product-prices{display:flex;gap:16px;margin-top:6px;font-size:12px}
.product-prices .buy{color:var(--gray-6)}
.product-prices .sell{color:var(--red);font-weight:600}
.product-stock{font-size:12px;color:var(--gray-6);margin-top:2px}
.product-actions{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}

/* ===== 开单页 ===== */
.form-section{background:#fff;margin-bottom:12px}
.form-section-title{font-size:13px;color:var(--gray-5);padding:12px 16px 4px}
.form-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.form-row:last-child{border-bottom:none}
.form-row .label{font-size:14px;color:var(--gray-7)}
.form-row .value{font-size:14px;color:var(--gray-5)}
.form-row .placeholder{color:var(--gray-5)}
.action-btns{display:flex;gap:10px;padding:14px 16px}
.recent-order{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.recent-order:active{background:var(--gray-1)}

/* ===== 采购页 ===== */
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border)}
.tab{flex:1;text-align:center;padding:12px 0;font-size:14px;color:var(--gray-6);position:relative}
.tab.active{color:var(--blue);font-weight:600}
.tab.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24px;height:2px;background:var(--blue);border-radius:2px}
.tab .count{display:inline-block;background:var(--gray-2);color:var(--gray-6);font-size:11px;padding:1px 6px;border-radius:8px;margin-left:2px}
.tab.active .count{background:#e6f3ff;color:var(--blue)}
.purchase-card{background:#fff;margin:10px 16px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--card-shadow)}
.purchase-head{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.purchase-no{font-size:13px;color:var(--gray-6);font-weight:500}
.purchase-body{padding:12px 14px}
.purchase-supplier{font-size:15px;font-weight:600;margin-bottom:4px}
.purchase-detail{font-size:13px;color:var(--gray-6);line-height:1.7}
.purchase-foot{padding:10px 14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.purchase-amount{font-size:16px;font-weight:700;color:var(--gray-8)}
.purchase-meta{font-size:12px;color:var(--gray-5)}

/* ===== 库存页 ===== */
.stock-summary{background:#fff;margin:10px 16px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--card-shadow);padding:14px}
.stock-product{font-size:15px;font-weight:600;margin-bottom:4px}
.stock-spec{font-size:12px;color:var(--gray-5);margin-bottom:10px}
.stock-warehouses{display:flex;gap:16px;font-size:13px}
.stock-wh{display:flex;flex-direction:column;align-items:center}
.stock-wh .wh-name{font-size:11px;color:var(--gray-5)}
.stock-wh .wh-val{font-size:18px;font-weight:600;color:var(--gray-8)}
.stock-total{margin-left:auto;text-align:right}
.stock-total .t-label{font-size:11px;color:var(--gray-5)}
.stock-total .t-val{font-size:20px;font-weight:700;color:var(--blue)}
.stock-value{margin-top:8px;font-size:12px;color:var(--gray-5);text-align:right}
.batch-card{background:#fff;margin:8px 16px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--card-shadow);padding:14px;border-left:4px solid var(--blue)}
.batch-card.urgent{border-left-color:var(--red)}
.batch-card.warning{border-left-color:var(--orange)}
.batch-card.expired{border-left-color:var(--gray-5)}
.batch-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.batch-product{font-size:15px;font-weight:600}
.batch-detail{font-size:12px;color:var(--gray-6);line-height:1.8}
.batch-no{font-size:12px;color:var(--gray-5)}
.priority-tag{background:#fff3e0;color:var(--orange-dark);padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}

/* ===== 索证索票 ===== */
.cert-banner{background:linear-gradient(90deg,#fff8e1,#fff3e0);padding:8px 16px;font-size:12px;color:var(--orange-dark);text-align:center;border-bottom:1px solid var(--border)}
.supplier-card{background:#fff;margin:10px 16px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--card-shadow)}
.supplier-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.supplier-name{font-size:15px;font-weight:600}
.supplier-meta{font-size:12px;color:var(--gray-5);padding:8px 14px}
.cert-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--border)}
.cert-item .cert-name{font-size:13px;color:var(--gray-7)}
.cert-item .cert-file{font-size:12px;color:var(--gray-5)}
.cert-item .cert-date{font-size:11px;color:var(--gray-5)}
.cert-actions{padding:10px 14px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* ===== 员工管理 ===== */
.emp-stats{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;margin-bottom:10px}
.emp-stat{text-align:center;padding:14px 8px;border-right:1px solid var(--border)}
.emp-stat:last-child{border-right:none}
.emp-stat .e-val{font-size:20px;font-weight:700;color:var(--gray-8)}
.emp-stat .e-label{font-size:11px;color:var(--gray-5)}
.emp-card{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);background:#fff}
.emp-card:active{background:var(--gray-1)}
.emp-avatar{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;margin-right:12px;flex-shrink:0}
.emp-info{flex:1}
.emp-name-row{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.emp-name{font-size:15px;font-weight:600}
.emp-role{font-size:11px;color:var(--gray-5)}
.emp-account{font-size:12px;color:var(--gray-5)}
.emp-actions{display:flex;gap:8px}

/* ===== 外勤车销 ===== */
.field-location{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.field-location .loc-icon{font-size:22px;color:var(--blue)}
.field-visit{background:#fff;margin:10px 16px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--card-shadow);padding:14px}
.field-visit .visit-customer{font-size:16px;font-weight:600;margin-bottom:6px}
.field-visit .visit-time{font-size:12px;color:var(--gray-5);margin-bottom:10px}
.field-visit .visit-actions{display:flex;gap:10px;margin-top:10px}
.field-stats{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;margin-bottom:10px}
.field-stat{text-align:center;padding:14px 8px;border-right:1px solid var(--border)}
.field-stat:last-child{border-right:none}
.field-stat .f-val{font-size:20px;font-weight:700;color:var(--blue)}
.field-stat .f-label{font-size:11px;color:var(--gray-5)}
.visit-record{padding:12px 16px;border-bottom:1px solid var(--border);background:#fff}
.visit-record .vr-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.visit-record .vr-customer{font-size:14px;font-weight:600}
.visit-record .vr-detail{font-size:12px;color:var(--gray-5);line-height:1.7}

/* ===== 库存预警 ===== */
.warning-stats{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;margin-bottom:0}
.warning-stat{text-align:center;padding:14px 8px;border-right:1px solid var(--border)}
.warning-stat:last-child{border-right:none}
.warning-stat .w-val{font-size:22px;font-weight:700}
.warning-stat .w-val.red{color:var(--red)}
.warning-stat .w-val.orange{color:var(--orange-dark)}
.warning-stat .w-val.blue{color:var(--blue)}
.warning-stat .w-label{font-size:11px;color:var(--gray-5)}
.warn-item{background:#fff;margin:8px 16px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--card-shadow);padding:14px;border-left:4px solid var(--blue)}
.warn-item.urgent{border-left-color:var(--red)}
.warn-item.warning{border-left-color:var(--orange)}
.warn-item.notice{border-left-color:var(--blue)}
.warn-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.warn-name{font-size:15px;font-weight:600}
.warn-detail{font-size:12px;color:var(--gray-6);line-height:1.7}
.warn-detail .num{font-weight:600;color:var(--gray-8)}
.warn-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}

/* ===== 过期商品 ===== */
.expired-summary{background:linear-gradient(135deg,#ee0a24,#ff5252);color:#fff;padding:20px 16px;text-align:center}
.expired-summary .e-count{font-size:32px;font-weight:700}
.expired-summary .e-label{font-size:13px;opacity:.9;margin-top:2px}
.expired-summary .e-amount{font-size:14px;margin-top:6px;opacity:.9}
.expired-section-title{font-size:14px;font-weight:600;padding:14px 16px 8px;color:var(--gray-7)}
.expired-card{background:#fff;margin:8px 16px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--card-shadow);padding:14px;border-left:4px solid var(--red)}
.expired-card.near{border-left-color:var(--orange)}
.expired-card .ex-name{font-size:15px;font-weight:600;margin-bottom:6px}
.expired-card .ex-detail{font-size:12px;color:var(--gray-6);line-height:1.7}
.expired-card .ex-frozen{display:inline-block;background:#ffeaea;color:var(--red);padding:2px 8px;border-radius:4px;font-size:11px;margin-top:6px}

/* ===== 进货台账 ===== */
.ledger-card{background:#fff;margin:8px 16px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--card-shadow);padding:14px}
.ledger-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ledger-no{font-size:13px;font-weight:600;color:var(--gray-7)}
.ledger-body{font-size:13px;color:var(--gray-6);line-height:1.8}
.ledger-body .strong{color:var(--gray-8);font-weight:500}

/* ===== 浮动按钮 ===== */
.fab{position:fixed;bottom:70px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 16px rgba(25,137,250,.4);z-index:50}
.fab:active{transform:scale(.92)}

/* ===== 提示框 ===== */

function navigate(path){
  location.hash = '#' + path;
}
function getRoute(){
  var hash = location.hash.replace(/^#/,'') || '/dashboard';
  if(!loggedIn && hash !== '/login') hash = '/login';
  if(loggedIn && hash === '/login') hash = '/dashboard';
  return hash;
}
function router(){
  var path = getRoute();
  var fn = routes[path] || renderDashboard;
  var app = document.getElementById('app');
  app.innerHTML = '';
  fn(app);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', router);

/* ===== 提示框 ===== */
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2000);
}

/* ===== 底部 Tab 栏 ===== */
function tabbar(active){
  var tabs = [
    {path:'/dashboard',icon:'🏠',label:'工作台'},
    {path:'/product',icon:'📦',label:'商品'},
    {path:'/sales',icon:'✏️',label:'开单'},
    {path:'/purchase',icon:'🛒',label:'采购'},
    {path:'/stock',icon:'📊',label:'库存'}
  ];
  return '<div class="tabbar">'+tabs.map(function(t){
    return '<div class="tabbar-item'+(t.path===active?' active':'')+'" onclick="navigate(\''+t.path+'\')">'+
      '<span class="tab-icon">'+t.icon+'</span><span>'+t.label+'</span></div>';
  }).join('')+'</div>';
}

}

    html += '<div class="visit-record">'+
      '<div class="vr-head"><div class="vr-customer">'+v.customer+'</div><span class="tag '+(v.status==='拜访中'?'tag-blue':'tag-green')+'">'+v.status+'</span></div>'+
      '<div class="vr-detail">签到: '+v.checkIn+(v.checkOut?'<br>签退: '+v.checkOut:'')+'<br>地址: '+v.address+'<br>拍照 '+v.photos+' 张'+(v.amount>0?' · ¥'+v.amount.toFixed(2):'')+'</div>'+
    '</div>';
  });
  
  html += '<div style="padding:16px;text-align:center;font-size:12px;color:var(--gray-5)">业务员手机在外直接开单，巡店签到，陈列拍照上传</div>'+
    tabbar('/sales')+'</div>';
  app.innerHTML = html;
}

/* ===== 库存预警 ===== */
function renderStockWarning(app){
  var tab = app.dataset.warnTab || 'low';
  var lowStock = [
    {name:'伊利安慕希',id:'SP-008',spec:'250ml*12/箱',unit:'箱',current:3,min:10,suggest:12},
    {name:'王老吉凉茶',id:'SP-010',spec:'310ml/罐',unit:'罐',current:4,min:50,suggest:71}
  ];
  var nearExpiry = D.batches.filter(function(b){return !b.expired && b.daysLeft<=30});
  var overstock = [];
  
  var html = '<div class="page active">'+
    navbar('库存预警',true,true)+
    '<div class="warning-stats">'+
      '<div class="warning-stat"><div class="w-val red">'+lowStock.length+'</div><div class="w-label">库存不足</div></div>'+
      '<div class="warning-stat"><div class="w-val" style="color:var(--gray-5)">'+overstock.length+'</div><div class="w-label">库存积压</div></div>'+
      '<div class="warning-stat"><div class="w-val orange">'+nearExpiry.length+'</div><div class="w-label">临期预警</div></div>'+
    '</div>'+
    '<div class="tabs">'+
      '<div class="tab '+(tab==='low'?'active':'')+'" onclick="switchWarnTab(\'low\')">库存不足</div>'+
      '<div class="tab '+(tab==='over'?'active':'')+'" onclick="switchWarnTab(\'over\')">库存积压</div>'+
      '<div class="tab '+(tab==='near'?'active':'')+'" onclick="switchWarnTab(\'near\')">临期预警</div>'+
    '</div>';
  
  if(tab==='low'){
    html += lowStock.map(function(w){
      return '<div class="warn-item">'+
        '<div class="warn-head"><div class="warn-name">'+w.name+' <span class="tag tag-red">偏低</span></div></div>'+
        '<div class="warn-detail">'+w.id+' · 规格 '+w.spec+' · 单位 '+w.unit+'<br>当前库存 <span class="num">'+w.current+'</span> · 最低库存 <span class="num">'+w.min+'</span> · 建议补货 <span class="num" style="color:var(--blue)">'+w.suggest+'</span></div>'+
        '<div class="warn-actions"><button class="btn btn-primary btn-sm" onclick="toast(\'补货：'+w.name+'\')">补货</button></div>'+
      '</div>';
    }).join('');
  } else if(tab==='over'){
    html += '<div class="empty">暂无库存积压商品</div>';
  } else {
    nearExpiry.forEach(function(b){
      var cls = b.daysLeft<=7?'urgent':(b.daysLeft<=15?'warning':'notice');
      var level = b.daysLeft<=7?'紧急(剩'+b.daysLeft+'天)':(b.daysLeft<=15?'警告(剩'+b.daysLeft+'天)':'注意(剩'+b.daysLeft+'天)');
      var levelTag = b.daysLeft<=7?'tag-red':(b.daysLeft<=15?'tag-orange':'tag-blue');
      html += '<div class="warn-item '+cls+'">'+
        '<div class="warn-head"><div class="warn-name">'+b.product+' <span class="tag '+levelTag+'">'+level+'</span></div></div>'+
        '<div class="warn-detail">批次号: '+b.batchNo+' · 剩余 '+b.remain+' '+b.unit+'<br>到期日期 '+b.expiry+' · 剩余天数 '+b.daysLeft+' 天<br>存放仓库 '+b.warehouse+'</div>'+
        '<div class="warn-actions"><button class="btn btn-danger btn-sm" onclick="toast(\'报损：'+b.product+'\')">报损</button></div>'+
      '</div>';
    });
  }
  
  html += tabbar('/stock')+'</div>';
  app.innerHTML = html;
}
function switchWarnTab(t){
  document.getElementById('app').dataset.warnTab = t;
  renderStockWarning(document.getElementById('app'));
}

/* ===== 初始化 ===== */
router();
</script>
