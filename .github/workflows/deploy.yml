name: Deploy Demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build all demos
        env:
          PAGES_READ_TOKEN: ${{ github.token }}
        run: node scripts/build-demos.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          retention-days: 90
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .codex-tmp/pages-artifact
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Save published site backup
        env:
          PAGES_BACKUP_TOKEN: ${{ github.token }}
        run: node scripts/backup-pages.cjs
